# Checks on every push and pull request (docs/process.md §7).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.go }} tests, lint and the catalogue
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.13', '1.27.4']
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    defaults:
      run:
        working-directory: wag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: wag/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      - name: The vendored engine's own tests (GoCHR, carneades-4 and WAG's fork regressions)
        # Only these catch a lost engine fix; WAG's suite passes without them.
        working-directory: .
        run: bash tools/engine-tests.sh
      - name: Lint the game's data
        run: go run ./cmd/wag-cli --lint
      - name: The catalogue and the generated views are what the generator makes
        run: |
          go run ./cmd/wag-cli --catalogue-gen
          git diff --exit-code -- data/catalogue ../docs/decisions.md ../docs/candidates.md || {
            echo "::error::wag/data/catalogue, docs/decisions.md or docs/candidates.md differs from what --catalogue-gen makes: run it and commit the result"
            exit 1
          }
      - name: Catalogue check
        # Without --book the copy check reads docs/book-catalogue (pp. 1-138);
        # the compendium's transcription is private (the owner's workspace).
        run: go run ./cmd/wag-cli --catalogue-check
      - name: Registry check
        # D042 records division_generic as a copy of composition_generic.
        # Only that debt is allowed until its scoped migration is implemented.
        run: |
          python3 ../tools/test_registry_gate.py
          bash ../tools/check-registry.sh

  data:
    name: Go ${{ matrix.go }} walton.yml rebuild and the batch-2 gold
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.13', '1.27.4']
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: wag/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate the batch-2 gold
        run: python3 -I docs/kialo-batch2/validate.py
      - name: Fetch the upstream walton.yml the cleaning was written for
        run: |
          curl -fsSL -o "$RUNNER_TEMP/walton.yml" \
            https://raw.githubusercontent.com/basakkurtuldu/walton-argumentation-schemes-for-carneades-4/master/walton.yml
          echo "1976202ac6bd538526ea75488659ec9880641ec03534d6e098f6f6dd1bcc099c  $RUNNER_TEMP/walton.yml" | sha256sum -c - || {
            echo "::error::the upstream walton.yml is not the file the cleaning's edits were written for (docs/scheme-registry/walton-clean/CHANGELOG.md)"
            exit 1
          }
      - name: Rebuild walton.yml and every report, and compare
        run: |
          sh docs/scheme-registry/walton-clean/check/run.sh "$RUNNER_TEMP/walton.yml"
          python3 -B tools/check_d084_migration.py
          python3 -B tools/check_d081_migration.py
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::check/run.sh does not reproduce the committed files: run it and commit the result"
            git diff --stat
            exit 1
          }
