meta:
  title: Abduction Argumentation Scheme
  note: This example only works if the conclusion, rain, is
        declared in the language. More generally, the predicates
        of all statements to be derived by the schemes must be declared.
  source: >
    Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). 
    Argumentation Schemes. Cambridge University Press.

language:
  explanation/2: "Theory %s explains %s."
  in/2: "%s contains %s as a member."
  more_coherent_explanation/2: "There exists a more coherent explanation than theory %s of observation %s."
  observed/1:  "%s has been observed."
  rain/0: "It rained."

argument_schemes:
  - id: abduction
    variables: [S,T,H]
    conclusions: [H]
    premises:
      - observed(S)
      - explanation(T,S)
      - in(T,H)
    exceptions:
      - more_coherent_explanation(T,S)

assumptions:
  - observed(wet)
  - explanation(weather,wet)
  - in(weather,rain)

# Declare expected identities so CLI prevalidation can check them before
# inference. The native assertion key is tests, not the old ignored labels key.
statements:
  rain: It rained.
  observed(wet): Wet conditions have been observed.
  in(weather,rain): The weather theory contains rain.
  explanation(weather,wet): The weather theory explains wet conditions.
  undercut(a1): The abduction argument is undercut.
  undercut(a2): The exception argument is undercut.
  more_coherent_explanation(weather,wet): A more coherent explanation exists.

tests:
  in:
    - rain
    - observed(wet)
    - in(weather,rain)
    - explanation(weather,wet)
  out:
    - undercut(a1)
    - undercut(a2)
    - more_coherent_explanation(weather,wet)
    








