# WAG Core Argumentation Schemes for Carneades-4
#
# This file combines 7 schemes from the Kurtuldu YAML collection into a
# single loadable file. These are the Minimum Viable NASCQ subset centered
# on practical reasoning.
#
# Source YAML files and their contributions:
#   3_practical-reasoning.yml    → practical_reasoning1, positive_consequences
#   2_argumen-from-commitment.yml → positive_value
#   4_abductive-reasoning.yml    → sign
#   1_arguments-from-position-to-know.yml → credible_source, position_to_know
#   1_arguments-based-on-cases.yml → analogy
#
# Variable names are preserved exactly from the originals so that
# InstantiateScheme substitution works correctly.

language:
  # How statements read on the board. The players' words are put in single
  # quotes for them (‘carbon tax’), and statements inside statements in
  # double quotes, so these templates need not fit every phrase a player
  # types. A key "¬p/n" is the sentence for the negation of p/n; without one
  # a negation reads "it is not the case that …".
  # --- practical_reasoning1 ---
  current_circumstances/1: "The current situation is %s."
  ¬current_circumstances/1: "The current situation is not %s."
  would_bring_about/3: "Doing %s in the situation %s would lead to %s."
  ¬would_bring_about/3: "Doing %s in the situation %s would not lead to %s."
  would_be_realized/2: "The goal %s would be achieved in %s."
  ¬would_be_realized/2: "The goal %s would not be achieved in %s."
  would_promote_value/2: "Achieving %s would promote the value %s."
  ¬would_promote_value/2: "Achieving %s would not promote the value %s."
  should_be_performed/1: "%s should be done."
  ¬should_be_performed/1: "%s should not be done."
  legitimate_value/1: "%s is a legitimate value."
  ¬legitimate_value/1: "%s is not a legitimate value."
  worthy_goal/1: "%s is a worthy goal."
  ¬worthy_goal/1: "%s is not a worthy goal."
  possible/1: "%s is possible."
  ¬possible/1: "%s is not possible."
  bring_about_more_effectively/2: "Another action would lead to %s more effectively than %s."
  ¬bring_about_more_effectively/2: "No other action would lead to %s more effectively than %s."
  realize_more_effectively/2: "Another action would achieve %s more effectively than %s."
  ¬realize_more_effectively/2: "No other action would achieve %s more effectively than %s."
  promote_more_effectively/2: "Another action would promote %s more effectively than %s."
  ¬promote_more_effectively/2: "No other action would promote %s more effectively than %s."
  side_effects/2: "Doing %s in the situation %s would have bad side effects."
  ¬side_effects/2: "Doing %s in the situation %s would have no bad side effects."
  # --- positive_consequences ---
  brings_about/2: "Doing %s brings about %s."
  ¬brings_about/2: "Doing %s does not bring about %s."
  good/1: "%s is good."
  ¬good/1: "%s is not good."
  # --- positive_value ---
  judged_positive_value/2: "%s is a positive value for %s."
  ¬judged_positive_value/2: "%s is not a positive value for %s."
  positive_affects/3: "%s supports the goal %s for %s."
  ¬positive_affects/3: "%s does not support the goal %s for %s."
  reason_retaining_goal/2: "%s is a reason to keep the goal %s."
  ¬reason_retaining_goal/2: "%s is no reason to keep the goal %s."
  # --- sign ---
  finding_true/1: "%s is observed."
  ¬finding_true/1: "%s is not observed."
  indicated_true/2: "%s is indicated when %s holds."
  ¬indicated_true/2: "%s is not indicated when %s holds."
  true_in_situation/1: "%s holds in the current situation."
  ¬true_in_situation/1: "%s does not hold in the current situation."
  strong_correlation/2: "%s and %s are strongly correlated."
  ¬strong_correlation/2: "%s and %s are not strongly correlated."
  # --- credible_source ---
  credible_source/2: "%s is a credible expert on %s."
  ¬credible_source/2: "%s is not a credible expert on %s."
  asserts/2: "%s says that %s."
  ¬asserts/2: "%s does not say that %s."
  in_domain/2: "%s is a matter of %s."
  ¬in_domain/2: "%s is not a matter of %s."
  biased/1: "%s is biased."
  ¬biased/1: "%s is not biased."
  dishonest/1: "%s is dishonest."
  ¬dishonest/1: "%s is honest."
  other_credible_sources_disagree/1: "Other credible sources dispute %s."
  ¬other_credible_sources_disagree/1: "No other credible source disputes %s."
  # --- position_to_know ---
  position_to_know/2: "%s is in a position to know about %s."
  ¬position_to_know/2: "%s is not in a position to know about %s."
  # --- analogy ---
  similar_case/1: "%s is a similar case."
  ¬similar_case/1: "%s is not a similar case."
  in_case/2: "%s is true in the case of %s."
  ¬in_case/2: "%s is not true in the case of %s."
  relevant_differences/1: "The case of %s differs in relevant ways."
  ¬relevant_differences/1: "The case of %s does not differ in relevant ways."
  more_on_point/2: "%s is false in a case more on point than %s."
  ¬more_on_point/2: "%s is not false in any case more on point than %s."

argument_schemes:
  - id: practical_reasoning1
    meta:
      title: Argument from Value-Based Practical Reasoning
      source: "Atkinson & Bench-Capon (2007)"
    variables: [A,S1,S2,G,V]
    conclusions:
      - should_be_performed(A)
    premises:
      - current_circumstances(S1)
      - would_bring_about(A,S1,S2)
      - would_be_realized(G,S2)
      - would_promote_value(G,V)
    assumptions:
      - legitimate_value(V)
      - worthy_goal(G)
      - possible(A)
    exceptions:
      - bring_about_more_effectively(S2,A)
      - realize_more_effectively(G,A)
      - promote_more_effectively(V,A)
      - side_effects(A,S1)

  - id: positive_consequences
    meta:
      title: Argument from Positive Consequences
      source: "Walton (1995)"
    variables: [A,G]
    conclusions:
      - should_be_performed(A)
    premises:
      - brings_about(A,G)
      - good(G)

  - id: positive_value
    meta:
      title: Argument from Values (Positive)
      source: "Bench-Capon (2003)"
    variables: [V,A,G]
    conclusions:
      - reason_retaining_goal(V,G)
    premises:
      - judged_positive_value(V,A)
      - positive_affects(V,G,A)

  - id: sign
    meta:
      title: Argument from Sign
      source: "Walton (2006)"
    variables: [A,B]
    conclusions:
      - true_in_situation(B)
    premises:
      - finding_true(A)
      - indicated_true(B,A)
    assumptions:
      - strong_correlation(A,B)

  - id: credible_source
    meta:
      title: Argument from Credible Source
      source: "Wyner (2016)"
    variables: [W,D,S]
    conclusions: [S]
    premises:
      - credible_source(W,D)
      - asserts(W,S)
      - in_domain(S,D)
    exceptions:
      - biased(W)
      - dishonest(W)
      - other_credible_sources_disagree(S)

  - id: position_to_know
    meta:
      title: Argument from Position to Know
      source: "Walton (2002)"
    variables: [W,D,S]
    conclusions: [S]
    premises:
      - position_to_know(W,D)
      - asserts(W,S)
      - in_domain(S,D)
    exceptions:
      - dishonest(W)

  - id: analogy
    meta:
      title: Argument from Analogy
      source: "Walton (2006)"
    variables: [A,C]
    conclusions: [A]
    premises:
      - similar_case(C)
      - in_case(A,C)
    exceptions:
      - relevant_differences(C)
      - more_on_point(A,C)
