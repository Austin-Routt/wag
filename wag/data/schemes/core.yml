# Generated by wag-cli --game-gen from the scheme catalogue (wag/data/catalogue:
# the entries' game parts and formulas, and game/), with the NASCQ files beside
# it. Do not edit them: edit the catalogue and generate them again
# (docs/c5-game.md).
# catalogue: 2e06373a30247097
#
# WAG Core Argumentation Schemes for Carneades-4
#
# The game's schemes (docs/c5-game.md): each game scheme's block is made
# from its catalogue entry, with walton.yml's formulas unless the entry
# records its own (analogy and sign, until their families' steps), and the
# language's sentences are walton.yml's templates or the ones game/language.yml
# records, with the reason each differs. Wyner's credible-source scheme is kept
# for games recorded before 2026-10-13.
#
# Variable names are preserved exactly from the formulas so that
# InstantiateScheme substitution works correctly.

language:
  # How statements read on the board. The players' words are put in single
  # quotes for them (‘carbon tax’), and statements inside statements in
  # double quotes, so these templates need not fit every phrase a player
  # types. A key "¬p/n" is the sentence for the negation of p/n; without one
  # a negation reads "it is not the case that …".
  should_be_performed/1: "%s should be done."
  ¬should_be_performed/1: "%s should not be done."
  goal_of_agent/2: "One of the goals of %s is %s."
  ¬goal_of_agent/2: "None of the goals of %s is %s."
  current_circumstances/1: "The current situation is %s."
  ¬current_circumstances/1: "The current situation is not %s."
  would_bring_about/3: "Doing %s in the situation %s would lead to %s."
  ¬would_bring_about/3: "Doing %s in the situation %s would not lead to %s."
  would_be_realized/2: "The goal %s would be achieved in %s."
  ¬would_be_realized/2: "The goal %s would not be achieved in %s."
  would_promote_value/2: "Achieving %s would promote the value %s."
  ¬would_promote_value/2: "Achieving %s would not promote the value %s."
  legitimate_value/1: "%s is a legitimate value."
  ¬legitimate_value/1: "%s is not a legitimate value."
  worthy_goal/1: "%s is a worthy goal."
  ¬worthy_goal/1: "%s is not a worthy goal."
  possible_bring_about/2: "It is possible for %s to bring about %s."
  ¬possible_bring_about/2: "It is not possible for %s to bring about %s."
  bring_about_more_effectively/3: "There is a way for %s to reach the state %s more effectively than %s."
  ¬bring_about_more_effectively/3: "There is no way for %s to reach the state %s more effectively than %s."
  realize_more_effectively/3: "There is a way for %s to realize the goal %s more effectively than %s."
  ¬realize_more_effectively/3: "There is no way for %s to realize the goal %s more effectively than %s."
  promote_more_effectively/3: "There is a way for %s to promote the value %s more effectively than %s."
  ¬promote_more_effectively/3: "There is no way for %s to promote the value %s more effectively than %s."
  bad_outweighs/2: "The action %s has bad consequences that outweigh %s."
  ¬bad_outweighs/2: "The action %s has no bad consequences that outweigh %s."
  incompatible_goal/2: "Another goal of %s is incompatible with %s."
  ¬incompatible_goal/2: "No other goal of %s is incompatible with %s."
  possible_goal/1: "%s is possible."
  ¬possible_goal/1: "%s is not possible."
  intervening_actions/2: "Something else would have to happen, or be done, before %s could achieve %s."
  ¬intervening_actions/2: "Nothing else would have to happen, or be done, before %s could achieve %s."
  brings_about/2: "Doing %s brings about %s."
  ¬brings_about/2: "Doing %s does not bring about %s."
  good/1: "%s is good."
  ¬good/1: "%s is not good."
  too_slight/2: "In deciding on action %s, %s is too slight a consequence to count."
  ¬too_slight/2: "In deciding on action %s, %s is not too slight a consequence to count."
  gain_discounted_by_bearer/2: "In deciding on action %s, the gain %s counts for less because of whom it would go to."
  ¬gain_discounted_by_bearer/2: "In deciding on action %s, the gain %s does not count for less because of whom it would go to."
  bad/1: "%s is bad."
  ¬bad/1: "%s is not bad."
  good_outweighs/2: "The action %s has good consequences that outweigh %s."
  ¬good_outweighs/2: "The action %s has no good consequences that outweigh %s."
  harm_discounted_by_bearer/2: "In deciding on action %s, the harm %s counts for less because of whom it would fall on."
  ¬harm_discounted_by_bearer/2: "In deciding on action %s, the harm %s does not count for less because of whom it would fall on."
  reason_retaining_goal/2: "%s is a reason to keep the goal %s."
  ¬reason_retaining_goal/2: "%s is no reason to keep the goal %s."
  judged_positive_value/2: "%s is a positive value for %s."
  ¬judged_positive_value/2: "%s is not a positive value for %s."
  positive_affects/3: "%s supports the goal %s for %s."
  ¬positive_affects/3: "%s does not support the goal %s for %s."
  true_in_situation/1: "%s holds in the current situation."
  ¬true_in_situation/1: "%s does not hold in the current situation."
  finding_true/1: "%s is observed."
  ¬finding_true/1: "%s is not observed."
  indicated_true/2: "%s is generally indicated when %s holds."
  ¬indicated_true/2: "%s is not generally indicated when %s holds."
  strong_correlation/2: "%s and %s are strongly correlated."
  ¬strong_correlation/2: "%s and %s are not strongly correlated."
  expert/2: "%s is an expert in %s."
  ¬expert/2: "%s is not an expert in %s."
  in_domain/2: "%s is a matter of %s."
  ¬in_domain/2: "%s is not a matter of %s."
  asserts/2: "%s says that %s."
  ¬asserts/2: "%s does not say that %s."
  based_on_evidence/1: "%s, and this is based on evidence."
  ¬based_on_evidence/1: "%s, but this is not based on evidence."
  untrustworthy/1: "%s is not a trustworthy source."
  ¬untrustworthy/1: "%s is a trustworthy source."
  inconsistent_with_other_experts/1: "Other experts disagree that %s."
  ¬inconsistent_with_other_experts/1: "Other experts agree that %s."
  credible_source/2: "%s is a credible expert on %s."
  ¬credible_source/2: "%s is not a credible expert on %s."
  biased/1: "%s is biased."
  ¬biased/1: "%s is not biased."
  dishonest/1: "%s is dishonest."
  ¬dishonest/1: "%s is honest."
  other_credible_sources_disagree/1: "Other credible sources dispute %s."
  ¬other_credible_sources_disagree/1: "No other credible source disputes %s."
  position_to_know/2: "%s is in a position to know about %s."
  ¬position_to_know/2: "%s is not in a position to know about %s."
  similar_case/1: "%s is a similar case."
  ¬similar_case/1: "%s is not a similar case."
  in_case/2: "%s is true in the case of %s."
  ¬in_case/2: "%s is not true in the case of %s."
  relevant_differences/1: "The case of %s differs in relevant ways."
  ¬relevant_differences/1: "The case of %s does not differ in relevant ways."
  more_on_point/2: "%s is false in a case more on point than %s."
  ¬more_on_point/2: "%s is not false in any case more on point than %s."
  may_be_worth_performing/2: "Action %s may be worth performing for the sake of %s."
  ¬may_be_worth_performing/2: "It is not the case that action %s may be worth performing for the sake of %s."
  may_bring_about/2: "The action %s may bring about %s."
  ¬may_bring_about/2: "There is no real chance that the action %s brings about %s."
  may_be_unwise_to_perform/2: "Action %s may be unwise to perform because of %s."
  ¬may_be_unwise_to_perform/2: "It is not the case that action %s may be unwise to perform because of %s."
  matters_to_decision/2: "The chance that action %s brings about %s is large enough, given what that consequence would be, to bear on whether the action should be performed."
  ¬matters_to_decision/2: "The chance that action %s brings about %s is not large enough, given what that consequence would be, to bear on whether the action should be performed."
  worth_finding_out_first/2: "It is worth finding out first whether action %s would bring about %s, and until then that possibility should not count in deciding on the action: it can be found out in time, reliably enough to settle the question, at a cost and risk worth bearing."
  ¬worth_finding_out_first/2: "It is not worth finding out first whether action %s would bring about %s: that possibility counts in deciding on the action now."
  matters_more/2: "%s matters more than %s."
  ¬matters_more/2: "%s does not matter more than %s."
  more_effective_means/4: "For %s, %s would realize %s more effectively than %s: more surely, sooner or at lower cost."
  ¬more_effective_means/4: "For %s, %s would not realize %s more effectively than %s: not more surely, sooner or at lower cost."
  settles_whether/3: "%s would settle, reliably enough for the decision, whether action %s brings about %s."
  ¬settles_whether/3: "%s would not settle, reliably enough for the decision, whether action %s brings about %s."
  done_in_time/2: "%s can be done before the decision on action %s must be taken."
  ¬done_in_time/2: "%s cannot be done before the decision on action %s must be taken."
  worth_its_costs/3: "The costs and risks of %s are worth bearing to know whether action %s brings about %s before that possibility counts in the decision."
  ¬worth_its_costs/3: "The costs and risks of %s are not worth bearing to know whether action %s brings about %s before that possibility counts in the decision."

argument_schemes:
  - id: practical_reasoning1
    meta:
      title: Argument from Value-Based Practical Reasoning
      source: Atkinson & Bench-Capon (2007)
    variables:
    - A
    - S1
    - S2
    - G
    - V
    - P
    conclusions:
    - should_be_performed(A)
    premises:
    - goal_of_agent(P,G)
    - current_circumstances(S1)
    - would_bring_about(A,S1,S2)
    - would_be_realized(G,S2)
    - would_promote_value(G,V)
    assumptions:
    - legitimate_value(V)
    - worthy_goal(G)
    - possible_bring_about(P,A)
    exceptions:
    - bring_about_more_effectively(P,S2,A)
    - realize_more_effectively(P,G,A)
    - promote_more_effectively(P,V,A)
    - bad_outweighs(A,G)
    - incompatible_goal(P,G)

  # As in walton.yml (Walton 2015): the goal-based scheme, without values
  # (the book's 22.1, practical inference).
  - id: practical_reasoning2
    meta:
      title: Argument from Instrumental Practical Reasoning
      source: Walton (2015), Goal-Based Reasoning for Argumentation
    variables:
    - A
    - S1
    - S2
    - G
    - P
    conclusions:
    - should_be_performed(A)
    premises:
    - goal_of_agent(P,G)
    - current_circumstances(S1)
    - would_bring_about(A,S1,S2)
    - would_be_realized(G,S2)
    assumptions:
    - possible_bring_about(P,A)
    - possible_goal(G)
    exceptions:
    - bring_about_more_effectively(P,S2,A)
    - realize_more_effectively(P,G,A)
    - intervening_actions(A,G)
    - bad_outweighs(A,G)
    - incompatible_goal(P,G)

  - id: positive_consequences
    meta:
      title: Argument from Positive Consequences
      source: Walton (1995)
    variables:
    - A
    - G
    conclusions:
    - should_be_performed(A)
    premises:
    - brings_about(A,G)
    - good(G)
    exceptions:
    - bad_outweighs(A,G)
    - too_slight(A,G)
    - gain_discounted_by_bearer(A,G)

  # As in walton.yml (the book's 33.2): the counterpart of positive
  # consequences; it concludes the opposite of should_be_performed(A), so it
  # argues against what should be done.
  - id: negative_consequences
    meta:
      title: Argument from Negative Consequences
      source: Walton (1995)
    variables:
    - A
    - G
    conclusions:
    - ¬should_be_performed(A)
    premises:
    - brings_about(A,G)
    - bad(G)
    exceptions:
    - good_outweighs(A,G)
    - too_slight(A,G)
    - harm_discounted_by_bearer(A,G)

  - id: positive_value
    meta:
      title: Argument from Values (Positive)
      source: Bench-Capon (2003)
    variables:
    - V
    - A
    - G
    conclusions:
    - reason_retaining_goal(V,G)
    premises:
    - judged_positive_value(V,A)
    - positive_affects(V,G,A)

  - id: sign
    meta:
      title: Argument from Sign
      source: Walton (2006)
    variables:
    - A
    - B
    conclusions:
    - true_in_situation(B)
    premises:
    - finding_true(A)
    - indicated_true(B,A)
    assumptions:
    - strong_correlation(A,B)

  # As in walton.yml (Walton 1997, the book's scheme 2): the game's Argument
  # from Expert Opinion. Its six critical questions are its three premises,
  # its assumption and its two exceptions.
  - id: expert_opinion
    meta:
      title: Argument from Expert Opinion
      source: Walton (1997), Appeal to Expert Opinion, pp. 211-225
    variables:
    - W
    - D
    - S
    conclusions:
    - S
    premises:
    - expert(W,D)
    - in_domain(S,D)
    - asserts(W,S)
    assumptions:
    - based_on_evidence(asserts(W,S))
    exceptions:
    - untrustworthy(W)
    - inconsistent_with_other_experts(S)

  # Wyner's variant (2016), kept for games recorded before 2026-10-13.
  - id: credible_source
    meta:
      title: Argument from Credible Source
      source: "Wyner (2016)"
    variables: [W,D,S]
    conclusions: [S]
    premises:
      - credible_source(W,D)
      - asserts(W,S)
      - in_domain(S,D)
    exceptions:
      - biased(W)
      - dishonest(W)
      - other_credible_sources_disagree(S)

  - id: position_to_know
    meta:
      title: Argument from Position to Know
      source: Walton (2002)
    variables:
    - W
    - D
    - S
    conclusions:
    - S
    premises:
    - position_to_know(W,D)
    - asserts(W,S)
    - in_domain(S,D)
    exceptions:
    - dishonest(W)

  - id: analogy
    meta:
      title: Argument from Analogy
      source: Walton (2006)
    variables:
    - A
    - C
    conclusions:
    - A
    premises:
    - similar_case(C)
    - in_case(A,C)
    exceptions:
    - relevant_differences(C)
    - more_on_point(A,C)

  # The modal variants (D008): an action that may bring about a consequence.
  # Their conclusions bear on the decision only through a bridge.
  - id: positive_consequences_modal
    meta:
      title: Argument from Possible Positive Consequences
      source: WAG (D008), after Walton (1995)
    variables:
    - A
    - G
    conclusions:
    - may_be_worth_performing(A,G)
    premises:
    - may_bring_about(A,G)
    - good(G)
    exceptions:
    - bad_outweighs(A,G)
    - too_slight(A,G)
    - gain_discounted_by_bearer(A,G)

  - id: negative_consequences_modal
    meta:
      title: Argument from Possible Negative Consequences
      source: WAG (D008), after Walton (1995)
    variables:
    - A
    - G
    conclusions:
    - may_be_unwise_to_perform(A,G)
    premises:
    - may_bring_about(A,G)
    - bad(G)
    exceptions:
    - good_outweighs(A,G)
    - too_slight(A,G)
    - harm_discounted_by_bearer(A,G)

  # The bridges (D008, refined 2026-11-25): from a possible consequence to the
  # action, when its chance matters enough to the decision; a modal argument
  # supports their first premise, and their exception is shared (D053).
  - id: bridge_from_possible_good
    meta:
      title: From a Possible Good Consequence to the Action (bridge)
      source: WAG (D008)
    variables:
    - A
    - G
    conclusions:
    - should_be_performed(A)
    premises:
    - may_be_worth_performing(A,G)
    - matters_to_decision(A,G)
    exceptions:
    - worth_finding_out_first(A,G)

  - id: bridge_from_possible_harm
    meta:
      title: From a Possible Bad Consequence to Not Acting (bridge)
      source: WAG (D008)
    variables:
    - A
    - G
    conclusions:
    - ¬should_be_performed(A)
    premises:
    - may_be_unwise_to_perform(A,G)
    - matters_to_decision(A,G)
    exceptions:
    - worth_finding_out_first(A,G)

  # The answer schemes (D075): each concludes the exception it answers and is
  # offered only as that answer (D094 (g)).
  - id: bad_outweighs_good
    meta:
      title: Weighing a Bad Consequence against a Good One
      source: WAG (D064, D075), after Walton (1998)
    variables:
    - A
    - H
    - G
    conclusions:
    - bad_outweighs(A,G)
    premises:
    - brings_about(A,H)
    - bad(H)
    - matters_more(H,G)

  - id: good_outweighs_bad
    meta:
      title: Weighing a Good Consequence against a Bad One
      source: WAG (D064, D075), after Walton (1998)
    variables:
    - A
    - H
    - G
    conclusions:
    - good_outweighs(A,G)
    premises:
    - brings_about(A,H)
    - good(H)
    - matters_more(H,G)

  - id: better_means
    meta:
      title: Argument from a Better Means
      source: WAG (D075, D089)
    variables:
    - A
    - A2
    - G
    - P
    conclusions:
    - realize_more_effectively(P,G,A)
    premises:
    - goal_of_agent(P,G)
    - possible_bring_about(P,A2)
    - brings_about(A2,G)
    - more_effective_means(P,A2,G,A)

  - id: finding_out_first
    meta:
      title: Argument for Finding Out First
      source: WAG (D095), after Walton (1998, 2006)
    variables:
    - A
    - G
    - I
    conclusions:
    - worth_finding_out_first(A,G)
    premises:
    - settles_whether(I,A,G)
    - done_in_time(I,A)
    - worth_its_costs(I,A,G)
