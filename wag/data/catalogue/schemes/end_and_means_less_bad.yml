critical_questions: []
summary:
  text: 'Use it when a means that is bad in itself is judged less bad because the
    end it serves is good: X is the means to Y, Y is good, X is bad, so X is less
    bad as a means to Y (the graded reading of 22.6.1, D022). It grades the means;
    it does not conclude that it is good (end_and_means_1) or that it should be used.'
  status: drafted by Claude Code, 2026-11-26
contrasts:
- scheme: practical_inference
  text: practical_inference recommends an action for a goal; end_and_means_less_bad
    only grades a bad means by its good end.
  status: drafted by Claude Code, 2026-11-26
examples:
- text: The injection is the means to the child's recovery, which is good, though
    the injection itself hurts. So it is less bad for being the means to her recovery.
  coding: 'X = the painful injection; Y = the child''s recovery. Pressed: a challenge
    of means_to_end(X,Y) (The injection treats the pain, not the infection: it does
    nothing for her recovery). (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: Closing the high street for a month is bad, but it is the means to building
    the new bridge, which is good. So the closure is less bad for being the means
    to it.
  coding: 'X = closing the high street for a month; Y = building the new bridge. Pressed:
    a challenge of bad(X) (Traffic will use the ring road; the closure harms nobody
    much). (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: The injection is the means to the child's recovery, which is good. So the
    injection is good.
  coding: 'Near miss: X = the injection; Y = the child''s recovery. A means judged
    good by its end, not a bad means judged less bad: end_and_means_1. (proposal D022-D093)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-26
