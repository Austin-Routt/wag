id: end_and_means_less_bad
name: Ends and Means - a Good End Makes a Bad Means Less Bad
tier: 2
walton:
  id: end_and_means_less_bad
  title: Ends and Means - a Good End Makes a Bad Means Less Bad
  source: 'Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation
    Schemes. Cambridge University Press, ch. 9, entry 22.6.1 (its graded reading),
    p. 325. Chaim Perelman and Lucie Olbrechts-Tyteca, The New Rhetoric: A Treatise
    on Argumentation, Notre Dame, Ind.: University of Notre Dame Press, 1969, pp.
    273-278. As the schemes library has it (decision D022).'
formulas:
  variables: [X, "Y"]
  premises:
  - means_to_end(X,Y)
  - good(Y)
  - bad(X)
  conclusions:
  - less_bad_as_means(X,Y)
