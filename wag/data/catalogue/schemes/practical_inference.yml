  status: generated
- id: 22.1/CQ5
  book:
    entry: "22.1"
    label: CQ5
  targets: [{formula: 'bad_outweighs(A,G)', locus: exception}]
  note: 'since 2026-11-24 (D070, D091) the exception is the claim that the bad consequences
    outweigh the goal, D055''s formula; a plain side effect is a rebuttal. WAG''s
    reading: the source''s exception is any side effect that demotes a value (Walton
    and Gordon 2015, p. 515); the action working against its own goal, practical inference''s
    own objection (D091), is asked as walton/incompatible_consequences'
  paraphrase: ""
  answer: ""
  status: generated
- id: walton/incompatible_consequences
  targets: [{formula: 'incompatible_consequences(P,A,G)', locus: exception}]
  note: 'Practical inference''s own objection, which D091 keeps apart from the side
    effect that outweighs G (22.1/CQ5): doing A would work against G itself. Scoped
    to the agent since 2026-11-24; no answer scheme concludes it yet, so it is argued
    with Other. One such claim defeats this scheme and leaves practical_reasoning2
    for the same A, G and P standing.'
  paraphrase: Would doing A work against G itself, undoing what it is meant to achieve?
  answer: 'The critic, who raises it with an argument. Against: a consequence of doing
    A that sets back G itself, which undercuts the argument through incompatible_consequences(P,A,G).
    For: showing that A''s consequences leave G untouched, or serve it.'
  status: drafted by Claude Code, 2026-11-24
- id: walton/possible_goal
  targets: [{formula: possible_goal(G), locus: assumption}]
  note: 'Neither the book nor the game asks it: the goal''s possibility, apart from
    P''s ability to do A, which is 22.1/CQ4''s (D088, since 2026-11-24).'
  paraphrase: Can G be reached at all, by any means?
  answer: 'The proponent, once asked. Against: showing that G cannot be reached whatever
    is done, which undermines possible_goal(G). For: cases where G, or goals like
    it, have been reached, or a credible path to it.'
  status: drafted by Claude Code, 2026-11-24
