# game/order.yml) and each question's game text (its paraphrase, with the
# scheme's variables in braces). The rest of the game part (game.id,
# game.nascq, game.core, each question's game id, locus and pattern) is the
# game's data, which "wag-cli --catalogue-gen" writes the game's files from:
# change it only as a decision says. Every other item has a status,
# game.status too; set it when you draft, verify or dispute.
id: practical_inference
name: Practical Reasoning - Practical Inference
tier: 2
walton:
  id: practical_inference
  title: Practical Reasoning - Practical Inference
  source: 'Trevor Bench-Capon, "Persuasion in Practical Argument Using Value-based
    Argumentation Frameworks." Journal of Logic and Computation 13 (2003), pp. 429-448.
    Douglas Walton, Practical Reasoning. Savage, Md.: Rowman and Littlefield, 1990.
    Douglas Walton, "Actions and Inconsistency: The Closure Problem of Practical Reasoning.
    "In Contemporary Action Theory, vol.1 , ed. Ghita Holmstrom-Hintikka and Raimo
    Tuomela. Dordrecht: Kluwer, 1997, p. 164. Douglas Walton, Slippery Slope Arguments.
    Newport News, Va.: Vale Press, 1992, pp. 89-90.'
formulas:
  variables: [A, G, P]
  premises:
  - goal_of_agent(P,G)
  - action_realize_goal(A,G)
  assumptions:
  - possible_bring_about(P,A)
  - possible_goal(G)
  exceptions:
  - incompatible_goal(P,G)
  - realize_more_effectively(P,G,A)
  - bad_outweighs(A,G)
  - incompatible_consequences(P,A,G)
  conclusions:
  - should_be_performed(A)
