id: cause_to_effect_modal
name: Argument from Cause to Effect - Modal Form
tier: 1
walton:
  id: cause_to_effect_modal
  title: Argument from Cause to Effect - Modal Form
  source: 'Douglas Walton, A Pragmatic Theory of Fallacy. Tuscaloosa and London: University
    of Alabama Press, 1995, pp. 140-141.'
formulas:
  variables: [E1, E2]
  premises:
  - may_occur(E1)
  - causes(E1,E2)
  exceptions:
  - interference(E1)
  conclusions:
  - may_occur(E2)
book:
- entry: "28"
  title: Argument From Cause To Effect
  pages: "328"
  match: partial
  note: 'The weak reading of 28 (the cause occurs or might; the effect will or might
    follow), which cause_to_effect does not formalize: written for WAG by the owner''s
    decision of 2026-10-22 (audit N8; walton-clean/CHANGELOG.md, "Changes decided
    by the owner"). Partial: its causal premise is cause_to_effect''s unqualified
    causes(E1,E2), while the weak reading''s generalization is weak too. cause_to_effect
    stays exact for the strong reading, as both forms of 41 link exactly.'
  status: generated
families:
- family: F13
  name: Causal reasoning and sign
  relation: variant
  note: the weak reading of 28 (the cause may occur; the effect may occur), for hypothetical
    causal steps; written for walton.yml by the owner's decision of 2026-10-22 (audit
    N8)
  status: generated
premise_map:
- entry: "28"
  label: Major Premise
  formulas: [{formula: 'causes(E1,E2)', locus: premise}]
  status: generated
- entry: "28"
  label: Minor Premise
  formulas: [{formula: may_occur(E1), locus: premise}]
  note: the cause occurs, or may occur
  status: generated
- entry: "28"
  label: Conclusion
  formulas: [{formula: may_occur(E2), locus: conclusion}]
  note: the effect may occur
  status: generated
critical_questions:
- id: 28/CQ1
  book:
    entry: "28"
    label: CQ1
  targets: [{formula: 'causes(E1,E2)', locus: premise}]
  note: The paraphrase is cause_to_effect's; the answer asks for less, because this
    scheme concludes only that E2 may occur. How weak a link causes(E1,E2) may state
    is recorded in the discrepancy on the Major Premise.
  paraphrase: How reliably do events like E1 bring about events like E2 — always,
    usually, or only now and then?
  answer: 'The proponent, once asked. Against: evidence that events like E1 do not
    bring about E2, or do so only under conditions this case lacks, which undermines
    causes(E1,E2). For: evidence that E1 brings about E2 in cases like this one often
    enough that E2 is a real prospect. Since the conclusion is only that E2 may occur,
    a modest but real tendency is enough.'
  status: drafted by Claude Code, 2026-10-22
- id: 28/CQ2
  book:
    entry: "28"
    label: CQ2
  targets: [{formula: 'causes(E1,E2)', locus: premise}]
  note: The book's evidence question; walton.yml has no separate formula for the evidence,
    so it targets the causal premise it would support.
  paraphrase: On what grounds is E1 said to cause E2, and do those grounds establish
    it?
  answer: 'The proponent, once asked. Against: showing that the evidence is missing,
    anecdotal, a mere correlation, or drawn from cases unlike this one, which undermines
    causes(E1,E2). For: studies, a known mechanism, or a record of cases that establishes
    the link.'
  status: drafted by Claude Code, 2026-10-22
- id: 28/CQ3
  book:
    entry: "28"
    label: CQ3
  targets: [{formula: interference(E1), locus: exception}]
  paraphrase: Could some other factor in this case, present now or arriving with E1,
    keep E1 from bringing about E2 or blunt its effect?
  answer: 'The critic, who raises it with an argument. Against: a factor that is present,
    or that E1 would bring with it, that blocks or offsets the effect, such as a countermeasure
    or a stronger opposing cause, which undercuts the argument through interference(E1).
    For: showing that no such factor is present or to be expected, or that it is too
    weak to matter.'
  status: drafted by Claude Code, 2026-10-22
summary:
  text: Use it when a cause E1 is only proposed, expected or possible in a case, typically
    a measure not yet adopted, or the text says only that an effect could follow,
    and events like E1 tend to bring about events like E2. It concludes only that
    E2 may occur there, where cause_to_effect claims that the cause has occurred and
    that the effect will follow, and its steps chain, the effect of one being the
    cause of the next.
  status: drafted by Claude Code, 2026-10-22
contrasts:
- scheme: cause_to_effect
  text: Choose cause_to_effect when the cause has occurred, or is occurring, and the
    effect is said to follow; choose cause_to_effect_modal when the cause is proposed,
    expected or merely possible, as with a policy not yet adopted ("if we tax meat"),
    or when the text says only that the effect could or might follow.
  status: drafted by Claude Code, 2026-10-22
- scheme: correlation_to_cause
  text: Choose correlation_to_cause when the point is to establish the causal link
    from the fact that the two go together; choose cause_to_effect_modal when the
    link is taken as given and applied to a cause that may occur.
  status: drafted by Claude Code, 2026-10-22
- scheme: sign
  text: Choose sign when an observed finding is taken to indicate something; choose
    cause_to_effect_modal when a cause that may occur, typically not yet observed,
    is said to bring about an effect.
  status: drafted by Claude Code, 2026-10-22
- scheme: slippery_slope_inductive_step
  text: Choose slippery_slope_inductive_step when the step is a link of a chain said
    to end in a horrible outcome, to reject the first step; choose cause_to_effect_modal
    for a hypothetical causal step whose effect is the point, or that explains, beside
    a consequences argument, how its consequence could come about.
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_consequences
  text: Choose negative_consequences when an effect is cited to argue that an action
    should not be done; choose cause_to_effect_modal when the point is only that the
    effect may follow, including a step that explains, beside a consequences argument,
    how the consequence it cites could come about (the step concludes may_occur, not
    brings_about).
  status: drafted by Claude Code, 2026-10-22
- scheme: positive_consequences
  text: Choose positive_consequences when an effect is cited to argue that an action
    should be done; choose cause_to_effect_modal when the point is only that the effect
    may follow, including a step that explains, beside a consequences argument, how
    the consequence it cites could come about (the step concludes may_occur, not brings_about).
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_consequences_reasoning
  text: Choose negative_consequences_reasoning when an agent's own action is said
    to bring about an outcome bad for the agent's goals, to argue against doing it;
    choose cause_to_effect_modal when the point is only that an effect may follow
    from a cause that may occur.
  status: drafted by Claude Code, 2026-10-22
examples:
- text: Tariffs decrease consumption of goods, which would help decrease consumption
    of meats (due to their higher price).
  kialo: "13292.14"
  coding: 'E1 = a higher price of meat; E2 = lower meat consumption. Stated: causes(E1,E2)
    (tariffs, through price, reduce consumption). Supplied: may_occur(E1), the price
    rise a tax not yet adopted would bring. Conclusion: may_occur(E2). The first link
    (the tax raises the price) is a second instance, whose may_occur(E2) is this one''s
    may_occur(E1). The batch-2 gold, made before this scheme, codes both as reconstructed
    cause_to_effect with the N8 note.'
  status: drafted by Claude Code, 2026-10-22
- text: Deforestation may still occur for crop production, and declining demand of
    meat would require increasing crop production to balance supply and demand.
  kialo: "13292.192"
  coding: 'Two chained instances. First: E1 = falling meat consumption; E2 = more
    crop production. Second: E1 = more crop production; E2 = deforestation for cropland
    ("may still occur"). In each, stated: causes(E1,E2); may_occur(E1) is supplied
    for the first (consumption falls only if the measure comes in) and carried from
    the first''s conclusion for the second; conclusion: may_occur(E2). The gold codes
    them as cause_to_effect, with the N8 note.'
  status: drafted by Claude Code, 2026-10-22
- text: A tax on meat could actually reduce tax revenues by harming the trillion-dollar
    meat industry, which pays substantial taxes.
  kialo: "13292.9"
  coding: 'Secondary instances: the claim''s primary scheme in the gold is negative_consequences
    (the tax should not be adopted). Two chained instances: E1 = a tax on meat, E2
    = harm to the meat industry; then E1 = that harm, E2 = lower tax revenue. In each,
    stated: causes(E1,E2); may_occur(E1), supplied for the tax and carried for the
    harm; conclusion: may_occur(E2). "Could" marks the effect as only possible, which
    is what may_occur(E2) concludes.'
  status: drafted by Claude Code, 2026-10-22
- text: The price of meat does not reflect its true cost due to subsidies.
  kialo: "13292.11"
  coding: 'Near miss: the cause, the subsidies, is in place and the effect already
    holds; cause_to_effect (E1 = meat subsidies, E2 = a meat price below the real
    costs), as the gold codes it (a secondary instance beneath practical_reasoning2).'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
discrepancies:
- kind: partial-link
  about: "28"
  detail: 'This scheme formalizes compendium 28 only in part: the weak reading, which
    cause_to_effect does not formalize, but with cause_to_effect''s unqualified causes(E1,E2)
    where the weak reading''s generalization is weak too. Written for WAG by the owner''s
    decision of 2026-10-22 (audit N8).'
  decision: Keep it partial, for the causal premise (the discrepancy on the Major
    Premise). cause_to_effect, which formalizes the strong reading, stays linked exactly,
    as the two forms of 41 are. Choose between the two schemes by whether the cause
    has occurred and the text says the effect will follow (the contrast with cause_to_effect).
  status: drafted by Claude Code, 2026-10-22
- kind: other
  about: actual causes
  detail: may_occur(E1) holds of a cause that has occurred as well as of one that
    may (its template says "occurs, or may occur", as the book's minor premise does),
    so an actual cause could be coded with either scheme.
  decision: 'No change: code an actual cause with cause_to_effect, which claims more,
    and use this scheme when the text leaves the cause hypothetical or the effect
    only possible (the contrast with cause_to_effect).'
  status: drafted by Claude Code, 2026-10-22
- kind: other
  about: conditional claims
  detail: Policy claims often say that an effect "would" follow if the policy were
    adopted. may_occur(E2) weakens that conditional to a possibility.
  decision: 'No change: while the policy is not adopted, the step can conclude only
    that the effect may occur; how strongly E1 brings about E2 is asked by 28/CQ1.
    Whether the steps can back the consequences argument beside them is the discrepancy
    on the consequence schemes.'
  status: drafted by Claude Code, 2026-10-22
- kind: other
  about: chaining
  detail: 'The scheme''s premise and conclusion use the same predicate, so its steps
    chain: one step''s may_occur(E2) is the next one''s may_occur(E1). A cause_to_effect
    step chains into neither scheme: its will_occur(E2) meets neither may_occur(E1)
    nor has_occurred(E1), so a chain from an actual cause to a possible effect breaks
    at the switch (cause_to_effect records the same gap between its own steps).'
  decision: 'Open: whether walton.yml should let will_occur(E) support may_occur(E),
    and has_occurred(E). Until then, supply the next step''s minor premise and say
    in the coding that it is the previous step''s conclusion.'
  status: drafted by Claude Code, 2026-10-22
- kind: other
  about: batch-2 gold
  detail: The batch-2 gold, made before this scheme, codes its 11 hypothetical causal
    steps (in 13292.9, .12, .14, .36, .180 and .192) as reconstructed cause_to_effect,
    with the note that they need a modal causal scheme (audit N8).
  decision: 'Open: recode them with this scheme, when the owner agrees. Later batches
    use it (batch-2 guidelines, item 11, note of 2026-10-22).'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: Major Premise
  detail: 'In the book''s weak reading the causal generalization is weak too: the
    effect may follow from the cause. The scheme keeps causes(E1,E2), cause_to_effect''s
    unqualified causal premise, and puts the modality only on whether the cause and
    the effect occur.'
  decision: 'Open: read causes(E1,E2), in every scheme that uses it, as a tendency
    of events like E1 to bring about events like E2, strong or weak, each scheme''s
    CQ1 asking whether it is strong enough for what that scheme concludes; or give
    a weak link a formula of its own. Until then, code a weak link with this scheme
    and say so in the coding.'
  status: drafted by Claude Code, 2026-10-22
- kind: other
  about: consequence schemes
  detail: A chain of modal steps from an action A to an outcome G concludes may_occur(G).
    The consequence schemes need brings_about(A,G), which no step concludes and which
    claims more, so the steps explain a consequence but do not back that premise in
    the argument graph.
  decision: 'Open: whether a causal chain should be able to back brings_about(A,G),
    or stay a secondary instance beside the consequences argument, as the batch-2
    gold codes it. Until then, code the steps as secondary instances of the claim,
    not attached to brings_about(A,G).'
  status: drafted by Claude Code, 2026-10-22
- kind: other
  about: interference
  detail: interference(E1)'s template says the interfering event has occurred; for
    a cause that may occur, the interference may be one still to come, such as producers
    absorbing a tax.
  decision: 'No change: read it as a factor that is present or would come with E1,
    as the paraphrase of 28/CQ3 does.'
  status: drafted by Claude Code, 2026-10-22
