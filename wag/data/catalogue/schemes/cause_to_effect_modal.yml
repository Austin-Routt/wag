dialogue_types:
  proper: [inquiry, persuasion, deliberation]
  suspect: []
  note: 'As for cause_to_effect, our extrapolation: weighing the likely effects of
    options is what deliberation does (ND pp. 157–60, on the arguments from consequences
    such steps support), and inquiry and persuasion ask what would happen too. No
    type makes it suspect as such.'
  status: drafted by Claude Code, 2026-10-22
