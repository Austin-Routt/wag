critical_questions: []
summary:
  text: 'Use it when an agent is said to be committed to a course of action by what
    it did or undertook earlier: at a time T2 there is a choice between doing A and
    not doing it, and P is committed in advance to A by what it did at T1, so P should
    do A (the compendium''s form of sunk costs, 25; D031). It names the agent, so
    bridge_from_agent carries it to the recommendation. Bind T1 and T2 with their
    preposition (in March, this spring), so that the templates read right.'
  status: drafted by Claude Code, 2026-11-26
contrasts:
- scheme: practical_inference
  text: practical_inference argues from a goal; sunk_costs_precommitment from a commitment
    made earlier, whatever the goal.
  status: drafted by Claude Code, 2026-11-26
- scheme: waste
  text: Choose waste when the text says that stopping would waste the effort already
    spent on a goal; choose sunk_costs_precommitment when it says that an earlier
    commitment binds the agent now, whatever was spent.
  status: drafted by Claude Code, 2026-11-26
- scheme: sunk_costs
  text: Choose sunk_costs when the text cites the costs already incurred on an action
    as too high to waste; choose sunk_costs_precommitment when it cites a commitment
    made at an earlier time.
  status: drafted by Claude Code, 2026-11-26
examples:
- text: In March Priya signed up to run the charity race and told everyone she would.
    Now, in October, she can run it or not. What she did in March is a commitment,
    binding now, to running it. So she should run it.
  coding: 'P = Priya; A = running the charity race; T1 = in March; T2 = in October.
    Pressed: a challenge of precommitted(P,A,T1,T2) (She signed up for the five-kilometre
    walk, not the race). (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: In 2024 the town committed itself to hosting the folk festival, booking the
    field and the bands. Now, this spring, it can host it or not. It is committed
    to hosting it by what it did in 2024. So the town should host it.
  coding: 'P = the town; A = hosting the folk festival; T1 = in 2024; T2 = this spring.
    The commitment form (D031); it concludes should_do(P,A), so bridge_from_agent
    carries it to the recommendation. Pressed: a challenge of choice_at(T2,A) (There
    is no choice left: the field has been sold for housing). (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: If Priya stops training for the race now, a summer of training will be wasted,
    which would be a pity. So she ought to keep training.
  coding: 'Near miss: A = Priya; X = running the charity race. Past effort that would
    be wasted, not a commitment made at an earlier time: the argument from waste.
    (proposal D022-D093)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-26
