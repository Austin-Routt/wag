id: sunk_costs_precommitment
name: Argument from Sunk Costs (the commitment form)
tier: 2
walton:
  id: sunk_costs_precommitment
  title: Argument from Sunk Costs (the commitment form)
  source: Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation
    Schemes. Cambridge University Press, pp. 135-136, and ch. 9, entry 25, pp. 326-327.
    Douglas Walton, 'The Sunk Costs Fallacy or Argument from Waste', Argumentation
    16 (2002), pp. 488-489. As the schemes library has it (decision D031).
formulas:
  variables: [P, A, T1, T2]
  premises:
  - choice_at(T2,A)
  - precommitted(P,A,T1,T2)
  conclusions:
  - should_do(P,A)
