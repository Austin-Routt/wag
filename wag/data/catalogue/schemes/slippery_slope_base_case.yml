critical_questions:
- id: 49/CQ1
  book:
    entry: "49"
    label: CQ1
  targets: [{formula: 'would_realize(A,E)', locus: premise}]
  note: 'The book asks it of the whole sequence. In walton.yml''s encoding every stated
    link is a premise of its own argument: the first here, the others in slippery_slope_inductive_step.'
  paraphrase: Which of the steps leading from A, through E, to the bad outcome does
    the arguer actually state?
  answer: 'The proponent, once asked. Against: showing that the steps between A and
    the bad outcome are not stated but assumed, so that the coder had to supply them,
    which undermines would_realize(A,E) as stated. For: pointing to where the text
    gives each step.'
  status: drafted by Claude Code, 2026-10-22
- id: 49/CQ2
  book:
    entry: "49"
    label: CQ2
  targets: [{formula: 'would_realize(A,E)', locus: premise}]
  note: 'walton.yml has no formula for the sequence as a whole, so a gap is charged
    to the link that spans it: here the first link, in slippery_slope_inductive_step
    a later one. A premise target rather than undercuts, because a gap makes the link
    doubtful but would not stop a true link from supporting the conclusion.'
  paraphrase: What missing steps would have to be filled in for the chain from A to
    the bad outcome to be plausible?
  answer: 'The proponent, once asked. Against: pointing to a gap, where E follows
    from A only if further events occur that the arguer has not shown, which undermines
    would_realize(A,E). For: supplying the missing events, each stated as a step of
    its own.'
  status: drafted by Claude Code, 2026-10-22
- id: 49/CQ3
  book:
    entry: "49"
    label: CQ3
  targets: [{formula: 'would_realize(A,E)', locus: premise}]
  note: Weakest link. The book's question tells the critic where to aim and to put
    the questions proper to that kind of link (for a causal link, those of cause_to_effect).
    Here it bears on the first link; the weakest link may be a later one, an inductive
    step.
  paraphrase: Which link in the chain is the weakest, and does the one event there
    really lead to the next?
  answer: 'The proponent, once asked. Against: evidence that A would probably not
    set off E (a check on the way, a point where someone must decide, a low likelihood),
    which undermines would_realize(A,E); since every later step hangs on this one,
    a broken first link stops the slope. For: evidence that A would very likely lead
    to E in the circumstances.'
  status: drafted by Claude Code, 2026-10-22
summary:
  text: 'Use it to argue that an action A should not be taken because A would set
    off an event E that leads, link by link, to an outcome with horrible costs. walton.yml
    splits the book''s single slippery slope (49) in two: this base case ties the
    action to the first event of the chain and to that event''s horrible costs, while
    slippery_slope_inductive_step carries the horrible costs back along each further
    link from the final outcome to E; the graduated chain is what sets a slope apart
    from plain negative_consequences.'
  status: drafted by Claude Code, 2026-10-22
contrasts:
- scheme: positive_consequences
  text: 'Not a close relative: it argues for an action from a good result. A chain
    of events towards a good end, argued for, is a series of cause_to_effect steps
    feeding positive_consequences.'
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_consequences
  text: ND treats the slippery slope as a subtype of argument from consequences (p.
    161). Choose the slope when the text presents a series of at least two further
    events after the first step, each said to bring on the next, ending in a horrible
    outcome; choose negative_consequences when the action leads to the bad outcome
    directly or through one stated intermediate event (13292.56, below).
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_consequences_reasoning
  text: Choose negative_consequences_reasoning when an agent rejects its own action
    because the result would harm its goals, in one step; choose the slope when the
    bad end comes at the far end of a chain.
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_consequences_prudential
  text: 'Not a close relative: the prudential form argues for doing A from the bad
    result of not doing it; a slope argues against a first step from the bad end of
    the chain it starts.'
  status: drafted by Claude Code, 2026-10-22
- scheme: pragmatic_alternative
  text: 'Not a close relative: it argues for an action from an either-or (do A, or
    a bad outcome follows), with no chain of steps.'
  status: drafted by Claude Code, 2026-10-22
- scheme: threat
  text: 'Not a close relative: in a threat the speaker undertakes to cause the bad
    outcome; in a slope each step is said to bring on the next without anyone undertaking
    it.'
  status: drafted by Claude Code, 2026-10-22
- scheme: ad_baculum
  text: 'Not a close relative: a threat in either-or form, with a harm the speaker
    will cause, and no chain of steps.'
  status: drafted by Claude Code, 2026-10-22
- scheme: fear
  text: Choose fear when the argument plays on the hearer's fear of a dreadful outcome
    and offers one action as the only escape; choose the slope when it argues, step
    by step, that a first move leads to the dreadful outcome. A slope painted to frighten
    may be both.
  status: drafted by Claude Code, 2026-10-22
- scheme: danger
  text: Choose danger when the action is said to put the hearer directly at serious
    risk; choose the slope when the harm lies at the end of a chain of events that
    the action starts.
  status: drafted by Claude Code, 2026-10-22
- scheme: slippery_slope_inductive_step
  text: The two halves of one book scheme. Use slippery_slope_inductive_step for each
    link between two events of the chain, and slippery_slope_base_case once, for the
    link from the action to the first event; a slope with n links is n−1 inductive
    steps and one base case.
  status: drafted by Claude Code, 2026-10-22
- scheme: precedent_slippery_slope_argument
  text: Choose precedent_slippery_slope_argument (compendium 50, not in walton.yml)
    when the steps are cases bound together by treating like cases alike, so that
    one exception to a rule forces the next; choose this causal slope when each step
    is an event that brings on the next.
  status: drafted by Claude Code, 2026-10-22
- scheme: sorites_slippery_slope
  text: Choose sorites_slippery_slope when the steps are small differences along a
    vague term, so that a property passes from a clear case into the grey area; choose
    this causal slope when the steps are events that bring each other about.
  status: drafted by Claude Code, 2026-10-22
- scheme: verbal_slippery_slope
  text: Choose verbal_slippery_slope when the chain runs through neighbouring cases
    of a vague classification and ends by denying that the first case has the property;
    choose this causal slope when it runs through events and ends by rejecting an
    action.
  status: drafted by Claude Code, 2026-10-22
- scheme: full_slippery_slope
  text: Choose full_slippery_slope (compendium 53) when the steps mix causal, precedent
    and analogical links and the text relies on a climate of opinion that will carry
    people from each step to the next; choose this causal slope when the links are
    events alone.
  status: drafted by Claude Code, 2026-10-22
- scheme: gradualism
  text: The book grounds all slippery slopes in argument from gradualism (p. 114).
    Choose gradualism when the arguer leads the hearer to a conclusion by many small
    moves, each easy to accept; choose the slope when a series of steps is used to
    reject the first one because of where it ends.
  status: drafted by Claude Code, 2026-10-22
examples:
- text: If the school lets phones in at lunch, students will soon want them in study
    hall, then in class, and before long no lesson will go uninterrupted.
  coding: 'A = allowing phones at lunch; E = phones in study hall. Stated: would_realize(A,E).
    Supplied: horrible_costs(E), the conclusion of two inductive steps (phones in
    study hall → phones in class → no lesson uninterrupted), whose final outcome''s
    badness the text implies. Conclusion: ¬should_be_performed(A), the implied "so
    don''t allow them".'
  status: drafted by Claude Code, 2026-10-22
- text: Close the night bus line and late-shift workers will drive home instead; more
    of them driving tired means more crashes on the ring road, and some of those crashes
    will kill.
  coding: 'A = closing the night bus line; E = late-shift workers driving home tired.
    Stated: would_realize(A,E). Supplied: horrible_costs(E), from the inductive steps
    (driving home tired → more crashes on the ring road → fatal crashes). Conclusion:
    ¬should_be_performed(A).'
  status: drafted by Claude Code, 2026-10-22
- text: Such a tax would negatively affect the protein intake of millions of people
    and open the market to the inevitable push by governments to incentivize the consumption
    of insects as a protein alternative.
  kialo: "13292.56"
  coding: 'Near miss: "inevitable push" sounds like a slope, but only one further
    step is given, with no graduated chain; negative_consequences (A = a tax on meat,
    G = a government push for insect protein), as the gold codes its second instance.'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
discrepancies:
- kind: partial-link
  about: "49"
  detail: 'walton.yml formalizes compendium 49 only in part: Upstream Carneades recursive
    encoding (title "Slippery Slope Argument"; source Slippery Slope Arguments, printed
    year 1999, corrected to the book''s 1992 on 2026-10-22, pp. 93, 95): base case
    of the chain.'
  decision: 'Keep the link as partial, and keep the split. The book''s one scheme
    becomes two in walton.yml: this base case (the first link, from the action A0
    = A to the first event A1 = E, E''s horrible costs, and a conclusion about A)
    and slippery_slope_inductive_step (each further link Ai → Ai+1, carrying the horrible
    costs of An back to A1). A slope with n links is coded as n−1 inductive steps
    and one base case. The premise maps show where each book premise goes. What the
    split loses is in the book-walton discrepancies below and in the inductive step''s.'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: First Step Premise
  detail: The book's first premise says that A0 has been put forward and looks, at
    first, like something to do. No formula expresses it.
  decision: 'No change: it sets the scene (a proposal is on the table) rather than
    giving a reason. In coding, A is the proposal the slope argues against; record
    in the notes that it is proposed.'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: Conclusion
  detail: The book's conclusion is that A0 is not to be done. walton.yml's base case
    concluded negative_consequences(A), that A would have negative consequences, and
    no walton.yml scheme takes that formula as a premise, so an encoded slope never
    reached a recommendation.
  decision: 'Done: the owner''s decision of 2026-10-22 changed the conclusion to ¬should_be_performed(A),
    as the book and negative_consequences have it, so a slope meets the pros of the
    same action (docs/scheme-registry/walton-clean/CHANGELOG.md, "Changes decided
    by the owner").'
  status: drafted by Claude Code, 2026-10-22
- kind: other
  about: source
  detail: walton.yml cited Slippery Slope Arguments (Vale Press, Newport News) as
    of 1999; the compendium cites the same title and pages (93, 95) from the same
    publisher as of 1992.
  decision: 'Done: the owner''s decision of 2026-10-22 changed the year to the compendium''s
    1992 (docs/scheme-registry/walton-clean/CHANGELOG.md, "Changes decided by the
    owner"). The book''s ch. 4 (p. 114) cites p. 93, for gradualism, as "Walton, 1999";
    a verifier with the book''s reference list should confirm which work that is.'
  status: drafted by Claude Code, 2026-10-22
classification:
  source: independent
  reasoning: epistemic
  epistemic: application
  group: chained
  note: Not in the tree; placed with the precedent and sorites slopes under chained,
    because it belongs to the same family (F17, of which it is the generic) and works
    by chaining steps. The tree lists no causal slope. The alternative is value-based,
    with negative consequences, since ND makes the slope a subtype of argument from
    consequences (p. 161) and the book's conclusion is about an action; the tree,
    though, puts the other slopes, whose conclusions are also practical, under chained.
  status: drafted by Claude Code, 2026-10-22
specialises:
  scheme: negative_consequences
  note: ND places the slippery slope under argument from consequences, as the case
    where the bad results come in a graded series (p. 161). The narrowing adds the
    chain of steps (carried by slippery_slope_inductive_step) and a horrible end;
    since 2026-10-22 both conclude ¬should_be_performed(A).
  status: drafted by Claude Code, 2026-10-22
dialogue_types:
  proper: [deliberation, persuasion]
  suspect: [inquiry]
  note: 'Not in ND''s table (docs/dialogue-types.md §7). ND names it as an argument
    used in deliberation, a subtype of argument from consequences (p. 161). Our extrapolation:
    it is proper in persuasion about a policy, where the book treats it as an attack
    on a proposed course of action (p. 118), and suspect where the issue is whether
    something is true, as for consequences in general (ND pp. 176–7).'
  status: drafted by Claude Code, 2026-10-22
