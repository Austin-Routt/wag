critical_questions:
- id: walton/difference_against
  targets: [{formula: 'difference_against(A1,A2,X2)', locus: exception}]
  note: 'No book question asks it: the book prints no questions for 8.1 or 8.2. The
    exception is analogy''s difference question, given to its practical counterpart
    (D028), and sided: a difference that tells against taking X2 here undercuts this
    argument, while one in its favour undercuts the negative practical analogy instead,
    so that when both argue from one past situation each side''s difference defeats
    only the other (D053).'
  paraphrase: Do the two situations differ in a way that tells against taking this
    course here?
  answer: 'The critic, who raises it with an argument. Against: a feature of the present
    situation, absent from A1, that makes X2 a worse course here (the river bridge
    is closed this time), which undercuts the argument through difference_against(A1,A2,X2).
    For: showing that the differences do not bear on X2, or that they favour it.'
  status: drafted by Claude Code, 2026-10-22
summary:
  text: 'Use it when an action X2 is recommended in a situation A2 because the corresponding
    action X1 was the right course in an earlier situation A1 that resembles A2. It
    is analogy put to practical use: what crosses from one situation to the other
    is a verdict that an action was right, and the conclusion, that X2 should be performed,
    meets practical reasoning and the consequence arguments about the same action.
    That sets it apart from analogy, which carries over any other claim, and from
    practical_inference, which recommends X as a means to a goal.'
  status: drafted by Claude Code, 2026-10-22
contrasts:
- scheme: analogy
  text: 'The choice with analogy: a practical analogy cites the source for a verdict
    that an action taken there was right or wrong, whatever the word, and concludes
    that verdict on the corresponding action here; any other claim carried over is
    analogy. A finding carried over by analogy (a tax worked there) can back the verdict
    that the action was right, in a second argument.'
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_inference
  text: Choose practical_inference when X is recommended as a means to a goal the
    agent has; choose practical_analogy_positive when it is recommended because X
    was right in a similar situation, with no goal stated. When a text cites a precedent
    and also names the goal X served, code the inference it leans on.
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_analogy_negative
  text: 'The counterpart, with the same form: they conclude contradictories about
    the same action, so they rebut each other and Carneades weighs them. Choose the
    negative form when the earlier action is cited as a mistake, to argue against
    repeating it, and the positive form when it is cited as the right course, to argue
    for repeating it.'
  status: drafted by Claude Code, 2026-10-22
- scheme: popular_practice
  text: Choose popular_practice when an action is defended because most of those who
    know the field accept it; choose practical_analogy_positive when it is defended
    because it was right in a situation like this one. Citing what other governments
    have done can be either; the gold codes 13292.30 as a practical analogy, since
    the other cases are cited as precedents, not as a majority.
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_reasoning2
  text: Choose practical_reasoning2 when X is argued for as the means, in the present
    circumstances, to a goal; choose practical_analogy_positive when X is argued for
    because it was the right thing in a similar situation, with no goal or means stated.
  status: drafted by Claude Code, 2026-10-22
examples:
- text: Elsewhere, governments have put taxes on ecologically damaging businesses,
    e.g., carbon tax, oil tax etc.
  kialo: "13292.30"
  coding: 'A1 = countries facing the damage done by burning fossil fuels; A2 = our
    country facing the damage done by meat production; X1 = taxing carbon and oil;
    X2 = tax_meat, the thesis''s action. Stated: that X1 was done in A1; right_to_do(A1,X1)
    is supplied (popular practice is the rival reading). Inferred: similar_to(A1,A2)
    (meat production is ecologically damaging, 13292.4, 13292.108) and corresponds(X1,X2).
    Conclusion: should_be_performed(tax_meat), the thesis, so it meets the consequence
    arguments about the same action. Pressed: walton/difference_against (meat is food,
    and a tax on food falls hardest on the poor); a challenge of corresponds(X1,X2).'
  status: drafted by Claude Code, 2026-10-22
- text: In the 2019 flood, evacuating the low town a day early was the right call.
    This storm is like that one, so we should evacuate early again.
  coding: 'A1 = the 2019 flood; A2 = this storm; X1 = evacuating the low town a day
    early in 2019; X2 = evacuating the low town a day early now. Conclusion: should_be_performed(X2).
    A negative practical analogy from the 2021 storm concludes its contradictory,
    and the two rebut each other. A critic raises difference_against(A1,A2,X2): this
    time the river bridge is closed.'
  status: drafted by Claude Code, 2026-10-22
- text: Bailing out the banks in 2008 was right, since it stopped a run that would
    have ruined ordinary savers. This crisis is like 2008, so the banks should be
    bailed out again.
  coding: A1 = the 2008 banking crisis; A2 = this banking crisis; X1 = bailing out
    the banks in 2008; X2 = bailing out the banks now. Its negative counterpart argues
    from the same situation that the bailout was wrong; their exceptions are sided,
    so the negative's difference_for leaves this argument standing.
  status: drafted by Claude Code, 2026-10-22
- text: Banning smoking in pubs was the right call, and vaping indoors is much the
    same, so it should be banned too.
  coding: 'A1 = smoking in pubs; A2 = vaping indoors; X1 = banning smoking in pubs;
    X2 = banning vaping indoors. Stated: right_to_do(A1,X1) ("the right call"), similar_to(A1,A2)
    ("much the same"); corresponds(X1,X2) supplied. Conclusion: should_be_performed(X2).'
  status: drafted by Claude Code, 2026-10-22
- text: Sugar taxes in other countries cut sales of sugary drinks, so a meat tax would
    cut meat sales.
  coding: 'Near miss: what crosses over is a finding (the tax cut sales), not a verdict
    that taxing was right, and the conclusion is a prediction; analogy (C1 = the sugar
    taxes; C2 = a meat tax; P1 = the sugar taxes cut sales of sugary drinks; P2 =
    a meat tax would cut meat sales).'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
- text: Denmark, which everyone here looks up to, taxes saturated fat; we should tax
    it too.
  coding: 'Near miss: followed because it is admired, not because its situation is
    like ours; from_model.'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
