  status: drafted by Claude Code, 2026-10-22
specialises:
  scheme: ""
  note: 'Specialises nothing: the book presents it as the practical counterpart of
    argument from analogy (ch. 2, p. 74), not a subtype. It shares analogy''s vocabulary
    (similar_to, corresponds and a difference exception) but carries a verdict on
    an action and concludes that the action should be performed.'
  status: drafted by Claude Code, 2026-10-22
dialogue_types:
  proper: [deliberation, persuasion]
  suspect: []
  note: 'Not in ND''s table, and ND does not discuss it; our extrapolation. It answers
    "what should we do?", so it belongs where practical reasoning does: deliberation
    (ND pp. 151–7) and persuasion about an action. In negotiation, an appeal to what
    was right in a like case works as the fair, independent standard that Fisher and
    Ury recommend, which ND says lies outside the normative model of negotiation (p.
    102); we list negotiation in neither list.'
  status: drafted by Claude Code, 2026-10-22
