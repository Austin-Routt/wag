  premises:
  - goal_is_action(A)
  - alternative_action(X,A)
  - necessary_action(X,A)
  - practicality_action(X)
  - more_acceptable_bringing(A,X)
  assumptions:
  - possible_action(A)
  - acceptable_action(X)
  - possible_agent(X,P)
  exceptions:
  - alternative_means(A,X)
  - side_effect_action(P,X)
  - conflict_goals(P,A2,A)
  conclusions:
  - bringing_about_action(X)
