id: practical_necessary_condition
name: Practical Reasoning - Necessary Condition Schema
tier: 1
walton:
  id: practical_necessary_condition
  title: Practical Reasoning - Necessary Condition Schema
  source: 'Trevor Bench-Capon, "Persuasion in Practical Argument Using Value-based
    Argumentation Frameworks." Journal of Logic and Computation 13 (2003), pp. 429-448.
    Douglas Walton, Practical Reasoning. Savage, Md.: Rowman and Littlefield, 1990.
    Douglas Walton, "Actions and Inconsistency: The Closure Problem of Practical Reasoning.
    "In Contemporary Action Theory, vol.1 , ed. Ghita Holmstrom-Hintikka and Raimo
    Tuomela. Dordrecht: Kluwer, 1997, p. 164. Douglas Walton, Slippery Slope Arguments.
    Newport News, Va.: Vale Press, 1992, pp. 89-90.'
formulas:
