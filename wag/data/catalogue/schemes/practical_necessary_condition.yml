# A scheme of WAG's catalogue (wag/data/catalogue/README.md).
# Source fields (walton, formulas) are regenerated by "wag-cli --catalogue-gen";
# do not edit them here. The game part (game, and the game part of each
# question) is the game's data, which "wag-cli --catalogue-gen" writes the
# game's files from: change it only as a decision says.
# Every other item has a status; set it when you draft, verify or dispute.
id: practical_necessary_condition
name: Practical Reasoning - Necessary Condition Schema
tier: 1
walton:
  id: practical_necessary_condition
  title: Practical Reasoning - Necessary Condition Schema
  source: 'Trevor Bench-Capon, "Persuasion in Practical Argument Using Value-based
    Argumentation Frameworks." Journal of Logic and Computation 13 (2003), pp. 429-448.
    Douglas Walton, Practical Reasoning. Savage, Md.: Rowman and Littlefield, 1990.
    Douglas Walton, "Actions and Inconsistency: The Closure Problem of Practical Reasoning.
    "In Contemporary Action Theory, vol.1 , ed. Ghita Holmstrom-Hintikka and Raimo
    Tuomela. Dordrecht: Kluwer, 1997, p. 164. Douglas Walton, Slippery Slope Arguments.
    Newport News, Va.: Vale Press, 1992, pp. 89-90.'
formulas:
  variables: [X, G, P, S]
  premises:
  - goal_of_agent(P,G)
  - alternative_action(P,S,G)
  - necessary_action(P,X,S,G)
  - practicality_action(P,X)
  - more_acceptable_bringing(P,G,X)
  assumptions:
  - possible_goal(G)
  - acceptable_action(P,X)
  - possible_bring_about(P,X)
  exceptions:
  - realize_more_effectively(P,G,X)
  - goal_achievable_without_any(P,G,S)
  - bad_outweighs(X,G)
  - incompatible_goal(P,G)
  conclusions:
  - should_be_performed(X)
book:
- entry: "22.2"
  title: Necessary Condition Schema
  pages: 323-324
  parent: "22"
  match: partial
  cqs_printed_under: "22.3"
  note: 'Same title and references; all five premises have formulas. Partial since
    2026-11-24: the first-person premises are stated of the agent P and the conclusion
    is restated in the game''s vocabulary, should_be_performed(X) (D030, D063).'
  status: generated
families:
- family: F10
  name: Practical reasoning
  relation: specialization
  status: generated
premise_map:
- entry: "22.2"
  label: Goal Premise
  formulas: [{formula: 'goal_of_agent(P,G)', locus: premise}]
  status: generated
- entry: "22.2"
  label: Alternatives Premise
  formulas: [{formula: 'alternative_action(P,S,G)', locus: premise}]
  note: the set of means [B0..Bn] is S; the chosen member is X (D030, since 2026-11-24)
  status: generated
- entry: "22.2"
  label: Selection Premise
  formulas: [{formula: 'necessary_action(P,X,S,G)', locus: premise}]
  status: generated
- entry: "22.2"
  label: Practicality Premise
  formulas: [{formula: 'practicality_action(P,X)', locus: premise}]
  status: generated
- entry: "22.2"
  label: Side Effects Premise
  formulas: [{formula: 'more_acceptable_bringing(P,G,X)', locus: premise}]
  status: generated
- entry: "22.2"
  label: Conclusion
  formulas: [{formula: should_be_performed(X), locus: conclusion}]
  note: 'restated as should_be_performed(X) (D063); the book: "it is required that
    I bring about Bi"'
  status: generated
critical_questions:
- id: 22.3/CQ1
  book:
    entry: "22.3"
    label: CQ1
  targets: [{formula: 'goal_achievable_without_any(P,G,S)', locus: exception}]
  note: 'Alternative Means Question, read as a best choice (D090, since 2026-11-24):
    the alternatives premise already grants other members of the set S, so another
    member answers nothing; what answers it is a route to G that uses no means of
    S. A means of the set that does better is asked separately (walton/realize_more_effectively).'
  paraphrase: Could P reach G without using any of the means S?
  answer: 'The critic, who raises it with an argument. Against: a route to G open
    to P that uses none of the means in S, which undercuts the argument through goal_achievable_without_any(P,G,S):
    no means of the set is then needed. It has no answer scheme yet, so it is argued
    with Other, and the engine accepts any argument concluding it; the answer contract
    (a route P can take that reaches G and uses no member of S, D090) is the CQ answer
    contract''s (stage 2, item F) and the game''s (step C5). For: showing that every
    route to G passes through some member of S.'
  status: drafted by Claude Code, 2026-11-24
- id: 22.3/CQ2
  book:
    entry: "22.3"
    label: CQ2
  targets: [{formula: 'acceptable_action(P,X)', locus: assumption}]
  note: Acceptable/Best Option Question. The Selection Premise, necessary_action(P,X,S,G),
    states the same choice as a premise, so the question bears on it too; the generated
    target keeps the assumption, acceptable_action(P,X), for the agent P since 2026-11-24
    (D030), which covers acceptability only. Whether X is the best means bears on
    the Selection Premise, which can be challenged directly, and on walton/realize_more_effectively.
  paraphrase: Is X an acceptable thing for P to do?
  answer: 'The proponent, once asked. Against: showing that X is unacceptable for
    P (unlawful, too costly, against P''s principles), which undermines acceptable_action(P,X).
    For: reasons why X is acceptable.'
  status: drafted by Claude Code, 2026-11-24
- id: 22.3/CQ3
  book:
    entry: "22.3"
    label: CQ3
  targets: [{formula: 'possible_bring_about(P,X)', locus: assumption}]
  note: Possibility Question; the agent a is P. Since 2026-11-24 the assumption is
    possible_bring_about(P,X), the means' possibility (D030, D088; possible_agent(X,P)
    before). The Practicality Premise, practicality_action(P,X), says much the same
    as a premise and can be challenged directly.
  paraphrase: Can P actually bring about X?
  answer: 'The proponent, once asked. Against: showing that P lacks the means, the
    power or the authority to bring about X, which undermines possible_bring_about(P,X).
    For: evidence that P can do X, such as resources, a plan, or having done it before.'
  status: drafted by Claude Code, 2026-11-24
- id: 22.3/CQ4
  book:
    entry: "22.3"
    label: CQ4
  targets: [{formula: 'bad_outweighs(X,G)', locus: exception}]
  note: 'Negative Side Effects Question. Since 2026-11-24 (D091) the exception is
    the claim that X''s bad consequences outweigh G, D055''s formula (side_effect_action(P,X),
    any harmful side effect, before). The Side Effects Premise, more_acceptable_bringing(P,G,X),
    states the weighing that this question reopens. The question has two routes (docs/kialo-batch2/guidelines.md
    §3.1): a bad consequence that ranks nothing is a rebuttal, negative_consequences
    at the conclusion (OC2); a claim that it matters more than G argues the exception,
    with bad_outweighs_good (OC3, OC4).'
  paraphrase: Would bringing about X have bad consequences that outweigh G?
  answer: 'The critic, who raises it with an argument. Against: a claim that a bad
    consequence of X matters more than G, argued with bad_outweighs_good, which concludes
    bad_outweighs(X,G) and undercuts the argument; a bad consequence that ranks nothing
    is a rebuttal, negative_consequences at the conclusion. For: a reply that attacks
    the weighing''s comparison or the consequence it relies on, or showing that reaching
    G is worth it, as more_acceptable_bringing(P,G,X) claims.'
  status: drafted by Claude Code, 2026-11-24
- id: 22.3/CQ5
  book:
    entry: "22.3"
    label: CQ5
  targets: [{formula: 'incompatible_goal(P,G)', locus: exception}]
  note: Conflicting Goals Question. Since 2026-11-24 (D004, D030) the exception is
    practical reasoning's incompatible_goal(P,G), scoped to the agent and the goal;
    the other goal is named by the answer, not by a variable (A2, which no premise
    bound, left the scheme).
  paraphrase: Is there another goal of P that G itself would clash with?
  answer: 'The critic, who raises it with an argument. Against: another goal of P
    that G itself clashes with, which undercuts the argument through incompatible_goal(P,G).
    For: showing that P''s other goals are compatible with G, or matter less.'
  status: drafted by Claude Code, 2026-11-24
- id: walton/realize_more_effectively
  targets: [{formula: 'realize_more_effectively(P,G,X)', locus: exception}]
  note: 'The book''s CQ2 asks whether X is acceptable or the best of the means. walton.yml''s
    exception, the best-choice reading (D090, since 2026-11-24), is a strictly better
    means: one that realizes G more surely, sooner or at lower cost. An equally good
    means does not defeat the recommendation (D006).'
  paraphrase: 'Is there a means open to P that would realize G more effectively than
    X: more surely, sooner or at lower cost?'
  answer: 'The critic, who raises it with an argument. Against: another means open
    to P that would realize G more surely, sooner or at lower cost than X, argued
    with better_means, which concludes realize_more_effectively(P,G,X) and so undercuts
    the argument; its goal premise is this argument''s own, and it records which comparison
    it makes. A means that is merely as good answers nothing (D006). For: a reply
    that attacks better_means'' premises: that P cannot take the other means, that
    it does not reach G, or that it does no better.'
  status: drafted by Claude Code, 2026-11-24
- id: walton/possible_goal
  targets: [{formula: possible_goal(G), locus: assumption}]
  note: Neither the book nor the game asks it. Since 2026-11-24 the goal's possibility
    is possible_goal(G) (D030, D088; possible_action(A) before, with A the goal),
    apart from the means', which is CQ3's.
  paraphrase: Can G be reached at all, by any means?
  answer: 'The proponent, once asked. Against: showing that G cannot be reached whatever
    means are taken, which undermines possible_goal(G). For: showing that G, or goals
    like it, have been reached, or a credible path to it.'
  status: drafted by Claude Code, 2026-11-24
summary:
  text: Use it when an agent P with a goal G argues that a means X should be taken
    because at least one of a set of means S is needed for G and X has been chosen
    among them, nothing known stands in the way of X, and reaching G is worth the
    cost of X. Necessity sets it apart from practical_sufficient_condition, where
    each means of the set would be enough for G, and the choice among alternatives
    sets it apart from the two-premise practical_inference.
  status: drafted by Claude Code, 2026-11-24
contrasts:
- scheme: practical_inference
  text: practical_inference is the generic goal-means form (22.1), whose means premise
    does not say whether the means is needed or merely enough. Choose practical_necessary_condition
    when the text says the means is required ("have to", "must", "the only way") and,
    at least implicitly, chosen among the alternatives; choose practical_inference
    for a bare goal and means.
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_sufficient_condition
  text: 'Choose practical_sufficient_condition when the text says X would be enough
    to bring G about ("would solve", "can achieve"); choose practical_necessary_condition
    when it says G cannot be had without some means of the set ("we have to", "there
    is no other way"). Since 2026-11-24 the two schemas differ in the alternatives
    premise (each means of S would be enough, as ch. 3 prints it, p. 96, against at
    least one being needed), the selection premise (sufficient_action against necessary_action)
    and the exceptions: only the necessary scheme has goal_achievable_without_any(P,G,S)
    (D030, D090).'
  status: drafted by Claude Code, 2026-11-24
- scheme: practical_reasoning2
  text: 'Choose practical_reasoning2 when the text describes the present circumstances
    and a state the action would bring about in which the goal is met; choose practical_necessary_condition
    when it says that the means is needed for the goal and can be done (Kialo gold,
    13292.45: "have to", "manageable").'
  status: drafted by Claude Code, 2026-10-22
examples:
- text: In which case, importation standards have to be maintained at a higher level;
    this is manageable.
  kialo: "13292.45"
  coding: 'X = raise import standards; G = domestic producers are protected from cheap
    imports; P = governments; S = the barriers to cheaper meat imports (higher import
    standards, quotas, tariffs). Stated: necessary_action(P,X,S,G) ("have to"), practicality_action(P,X)
    ("this is manageable"). Supplied: goal_of_agent(P,G) (from the parent 13292.12,
    whose prediction "in which case" grants), alternative_action(P,S,G), more_acceptable_bringing(P,G,X).
    Conclusion: should_be_performed(X). Since 2026-11-24 the gold binds S, which the
    claim does not name (D030); A2, which no premise bound, left the scheme.'
  status: drafted by Claude Code, 2026-11-24
- text: 'To get the bridge reopened before winter, the council has to hire a second
    repair crew: no other option is fast enough, and the budget can stretch to it.'
  coding: 'G = the bridge reopens before winter; X = hire a second repair crew; P
    = the council; S = the ways to finish the repairs before winter (a second crew,
    overtime, a contractor). Stated: goal_of_agent(P,G), alternative_action(P,S,G)
    and necessary_action(P,X,S,G) ("has to", "no other option is fast enough"), practicality_action(P,X)
    ("the budget can stretch to it"). Supplied: more_acceptable_bringing(P,G,X). Conclusion:
    should_be_performed(X).'
  status: drafted by Claude Code, 2026-11-24
- text: Measures such as eco-tariffs and import-related policy can solve this issue.
    Imported meat would need to verifiably meet environmental and animal welfare standards
    and/or needs to pass a sufficiently high tax barrier.
  kialo: "13292.194"
  coding: 'Near miss: it proposes import measures for the same goal as 13292.45, but
    "can solve" says the measures would be enough, not that they are needed, and no
    choice among alternatives or practicality is stated. positive_consequences (A
    = tax meat with import safeguards, G = domestic producers protected), as the gold
    codes it, having set practical_sufficient_condition aside. "Would need to" in
    the second sentence says what the measures require of imports, not that the measures
    are necessary for the goal.'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
discrepancies:
- kind: partial-link
  about: "22.2"
  detail: 'walton.yml formalizes compendium 22.2 only in part: Same title and references;
    all five premises have formulas. Partial since 2026-11-24: the first-person premises
    are stated of the agent P and the conclusion is restated in the game''s vocabulary,
    should_be_performed(X) (D030, D063).'
  decision: ""
  status: generated
- kind: other
  about: A_reasoning/3_practical-reasoning.yml
  detail: 'The upstream category file A/3 has two blocks with the id practical_necessary_condition
    (lines 249 and 277), both with the necessary-condition title. The second has sufficient_action(X,A)
    in place of necessary_action(X,A) and is otherwise the same: it is master walton.yml''s
    practical_sufficient_condition under the wrong id and title. Read as one file,
    the later block shadows the earlier (docs/walton-audit/REPORT.md §2 and §3.1).'
  decision: 'No change to walton.yml, which has both schemes under their own ids.
    The duplicate is an upstream defect of the category file: its second block should
    carry the id practical_sufficient_condition and that title.'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: Alternatives Premise
  detail: The book's premise is about a set of means [B0, ..., Bn], at least one of
    which is needed for the goal. walton.yml's alternative_action(X,A) named only
    the selected member X, so the set and its "at least one" were lost, although the
    English reading still spoke of at least one of X.
  decision: 'Done: decision D030 (2026-11-24; proposal D004-D075) gave the scheme
    the set of means S apart from the chosen means X, as the schemes library repairs
    it: alternative_action(P,S,G), at least one of the means S is needed for G, and
    necessary_action(P,X,S,G). Another member of S answers nothing (D090); the objection
    is a route that uses none of them (22.3/CQ1).'
  status: drafted by Claude Code, 2026-11-24
- kind: book-walton
  about: possible_action(A)
  detail: The assumption possible_action(A) had no basis in 22.2. There A was the
    goal, so it said that the goal is possible; in practical_inference, where the
    predicate also occurred, A was the action. The book's possibility question (CQ3)
    is about the means, which possible_agent(X,P) covered.
  decision: 'Done: decision D030 (2026-11-24; proposal D004-D075): the schema separates
    possible_goal(G) and possible_bring_about(P,X), as the schemes library has it,
    so that no variable is left unbound (D088); its conclusion is should_be_performed(X)
    (D063). The goal''s possibility is asked as walton/possible_goal, the means''
    as 22.3/CQ3.'
  status: drafted by Claude Code, 2026-11-24
- kind: book-walton
  about: P and A2
  detail: The book's schema speaks in the first person, and its questions switch to
    an agent a (p. 324). walton.yml's agent P and other goal A2 occurred only in the
    assumptions and exceptions, not in any premise or the conclusion, so nothing in
    the argument itself bound them, and the validator failed the scheme.
  decision: 'Done: decision D030 (2026-11-24; proposal D004-D075) states the agent
    P in each premise, as the schemes library repairs the schema, and replaces A2''s
    exception with incompatible_goal(P,G) (D004), whose answer names the other goal.
    Bind P to the agent the text names or its context supplies (in a policy debate,
    whoever would enact the policy).'
  status: drafted by Claude Code, 2026-11-24
- kind: book-walton
  about: burden of the questions
  detail: In ch. 3, right after the necessary- and sufficient-condition schemata,
    the book says that asking any of the questions it lists defeats the argument,
    at least for a time, until the proponent answers (p. 96). walton.yml makes the
    alternative-means, side-effects and conflicting-goals questions exceptions, which
    the critic must prove.
  decision: 'Decided 2026-11-22 (D003): The questions stay exceptions, the critic''s
    to support. Who must answer a question that is asked is a rule of the dialogue
    (the request, its answer, and what holds while it is pending), set by the game''s
    question protocol with D075, not by turning exceptions into assumptions. Not yet
    applied. Before: The catalogue follows walton.yml''s roles, as the game does (docs/game-rules.md
    §2), and the answers say so. open: the owner''s decision whether these questions
    should shift the burden when asked, which would make them assumptions.'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: best choice
  detail: 22.2 concludes that the agent should bring about the means chosen among
    the alternatives as acceptable or the best, and its CQ1 asks about alternative
    means. Read literally, any other means of the set would answer CQ1, though the
    alternatives premise grants that there are others.
  decision: 'Decided 2026-11-24 (D090) and done (proposal D004-D075): read as a best
    choice. A strictly better means defeats the recommendation (realize_more_effectively(P,G,X),
    asked as walton/realize_more_effectively and argued with better_means); an equally
    good one does not (D006); CQ1''s objection is a route to G that uses none of the
    means S (goal_achievable_without_any(P,G,S)). The engine accepts any argument
    concluding that exception; the answer contract (a route P can take that reaches
    G and uses no member of S) is the CQ answer contract''s (stage 2, item F) and
    the game''s (step C5).'
  status: drafted by Claude Code, 2026-11-24
classification:
  source: independent
  reasoning: practical
  epistemic: ""
  group: instrumental
  note: 'The tree does not name the schema, but compendium 22.2 is a form of practical
    reasoning (22), and the tree''s instrumental argument from practical reasoning
    covers it: it argues from a goal to a needed means, without values.'
  status: drafted by Claude Code, 2026-10-22
specialises:
  scheme: practical_inference
  note: 'families.json lists it as a specialization of practical_inference (F10),
    and rightly: the means premise is narrowed to a necessary condition chosen among
    alternatives, and the schema adds premises for practicality and side effects (ch.
    3, pp. 95–6).'
  status: drafted by Claude Code, 2026-10-22
dialogue_types:
  proper: [deliberation, negotiation, persuasion]
  suspect: []
  note: 'From ND: ND gives the necessary- and sufficient-condition schemata as the
    basic inferences of practical reasoning in deliberation (ND pp. 154–5), and argument
    in negotiation also rests on practical reasoning about goals and means (ND pp.
    105, 111). Persuasion about what to do is our extrapolation. ND names no type
    in which it is suspect.'
  status: drafted by Claude Code, 2026-10-22
