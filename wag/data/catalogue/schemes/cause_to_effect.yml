critical_questions:
- id: 28/CQ1
  book:
    entry: "28"
    label: CQ1
  targets: [{formula: 'causes(E1,E2)', locus: premise}]
  paraphrase: How reliably do events like E1 bring about events like E2 — always,
    usually, or only now and then?
  answer: 'The proponent, once asked. Against: evidence that events like E1 produce
    E2 rarely, or only under conditions this case lacks, which undermines causes(E1,E2)
    or leaves it too weak to carry the conclusion. For: evidence that E1 regularly
    brings about E2 in cases like this one.'
  status: drafted by Claude Code, 2026-10-22
- id: 28/CQ2
  book:
    entry: "28"
    label: CQ2
  targets: [{formula: 'causes(E1,E2)', locus: premise}]
  note: The book's evidence question; walton.yml has no separate formula for the evidence,
    so it targets the causal premise it would support.
  paraphrase: On what grounds is E1 said to cause E2, and do those grounds establish
    it?
  answer: 'The proponent, once asked. Against: showing that the evidence is missing,
    anecdotal, a mere correlation, or drawn from cases unlike this one, which undermines
    causes(E1,E2). For: studies, a known mechanism, or a record of cases that establishes
    the link.'
  status: drafted by Claude Code, 2026-10-22
- id: 28/CQ3
  book:
    entry: "28"
    label: CQ3
  targets: [{formula: interference(E1), locus: exception}]
  paraphrase: Is anything present in this case that could stop E1 from bringing about
    E2?
  answer: 'The critic, who raises it with an argument. Against: a factor in this case
    that blocks or offsets the effect, such as a countermeasure or a stronger opposing
    cause, which undercuts the argument through interference(E1). For: showing that
    no such factor is present, or that it is too weak to matter.'
  status: drafted by Claude Code, 2026-10-22
summary:
  text: Use it to predict that an event E2 will happen in a case because an event
    E1 happens there, and events like E1 generally bring about events like E2. It
    reasons forward from a cause taken as known to its effect, which sets it apart
    from correlation_to_cause, which argues for the causal link itself, and from sign,
    which infers from an indicator to what it indicates.
  status: drafted by Claude Code, 2026-10-22
contrasts:
- scheme: cause_to_effect_modal
  text: Choose cause_to_effect when the cause has occurred, or is occurring, and the
    effect is said to follow; choose cause_to_effect_modal when the cause is proposed,
    expected or merely possible, as with a policy not yet adopted, or when the text
    says only that the effect could or might follow.
  status: drafted by Claude Code, 2026-10-22
- scheme: correlation_to_cause
  text: Choose cause_to_effect when the causal link is taken as given and used to
    predict an effect in a case; choose correlation_to_cause when the point of the
    argument is to establish the link, from the fact that the two kinds of event go
    together.
  status: drafted by Claude Code, 2026-10-22
- scheme: sign
  text: Choose sign when the arguer infers something from an observed indicator without
    claiming that the one produces the other; choose cause_to_effect when the text
    claims that E1 brings about E2. Reasoning back from an effect to its cause is
    sign (or abduction), not cause_to_effect.
  status: drafted by Claude Code, 2026-10-22
- scheme: slippery_slope_inductive_step
  text: Choose slippery_slope_inductive_step when a step is one link of a chain said
    to lead to a bad end, and the point is not to take the first step; choose cause_to_effect
    for a causal step whose effect is itself the point. A chain of causal predictions
    with no bad end and no proposal to reject is a series of cause_to_effect arguments.
  status: drafted by Claude Code, 2026-10-22
- scheme: positive_consequences
  text: Choose positive_consequences when the effect is cited to argue that an action
    should be done; choose cause_to_effect when the point is only that the effect
    will happen, including a step that explains how a consequence cited elsewhere
    comes about.
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_consequences
  text: Choose negative_consequences when the effect is cited to argue that an action
    should not be done; choose cause_to_effect when the point is only that the effect
    will happen, including a step that explains how a consequence cited elsewhere
    comes about.
  status: drafted by Claude Code, 2026-10-22
examples:
- text: Meat production creates significant greenhouse gas emissions which contribute
    to climate change.
  kialo: "13292.2"
  coding: 'In the gold these are secondary instances; the claim''s primary scheme
    is verbal_classification. Two chained instances. First: E1 = meat production;
    E2 = significant greenhouse-gas emissions. Stated: causes(E1,E2). Supplied: has_occurred(E1)
    (meat is produced now). Conclusion: will_occur(E2). Second: E1 = those emissions;
    E2 = climate change being driven. Stated: causes(E1,E2). Supplied: has_occurred(E1).
    Conclusion: will_occur(E2).'
  status: drafted by Claude Code, 2026-10-22
- text: The energy consumed in producing meat, starting from birthing and feeding
    animals to slaughter and processing, far exceeds the energy needed to grow an
    equivalent amount of nutrients gained from vegetarian or vegan sources.
  kialo: "13292.141"
  coding: 'E1 = energy-intensive meat production; E2 = significant greenhouse-gas
    emissions. Stated: has_occurred(E1) (the energy meat production uses). Supplied:
    causes(E1,E2), from energy use to emissions. Conclusion: will_occur(E2). The gold
    codes it so, as the claim''s primary instance.'
  status: drafted by Claude Code, 2026-10-22
- text: The price of meat does not reflect its true cost due to subsidies.
  kialo: "13292.11"
  coding: 'E1 = meat subsidies; E2 = a meat price below the real costs. Stated: has_occurred(E1)
    and causes(E1,E2) ("due to subsidies"). Conclusion: will_occur(E2), an effect
    already in place. In the gold it is a secondary instance; the claim''s primary
    scheme is practical_reasoning2.'
  status: drafted by Claude Code, 2026-10-22
- text: Towns with more fast-food outlets have higher obesity rates, so fast food
    is making people obese.
  coding: 'Near miss: it does not apply a known causal link to a case; it argues for
    the link from the fact that the two go together. correlation_to_cause (E1 = fast-food
    outlets, E2 = obesity), open to the question whether something else, such as income,
    causes both.'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
- text: Tariffs decrease consumption of goods, which would help decrease consumption
    of meats (due to their higher price).
  kialo: "13292.14"
  coding: 'Near miss: the cause, a price rise from a tax not yet adopted, is hypothetical,
    and "would help" says the effect may follow; cause_to_effect_modal (E1 = a higher
    price of meat, E2 = lower meat consumption). The gold, made before that scheme,
    codes cause_to_effect with the N8 note.'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
discrepancies:
- kind: book-walton
  about: conclusion
  detail: 'The book''s scheme comes in a strong and a weak form: the effect will occur,
    or it might. walton.yml has only will_occur(E2). Kialo claims about policies often
    use the weak form ("could", "may").'
  decision: 'Done: the owner''s decision of 2026-10-22 (audit N8; docs/scheme-registry/walton-clean/CHANGELOG.md,
    "Changes decided by the owner") added cause_to_effect_modal, which formalizes
    the weak reading with may_occur; this scheme keeps the strong one. Code a "might"
    or "could" claim with cause_to_effect_modal.'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: Minor Premise
  detail: The book's minor premise says that the cause occurs, or might occur, in
    the case at hand; walton.yml's has_occurred(E1) reads as an event that has already
    happened. In a policy debate the cause is usually a proposal not yet enacted.
  decision: 'Done, with the conclusion''s decision: a cause that has not occurred,
    such as a proposal not yet adopted, is coded with cause_to_effect_modal; here
    has_occurred(E1) means that the cause has occurred or is occurring.'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: Major Premise
  detail: The book's major premise is a generalization over kinds of event (generally,
    if A occurs, B will occur). causes(E1,E2) uses the same terms as the particular
    has_occurred(E1), so the kind and the instance are not told apart. walton.yml
    also cites no source, where the book cites Walton 1995, pp. 140–141.
  decision: 'No change: read causes(E1,E2) as "events of E1''s kind generally bring
    about events of E2''s kind", as the paraphrases do. Open: give walton.yml the
    book''s reference as its source.'
  status: drafted by Claude Code, 2026-10-22
