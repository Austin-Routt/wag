dialogue_types:
  proper: [inquiry, persuasion, deliberation]
  suspect: []
  note: Not in ND's table (docs/dialogue-types.md §7); our extrapolation. As evidence
    about what will happen, it serves inquiry and persuasion, and deliberation, where
    options are weighed by their predicted effects (ND pp. 157–60 on arguments from
    consequences). No type makes it suspect as such; a weak causal link is a reason
    to question it, not a misuse of the dialogue.
  status: drafted by Claude Code, 2026-10-22
