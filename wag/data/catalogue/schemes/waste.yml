  status: drafted by Claude Code, 2026-10-22
dialogue_types:
  proper: [deliberation, negotiation, persuasion]
  suspect: []
  note: 'Not in ND''s table, and ND does not discuss it; our extrapolation. As a reason
    to keep pursuing a goal it belongs to deliberation, and to negotiation and persuasion
    about action. In deliberation ND stresses plasticity: commitment to a line of
    action may be retracted when it runs into trouble (ND p. 165), so past effort
    alone weighs little there; the misuse is caught by 24/CQ2, not by the type.'
  status: drafted by Claude Code, 2026-10-22
