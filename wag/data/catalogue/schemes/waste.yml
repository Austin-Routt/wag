# A scheme of WAG's catalogue (wag/data/catalogue/README.md).
# Source fields (walton, formulas) are regenerated by "wag-cli --catalogue-gen";
# do not edit them here. The game part (game, and the game part of each
# question) is the game's data, which "wag-cli --catalogue-gen" writes the
# game's files from: change it only as a decision says.
# Every other item has a status; set it when you draft, verify or dispute.
id: waste
name: Argument From Waste
tier: 1
walton:
  id: waste
  title: Argument From Waste
  source: 'Douglas Walton, A Pragmatic Theory of Fallacy, Tuscaloosa and London: University
    of Alabama Press, 1995, p. 157. Douglas Walton "The Sunk Cost Fallacy or Argument
    from Waste" Argumentation 16 (2002), p.488.'
formulas:
  variables: [A, X]
  premises:
  - stop_realize_wasted(A,X)
  - waste_bad_thing(A,X)
  assumptions:
  - possible_goal(X)
  exceptions:
  - reassessment_against_continuing(A,X)
  conclusions:
  - ought_to_continue(A,X)
book:
- entry: "24"
  title: Argument From Waste
  pages: "326"
  match: exact
  note: Same title and both references. Since 2026-11-26 the book's second question
    is an exception (D033), and the goal's possibility reads possible_goal(X) (D093).
  status: generated
families:
- family: F10
  name: Practical reasoning
  relation: related
  note: F11
  status: generated
- family: F11
  name: Waste and sunk costs
  relation: variant
  status: generated
premise_map:
- entry: "24"
  label: Premise 1
  formulas: [{formula: 'stop_realize_wasted(A,X)', locus: premise}]
  status: generated
- entry: "24"
  label: Premise 2
  formulas: [{formula: 'waste_bad_thing(A,X)', locus: premise}]
  status: generated
- entry: "24"
  label: Conclusion
  formulas: [{formula: 'ought_to_continue(A,X)', locus: conclusion}]
  note: names the agent and the goal; bridge_from_continuing carries it to the continuing
    action (D063)
  status: generated
critical_questions:
- id: 24/CQ1
  book:
    entry: "24"
    label: CQ1
  targets: [{formula: possible_goal(X), locus: assumption}]
  note: Possibility. In walton.yml's letters A is the agent and X the goal (the book's
    a and A). Since 2026-11-26 the assumption is possible_goal(X), whose English speaks
    of a goal (D093); it was possible(X), whose English spoke of an action (upstream
    posible; see the discrepancy).
  paraphrase: Can X be realized at all?
  answer: 'The proponent, once asked. Against: showing that X can no longer be reached,
    whatever more A does, which undermines possible_goal(X): further effort would
    then be wasted too. For: evidence that X is still within reach, such as the progress
    so far or a clear path to the end.'
  status: drafted by Claude Code, 2026-11-26
- id: 24/CQ2
  book:
    entry: "24"
    label: CQ2
  targets: [{formula: 'reassessment_against_continuing(A,X)', locus: exception}]
  note: Reassessment. Since 2026-11-26 an exception, reassessment_against_continuing(A,X),
    the critic's to make out, as D055's outweighing exceptions are (D033); until then
    no formula encoded it and the question was marked as undercutting. sunk_costs
    has the like exception future_losses_outweigh(A).
  paraphrase: Leaving aside what is already lost, do the costs and benefits from now
    on go against continuing to try to realize X?
  answer: 'The critic, who raises it with an argument. Against: showing that, leaving
    aside what is lost and cannot be recovered, continuing toward X from now on would
    cost more than it would yield, which undercuts the argument through reassessment_against_continuing(A,X).
    For: showing that the remaining costs of reaching X are worth its benefits, judged
    from now on.'
  status: drafted by Claude Code, 2026-11-26
summary:
  text: Use it when an agent A has already put effort into pursuing a goal X, and
    the argument is that stopping now would let that effort go for nothing, which
    would be bad, so A ought to keep trying. It looks back at past effort toward a
    goal, which sets it apart from practical_inference, which looks forward from a
    goal to a means, and from sunk_costs, which in walton.yml rests on the amount
    already spent on an action.
  status: drafted by Claude Code, 2026-10-22
contrasts:
- scheme: practical_inference
  text: Choose practical_inference when the reason for an action is that it is a means
    to a goal the agent now holds; choose waste when the reason to continue is that
    the effort already spent would otherwise be lost. A text that says both (we still
    want X, and quitting would throw our work away) holds two arguments.
  status: drafted by Claude Code, 2026-10-22
- scheme: sunk_costs
  text: 'The two are close: the book first gives them as two names for one argument
    (pp. 10–11), then distinguishes them, waste comparing consequences and sunk costs
    resting on an earlier commitment (p. 135); its compendium separates them. Choose
    waste when the text says that stopping would make the agent''s efforts toward
    a goal come to nothing; choose sunk_costs when it cites the amount already spent
    on an action (money, time) as too much to write off.'
  status: drafted by Claude Code, 2026-10-22
- scheme: sunk_costs_precommitment
  text: Choose sunk_costs_precommitment when the text cites a commitment made earlier,
    not effort that stopping would waste.
  status: drafted by Claude Code, 2026-11-26
examples:
- text: We've spent four summers restoring this old sailing boat. If we give up now,
    all that work goes for nothing, and that would be a real shame, so let's keep
    at it.
  coding: 'A = we (the restorers); X = a restored sailing boat. Stated: stop_realize_wasted(A,X)
    ("all that work goes for nothing"), waste_bad_thing(A,X) ("a real shame"). Supplied:
    none. Conclusion: ought_to_continue(A,X). Open to 24/CQ2: whether finishing the
    boat still pays from here.'
  status: drafted by Claude Code, 2026-10-22
- text: The neighbourhood association has spent six years building up the community
    garden. Walking away now would throw all of that away, which would be a loss for
    the whole street, so the association should keep going.
  coding: 'A = the neighbourhood association; X = a thriving community garden. Stated:
    stop_realize_wasted(A,X) ("throw all of that away"), waste_bad_thing(A,X) ("a
    loss for the whole street"). Supplied: none. Conclusion: ought_to_continue(A,X).'
  status: drafted by Claude Code, 2026-10-22
- text: If we drop the trial now, the patients already enrolled will lose their follow-up
    care, so we must carry on with it.
  coding: 'Near miss: it argues for continuing, but from a harm that stopping would
    cause later, not from past effort going to waste; negative_consequences_prudential
    (X = carrying on with the trial, C = enrolled patients lose follow-up care), or
    negative_consequences against dropping it.'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
- text: If the council stops trying to build the tram line now, the four years and
    millions already spent will be wasted. That would be a bad thing. So the council
    ought to continue trying to build it.
  coding: 'A = the council; X = building the tram line. Pressed: 24/CQ1 (The line
    cannot be built: the bridge it needs was refused permission for good); 24/CQ2
    (Leaving aside what is spent, finishing would cost more than the line will ever
    return). (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: If Ravi gives up on his novel now, six years of writing will have been for
    nothing, which would be a shame. So Ravi ought to keep trying to finish it.
  coding: 'A = Ravi; X = finishing his novel. It concludes ought_to_continue(A,X),
    the agent and the goal; bridge_from_continuing carries it to the action that continues
    the effort (D063). Pressed: 24/CQ2 (Leaving the six years aside, another year
    of unpaid writing costs him more than the book is likely to bring). (proposal
    D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: The council has spent millions on the tram line so far, too much to waste.
    So the line should be finished.
  coding: 'Near miss: A = finishing the tram line; C = millions spent on the tram
    line so far. WAG''s sunk costs form: the costs incurred, with no agent''s efforts
    or goal: not the argument from waste. (proposal D022-D093)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-26
discrepancies:
- kind: book-walton
  about: CQ2
  detail: 24/CQ2 asks for a forward-looking reassessment of costs and benefits, past
    losses aside; no formula of waste encodes it. sunk_costs, which cites the same
    2002 article, has it as the exception future_losses_outweigh(A).
  decision: 'Decided 2026-11-22 (D033): An exception, the critic''s burden, as D055''s
    outweighing exceptions are: reassessment_against_continuing(A,X), as the schemes
    library has it. Applied 2026-11-26 (proposal D022-D093): the exception reassessment_against_continuing(A,X),
    which 24/CQ2 targets. Before: The catalogue marks CQ2 as undercutting the inference,
    so asking it puts the argument out of force until the proponent shows that going
    on pays from now. open: whether to add future_losses_outweigh(X) to waste in walton.yml,
    as an exception (the critic''s burden, as in sunk_costs) or as an assumption (the
    proponent''s, as asking the book''s question implies).'
  status: drafted by Claude Code, 2026-10-22
- kind: other
  about: possible(X)
  detail: The upstream master and the category file A/3 spell the assumption posible(X);
    the cleaned walton.yml corrects it to possible(X) (walton-clean/changes.json),
    whose English template speaks of an action, although X is a goal.
  decision: No change; the catalogue uses the cleaned spelling and reads possible(X)
    as "the goal X can be reached". Since 2026-11-26 the assumption is possible_goal(X),
    whose English speaks of a goal (D093, proposal D022-D093).
  status: drafted by Claude Code, 2026-10-22
classification:
  source: independent
  reasoning: practical
  epistemic: ""
  group: value-based
  note: The tree lists argument from waste under arguments from consequences, within
    the value-based argument from practical reasoning (Walton and Macagno 2015, p.
    22, in Aberdein 2020, Table 4).
  status: drafted by Claude Code, 2026-10-22
specialises:
  scheme: ""
  note: 'Specialises nothing: waste and sunk_costs are variants in family F11, neither
    a narrower version of the other, and waste is related to, not a narrowing of,
    practical_inference (F10).'
  status: drafted by Claude Code, 2026-10-22
dialogue_types:
  proper: [deliberation, negotiation, persuasion]
  suspect: []
  note: 'Not in ND''s table, and ND does not discuss it; our extrapolation. As a reason
    to keep pursuing a goal it belongs to deliberation, and to negotiation and persuasion
    about action. In deliberation ND stresses plasticity: commitment to a line of
    action may be retracted when it runs into trouble (ND p. 165), so past effort
    alone weighs little there; the misuse is caught by 24/CQ2, not by the type.'
  status: drafted by Claude Code, 2026-10-22
