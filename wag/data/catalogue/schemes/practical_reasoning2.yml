# A scheme of WAG's catalogue (wag/data/catalogue/README.md).
# Source fields are regenerated by "wag-cli --catalogue-gen"; do not edit
# them here: walton and formulas (from walton.yml), game.backs (from
# game/order.yml) and each question's game text (its paraphrase, with the
# scheme's variables in braces). The rest of the game part (game.id,
# game.nascq, game.core, each question's game id, locus and pattern) is the
# game's data, which "wag-cli --catalogue-gen" writes the game's files from:
# change it only as a decision says. Every other item has a status,
# game.status too; set it when you draft, verify or dispute.
id: practical_reasoning2
name: Argument from Instrumental Practical Reasoning
tier: 1
walton:
  id: practical_reasoning2
  title: Argument from Instrumental Practical Reasoning
  source: Walton, Douglas (2015). Goal-Based Reasoning for Argumentation. Cambridge
    University Press.
game:
  id: AS:practical_reasoning_goal
  nascq:
    carneades_id: practical_reasoning2
    name: Instrumental Practical Reasoning
    semantic_type: action
    thesis_independent: false
    base_weight: 0.65
    variables:
      S1:
        type: state
        description: Current circumstances
        example_en: emissions are rising
      A:
        type: action
        description: Action to be performed
        example_en: introduce a carbon tax
      S2:
        type: state
        description: Future state after the action
        example_en: lower emissions
      G:
        type: goal
        description: Goal to be realized
        example_en: meet the 2030 climate target
      P:
        type: agent
        description: Agent who would take the action
        example_en: the city council
    premise_templates_en:
    - One of the goals of {P} is {G}
    - The current situation is {S1}
    - Doing {A} in the situation {S1} would lead to {S2}
    - The goal {G} would be achieved in {S2}
    conclusion_template_en: '{A} should be done'
    description_en: 'An agent should do an action because, in the current circumstances,
      it brings about a state in which the agent''s goal is realized (goal-based,
      without values: Walton 2015; the book''s practical inference, 22.1). For an
      argument that also names the value the goal promotes, use Practical Reasoning.'
    cues_en:
    - in order to
    - so that
    - so as to
    - means to
    - the way to
    - to achieve
    - to reach
    - our goal
    - the aim
    evidence: recommended
    evidence_note_en: a source showing the action would bring about the state
  core:
    meta:
      title: Argument from Instrumental Practical Reasoning
      source: Walton (2015), Goal-Based Reasoning for Argumentation
  status: generated
formulas:
  variables: [A, S1, S2, G, P]
  premises:
  - goal_of_agent(P,G)
  - current_circumstances(S1)
  - would_bring_about(A,S1,S2)
  - would_be_realized(G,S2)
  assumptions:
  - possible_bring_about(P,A)
  - possible_goal(G)
  exceptions:
  - bring_about_more_effectively(P,S2,A)
  - realize_more_effectively(P,G,A)
  - intervening_actions(A,G)
  - bad_outweighs(A,G)
  - incompatible_goal(P,G)
  conclusions:
  - should_be_performed(A)
book:
- entry: "22.1"
  title: Practical Inference
  pages: "323"
  parent: "22"
  match: partial
  note: 'Later version from another source (Walton 2015, Goal-Based Reasoning for
    Argumentation): instrumental practical reasoning with circumstances S1/S2.'
  status: generated
families:
- family: F10
  name: Practical reasoning
  relation: variant
  note: instrumental, Walton 2015 (not in the book)
  status: generated
premise_map:
- entry: "22.1"
  label: Major Premise
  formulas: [{formula: 'goal_of_agent(P,G)', locus: premise}]
  note: the agent has the goal (D005, since 2026-11-24)
  status: generated
- entry: "22.1"
  label: Minor Premise
  formulas: [{formula: 'would_bring_about(A,S1,S2)', locus: premise}, {formula: 'would_be_realized(G,S2)',
      locus: premise}]
  status: generated
- entry: "22.1"
  label: Conclusion
  formulas: [{formula: should_be_performed(A), locus: conclusion}]
  status: generated
critical_questions:
- id: 22.1/CQ1
  book:
    entry: "22.1"
    label: CQ1
  game:
    id: CQ:conflicting_goals
    text: Is there another goal of {P} that {G} itself would clash with?
    locus: exception
    pattern: incompatible_goal(P,G)
  targets: [{formula: 'incompatible_goal(P,G)', locus: exception}]
  note: Conflicting goals. The book asks which such goals should be considered; walton.yml
    makes the conflict an exception, scoped to the agent and the goal since 2026-11-24
    (D004), so the critic must name the goal. See the discrepancy on the burden of
    the questions.
  paraphrase: Is there another goal of P that G itself would clash with?
  answer: 'The critic, who raises it with an argument. Against: another goal of P
    that G itself clashes with and that matters as much or more, which undercuts the
    argument through incompatible_goal(P,G). A goal that the means sets back is a
    consequence of the means, argued as a rebuttal or a weighing (22.1/CQ5). For:
    showing that P has no such goal, or that G can be pursued without giving the others
    up.'
  status: drafted by Claude Code, 2026-11-24
- id: 22.1/CQ2
  book:
    entry: "22.1"
    label: CQ2
  game:
    id: CQ:other_means
    text: 'Could {P} realize {G} more effectively by another action than {A}: more
      surely, sooner or at lower cost?'
    locus: exception
    pattern: realize_more_effectively(P,G,A)
  targets: [{formula: 'realize_more_effectively(P,G,A)', locus: exception}]
  note: 'Alternatives. Only realize_more_effectively: bring_about_more_effectively,
    about efficiency in reaching S2, is CQ3''s, as the same two questions are targeted
    in practical_reasoning1 (22.4/CQ3 and CQ4); links.json, which gave it here too,
    agrees since 2026-11-24. The exception needs an action that does better; since
    then it names the agent (D089), and the answer scheme better_means concludes it
    (D075). An alternative that is merely as good is no reason against A (D006); see
    the discrepancy on the game''s questions.'
  paraphrase: 'Could P realize G more effectively by another action than A: more surely,
    sooner or at lower cost?'
  answer: 'The critic, who raises it with an argument. Against: another action open
    to P that would realize G more surely, sooner or at lower cost than A, argued
    with better_means, which concludes realize_more_effectively(P,G,A) and so undercuts
    the argument; its goal premise is this argument''s own, and it records which comparison
    it makes. An action that is merely as good answers nothing (D006). For: a reply
    that attacks better_means'' premises: that P cannot take the other action, that
    it does not reach G, or that it does no better.'
  status: drafted by Claude Code, 2026-11-24
- id: 22.1/CQ3
  book:
    entry: "22.1"
    label: CQ3
  game:
    id: CQ:best_means
    text: Of {A} and the other actions open to {P}, which would achieve {G}, or reach
      {S2}, most surely, soonest or at least cost?
    locus: exception
    pattern: bring_about_more_effectively(P,S2,A)
  targets: [{formula: 'realize_more_effectively(P,G,A)', locus: exception}, {formula: 'bring_about_more_effectively(P,S2,A)',
      locus: exception}]
  note: 'Efficiency, in realizing G or in reaching S2: both exceptions, as links.json
    has it since 2026-11-24. The game''s CQ:best_means sits here, asked at bring_about_more_effectively(P,S2,A)
    since step C5.2. Both exceptions name the agent since then (D089).'
  paraphrase: Of A and the other actions open to P, which would achieve G, or reach
    S2, most surely, soonest or at least cost?
  answer: 'The critic, who raises it with an argument. Against: an action open to
    P that would reach S2, or realize G, more surely, sooner or at lower cost than
    A, which undercuts the argument through bring_about_more_effectively(P,S2,A) or
    realize_more_effectively(P,G,A); the second is argued with better_means (D075),
    the first with Other until it has an answer scheme. For: a comparison showing
    that A is the most efficient of P''s options.'
  status: drafted by Claude Code, 2026-11-24
- id: 22.1/CQ4
  book:
    entry: "22.1"
    label: CQ4
  game:
    id: CQ:possibility
    text: Can {P} actually do {A}?
    locus: premise
    pattern: possible_bring_about(P,A)
  targets: [{formula: 'possible_bring_about(P,A)', locus: assumption}]
  note: 'Possibility of the means: that P can do A (D088, since 2026-11-24; the goal''s
    possibility is game/CQ:goal_possible). The game asks it at the premise; possible_bring_about(P,A)
    is an assumption of walton.yml, and both put the burden on the proponent.'
  paraphrase: Can P actually do A?
  answer: 'The proponent, once asked. Against: showing that A is beyond P''s means,
    powers or authority in the circumstances S1, which undermines possible_bring_about(P,A).
    For: evidence that P has the resources and the standing to do A, such as a plan
    or a precedent.'
  status: drafted by Claude Code, 2026-11-24
- id: 22.1/CQ5
  book:
    entry: "22.1"
    label: CQ5
  game:
    id: CQ:bad_outweighs
    text: Would doing {A} have bad consequences that matter more than {G}?
    locus: exception
    pattern: bad_outweighs(A,G)
  targets: [{formula: 'bad_outweighs(A,G)', locus: exception}]
  note: 'Consequences. Since 2026-11-24 (D070, D091) the exception is the claim that
    A''s bad consequences outweigh G, D055''s formula, which is WAG''s reading of
    the source''s side-effect exception: a side effect, however small, no longer defeats
    the argument by itself (side_effects(A,S1) did). The question has two routes (docs/kialo-batch2/guidelines.md
    §3.1): a bad consequence that ranks nothing is a rebuttal, negative_consequences
    at the conclusion (OC2); a claim that it matters more than G argues the exception,
    with bad_outweighs_good (OC3, OC4). The book''s question covers any further consequence;
    the ch. 3 list of questions (p. 96) speaks of known bad consequences.'
  paraphrase: Would doing A have bad consequences that matter more than G?
  answer: 'The critic, who raises it with an argument. Against: a claim that a bad
    consequence of A matters more than G, argued with bad_outweighs_good, which concludes
    bad_outweighs(A,G) and undercuts the argument; a bad consequence that ranks nothing
    is argued as negative_consequences, a rebuttal at the conclusion, weighed by the
    scheme weights. For: a reply that attacks the weighing''s comparison or the consequence
    it relies on (docs/kialo-batch2/guidelines.md §3.1, OC10).'
  status: drafted by Claude Code, 2026-11-24
- id: game/CQ:goal_possible
  game:
    id: CQ:goal_possible
    text: Can {G} be reached at all, by any means?
    locus: premise
    pattern: possible_goal(G)
  targets: [{formula: possible_goal(G), locus: assumption}]
  note: No question of 22.1 asks it; practical_inference has the same assumption.
    Since 2026-11-24 the goal's possibility is possible_goal(G), apart from P's ability
    to do A (D088), and its English reads right (possible(G) read "Action G is possible").
    The game asks it at possible_goal(G) since step C5.2.
  paraphrase: Can G be reached at all, by any means?
  answer: 'The proponent, once asked. Against: showing that G cannot be reached whatever
    is done, which undermines possible_goal(G). For: cases where G, or goals like
    it, have been reached, or a credible path to it.'
  status: drafted by Claude Code, 2026-11-24
- id: game/CQ:intervening_actions
  game:
    id: CQ:intervening_actions
    text: Would further steps be needed after {A} before {G} is achieved?
    locus: exception
    pattern: intervening_actions(A,G)
  targets: [{formula: 'intervening_actions(A,G)', locus: exception}]
  note: No question of 22.1 asks it; the book's two-person practical reasoning asks
    whether other actions besides the means are required (23/CQ5; also ch. 3, p. 97).
  paraphrase: Would further steps be needed after A before G is achieved?
  answer: 'The critic, who raises it with an argument. Against: steps that must follow
    A, or conditions that must also be met, before G is reached, which undercuts the
    argument through intervening_actions(A,G) unless the proponent plans for them.
    For: showing that A by itself leads to S2, and so to G.'
  status: drafted by Claude Code, 2026-10-22
- id: game/CQ:side_effect
  game:
    id: CQ:side_effect
    text: Would doing {A} also bring about something bad?
    locus: conclusion
  targets: [{formula: should_be_performed(A), locus: conclusion}]
  note: 'The game''s rebuttal route of 22.1/CQ5 (D095 (1)), as on positive_consequences:
    it asks, at the conclusion, for a further bad consequence of A, argued as negative_consequences
    and weighed by the scheme weights (docs/kialo-batch2/guidelines.md §3.1, OC2).
    A claim that the consequence matters more than G is 22.1/CQ5''s exception, bad_outweighs(A,G).
    No backup edge lets negative_consequences back this question (D009; the owner''s
    question 1 in docs/c5-game.md), so such an argument is played as a direct rebuttal.'
  paraphrase: Would doing A also bring about something bad?
  answer: 'The critic, who raises it with an argument. Against: a bad consequence
    of A, played as a rebuttal of the conclusion; the weights decide between it and
    the argument. In the game the answer is backed by expert_opinion, position_to_know
    or sign; an argument from negative consequences against A is played as a direct
    rebuttal instead. A claim that the bad consequence matters more than G answers
    22.1/CQ5. For: showing that A has no such consequence.'
  status: drafted by Claude Code, 2026-11-27
- id: derived/other_goals_priority
  derived:
    source: Walton, Reed and Macagno 2008
    chapter: "3"
    page: "96"
    name: Other-Goals Question
  targets: []
  note: 'D007: the compendium (ch. 9) is the catalogue''s authority, and ch. 3''s
    further questions are kept as derived questions. Ch. 3''s list asks which other
    goals should have priority, a ranking of goals that no formula of the scheme encodes;
    22.1/CQ1 asks instead whether G clashes with another goal of P. Before step C5.2
    the game''s CQ:other_goals asked in ch. 3''s terms; the game does not ask this
    question.'
  paraphrase: Has P another goal that should come before G in deciding on A, its achievement
    being worth more?
  answer: 'The critic, who raises it with an argument for the other goal. No formula
    of the scheme ranks goals: a goal that should come first is argued as practical
    reasoning from it against A, a rebuttal, or as a bad consequence of A that matters
    more than G (22.1/CQ5); a goal that G itself clashes with is 22.1/CQ1''s exception.
    For: showing that G comes first in this decision, or that A serves the other goal
    too.'
  status: drafted by Claude Code, 2026-11-27
summary:
  text: Use it when an action A is recommended because, in the present circumstances
    S1, doing A would lead to a state S2 in which the goal G of the agent P, who would
    do A, is met. It argues from a goal back to a means with no value premise, which
    sets it apart from practical_reasoning1, which also names the value V that G serves,
    and from positive_consequences, which recommends A for a good outcome without
    a goal or circumstances.
  status: drafted by Claude Code, 2026-11-24
contrasts:
- scheme: practical_inference
  text: 'practical_inference encodes compendium 22.1 directly: a goal G and an action
    A that is a means to it, with no circumstances. Choose practical_reasoning2 when
    the text describes the present situation S1 and a resulting state S2 that differs
    from the action; choose practical_inference when the text states, as a premise,
    that the agent has the goal G and that A is a means to it, with no circumstances.
    A claim that A has a good result, without a goal premise, is positive_consequences
    (batch-2 guidelines §5 item 4; gold rule R3). The game plays practical_reasoning2
    (AS:practical_reasoning_goal), not practical_inference.'
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_reasoning1
  text: Choose practical_reasoning1 when the text also names the value V that the
    goal serves (health, fairness, liberty); choose practical_reasoning2 when it argues
    from the goal alone. A value only hinted at does not make the argument value-based
    (Kialo gold, 13292.104 and 13292.118).
  status: drafted by Claude Code, 2026-10-22
- scheme: positive_consequences
  text: Choose practical_reasoning2 when S2 is a state distinct from the action and,
    of S1, the step from A to S2 and the step from S2 to G, at most one has to be
    supplied (the claim's immediate context counts as given); choose positive_consequences
    when the claim says only that A brings about a good outcome. A proposal stated
    with its purpose is positive_consequences (batch-2 guidelines §5 item 4; gold
    rule R3).
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_necessary_condition
  text: Choose practical_necessary_condition when the text says the means is required
    ("have to", "the only way") and can be done; choose practical_reasoning2 when
    it describes the circumstances and a resulting state in which the goal is met
    (Kialo gold, 13292.45).
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_goal
  text: Choose practical_goal when the text says only that an act helps toward a goal
    that a named person or body has; choose practical_reasoning2 when it describes
    the present circumstances and a resulting state in which the goal is met. The
    game plays practical_reasoning2, not practical_goal.
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_consequences_reasoning
  text: Practical reasoning starts from a goal and looks for the action; reasoning
    from consequences starts from the action and judges it by its outcome (the book,
    p. 101). Choose practical_reasoning2 when an action is argued for as the way to
    reach a goal; choose negative_consequences_reasoning when an agent argues against
    its own action because the result would harm its goals.
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_analogy_positive
  text: Choose practical_analogy_positive when X is argued for because it was the
    right thing in a similar situation, with no goal or means stated; choose practical_reasoning2
    when X is argued for as the means, in the present circumstances, to a goal.
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_analogy_negative
  text: Choose practical_analogy_negative when X is opposed because doing it in a
    similar situation was wrong; choose practical_reasoning2 when the argument is
    whether X serves a goal in the present circumstances.
  status: drafted by Claude Code, 2026-10-22
examples:
- text: Meat is not inherently problematic. What is problematic is the animal farming
    industry, so the appropriate solution is to regulate this industry rather than
    penalize those who wish to consume meat.
  kialo: "13292.104"
  coding: 'P = governments; A = regulate the animal farming industry; S1 = the farming
    industry, not meat itself, is the problem; S2 = the industry is regulated; G =
    the problems of meat are resolved. Stated: current_circumstances(S1), would_bring_about(A,S1,S2),
    would_be_realized(G,S2) ("the appropriate solution"). Supplied: goal_of_agent(P,G).
    Conclusion: should_be_performed(A). As the gold notes, S2 nearly restates A. Since
    2026-11-24 this is a secondary instance: the claim''s answer to 22.1/CQ2 of the
    environmental argument for the tax (13292.108) is its primary better_means instance,
    that regulating the industry would reduce the harm more surely than the tax (D075,
    D089).'
  status: drafted by Claude Code, 2026-11-24
- text: Taxing meat would raise the consumer price to reflect the real costs of meat
    consumption.
  kialo: "13292.118"
  coding: 'P = governments, the thesis''s agent; A = tax meat; S1 = the price of meat
    is below its real costs; S2 = a higher consumer price; G = the price reflects
    the real costs. Stated: would_bring_about(A,S1,S2), would_be_realized(G,S2). Supplied:
    goal_of_agent(P,G), and current_circumstances(S1), which the child claim 13292.11
    states. Conclusion: should_be_performed(A). No value is named, so not practical_reasoning1.'
  status: drafted by Claude Code, 2026-11-24
- text: A tax on meat would combat unhealthy meat consumption.
  kialo: "13292.115"
  coding: 'Near miss: "combat" sounds like a goal, but the claim gives no circumstances
    and no state distinct from the outcome; it says that the tax brings about something
    good. positive_consequences (A = tax meat, G = less unhealthy meat consumption),
    as the gold codes it.'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
discrepancies:
- kind: partial-link
  about: "22.1"
  detail: 'walton.yml formalizes compendium 22.1 only in part: Later version from
    another source (Walton 2015, Goal-Based Reasoning for Argumentation): instrumental
    practical reasoning with circumstances S1/S2.'
  decision: Keep the partial link. practical_reasoning2 is Walton's 2015 version,
    which the book does not print; practical_inference is the exact encoding of 22.1.
    The catalogue reads 22.1's premises and questions onto this scheme through the
    premise map and the targets, and records the gaps below. The game plays this scheme,
    so its questions are 22.1's as targeted here.
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: Major Premise
  detail: '22.1''s major premise says that the agent has the goal G. No formula of
    practical_reasoning2 said so: G entered only through would_be_realized(G,S2).
    links.json mapped the major premise to that formula, which belongs to the means;
    the catalogue mapped it to nothing and gave both transition formulas to the minor
    premise.'
  decision: 'Done: decision D005 (2026-11-24; proposal D004-D075) added the premise
    goal_of_agent(P,G), the schemes library''s predicate, which links.json and the
    premise map give the major premise. P is the agent who would do A: bind it to
    the agent the text names or its context supplies (in a policy debate, whoever
    would enact the policy). The conclusion stays should_be_performed(A) (D059, D063).'
  status: drafted by Claude Code, 2026-11-24
- kind: book-walton
  about: current_circumstances(S1)
  detail: '22.1 states no circumstances: current_circumstances(S1) and the resulting
    state S2 come from Walton 2015. The book''s ch. 3 possibility question mentions
    the given circumstances (p. 96), and ND relativises the means premise to the agent''s
    view of the situation (ND p. 154). The book''s ch. 3 version writes the goal and
    the means as states of affairs S0 … Sn (p. 95), which anticipates S1 and S2, but
    has no circumstances premise.'
  decision: No change. Bind S1 when the claim or its immediate context describes the
    present situation (batch-2 guidelines §3; gold rule R3). A proposal that only
    gives A and its good result is positive_consequences; a claim that states only
    S1 or only G is a fragment of its parent's argument. Use practical_inference only
    outside the game, for a text that states the agent's goal and a means to it and
    nothing more.
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: burden of the questions
  detail: 'In ch. 3 the book says that asking any of the five questions it lists for
    practical reasoning defeats the argument, at least for a time, until the proponent
    answers (p. 96): each question shifts the burden to the proponent. walton.yml
    makes the conflicting-goals, alternatives, efficiency and side-effects questions
    exceptions, which the critic must prove.'
  decision: 'Decided 2026-11-22 (D003): The questions stay exceptions, the critic''s
    to support. Who must answer a question that is asked is a rule of the dialogue
    (the request, its answer, and what holds while it is pending), set by the game''s
    question protocol with D075, not by turning exceptions into assumptions. Not yet
    applied. Before: The catalogue follows walton.yml''s roles, as the game does (docs/game-rules.md
    §2), and the answers say so. open: the owner''s decision whether these questions
    should shift the burden when asked, which would make them assumptions.'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: possible_goal(G), intervening_actions(A,G)
  detail: 'Two formulas have no basis in 22.1: the assumption possible_goal(G) (possible(G)
    until 2026-11-24, D088) and the exception intervening_actions(A,G). The second
    matches the book''s two-person question on further actions needed besides the
    means (23/CQ5; p. 97).'
  decision: No change; the game's questions about them stand on their own (game/CQ:goal_possible,
    game/CQ:intervening_actions).
  status: drafted by Claude Code, 2026-11-24
- kind: other
  about: game questions
  detail: 'Since step C5.2 the game asks the compendium''s questions (D007) in this
    entry''s paraphrases (D009), at walton.yml''s formulas: CQ:conflicting_goals at
    incompatible_goal(P,G) (22.1/CQ1), CQ:other_means at realize_more_effectively(P,G,A)
    (CQ2; an equally good alternative answers nothing, D006), CQ:best_means at bring_about_more_effectively(P,S2,A)
    (CQ3), CQ:possibility at possible_bring_about(P,A) (CQ4) and CQ:bad_outweighs
    at bad_outweighs(A,G) (CQ5, the weighing route, D095 (1)); and its own CQ:goal_possible
    at possible_goal(G), CQ:intervening_actions at intervening_actions(A,G) and CQ:side_effect
    at the conclusion (the rebuttal route). Before step C5.2 the game''s texts followed
    the book''s ch. 3 list (p. 96), whose Other-Goals question is now the derived
    question derived/other_goals_priority.'
  decision: 'Decided 2026-11-22 (D007): The book''s ch. 9 version, the compendium,
    which is the catalogue''s authority (plan §1). Ch. 3''s further questions are
    kept as derived questions, each with its source (D023). (The review left the chapter
    unchosen.) Applied at step C5.2 (2026-11-27): the game asks the compendium''s
