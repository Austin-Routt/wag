id: practical_reasoning2
name: Argument from Instrumental Practical Reasoning
tier: 1
walton:
  id: practical_reasoning2
  title: Argument from Instrumental Practical Reasoning
  source: Walton, Douglas (2015). Goal-Based Reasoning for Argumentation. Cambridge
    University Press.
game:
  id: AS:practical_reasoning_goal
formulas:
  variables: [A, S1, S2, G]
  premises:
  - current_circumstances(S1)
  - would_bring_about(A,S1,S2)
  - would_be_realized(G,S2)
  assumptions:
  - possible(A)
  - possible(G)
  exceptions:
  - bring_about_more_effectively(S2,A)
  - realize_more_effectively(G,A)
  - intervening_actions(A,G)
  - side_effects(A,S1)
  - incompatible_goal(G)
  conclusions:
  - should_be_performed(A)
