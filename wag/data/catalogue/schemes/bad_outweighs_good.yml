id: bad_outweighs_good
name: Weighing a Bad Consequence against a Good One
tier: 2
walton:
  id: bad_outweighs_good
  title: Weighing a Bad Consequence against a Good One
  source: 'WAG''s answer scheme (decisions D064 and D075; candidate C003, docs/candidates.md),
    after Walton''s comparative weighing of good and bad consequences: Douglas Walton,
    The New Dialectic: Conversational Contexts of Argument. University of Toronto
    Press, 1998, pp. 159, 170. Not in the compendium.'
formulas:
  variables: [A, H, G]
  premises:
  - brings_about(A,H)
  - bad(H)
  - matters_more(H,G)
  conclusions:
  - bad_outweighs(A,G)
book: []
families:
- family: F15
  name: Consequences, alternatives, threat and fear
  relation: variant
  note: 'a sided flip of good_outweighs_bad, not a polarity pair (D053): the two conclude
    different predicates. Answer scheme (D075; candidate C003, D064): concludes bad_outweighs(A,G),
    the exception of positive_consequences and of practical reasoning (D070); since
    2026-11-24'
  status: generated
premise_map: []
critical_questions: []
summary:
  text: 'An answer scheme (D064, D075; candidate C003): it concludes bad_outweighs(A,G),
    positive_consequences'' exception, negative_consequences_prudential''s (with A
    bound to X and G to C) and practical reasoning''s side-effect exception (D070),
    from a bad consequence H of A that matters more than G: brings_about(A,H), bad(H),
    matters_more(H,G). Use it for a claim that one consequence of the action matters
    more than the one an argument about it cites (docs/kialo-batch2/guidelines.md
    §3.1, OC3, OC4). It has no questions of its own: a reply attacks its premises,
    the comparison or the consequence it relies on (OC10).'
  status: drafted by Claude Code, 2026-11-24
