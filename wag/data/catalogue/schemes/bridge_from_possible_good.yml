examples:
- text: Switching to a four-day week might raise our productivity, and even the chance
    of that matters for a firm our size, so we should switch.
  coding: 'A = the firm switching to a four-day week; G = higher productivity at the
    firm. It takes the conclusion of ''A four-day week might raise productivity''
    to the recommendation (D008). That the chance matters, given what the gain would
    be, is its arguer''s to support (the challenge grants that the gain is possible);
    that it is worth settling the question first is the critic''s. Pressed: walton/worth_finding_out_first
    (A three-month trial in one team would show cheaply, and in time, whether productivity
    rises before the whole firm commits); a challenge of matters_to_decision(A,G)
    (One firm in twenty that tried it saw any gain, and a few per cent at that: a
    chance that small, for a gain that small, is no reason to switch). (proposal D008-D074)'
  status: drafted by Claude Code, 2026-11-25
- text: A night bus could get people home safely after the pubs close, and the chance
    of that matters to the town's choice, so the town should run one.
  coding: 'A = the town running a night bus; G = people getting home safely after
    the pubs close. A reply that only shows that a pilot could be run, at a cost the
    town could not bear, argues the exception without making it out: the bridge''s
    defender answers that finding out first is not worth it. Pressed: walton/worth_finding_out_first
    (A summer pilot would show, at a small part of a year''s cost, whether people
    ride it home before the town pays for a year). (proposal D008-D074)'
  status: drafted by Claude Code, 2026-11-25
- text: Higher productivity is one of the firm's goals, and switching to a four-day
    week is a means to it, so the firm should switch.
  coding: 'Near miss: A = the firm switching to a four-day week; G = higher productivity;
    P = the firm. It recommends the same action, but from a goal and a means, not
    from a possible consequence: practical inference (22.1), with its own questions.
    (proposal D008-D074)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-25
