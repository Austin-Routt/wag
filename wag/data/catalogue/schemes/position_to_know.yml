  status: drafted by Claude Code, 2026-10-22
dialogue_types:
  proper: [information_seeking, deliberation, persuasion, inquiry]
  suspect: []
  note: 'ND treats asking someone in a position to know as a subtype of information-seeking
    (pp. 134–5), which joins deliberation when the question is how to do something
    (pp. 135–6). Persuasion comes from the book, not ND: it says the argument is often
    used in deliberation and persuasion (p. 90). Inquiry is listed too: the first
    stage of an inquiry collects information from those in a position to know, as
    witnesses (ND p. 92), to be checked before anything is built on it (our reading,
    as for witness_testimony). No type makes the scheme suspect as such.'
  status: drafted by Claude Code, 2026-10-22
