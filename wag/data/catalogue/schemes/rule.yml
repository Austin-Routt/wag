dialogue_types:
  proper: [deliberation, persuasion]
  suspect: []
  note: Not in ND's table, and ND does not discuss the scheme; our extrapolation.
    A rule that attaches an evaluation or a required conduct to a situation answers
    what should be done or thought about it, so it is at home in deliberation and
    in persuasion about action; the gold's two instances are arguments in a policy
    debate. Its walton.yml source (Schellens and De Jong 2004) studies persuasive
    brochures.
  status: drafted by Claude Code, 2026-10-22
