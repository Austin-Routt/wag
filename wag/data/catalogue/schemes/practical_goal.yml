# A scheme of WAG's catalogue (wag/data/catalogue/README.md).
# Source fields are regenerated by "wag-cli --catalogue-gen"; do not edit
# them here: walton and formulas (from walton.yml), game.backs (from
# game/order.yml) and each question's game text (its paraphrase, with the
# scheme's variables in braces). The rest of the game part (game.id,
# game.nascq, game.core, each question's game id, locus and pattern) is the
# game's data, which "wag-cli --catalogue-gen" writes the game's files from:
# change it only as a decision says. Every other item has a status,
# game.status too; set it when you draft, verify or dispute.
id: practical_goal
name: Practical Reasoning - Argument From Goal
tier: 1
walton:
  id: practical_goal
  title: Practical Reasoning - Argument From Goal
  source: 'Bart Verheij, "Dialectical Argumentation with Argumentation Schemes: An
    Approach to Legal Logic." Artificial Intelligence and Law 11 (2003), p. 169.'
formulas:
  variables: [P, X, G]
  premises:
  - contributing_action(X,G)
  - goal_of_agent(P,G)
  exceptions:
  - realize_more_effectively(P,G,X)
  - incompatible_goal(P,G)
  - bad_outweighs(X,G)
  conclusions:
  - should_do(P,X)
book:
- entry: "22.5"
  title: Argument from Goal
  pages: "325"
  parent: "22"
  match: exact
  note: Same title ("Argument From Goal") and source (Verheij 2003, p. 169). Since
    2026-11-26 its goal premise is practical reasoning's goal_of_agent(P,G) (D093),
    and it borrows practical reasoning's questions (D023).
  status: generated
families:
- family: F10
  name: Practical reasoning
  relation: variant
  note: third-person "person P has goal G"
  status: generated
premise_map:
- entry: "22.5"
  label: Major Premise
  formulas: [{formula: 'contributing_action(X,G)', locus: premise}]
  status: generated
- entry: "22.5"
  label: Minor Premise
  formulas: [{formula: 'goal_of_agent(P,G)', locus: premise}]
  note: practical reasoning's goal premise (D093)
  status: generated
- entry: "22.5"
  label: Conclusion
  formulas: [{formula: 'should_do(P,X)', locus: conclusion}]
  note: names the agent; bridge_from_agent carries it to should_be_performed(X) (D063)
  status: generated
critical_questions:
- id: walton/realize_more_effectively
  targets: [{formula: 'realize_more_effectively(P,G,X)', locus: exception}]
  note: 'Borrowed from practical reasoning (D023): its questions on other means (22.1
    CQ2 and CQ3, 22.4 CQ3 and CQ4), read as a better means and scoped to the agent
    (D089), in its formula. 22.5 prints no questions.'
  paraphrase: Is there a way for P to realize G more surely, sooner or at lower cost
    than by doing X?
  answer: 'The critic, who raises it with an argument. Against: a way for P to reach
    G more surely, sooner or at lower cost than X, which undercuts the argument through
    realize_more_effectively(P,G,X). For: showing that X is the best way open to P,
    or that the other way is not open to P.'
  status: drafted by Claude Code, 2026-11-26
- id: walton/incompatible_goal
  targets: [{formula: 'incompatible_goal(P,G)', locus: exception}]
  note: 'Borrowed from practical reasoning (D023): its question on conflicting goals
    (22.1 CQ1, 22.4 CQ1), in its formula, with the agent P.'
  paraphrase: Does P have another goal that G works against?
  answer: 'The critic, who raises it with an argument. Against: another goal of P
    that G works against, and that matters to P, which undercuts the argument through
    incompatible_goal(P,G). For: showing that the goals can be pursued together, or
    that the other goal gives way.'
  status: drafted by Claude Code, 2026-11-26
- id: walton/bad_outweighs
  targets: [{formula: 'bad_outweighs(X,G)', locus: exception}]
  note: 'Borrowed from practical reasoning (D023): its question on consequences (22.1
    CQ5, 22.4 CQ7), read as the side effect that outweighs, WAG''s reading (D070,
    D091), in its formula. A side effect that does not outweigh G is a rebuttal, not
    this exception.'
  paraphrase: Would doing X have bad consequences that matter more than G?
  answer: 'The critic, who raises it with an argument. Against: bad consequences of
    X that matter more than G, which undercuts the argument through bad_outweighs(X,G).
    For: showing that they are smaller than G, or can be avoided.'
  status: drafted by Claude Code, 2026-11-26
summary:
  text: Use it when a person or body P is said to have a goal G and an act X helps
    toward G, to conclude that P should do X. It is a third-person form of practical
    reasoning in which the act need only contribute to the goal, which sets it apart
    from practical_inference, where the arguer reasons from its own goal to a means
    that realizes it.
  status: drafted by Claude Code, 2026-10-22
contrasts:
- scheme: practical_inference
  text: practical_inference (22.1) reasons from the arguer's own goal to a means that
    realizes it, and carries the book's questions on conflicting goals, alternatives,
    efficiency, possibility and consequences; practical_goal has a named person P,
    an act that only contributes to G, and no questions. Choose practical_goal when
    the text recommends an act to a third party because it helps toward that party's
    goal; choose practical_inference when the arguer reasons about a goal of their
    own.
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_reasoning2
  text: Choose practical_reasoning2 when the text describes the present circumstances
    and a resulting state in which the goal is met; choose practical_goal when it
    says only that an act helps toward a goal that a named person or body has. The
    game plays practical_reasoning2, not practical_goal.
  status: drafted by Claude Code, 2026-10-22
examples:
- text: The hospital wants to cut waiting times in its emergency department, and an
    evening clinic for minor injuries would help with that, so the hospital should
    open one.
  coding: 'P = the hospital; G = shorter waiting times in the emergency department;
    X = open an evening clinic for minor injuries. Stated: goal_of_agent(P,G), contributing_action(X,G)
    ("would help"). Supplied: none. Conclusion: should_do(P,X).'
  status: drafted by Claude Code, 2026-11-26
- text: Maria wants to run a marathon next year. Joining a running club would get
    her training on track, so she ought to sign up.
  coding: 'P = Maria; G = run a marathon next year; X = join a running club. Stated:
    goal_of_agent(P,G), contributing_action(X,G). Supplied: none. Conclusion: should_do(P,X).'
  status: drafted by Claude Code, 2026-11-26
- text: Rationing meat via personal carbon budgets/allowances (credits) where everybody
    in a country can consume a small amount of meat but larger amounts cost extra
    … would help reduce carbon emissions.
  kialo: "13292.147"
  coding: 'Near miss: "would help" is the language of contribution, but no person
    or body is said to hold the goal; the claim says that the action brings about
    a good outcome. positive_consequences (A = ration meat through carbon budgets,
    G = lower carbon emissions), as the gold codes it; since 2026-11-24 its role is
    a proposal of another course for the thesis''s goal (action_amendment), since
    it does not claim that rationing does better (D006, D066).'
  near_miss: true
  status: drafted by Claude Code, 2026-11-24
- text: Walking to school contributes to getting more exercise. Maya's goal is to
    get more exercise. So Maya should walk to school.
  coding: 'P = Maya; X = walking to school; G = getting more exercise. Pressed: walton/realize_more_effectively
    (Joining the swimming club would give her the same exercise in half the time);
    walton/incompatible_goal (She also wants to sleep longer, and walking means leaving
    forty minutes earlier); walton/bad_outweighs (The road has no pavement for a mile:
    the risk matters more than the exercise). (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: Learning Spanish contributes to working in Madrid, and Jo's goal is to work
    in Madrid. So Jo should learn Spanish.
  coding: 'P = Jo; X = learning Spanish; G = working in Madrid. It concludes should_do(P,X),
    naming the agent; bridge_from_agent carries it to the recommendation when Jo is
    the one deciding (D063). Pressed: walton/incompatible_goal (Jo also wants to finish
    the engineering degree this year, and evening classes would take the time it needs).
    (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: Walking to school brings more exercise, and more exercise is good. So children
    should walk to school.
  coding: 'Near miss: A = children walking to school; G = more exercise. A good consequence,
    with no agent''s goal: positive consequences, not the argument from goal. (proposal
    D022-D093)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-26
discrepancies:
- kind: other
  about: critical questions
  detail: Neither the book (22.5 prints no questions) nor walton.yml (no assumptions
    or exceptions) gives the scheme critical questions; both premises can be challenged.
  decision: 'Decided 2026-11-22 (D023): Yes, as derived questions, each with its source
    scheme and question recorded. Applied 2026-11-26 (proposal D022-D093): realize_more_effectively(P,G,X),
    incompatible_goal(P,G) and bad_outweighs(X,G), practical reasoning''s questions
    on other means, conflicting goals and side effects, asked as walton/ questions,
    with the goal premise goal_of_agent(P,G) (D093). Before: open: whether to borrow
    22.1''s questions (alternatives, conflicting goals, side effects), which apply
    to any goal-means argument.'
  status: drafted by Claude Code, 2026-10-22
classification:
  source: independent
  reasoning: practical
  epistemic: ""
  group: instrumental
  note: The tree does not name the argument from goal, but compendium 22.5 is a form
    of practical reasoning (22), and it argues from a goal to an act without values,
    as the instrumental argument from practical reasoning does.
  status: drafted by Claude Code, 2026-10-22
specialises:
  scheme: ""
  note: 'Specialises nothing: it is a variant of practical_inference (F10), in the
    third person and with an act that need only contribute to the goal, a weaker means
    premise rather than a narrower one.'
  status: drafted by Claude Code, 2026-10-22
dialogue_types:
  proper: [deliberation, negotiation, persuasion]
  suspect: []
  note: Not in ND's table. ND does not state this scheme, though in negotiation one
    party reasons about the other party's goals and the means to them (ND p. 111),
    and ND discusses practical reasoning in deliberation (pp. 153–5). Placing it in
    deliberation, negotiation and persuasion about action is our extrapolation. No
    type makes it suspect as such.
  status: drafted by Claude Code, 2026-10-22
