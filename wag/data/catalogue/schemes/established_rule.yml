  status: drafted by Claude Code, 2026-10-22
specialises:
  scheme: ""
  note: 'Specialises nothing: the book prints it beside argument from rules (55.2)
    under 55, as siblings, and in walton.yml''s formulas neither narrows the other:
    established_rule applies any rule R with a bare conclusion C, while rule concludes
    that an evaluation or a conduct is justified or required.'
  status: drafted by Claude Code, 2026-10-22
dialogue_types:
  proper: [deliberation, persuasion]
  suspect: []
  note: The book (p. 71, not ND) says the scheme belongs to deliberation, which sets
    it apart from verbal classification. ND does not discuss it. Persuasion, where
    the dispute is whether an agent is bound to act, is our extrapolation.
  status: drafted by Claude Code, 2026-10-22
