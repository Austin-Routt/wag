# A scheme of WAG's catalogue (wag/data/catalogue/README.md).
# Source fields are regenerated by "wag-cli --catalogue-gen"; do not edit
# them here: walton and formulas (from walton.yml), game.backs (from
# game/order.yml) and each question's game text (its paraphrase, with the
# scheme's variables in braces). The rest of the game part (game.id,
# game.nascq, game.core, each question's game id, locus and pattern) is the
# game's data, which "wag-cli --catalogue-gen" writes the game's files from:
# change it only as a decision says. Every other item has a status,
# game.status too; set it when you draft, verify or dispute.
id: negative_consequences
name: Argument from Negative Consequences
tier: 1
walton:
  id: negative_consequences
  title: Argument from Negative Consequences
  source: Douglas Walton, A Pragmatic Theory of Fallacy, The University of Alabama
    Press, Tuscaloosa and London, 1995, pp. 155-156.
game:
  id: AS:negative_consequences
  nascq:
    carneades_id: negative_consequences
    name: Argument from Negative Consequences
    semantic_type: action
    thesis_independent: false
    base_weight: 0.65
    variables:
      A:
        type: action
        description: Action
        example_en: introduce a carbon tax
      G:
        type: event
        description: Bad consequence
        example_en: higher heating bills for poor households
    premise_templates_en:
    - Doing {A} brings about {G}
    - '{G} is bad'
    conclusion_template_en: '{A} should not be done'
    description_en: An action should not be performed because it brings about bad
      consequences (the counterpart of positive consequences).
    cues_en:
    - bad consequence
    - bad consequences
    - would cause
    - would harm
    - harm
    - harmful
    - danger
    - dangerous
    - risk
    - backfire
    - should not
    - shouldn't
    - downside
    evidence: recommended
    evidence_note_en: a source showing the action brings about the consequence
  core:
    meta:
      title: Argument from Negative Consequences
      source: Walton (1995)
  status: generated
formulas:
  variables: [A, G]
  premises:
  - brings_about(A,G)
  - bad(G)
  exceptions:
  - good_outweighs(A,G)
  - too_slight(A,G)
  - harm_discounted_by_bearer(A,G)
  conclusions:
  - ¬should_be_performed(A)
book:
- entry: "33.2"
  title: Argument from Negative Consequences
  pages: "332"
  parent: "33"
  match: exact
  cqs_printed_under: "33"
  note: Same title (upstream Carneades; source A Pragmatic Theory of Fallacy 1995,
    pp. 155-156).
  status: generated
families:
- family: F15
  name: Consequences, alternatives, threat and fear
  relation: counterpart
  status: generated
premise_map:
- entry: "33.2"
  label: Premise
  formulas: [{formula: 'brings_about(A,G)', locus: premise}, {formula: bad(G), locus: premise}]
  status: generated
- entry: "33.2"
  label: Conclusion
  formulas: [{formula: ¬should_be_performed(A), locus: conclusion}]
  status: generated
critical_questions:
- id: 33/CQ1
  book:
    entry: "33"
    label: CQ1
  game:
    id: CQ:likelihood
    text: How likely is it that doing {A} would actually lead to {G}?
    locus: premise
    pattern: brings_about(A,G)
  targets: [{formula: 'brings_about(A,G)', locus: premise}]
  note: The book's question also allows for the strength the arguer claims (that G
    will, may or must follow); the paraphrase asks for the likelihood whatever strength
    is claimed. The game's CQ:likelihood asks this paraphrase since step C5.2 (before,
    it dropped the modality and spoke of "the claimed link").
  paraphrase: How likely is it that doing A would actually lead to G?
  answer: 'The proponent, once asked. Against: reasons why G is unlikely to follow
    from A, or would follow only under conditions this case lacks, which undermines
    brings_about(A,G). For: a record, a known mechanism or a forecast showing that
    actions like A reliably produce outcomes like G.'
  status: drafted by Claude Code, 2026-10-22
- id: 33/CQ2
  book:
    entry: "33"
    label: CQ2
  game:
    id: CQ:evidence
    text: What evidence shows that doing {A} would lead to {G}, and is it strong enough
      for the confidence with which the claim is made?
    locus: premise
    pattern: brings_about(A,G)
  targets: [{formula: 'brings_about(A,G)', locus: premise}]
  note: 'No separate evidence formula, so the question targets the premise the evidence
    would support. The game asks it there since step C5.2 (CQ:evidence; before, of
    the inference), beside CQ:likelihood: one argument for the premise answers both.'
  paraphrase: What evidence shows that doing A would lead to G, and is it strong enough
    for the confidence with which the claim is made?
  answer: 'The proponent, once asked. Against: showing that the evidence for the link
    is missing, anecdotal, or weaker than the claim needs (a firm "will" backed only
    by a "might"), which undermines brings_about(A,G). For: studies, precedents or
    a known mechanism that support the link as strongly as it is claimed.'
  status: drafted by Claude Code, 2026-10-22
- id: 33/CQ3
  book:
    entry: "33"
    label: CQ3
  game:
    id: CQ:good_outweighs
    text: Would doing {A} have good consequences that matter more than {G}?
    locus: exception
    pattern: good_outweighs(A,G)
  targets: [{formula: 'good_outweighs(A,G)', locus: exception}]
  note: 'Targets the sided exception good_outweighs(A,G), decision D055 (2026-10-23):
    doing A has good consequences that outweigh G. It names G, so it defeats only
    this argument. The question has two routes (docs/kialo-batch2/guidelines.md §3.1):
    a further good consequence of A that ranks nothing rebuts the conclusion, as a
    positive_consequences argument weighed by the scheme weights (OC2); a claim that
    a good consequence of A matters more than G argues this exception (OC3, OC4).
    The exceptions'' limits are recorded in positive_consequences'' discrepancy on
    33/CQ3.'
  paraphrase: Would doing A have good consequences that matter more than G?
  answer: 'The critic, who raises it with an argument. Against: a claim that some
    good consequence of A matters more than G, argued with C003''s good_outweighs_bad
    or a source-based scheme, which argues good_outweighs(A,G) and, unanswered, defeats
    the argument whatever the weights. For: a reply that attacks that claim''s own
    comparison, or the consequence it relies on (OC10).'
  status: drafted by Claude Code, 2026-11-24
- id: game/CQ:opposite_consequences
  game:
    id: CQ:opposite_consequences
    text: Would doing {A} also bring about something good, to set against {G}?
    locus: conclusion
  targets: [{formula: ¬should_be_performed(A), locus: conclusion}]
  note: 'The game''s form of the rebuttal route of 33/CQ3: it asks, at the conclusion,
    for a good consequence of A, which the game plays as an argument from positive
    consequences (AS:consequences backs it); the weights decide between the two. Whether
    a good consequence outweighs G is the exception good_outweighs(A,G), which 33/CQ3
    targets (D055); the game asks it there since step C5.2 (CQ:good_outweighs, D095
    (1)).'
  paraphrase: Would doing A also bring about something good, to set against G?
  answer: 'The critic, who raises it with an argument. Against: a good consequence
    of A, put forward as an argument from positive_consequences (the game lets AS:consequences
    back this answer), which rebuts the conclusion; the weights decide between them.
    A claim that the good consequence outweighs G answers 33/CQ3 instead. For: showing
    that A has no such consequence.'
  status: drafted by Claude Code, 2026-10-23
- id: walton/too_slight
  game:
    id: CQ:too_slight
    text: 'Granted that doing {A} would or could bring about {G}, is {G} too slight
      a consequence to count in deciding on {A}? (Reaching few does not make a consequence
      slight: one weighty gain or harm can decide.)'
    locus: exception
    pattern: too_slight(A,G)
  targets: [{formula: 'too_slight(A,G)', locus: exception}]
  note: The book does not ask it. Since 2026-11-25 walton.yml has it as an exception
    (D065, candidate C005), apart from bad(G), so that a real but slight consequence
    is not a denied one. Slight means slight by what bears on the decision on A, not
    merely that G reaches few, is small in number, or seems minor to one side; so
    scoped, it is neutral as to polarity (D053, the owner's declaration of 2026-11-25).
    The game asks it since step C5.2 (CQ:too_slight).
  paraphrase: 'Granted that doing A would or could bring about G, is G too slight
    a consequence to count in deciding on A? (Reaching few does not make a consequence
    slight: one weighty gain or harm can decide.)'
  answer: 'The critic, who raises it with an argument. Against: showing that G, though
    real and bad, is too small to weigh in the decision on A (a burden as small as
    a change of diet, 13292.25), which undercuts the argument through too_slight(A,G);
    a grave harm is not slight, however few it reaches. No scheme concludes it: a
    claim that argues it is coded with Other (docs/kialo-batch2/guidelines.md §3.1,
    OC9). For: showing that G is large enough to count: its size, how long it lasts,
    or how much it matters to those it reaches.'
  status: drafted by Claude Code, 2026-11-25
- id: walton/harm_discounted_by_bearer
  game:
    id: CQ:harm_discounted
    text: On whom would {G} fall, and does that make it count for less in deciding
      on {A}?
    locus: exception
    pattern: harm_discounted_by_bearer(A,G)
  targets: [{formula: 'harm_discounted_by_bearer(A,G)', locus: exception}]
  note: 'The book does not ask it. Since 2026-11-25 walton.yml has it as an exception
    (D065, candidate C021): the side of an argument against A of the bearer pair,
    whose other side, gain_discounted_by_bearer(A,G), is the positive schemes'' (a
    sided flip, D053: that a cost falls on the polluters who cause the harm discounts
    it as a harm and is the very reason it is a gain). The game asks it since step
    C5.2 (CQ:harm_discounted).'
  paraphrase: On whom would G fall, and does that make it count for less in deciding
    on A?
  answer: 'The critic, who raises it with an argument. Against: showing that the harm
    falls on those who cause what A is meant to remedy (the cost falls on the producers
    whose farms cause the harm the tax is for), so that it counts for less, which
    undercuts the argument through harm_discounted_by_bearer(A,G); it grants the harm.
    Coded with Other (docs/kialo-batch2/guidelines.md §3.1, OC16). A right or a value
    that rules A out whatever its consequences is not this question (OC5). For: showing
    that those it falls on have no part in what A remedies, or that on whom it falls
    does not lessen it here.'
  status: drafted by Claude Code, 2026-11-25
summary:
  text: Use it when an action A is argued against because doing it would bring about
    an outcome G that is bad. It concludes that A should not be done; it is the mirror
    of positive_consequences, and differs from threat and fear in that nobody undertakes
    to bring G about and no appeal is made to the hearer's fear.
  status: drafted by Claude Code, 2026-10-22
contrasts:
- scheme: positive_consequences
  text: The mirror image. Choose negative_consequences when the cited outcome of A
    is bad and the claim is that A should not be done; choose positive_consequences
    when the outcome is good and the claim is that A should be done. Bind A to the
    action as the issue states it, so that pros and cons meet on one conclusion.
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_consequences_reasoning
  text: Choose negative_consequences_reasoning when an agent reasons about its own
    action, and the outcome is bad by that agent's own goals ("if I do this, it defeats
    what I am after, so I had better not"); choose negative_consequences when an action,
    such as a policy, is judged by an outcome that is bad in general terms. Both conclude
    ¬should_be_performed(A); in a policy debate, where the badness is judged in general
    terms, prefer negative_consequences.
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_consequences_prudential
  text: Choose negative_consequences_prudential when the bad outcome would follow
    from not doing A and falls on the one who acts, whom the arguer warns to do A
    after all; the book counts it a subtype of negative consequences (p. 104). A bad
    outcome of not doing A that falls on others is an argument for A, positive_consequences
    with G the harm's not happening (docs/kialo-batch2/guidelines.md §3.1, OC13).
    Choose negative_consequences when the bad outcome follows from doing A.
  status: drafted by Claude Code, 2026-10-23
- scheme: pragmatic_alternative
  text: 'Choose pragmatic_alternative when the text sets up an either-or: A must be
    done or the bad outcome B follows, so A should be done. Choose negative_consequences
    when the bad outcome is a result of the action argued against.'
  status: drafted by Claude Code, 2026-10-22
- scheme: threat
  text: Choose threat when the speaker says that he will himself bring the bad outcome
    about if the hearer acts; choose negative_consequences when the bad outcome would
    follow from the action without anyone undertaking to cause it. The book's adviser
    who only warns of a bad outcome argues from negative consequences (p. 102), and
    ND counts threats as a subtype of it (p. 116).
  status: drafted by Claude Code, 2026-10-22
- scheme: ad_baculum
  text: Choose ad_baculum when the speaker demands an action and undertakes to cause
    a harm if it is not done (a threat in either-or form); choose negative_consequences
    when no one is threatening anything and the harm is simply a result of the action
    argued against.
  status: drafted by Claude Code, 2026-10-22
- scheme: fear
  text: Choose fear when the argument works on the hearer's fear of something very
    bad and presents one action as the only way to avert it; choose negative_consequences
    when an action is opposed for a bad result, stated as a matter of fact. The book
    says the two have a similar structure and differ in the speech act (p. 102).
  status: drafted by Claude Code, 2026-10-22
- scheme: danger
  text: Choose danger when the bad outcome is a risk of serious harm to the hearer,
    which the book counts among arguments from negative consequences (p. 102); choose
    negative_consequences for any other bad outcome, including harms to third parties,
    budgets or institutions.
  status: drafted by Claude Code, 2026-10-22
- scheme: slippery_slope_base_case
  text: Choose a slippery slope (slippery_slope_base_case with slippery_slope_inductive_step)
    when the text presents a series of at least two further events after the first
    step, each said to bring on the next, ending in a horrible outcome; choose negative_consequences
    when the action leads to the bad outcome directly or through one stated intermediate
    event.
  status: drafted by Claude Code, 2026-10-22
- scheme: bad_outweighs_good
  text: ""
  status: todo
- scheme: good_outweighs_bad
  text: ""
  status: todo
- scheme: positive_consequences_modal
  text: ""
  status: todo
- scheme: negative_consequences_modal
  text: The categorical scheme claims that A brings about G (would, will, can of capability);
    the modal variant only that it may (may, might, could, can of possibility), and
    concludes no more than that A may be unwise because of G, which reaches ¬should_be_performed(A)
    through bridge_from_possible_harm. The mood is the causal link's; when it cannot
    be told, code the modal variant, which claims less (docs/kialo-batch2/guidelines.md
    §3).
  status: drafted by Claude Code, 2026-11-25
- scheme: bridge_from_possible_good
  text: ""
  status: todo
- scheme: bridge_from_possible_harm
  text: The categorical scheme concludes ¬should_be_performed(A) directly, from brings_about(A,G);
    the bridge reaches it from a possible consequence, through the modal variant's
    conclusion and matters_to_decision(A,G). The bridge's exception leaves the categorical
    argument standing.
  status: drafted by Claude Code, 2026-11-25
- scheme: harm_reduction
  text: ""
  status: todo
- scheme: finding_out_first
  text: ""
  status: todo
- scheme: cause_to_effect
  text: Choose cause_to_effect when the claim's point is that the effect will happen
    from a cause that has occurred, for instance when it explains how a consequence
    another claim cites comes about from present facts (from the proposed action,
    cause_to_effect_modal); choose negative_consequences when the point is that A
    should not be done because the effect is bad.
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_reasoning1
  text: A bad consequence offered as a reply to a practical-reasoning argument for
    A is the side_effects exception of practical_reasoning1 or 2, and is coded as
    a negative_consequences argument against the same A. Choose practical_reasoning1
    only when the claim argues for an action from circumstances, a goal and a value.
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_value
  text: Choose negative_value when the reason is a value that the agent judges bad
    and that tells against keeping a goal; choose negative_consequences when the reason
    is a bad outcome that the action would produce.
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_analogy_negative
  text: Choose practical_analogy_negative when X is opposed because doing it in a
    similar earlier situation was judged wrong; choose negative_consequences when
    it is opposed for the bad outcome it would bring here.
  status: drafted by Claude Code, 2026-10-22
- scheme: cause_to_effect_modal
  text: Choose negative_consequences when an effect is cited to argue that an action
    should not be done; choose cause_to_effect_modal when the point is only that the
    effect may follow, including a step that explains, beside a consequences argument,
    how the consequence it cites could come about (the step concludes may_occur, not
    brings_about).
  status: drafted by Claude Code, 2026-10-22
examples:
- text: A sin tax on meat would make food more expensive, despite many people not
    being able to afford it.
  kialo: "13292.7"
  coding: 'A = a tax on meat; G = food becoming unaffordable for many people. Stated:
    brings_about(A,G). Supplied: bad(G); the affordability clause says why it is bad.
    Conclusion: ¬should_be_performed(A). Pressed: 33/CQ1 (meat is a small part of
    what poor households spend on food, and cheaper foods would not be taxed); 33/CQ3
    by a claim that the health gains of eating less meat, above all among the poor,
    outweigh a higher price for one food, which argues good_outweighs(A,G). A plain
    counter (the tax cuts emissions) would be a positive_consequences argument, a
    rebuttal (docs/kialo-batch2/guidelines.md §3.1, OC2, OC3). Since 2026-11-25, 13292.25
    (the extra burden could be no more than a change of diet) argues walton/too_slight,
    the exception too_slight(A,G), as an undercutter: it says the burden is small,
    not that it is not bad (OC9).'
  status: drafted by Claude Code, 2026-11-25
- text: Taxing meat could also result in an unhealthy underconsumption of meat.
  kialo: "13292.121"
  coding: 'Near miss: "could also result in" claims the consequence only possible
    (the mood of the link, D008): negative_consequences_modal (A = a tax on meat;
    G = unhealthy underconsumption of meat), secondary, with bridge_from_possible_harm,
    primary, which keeps the claim''s role and target: a further bad consequence that
    ranks nothing, at the conclusion of the pro 13292.115 (docs/kialo-batch2/guidelines.md
    §3.1, OC2, OC15). As the gold codes it since 2026-11-25; until then it was coded
    here, with brings_about(A,G).'
  near_miss: true
  status: drafted by Claude Code, 2026-11-25
- text: A tax on meat could reduce tax revenues, since it would harm the meat industry,
    which pays substantial taxes.
  kialo: "13292.9"
  coding: 'Near miss: "could actually" claims the consequence only possible (D008):
    negative_consequences_modal (A = a tax on meat; G = tax revenues falling) with
    its bridge, the claim''s primary instance, and its causal steps two cause_to_effect_modal
    instances. 13292.43 (revenue is not why the tax is wanted) weighs against the
    modal instance''s good_outweighs(A,G), which the categorical scheme shares (docs/kialo-batch2/guidelines.md
    §3.1, OC4, OC15). As the gold codes it since 2026-11-25.'
  near_miss: true
  status: drafted by Claude Code, 2026-11-25
- text: Legalising cannabis would mean more adults use it, which is bad for public
    health.
  coding: 'A = legalising cannabis; G = more adults using cannabis. Pressed: 33/CQ2,
    since the studies cited measure use among teenagers, not adults, and come from
    before any country legalised it. The counterpart of positive_consequences'' example
    with the same G, valued oppositely; each has its own exception, so they share
    none.'
  status: drafted by Claude Code, 2026-10-23
- text: Meat is the easiest source of organic iron for one's diet. Any financial restrictions
    will only increase cases for anemia directly because of this.
  kialo: "13292.180"
  coding: 'A = a tax on meat (the "financial restrictions"); G = more cases of anemia.
    Stated: brings_about(A,G). Supplied: bad(G). Conclusion: ¬should_be_performed(A).
    The first sentence backs the link; the gold codes the step from less meat to anemia
    as a secondary instance. Its cause is hypothetical, so it is a cause_to_effect_modal
    step, as the gold codes it since 2026-11-24 (D039; cause_to_effect with the N8
    note before).'
  status: drafted by Claude Code, 2026-11-24
- text: Taxes on meat would not resolve the problems associated with its production
    and consumption.
  kialo: "13292.13"
  coding: 'Near miss: it names no bad result of the tax; it only denies that the tax
    achieves what its supporters claim. A bare denial of the pros'' efficacy premise:
    would_bring_about(A,S1,S2) of 13292.108 in the gold, and equally brings_about(A,G)
    of 13292.115 (batch-2 guidelines §3); coded none, not an argument from negative
    consequences.'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
- text: A meat tax is only the first step; once it exists it will be raised again
    a year later, and again, until meat is banned outright.
  coding: 'Near miss: it argues from a chain of further steps, not from the action''s
    own consequence; slippery_slope_base_case (A = a tax on meat, E = the tax being
    raised again a year later), with inductive steps that carry the ban''s horrible
    costs back to the first step.'
  near_miss: true
  status: drafted by Claude Code, 2026-10-23
- text: Closing the high street for the Saturday market would delay deliveries to
    its shops, so the council should not close it.
  coding: 'A = the council closing the high street for the Saturday market; G = deliveries
    to the high street''s shops being delayed. Pressed: 33/CQ1 (The shops take their
    deliveries before eight, and the market opens at nine); 33/CQ2 (No shop has said
    that a delivery was ever late on a market day); walton/harm_discounted_by_bearer
    (The delays would fall on the shops that asked the council for the market, since
    it brings them customers). (proposal D008-D074)'
  status: drafted by Claude Code, 2026-11-25
- text: 'Under the claim that free will is an illusion: believing that it is an illusion
    would make people give up trying, so no one should believe it.'
  coding: 'A = people believing that free will is an illusion; G = people giving up
    trying. As Kialo 27150.12 replies to an argument from the risks of AGI offered
    on whether AGI is possible: whether we should do something has no bearing on whether
    it is so. A reply that raises D074''s objection undercuts this argument''s inference
    (an undercutter of the specific argument, not an exception, as the owner refined
    D074 on 2026-11-25): ''Whether a belief makes people give up is no evidence about
    whether it is true, and the discussion is whether free will is an illusion.''
    (proposal D008-D074)'
  status: drafted by Claude Code, 2026-11-25
- text: A congestion charge might drive shoppers to the out-of-town malls, so it may
    be unwise to bring one in.
  coding: 'Near miss: A = the council bringing in a congestion charge; G = shoppers
    going to the out-of-town malls instead. It looks like negative consequences, but
    ''might'' claims the consequence only possible (the mood rule): negative_consequences_modal.
    Coded categorically, the ''might'' would fill brings_about(A,G), which it does
    not claim. (proposal D008-D074)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-25
discrepancies:
- kind: book-walton
  about: Premise
  detail: The compendium's 33.2 has a single premise (doing A will have bad consequences)
    that names no consequence; walton.yml names it G and splits the premise into brings_about(A,G)
    and bad(G).
  decision: No change. Naming G lets the link and the badness be questioned apart,
    and ND's form of the scheme does the same (p. 158). The first-person, two-premise
    form (33.3, and the ch. 3 version on p. 101) now has its own scheme, negative_consequences_reasoning.
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: CQ1-CQ2
  detail: The book's first two questions allow the consequences to be claimed with
    different strengths (will, may, must). brings_about(A,G) has no modality, and
    Kialo cons often hedge ("could", "might").
  decision: 'Decided 2026-11-22 (D008): Yes, as schemes of their own: modal variants
    of the consequence schemes, as cause to effect has cause_to_effect_modal, not
    a modality field. Likelihood stays a question (33/CQ1, CQ:likelihood). (The review
    left variant or field open and added an adequacy assumption; WAG''s precedent
    is a scheme of its own, and the likelihood question already exists.) Applied 2026-11-25
    (proposal D008-D074): negative_consequences_modal, which concludes may_be_unwise_to_perform(A,G)
    from may_bring_about(A,G) and meets ¬should_be_performed(A) only through bridge_from_possible_harm,
    whose premise matters_to_decision(A,G) its arguer supports. A hedged claim is
    coded with them (docs/kialo-batch2/guidelines.md §3, the mood of the link; §3.1,
    OC15). Before: No change. Code a hedged claim with brings_about(A,G), say so in
    the coding, and treat the hedge as a reason to press 33/CQ1: the conclusion that
    A should not be done needs a consequence likely enough to act on. The claim''s
    causal steps are coded beside it as secondary cause_to_effect_modal instances,
    which conclude only that the effect may occur and do not back brings_about(A,G)
    (cause_to_effect_modal, the discrepancy on the consequence schemes). The question
