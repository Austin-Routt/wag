classification:
  source: independent
  reasoning: practical
  epistemic: ""
  group: value-based
  status: drafted by Claude Code, 2026-10-22
specialises:
  scheme: ""
  note: 'Specialises nothing: it is the counterpart of positive_consequences. Narrower
    schemes specialise it: the first-person form negative_consequences_reasoning (families.json
    F15), the prudential form (the book, p. 104), the danger appeal (p. 102), and,
    in ND, threats (p. 116) and the slippery slope (p. 161).'
  status: drafted by Claude Code, 2026-10-22
dialogue_types:
  proper: [deliberation, persuasion, negotiation]
  suspect: [inquiry]
  note: 'From ND, via docs/dialogue-types.md §7: arguments from consequences are the
    characteristic move of deliberation (ND pp. 157–60), and are proper in a critical
    discussion of whether a policy is good (p. 203). In negotiation, ND treats an
    argument from negative consequences as a way to steer the other party off a course
    of action, and threats, a subtype of it, as relevant there (pp. 114–16). Used
    in a dispute about whether a thesis is true, it is the ad consequentiam fallacy,
    an illicit shift into deliberation (pp. 176–7); persuasion is listed as proper
    only for theses about what to do. Our extrapolation: inquiry, whose goal is to
    prove a proposition true or false (p. 32), is where that misuse threatens.'
  status: drafted by Claude Code, 2026-10-22
