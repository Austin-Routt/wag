id: good_outweighs_bad
name: Weighing a Good Consequence against a Bad One
tier: 2
walton:
  id: good_outweighs_bad
  title: Weighing a Good Consequence against a Bad One
  source: 'WAG''s answer scheme (decisions D064 and D075; candidate C003, docs/candidates.md),
    after Walton''s comparative weighing of good and bad consequences: Douglas Walton,
    The New Dialectic: Conversational Contexts of Argument. University of Toronto
    Press, 1998, pp. 159, 170. Not in the compendium.'
game:
  id: AS:good_outweighs_bad
  backs: ['CQ:good_outweighs']
  nascq:
    carneades_id: good_outweighs_bad
    name: Weighing a Good Consequence against a Bad One
    semantic_type: value
    thesis_independent: false
    base_weight: 0.5
    variables:
      A:
        type: action
        description: Action
        example_en: introduce a carbon tax
      H:
        type: event
        description: Good consequence that matters more
        example_en: cleaner air
      G:
        type: event
        description: The consequence it outweighs
        example_en: higher heating bills
    premise_templates_en:
    - Doing {A} brings about {H}
    - '{H} is good'
    - '{H} matters more than {G}'
    conclusion_template_en: Doing {A} has good consequences that outweigh {G}
    description_en: The answer that a good consequence of the action matters more
      than the harm it is argued against for (C003, D064, D075). It concludes the
      exception good_outweighs(A,G) of the argument it answers.
    cues_en:
    - outweigh
    - outweighs
    - matters more
    - worth it anyway
    - the gain is greater
    evidence: recommended
    evidence_note_en: a source showing the action brings about the good consequence
    role: answer
  core:
    meta:
      title: Weighing a Good Consequence against a Bad One
      source: WAG (D064, D075), after Walton (1998)
  status: drafted by Claude Code, 2026-11-27
formulas:
  variables: [A, H, G]
  premises:
  - brings_about(A,H)
  - good(H)
  - matters_more(H,G)
  conclusions:
  - good_outweighs(A,G)
book: []
families:
- family: F15
  name: Consequences, alternatives, threat and fear
  relation: variant
  note: 'a sided flip of bad_outweighs_good, not a polarity pair (D053): the two conclude
    different predicates. Answer scheme (D075; candidate C003, D064): concludes good_outweighs(A,G),
    the exception of negative_consequences; since 2026-11-24'
  status: generated
premise_map: []
critical_questions: []
summary:
  text: 'An answer scheme (D064, D075; candidate C003): it concludes good_outweighs(A,G),
    negative_consequences'' exception (and negative_consequences_reasoning''s, with
    G bound to B), from a good consequence H of A that matters more than G: brings_about(A,H),
    good(H), matters_more(H,G). Use it for a claim that one consequence of the action
    matters more than the one an argument about it cites (docs/kialo-batch2/guidelines.md
    §3.1, OC3, OC4). It has no questions of its own (D075''s reasoned none): a reply
    attacks its premises, the comparison or the consequence it relies on (OC10).'
  status: drafted by Claude Code, 2026-11-24
