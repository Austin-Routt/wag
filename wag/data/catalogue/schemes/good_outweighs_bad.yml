summary:
  text: 'An answer scheme (D064, D075; candidate C003): it concludes good_outweighs(A,G),
    negative_consequences'' exception (and negative_consequences_reasoning''s, with
    G bound to B), from a good consequence H of A that matters more than G: brings_about(A,H),
    good(H), matters_more(H,G). Use it for a claim that one consequence of the action
    matters more than the one an argument about it cites (docs/kialo-batch2/guidelines.md
    §3.1, OC3, OC4). It has no questions of its own: a reply attacks its premises,
    the comparison or the consequence it relies on (OC10).'
  status: drafted by Claude Code, 2026-11-24
