- kind: other
  about: contrary comparisons
  detail: 'Both of two contrary comparisons can be accepted: matters_more(H,G) and
    matters_more(G,H) are different statements, and declared contraries are not enforced
    (D053), so both weighing arguments can stand and both arguments they answer fall
    (limit (2) of positive_consequences'' discrepancy on 33/CQ3). A comparison names
    no one whose ordering it is.'
  decision: 'Recorded as a limit (proposal D004-D075): nothing enforces contraries
    yet (D053). A reply to a weighing claim attacks its own comparison or the consequence
    it relies on (docs/kialo-batch2/guidelines.md §3.1, OC10).'
  status: drafted by Claude Code, 2026-11-24
