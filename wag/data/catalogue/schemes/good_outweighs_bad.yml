id: good_outweighs_bad
name: Weighing a Good Consequence against a Bad One
tier: 2
walton:
  id: good_outweighs_bad
  title: Weighing a Good Consequence against a Bad One
  source: 'WAG''s answer scheme (decisions D064 and D075; candidate C003, docs/candidates.md),
    after Walton''s comparative weighing of good and bad consequences: Douglas Walton,
    The New Dialectic: Conversational Contexts of Argument. University of Toronto
    Press, 1998, pp. 159, 170. Not in the compendium.'
formulas:
  variables: [A, H, G]
  premises:
  - brings_about(A,H)
  - good(H)
  - matters_more(H,G)
  conclusions:
  - good_outweighs(A,G)
