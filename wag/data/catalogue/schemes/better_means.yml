  note: 'answer scheme (D075, D089): concludes realize_more_effectively(P,G,A) of
    practical reasoning; since 2026-11-24'
  status: generated
premise_map: []
critical_questions: []
summary:
  text: 'An answer scheme (D075, D089): it concludes realize_more_effectively(P,G,A),
    practical reasoning''s exception that another action would do better, from the
    answered argument''s own goal premise, goal_of_agent(P,G), that P can take the
    other action A2 (possible_bring_about(P,A2)), that A2 brings about G, and more_effective_means(P,A2,G,A):
    A2 would realize G more surely, sooner or at lower cost. Use it for a claim that
    another course would do better (docs/kialo-batch2/guidelines.md §3, OC6); an action
    merely as good answers nothing (D006). It has no questions of its own: a reply
    attacks its premises.'
  status: drafted by Claude Code, 2026-11-24
