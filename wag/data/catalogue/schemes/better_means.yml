id: better_means
name: Argument from a Better Means
tier: 2
walton:
  id: better_means
  title: Argument from a Better Means
  source: 'WAG''s answer scheme (decisions D075 and D089), the sketch better_means
    of WAG''s review of 2026-10-15 (part 6, §4), repaired; after the book''s questions
    on other means and efficiency (Walton, Reed and Macagno, Argumentation Schemes,
    2008: 22.1 and 22.4, and ch. 3, p. 96). Not in the compendium.'
formulas:
  variables: [A, A2, G, P]
  premises:
  - goal_of_agent(P,G)
  - possible_bring_about(P,A2)
  - brings_about(A2,G)
  - more_effective_means(P,A2,G,A)
  conclusions:
  - realize_more_effectively(P,G,A)
