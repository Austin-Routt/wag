discrepancies:
- kind: not-in-book
  about: better_means
  detail: 'The compendium (ch. 9) lists no scheme this formalizes. walton.yml cites:
    WAG''s answer scheme (decisions D075 and D089), the sketch better_means of WAG''s
    review of 2026-10-15 (part 6, §4), repaired; after the book''s questions on other
    means and efficiency (Walton, Reed and Macagno, Argumentation Schemes, 2008: 22.1
    and 22.4, and ch. 3, p. 96). Not in the compendium.'
  decision: 'Keep: WAG''s answer scheme (proposal D004-D075, 2026-11-24), after the
    book''s questions on other means and efficiency (22.1, 22.4; ch. 3, p. 96).'
  status: drafted by Claude Code, 2026-11-24
- kind: other
  about: the agent's means
  detail: 'The answer must name a means open to the same agent: its goal premise,
    goal_of_agent(P,G), is the answered argument''s, and its premise possible_bring_about(P,A2)
    says that P can take A2. The engine checks neither, nor that the comparison is
    one of the three.'
  decision: 'Recorded as a limit (proposal D004-D075): the record checks refuse an
    answer bound to another agent or another goal (validate.py''s R8 and R9: its conclusion
    and its goal premise must be the answered argument''s), one that compares A with
    itself, and one that records no comparison (R9). Whether A2 is really open to
    P is the premise possible_bring_about(P,A2), which a reply challenges; the game
    will check the agent (step C5).'
  status: drafted by Claude Code, 2026-11-24
