id: practical_sufficient_condition
name: Practical Reasoning - Sufficient Condition Schema
tier: 2
walton:
  id: practical_sufficient_condition
  title: Practical Reasoning - Sufficient Condition Schema
  source: 'Trevor Bench-Capon, "Persuasion in Practical Argument Using Value-based
    Argumentation Frameworks." Journal of Logic and Computation 13 (2003), pp. 429-448.
    Douglas Walton, Practical Reasoning. Savage, Md.: Rowman and Littlefield, 1990.
    Douglas Walton, "Actions and Inconsistency: The Closure Problem of Practical Reasoning.
    "In Contemporary Action Theory, vol.1 , ed. Ghita Holmstrom-Hintikka and Raimo
    Tuomela. Dordrecht: Kluwer, 1997, p. 164. Douglas Walton, Slippery Slope Arguments.
    Newport News, Va.: Vale Press, 1992, pp. 89-90.'
formulas:
  variables: [X, G, P, S]
  premises:
  - goal_of_agent(P,G)
  - alternative_action_sufficient(P,S,G)
  - sufficient_action(P,X,S,G)
  - practicality_action(P,X)
  - more_acceptable_bringing(P,G,X)
  assumptions:
  - possible_goal(G)
  - acceptable_action(P,X)
  - possible_bring_about(P,X)
  exceptions:
  - realize_more_effectively(P,G,X)
  - bad_outweighs(X,G)
  - incompatible_goal(P,G)
  conclusions:
  - should_be_performed(X)
book:
- entry: "22.3"
  title: Sufficient Condition Schema
  pages: 323-324
  parent: "22"
  match: partial
  note: 'Same title and references. Since 2026-11-24 it differs from practical_necessary_condition
    in its alternatives premise (each means enough), its selection premise, and its
    exceptions (no objection that the goal can be reached without the set, D090).
    Partial since 2026-11-24: the first-person premises are stated of the agent P
    and the conclusion is restated in the game''s vocabulary, should_be_performed(X)
    (D030, D063).'
  status: generated
