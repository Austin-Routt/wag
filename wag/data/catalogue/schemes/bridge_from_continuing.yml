id: bridge_from_continuing
name: From Continuing to Try to the Action (bridge)
tier: 2
walton:
  id: bridge_from_continuing
  title: From Continuing to Try to the Action (bridge)
  source: 'WAG''s bridge (decision D063, refined 2026-11-22: continuing an activity
    binds to the continuing action, not only to its goal; D093): from waste''s conclusion,
    that an agent ought to continue trying to realize a goal, to the recommendation
    of an action that continues the effort, when the decision is the agent''s, with
    practical reasoning''s questions for the means it chooses. Not in the compendium.'
formulas:
  variables: [P, G, A]
  premises:
  - ought_to_continue(P,G)
  - continues_trying(A,G)
  - deliberating_agent(P,A)
  assumptions:
  - possible_bring_about(P,A)
  exceptions:
  - realize_more_effectively(P,G,A)
  - bad_outweighs(A,G)
  conclusions:
  - should_be_performed(A)
book: []
families:
- family: F10
  name: Practical reasoning
  relation: related
  note: 'a bridge (decision D063, 2026-11-26): from waste''s ought_to_continue(P,G)
    to should_be_performed(A) for an action that continues the effort, with deliberating_agent(P,A)
    and practical reasoning''s questions of the means (D093)'
  status: generated
premise_map: []
critical_questions:
- id: walton/realize_more_effectively
  targets: [{formula: 'realize_more_effectively(P,G,A)', locus: exception}]
  note: 'Borrowed from practical reasoning (D093(f)): the bridge chooses a means for
    the goal, so practical reasoning''s question on other means (22.1 CQ2 and CQ3,
    22.4 CQ3 and CQ4), read as a better means and scoped to the agent (D089), asks
    of it. Not in the compendium.'
  paraphrase: Is there a way for P to realize G more surely, sooner or at lower cost
    than by doing A?
  answer: 'The critic, who raises it with an argument. Against: a way for P to realize
    G more surely, sooner or at lower cost than by doing A, which undercuts the bridge
    through realize_more_effectively(P,G,A). For: showing that A is the best way open
    to P to go on, or that the other way is not open to P.'
  status: drafted by Claude Code, 2026-11-26
- id: walton/bad_outweighs
  targets: [{formula: 'bad_outweighs(A,G)', locus: exception}]
  note: 'Borrowed from practical reasoning (D093(f)): its question on consequences
    (22.1 CQ5, 22.4 CQ7), read as the side effect that outweighs, WAG''s reading (D070,
    D091). A side effect that does not outweigh G is a rebuttal, not this exception.'
  paraphrase: Would doing A have bad consequences that matter more than G?
  answer: 'The critic, who raises it with an argument. Against: bad consequences of
    doing A that matter more than G, which undercuts the bridge through bad_outweighs(A,G).
    For: showing that they are smaller than G, or can be avoided.'
  status: drafted by Claude Code, 2026-11-26
- id: walton/possible_bring_about
  targets: [{formula: 'possible_bring_about(P,A)', locus: assumption}]
  note: 'Borrowed from practical reasoning (D093(f)): its question whether the agent
    can do the action (22.1 CQ4), scoped to the agent (D088).'
  paraphrase: Can P do A?
  answer: 'The proponent, once asked. Against: showing that P cannot do A, which undermines
    possible_bring_about(P,A). For: showing that P can.'
  status: drafted by Claude Code, 2026-11-26
summary:
  text: 'Use it to carry the argument from waste''s conclusion, that an agent ought
    to continue trying to realize a goal, to the recommendation of an action that
    would continue the effort, when the decision is the agent''s (D063: continuing
    binds to the continuing action, not only to its goal). Both are premises its arguer
    supports. It chooses a means for the goal, so practical reasoning''s questions
    test it: a better means, side effects that outweigh the goal, and whether the
    agent can do it (D093).'
  status: drafted by Claude Code, 2026-11-26
contrasts:
- scheme: practical_inference
  text: practical_inference concludes should_be_performed(A) from a goal and a means;
    bridge_from_continuing from waste's conclusion and the premise that A would continue
    the effort, with practical reasoning's questions.
  status: drafted by Claude Code, 2026-11-26
examples:
- text: The council ought to continue trying to build the tram line; renewing the
    works contract would continue that effort; and the decision is the council's.
    So the works contract should be renewed.
  coding: 'P = the council; G = building the tram line; A = renewing the tram works
    contract. Pressed: a challenge of continues_trying(A,G) (The contract is for the
    depot, which the line does not need until year five); walton/realize_more_effectively
    (Tendering the remaining works anew would get the line built sooner and for less);
    walton/bad_outweighs (Renewing it ties the city to the contractor''s overruns
    for ten more years, which matters more than the line). (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: Ravi ought to keep trying to finish his novel; taking another year's sabbatical
    would continue that effort; and the decision is his. So he should take it.
  coding: 'P = Ravi; G = finishing his novel; A = taking another year''s writing sabbatical.
    Pressed: a challenge of deliberating_agent(P,A) (The sabbatical is his employer''s
    to grant, not his to take); walton/possible_bring_about (His employer has already
    refused him a second year). (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: The council should renew the works contract, and it is the one deciding. So
    the contract should be renewed.
  coding: 'Near miss: P = the council; A = renewing the tram works contract. From
    what an agent should do, not from continuing an effort toward a goal: bridge_from_agent.
    (proposal D022-D093)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-26
discrepancies:
- kind: not-in-book
  about: bridge_from_continuing
  detail: 'The compendium (ch. 9) lists no scheme this formalizes. walton.yml cites:
