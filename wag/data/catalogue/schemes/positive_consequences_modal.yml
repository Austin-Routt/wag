examples:
- text: Switching to a four-day week might raise our productivity, so it may be worth
    doing.
  coding: 'A = the firm switching to a four-day week; G = higher productivity at the
    firm. ''Might'': a possible consequence, and a conclusion that keeps the modality.
    Pressed: 33/CQ1 (The trials that reported gains were in firms whose work is done
    at desks; ours is shift work, where no gain has been seen); 33/CQ2 (The claim
    cites one press release, not a trial''s results); 33/CQ3 (Clients would lose a
    weekday of service, and keeping them matters more than higher productivity); walton/too_slight
    (Productivity is already the industry''s best; whatever gain there could be would
    be too small to count); walton/gain_discounted_by_bearer (The staff are deciding,
    and the gain would go to the owners'' profits, not to them). (proposal D008-D074)'
  status: drafted by Claude Code, 2026-11-25
- text: 'Under the claim that there is an afterlife: believing in one might comfort
    people as they die, so it may be worth believing in.'
  coding: 'A = people believing in an afterlife; G = people dying with comfort. A
    reply that raises D074''s objection undercuts this argument''s inference (an undercutter
    of the specific argument, not an exception, as the owner refined D074 on 2026-11-25):
    ''Comfort is a reason to want an afterlife, not a reason to think there is one,
    and the discussion is whether there is.'' (proposal D008-D074)'
  status: drafted by Claude Code, 2026-11-25
- text: Measures such as eco-tariffs and import-related policy can solve this issue.
    Imported meat would need to verifiably meet environmental and animal welfare standards
    and/or needs to pass a sufficiently high tax barrier.
  kialo: "13292.194"
  coding: 'Near miss: A = governments taxing meat with safeguards against cheap imports;
    G = domestic meat producers being protected from cheap imports. ''Can solve''
    says what the measures are able to do when they are taken, a capability, not that
    the result may or may not follow: categorical (the mood rule). The gold codes
    it as the amended action''s positive consequences (action_amendment). (proposal
    D008-D074)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-25
discrepancies:
- kind: partial-link
  about: "33.1"
  detail: 'walton.yml formalizes compendium 33.1 only in part: WAG''s modal variant
    (decision D008, 2026-11-25): the premise in the modal mood, as the book''s questions
    allow (a consequence that will, may or must occur); the conclusion keeps the modality
    and names the consequence, where the book concludes that A should be brought about.
    It meets should_be_performed(A) only through bridge_from_possible_good.'
  decision: 'As decided (D008, proposal D008-D074): the modal premise and the conclusion
    that keeps the modality are WAG''s; the book''s three questions carry over, at
    may_bring_about(A,G) and the outweighing exception.'
  status: drafted by Claude Code, 2026-11-25
- kind: other
  about: D074
  detail: 'The appeal to consequences offered for the truth of a claim (D074, candidate
    C011) has no formula here: it is an undercutter of the specific argument whose
    consequences are offered for the truth of a claim (the owner''s refinement of
    2026-11-25). An exception would name only the action, so proving it against a
    misplaced argument would also defeat a legitimate argument about the same action.'
  decision: 'Done (proposal D008-D074): in annotation a reply that raises the objection
    targets that argument''s inference (docs/kialo-batch2/guidelines.md §3.1, OC18);
    the game asks it from step C5, as a question about the argument itself or a direct
    undercutter.'
  status: drafted by Claude Code, 2026-11-25
