# A scheme of WAG's catalogue (wag/data/catalogue/README.md).
# Source fields (walton, formulas) are regenerated by "wag-cli --catalogue-gen";
# do not edit them here. The game part (game, and the game part of each
# question) is the game's data, which "wag-cli --catalogue-gen" writes the
# game's files from: change it only as a decision says.
# Every other item has a status; set it when you draft, verify or dispute.
id: positive_consequences_modal
name: Argument from Possible Positive Consequences
tier: 2
walton:
  id: positive_consequences_modal
  title: Argument from Possible Positive Consequences
  source: WAG's modal variant of the argument from positive consequences (decision
    D008), after Douglas Walton, A Pragmatic Theory of Fallacy, The University of
    Alabama Press, Tuscaloosa and London, 1995, pp. 155-156, and the questions on
    consequences in Walton, Reed and Macagno, Argumentation Schemes, 2008, pp. 332-333,
    which allow that a consequence will, may or must occur.
formulas:
  variables: [A, G]
  premises:
  - may_bring_about(A,G)
  - good(G)
  exceptions:
  - bad_outweighs(A,G)
  - too_slight(A,G)
  - gain_discounted_by_bearer(A,G)
  conclusions:
  - may_be_worth_performing(A,G)
book:
- entry: "33.1"
  title: Argument from Positive Consequences
  pages: "332"
  parent: "33"
  match: partial
  cqs_printed_under: "33"
  note: 'WAG''s modal variant (decision D008, 2026-11-25): the premise in the modal
    mood, as the book''s questions allow (a consequence that will, may or must occur);
    the conclusion keeps the modality and names the consequence, where the book concludes
    that A should be brought about. It meets should_be_performed(A) only through bridge_from_possible_good.'
  status: generated
families:
- family: F15
  name: Consequences, alternatives, threat and fear
  relation: variant
  note: of positive_consequences in the modal mood (decision D008, 2026-11-25), as
    cause_to_effect_modal is of 28; to negative_consequences_modal a sided flip, not
    a D053 polarity pair (they conclude two predicates)
  status: generated
