  status: generated
critical_questions:
- id: 33/CQ1
  book:
    entry: "33"
    label: CQ1
  targets: [{formula: 'may_bring_about(A,G)', locus: premise}]
  note: 'whether the possibility is real, not merely conceivable: the book''s ''may'''
  paraphrase: Is there a real chance that doing A leads to G, or is it no more than
    conceivable?
  answer: 'The proponent, once asked. Against: reasons why G could not follow from
    A, or only conceivably (no mechanism, no case where it did), which undermines
    may_bring_about(A,G). For: a mechanism, a precedent or evidence that A can lead
    to G. A reply that G is real but slight answers walton/too_slight instead, and
    one that the chance is too small to matter answers the bridge''s premise (docs/kialo-batch2/guidelines.md
    §3.1, OC9, OC15).'
  status: drafted by Claude Code, 2026-11-25
- id: 33/CQ2
  book:
    entry: "33"
    label: CQ2
  targets: [{formula: 'may_bring_about(A,G)', locus: premise}]
  note: no separate evidence formula
  paraphrase: What evidence shows that doing A could lead to G, and is it enough for
    a real possibility?
  answer: 'The proponent, once asked. Against: showing that the evidence offered does
    not show the possibility (an anecdote, a case unlike this one), which undermines
    may_bring_about(A,G). For: evidence enough to make the possibility real: a study,
    a precedent, a known mechanism.'
  status: drafted by Claude Code, 2026-11-25
- id: 33/CQ3
  book:
    entry: "33"
    label: CQ3
  targets: [{formula: 'bad_outweighs(A,G)', locus: exception}]
  note: the sided exception bad_outweighs(A,G), shared with positive_consequences
    (D055)
  paraphrase: Would doing A have bad consequences that matter more than G?
  answer: 'The critic, who raises it with an argument. Against: a claim that a bad
    consequence of A matters more than G, argued with bad_outweighs_good, which concludes
    bad_outweighs(A,G) and undercuts the argument, this one and the categorical one
    about the same A and G alike: the comparison does not depend on how likely G is.
    If the rival consequence is itself only possible, the claim is coded with Other,
    naming candidate C024. A bad consequence that ranks nothing is a rebuttal at the
    bridge''s conclusion. For: a reply that attacks the weighing''s comparison or
    the consequence it relies on (docs/kialo-batch2/guidelines.md §3.1, OC10, OC15).'
  status: drafted by Claude Code, 2026-11-25
- id: walton/too_slight
  targets: [{formula: 'too_slight(A,G)', locus: exception}]
  note: Neither the book nor the game asks it. Since 2026-11-25 walton.yml has it
    as an exception (D065, candidate C005), apart from good(G), so that a real but
    slight consequence is not a denied one. Slight means slight by what bears on the
    decision on A, not merely that G reaches few, is small in number, or seems minor
    to one side; so scoped, it is neutral as to polarity (D053, the owner's declaration
    of 2026-11-25). The game asks it from step C5.
  paraphrase: Granted that doing A could bring about G and that G is good, is G too
    slight a gain to count in deciding on A?
  answer: 'The critic, who raises it with an argument. Against: showing that G, though
    real and good, is too small to weigh in the decision on A (a few minutes saved,
    a trivial convenience), which undercuts the argument through too_slight(A,G);
    a great gain is not slight, however few it reaches. No scheme concludes it: a
    claim that argues it is coded with Other (docs/kialo-batch2/guidelines.md §3.1,
    OC9). For: showing that G is large enough to count: its size, how long it lasts,
    or how much it matters to those it reaches.'
  status: drafted by Claude Code, 2026-11-25
- id: walton/gain_discounted_by_bearer
  targets: [{formula: 'gain_discounted_by_bearer(A,G)', locus: exception}]
  note: 'Neither the book nor the game asks it. Since 2026-11-25 walton.yml has it
    as an exception (D065, candidate C021): the side of an argument for A of the bearer
    pair, whose other side, harm_discounted_by_bearer(A,G), is the negative schemes''
    (a sided flip, D053: who bears a consequence is not neutral between the sides).
    The game asks it from step C5.'
  paraphrase: Who would gain G, and does that make it count for less in deciding on
    A?
  answer: 'The critic, who raises it with an argument. Against: showing that the gain
    goes to those who need it least or have no claim to it (the savings go to well-off
    homeowners), so that it counts for less, which undercuts the argument through
    gain_discounted_by_bearer(A,G); it grants the gain. Coded with Other (docs/kialo-batch2/guidelines.md
    §3.1, OC16). A right or a value that rules A out whatever its consequences is
    not this question (OC5). For: showing that those who gain have a claim to it,
    or that who gains does not matter here.'
  status: drafted by Claude Code, 2026-11-25
summary:
  text: 'WAG''s modal variant of positive consequences (33.1; decision D008, 2026-11-25),
    as cause_to_effect_modal is of 28: from may_bring_about(A,G) and good(G) it concludes
    may_be_worth_performing(A,G), a conclusion that keeps the modality and names the
    consequence. It meets should_be_performed(A) only through bridge_from_possible_good.
    Use it for a claim that doing A may, might, could or can (of possibility) bring
    about a good G (docs/kialo-batch2/guidelines.md §3, the mood of the link; §3.1,
    OC15); the claim''s primary instance is then the bridge. It has the categorical
    scheme''s exceptions: bad_outweighs(A,G), too_slight(A,G) and gain_discounted_by_bearer(A,G).'
  status: drafted by Claude Code, 2026-11-25
contrasts:
- scheme: positive_consequences
  text: The categorical scheme claims that A brings about G (would, will, can of capability);
    the modal variant only that it may (may, might, could, can of possibility), and
    concludes no more than that A may be worth doing for G, which reaches should_be_performed(A)
    through bridge_from_possible_good. The mood is the causal link's; when it cannot
    be told, code the modal variant, which claims less (docs/kialo-batch2/guidelines.md
    §3).
  status: drafted by Claude Code, 2026-11-25
