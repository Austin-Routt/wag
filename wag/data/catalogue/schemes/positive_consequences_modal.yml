- entry: "33.1"
  label: Premise
  formulas: [{formula: 'may_bring_about(A,G)', locus: premise}, {formula: good(G),
      locus: premise}]
  note: the good consequence is named G; 'will plausibly occur' becomes 'may occur'
  status: generated
- entry: "33.1"
  label: Conclusion
  formulas: [{formula: 'may_be_worth_performing(A,G)', locus: conclusion}]
  note: the book's 'A should be brought about', kept modal (D008); the bridge concludes
