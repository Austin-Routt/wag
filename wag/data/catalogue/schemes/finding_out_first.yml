game:
  id: AS:finding_out_first
  backs: ['CQ:worth_finding_out_first']
  nascq:
    carneades_id: finding_out_first
    name: Argument for Finding Out First
    semantic_type: action
    thesis_independent: false
    base_weight: 0.5
    variables:
      A:
        type: action
        description: Action decided on
        example_en: switch to a four-day week
      G:
        type: event
        description: Possible consequence to find out about
        example_en: higher productivity
      I:
        type: entity
        description: Investigation that would settle it
        example_en: a six-month trial in one office
    premise_templates_en:
    - '{I} would settle, reliably enough for the decision, whether doing {A} brings
      about {G}'
    - '{I} can be done before the decision on {A} must be taken'
    - The costs and risks of {I} are worth bearing to know whether doing {A} brings
      about {G} before that possibility counts in the decision
    conclusion_template_en: It is worth finding out first whether doing {A} would
      bring about {G}, and until then that possibility should not count in deciding
      on {A}
    description_en: The answer that a possible consequence should be found out before
      it counts in the decision, since an investigation would settle it in time, reliably
      enough and at a cost worth bearing (D095 (3), on the owner's declaration under
      D053). It defeats both bridges about the same action and consequence. A bare
      claim that the consequence could be found out is not this scheme, and the game
      refuses it at the question.
    cues_en:
    - find out first
    - wait and see
    - a trial
    - a pilot
    - test it first
    - study it first
    evidence: recommended
    evidence_note_en: a source on the investigation, its timing and its cost
    role: answer
  core:
    meta:
      title: Argument for Finding Out First
      source: WAG (D095), after Walton (1998, 2006)
