summary:
  text: 'WAG''s answer scheme (D095 (3), 2026-11-26) for the exception of the two
    bridges of possible consequences, worth_finding_out_first(A,G), on the owner''s
    declaration under D053 (2026-11-25): an investigation I would settle whether A
    brings about G, reliably enough for the decision on A (settles_whether), it can
    be done before the decision on A must be taken (done_in_time), and its costs and
    risks are worth bearing to know first (worth_its_costs); so it is worth finding
    out first, and until then the possibility does not count in the decision. Established,
    the exception defeats both bridges about the same A and G, whichever side argues
    it, and nothing else: not the modal arguments, not a categorical argument, not
    a bridge about another consequence; it does not suspend the decision on A. The
    critic bears the burden, and a tie goes against the critic. Its premises are its
    arguer''s, each challenged as any premise is; it has no question of its own (D075''s
    reasoned none). A reply that only says G could be found out is not this scheme:
    it is coded with Other, and the game refuses it at the question from step C5.2
    (D095 (3)). Not in the compendium; after Walton 1998, p. 203, and 2006, p. 85.'
  status: drafted by Claude Code, 2026-11-26
