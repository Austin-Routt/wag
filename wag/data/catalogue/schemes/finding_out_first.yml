  title: Argument for Finding Out First
  source: 'WAG''s answer scheme (decision D095 (3), 2026-11-26), on the owner''s declaration
    under D053 (2026-11-25) of the bridges'' exception worth_finding_out_first(A,G):
    it concludes the exception from the conditions the declaration names. Not in the
    compendium. After Douglas Walton, The New Dialectic: Conversational Contexts of
    Argument, University of Toronto Press, Toronto, 1998, p. 203 (a shift to information-seeking
    within a critical discussion), and Douglas Walton, Fundamentals of Critical Argumentation,
    Cambridge University Press, Cambridge, 2006, p. 85 (delaying a decision to collect
