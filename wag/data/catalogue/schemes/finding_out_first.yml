- scheme: bridge_from_possible_good
  text: The bridge carries a possible good consequence to the recommendation; this
    scheme concludes its exception, that the possibility should be found out first
    and not count until then. It answers the bridge; it does not deny that G may follow,
    which 33/CQ1 or CQ2 asks of the modal argument.
  status: drafted by Claude Code, 2026-11-26
- scheme: bridge_from_possible_harm
  text: The harm bridge lets a possible harm count against the action now, as a precautionary
    claim does (near miss 'Until we know, no licence'); this scheme argues that the
    possibility should not count until an investigation it names has settled it, in
    time and at a cost worth bearing. The exception it concludes defeats the harm
    bridge and the good bridge about the same A and G alike (D053).
  status: drafted by Claude Code, 2026-11-26
- scheme: harm_reduction
  text: ""
  status: todo
- scheme: ignorance
  text: 'The argument from ignorance concludes that a claim is false because it would
    be known if it were true and is not; in Walton''s account it is the argument of
    the side that says further investigation is not needed (Walton 1996, p. 122).
    This scheme argues the opposite for one possibility: that a particular investigation
    is worth making before the possibility counts in the decision. A reply that a
    study would settle the question answers the argument from ignorance at its exception
    uninvestigated(S); such a reply is an argument of this scheme only when it answers
    a bridge''s exception and makes out its three conditions.'
  status: drafted by Claude Code, 2026-11-26
examples:
- text: A three-month trial in one team would show cheaply, and in time, whether productivity
    rises before the whole firm commits.
  coding: 'Answers walton/worth_finding_out_first of the four-day week, bridged (proposal
    D008-D074''s example), the bridge from a possible good; it concludes that bridge''s
    exception, worth_finding_out_first(A,G). A = the firm switching to a four-day
    week; G = higher productivity at the firm; I = a three-month trial in one team.
    The text names the investigation (the trial), says it is timely and cheap, and
    what it would settle: all three premises are made out, two of them explicitly.
    A critic of the answer challenges one of them. The bridge''s defender need not
    show again that the possibility matters: matters_to_decision is the bridge''s
    premise, not the answer''s. Established, the exception leaves the possible gain
    out of the decision until the trial reports; the firm may still decide, on its
    other arguments. Pressed: a challenge of done_in_time(I,A) (The board votes on
    the new contracts in two weeks; a three-month trial would report after the decision);
    a challenge of settles_whether(I,A,G) (One team of five, in its busiest quarter,
    would tell us little about the firm''s three hundred people). (proposal D095)'
  status: drafted by Claude Code, 2026-11-26
- text: A one-season field study would settle whether the pesticide harms bee colonies
    before next year's licensing round, and it costs a fraction of what a wrong ban
    or a wrong licence would.
  coding: 'Answers walton/worth_finding_out_first of an argument that the pesticide
    may harm bees, so it should not be licensed (the bridge from a possible harm);
    it concludes that bridge''s exception, worth_finding_out_first(A,G). A = the agency
    licensing the pesticide; G = harm to bee colonies; I = a one-season field study.
    Established, the exception leaves the possible harm to bees out of the decision
    on the licence until it is found out; the licence is still decided by the other
    arguments (the declaration). Pressed: a challenge of worth_its_costs(I,A,G) (The
    study would spray the pesticide near a whole region''s hives for a season: it
    risks the very harm it is meant to measure). (proposal D095)'
  status: drafted by Claude Code, 2026-11-26
- text: 'Whether the new anticoagulant would interact with her heart medication can
    be checked with a blood test this afternoon, before tomorrow''s operation, at
    almost no cost or risk: we should find that out before letting the possibility
    decide.'
  coding: 'A = giving the patient the new anticoagulant; G = a dangerous interaction
    with her heart medication; I = a blood test this afternoon. Pressed: a challenge
    of settles_whether(I,A,G) (A standard panel does not detect that interaction;
    only a genetic test would, and it takes a week). (proposal D095)'
  status: drafted by Claude Code, 2026-11-26
- text: Whether a meat tax would cut tax revenue can be estimated from Denmark's fat
    tax records within this budget cycle, and cheaply; that should be settled before
    the possible loss counts for or against the tax.
  coding: 'A = governments putting a tax on meat; G = tax revenues falling; I = an
    estimate from Denmark''s fat tax records. The batch''s 13292.9 argues that the
    tax could reduce revenue (a modal argument and its bridge, D008); this answer
    would be a reply to its bridge. No claim of the batch makes it: the replies to
    13292.9 support the link (13292.12) or weigh it (13292.43). Pressed: a challenge
    of settles_whether(I,A,G) (Denmark''s tax lasted fifteen months and taxed the
    saturated fat of foods above a threshold, meat among them; its records would not
    show what a tax on meat alone would do to revenue); a challenge of done_in_time(I,A)
    (The budget must pass this month, and the estimate would take three). (proposal
    D095)'
  status: drafted by Claude Code, 2026-11-26
- text: No study has found that the pesticide harms bees, and if it did we would know
    by now, so it does not.
  coding: 'Near miss, coded with ignorance: S = the pesticide harms bee colonies.
    An argument from ignorance: it concludes that the link is false from the lack
    of evidence, where finding_out_first concludes that the link should be settled
    before its possibility counts. Its own exception, uninvestigated(S), asks whether
    it was investigated enough; a reply that a study would settle it in time argues
    that exception, for another conclusion than this scheme''s. It is the defensive
    side''s claim that further investigation is not needed (Walton 1996, p. 122).
    (proposal D095)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-26
- text: The pesticide might harm bees, and harm to pollinators matters whatever the
    odds, so it should not be licensed until we know.
  coding: 'Near miss, coded with bridge_from_possible_harm: A = the agency licensing
    the pesticide; G = harm to bee colonies. Precaution, not finding out first: it
    lets the possibility decide against the action now (the bridge from a possible
    harm, with its premise that the chance matters, as today''s rules code a precautionary
    claim; whether precaution is a bridge of its own is candidate C008''s third open
    question). ''Until we know'' does not argue the bridges'' exception: it names
    no investigation, and it asks for the possibility to count, not to be left out
    until settled. (proposal D095)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-26
