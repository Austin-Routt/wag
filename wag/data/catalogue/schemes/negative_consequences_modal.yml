examples:
- text: Taxing meat might force producers to use cheaper and more dangerous means
    of producing meat.
  kialo: "13292.174"
  coding: 'A = governments putting a tax on meat; G = producers using cheaper and
    more dangerous means of producing meat. Its conclusion, that the tax may be unwise
    because of G, meets the thesis only through its bridge (the example ''Cutting
    corners, bridged''). Pressed: 33/CQ1 (Food safety inspections already stop the
    dangerous methods, and a tax does not lift them: the possibility is not real);
    33/CQ3 (The tax''s health and climate gains matter more than any change in how
    producers raise animals). (proposal D008-D074)'
  status: drafted by Claude Code, 2026-11-25
- text: Taxing meat could also result in an unhealthy underconsumption of meat.
  kialo: "13292.121"
  coding: 'A = governments putting a tax on meat; G = an unhealthy underconsumption
    of meat. ''Could also result in'': modal. Pressed: 33/CQ2 (Nobody in the countries
    with such taxes eats too little meat; the claim cites no case); walton/too_slight
    (Eating less meat than one should harms health only mildly where iron and protein
    are easily had from other foods); walton/harm_discounted_by_bearer (It would fall
    on people who choose to give up meat and can take supplements; a harm they choose
    counts for less). (proposal D008-D074)'
  status: drafted by Claude Code, 2026-11-25
- text: 'Under the claim that the universe has no purpose: teaching it might drive
    students to despair, so it may be unwise to teach.'
  coding: 'A = schools teaching that the universe has no purpose; G = students falling
    into despair. A reply that raises D074''s objection undercuts this argument''s
    inference (an undercutter of the specific argument, not an exception, as the owner
    refined D074 on 2026-11-25): ''Whether a view drives students to despair is no
    evidence about whether it is true, and the discussion is whether the universe
    has a purpose.'' (proposal D008-D074)'
  status: drafted by Claude Code, 2026-11-25
- text: If the tax were passed, meat prices would rise.
  coding: 'Near miss: E1 = governments passing a tax on meat; E2 = meat prices rising.
    The cause is only proposed and the link is stated firmly (''would''): a causal
    step of a policy not yet enacted (guidelines §5 item 11), with no evaluation and
    no recommendation. Its modality is on the cause (may_occur), the modal consequence
    schemes'' on the link (may_bring_about). (proposal D008-D074)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-25
discrepancies:
- kind: partial-link
  about: "33.2"
  detail: 'walton.yml formalizes compendium 33.2 only in part: WAG''s modal variant
    (decision D008, 2026-11-25): the premise in the modal mood, as the book''s questions
    allow (a consequence that will, may or must occur); the conclusion keeps the modality
    and names the consequence, where the book concludes that A should not be brought
    about. It meets ¬should_be_performed(A) only through bridge_from_possible_harm.'
  decision: 'As decided (D008, proposal D008-D074): the modal premise and the conclusion
    that keeps the modality are WAG''s; the book''s three questions carry over, at
    may_bring_about(A,G) and the outweighing exception.'
  status: drafted by Claude Code, 2026-11-25
- kind: other
  about: D074
  detail: 'The appeal to consequences offered for the truth of a claim (D074, candidate
    C011) has no formula here: it is an undercutter of the specific argument whose
    consequences are offered for the truth of a claim (the owner''s refinement of
    2026-11-25). An exception would name only the action, so proving it against a
    misplaced argument would also defeat a legitimate argument about the same action.'
  decision: 'Done (proposal D008-D074): in annotation a reply that raises the objection
    targets that argument''s inference (docs/kialo-batch2/guidelines.md §3.1, OC18);
    the game asks it from step C5, as a question about the argument itself or a direct
    undercutter.'
  status: drafted by Claude Code, 2026-11-25
