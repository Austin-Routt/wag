# A scheme of WAG's catalogue (wag/data/catalogue/README.md).
# Source fields are regenerated by "wag-cli --catalogue-gen"; do not edit
# them here: walton and formulas (from walton.yml), game.backs (from
# game/order.yml) and each question's game text (its paraphrase, with the
# scheme's variables in braces). The rest of the game part (game.id,
# game.nascq, game.core, each question's game id, locus and pattern) is the
# game's data, which "wag-cli --catalogue-gen" writes the game's files from:
# change it only as a decision says. Every other item has a status,
# game.status too; set it when you draft, verify or dispute.
id: negative_consequences_modal
name: Argument from Possible Negative Consequences
tier: 2
walton:
  id: negative_consequences_modal
  title: Argument from Possible Negative Consequences
  source: WAG's modal variant of the argument from negative consequences (decision
    D008), after Douglas Walton, A Pragmatic Theory of Fallacy, The University of
    Alabama Press, Tuscaloosa and London, 1995, pp. 155-156, and the questions on
    consequences in Walton, Reed and Macagno, Argumentation Schemes, 2008, pp. 332-333,
    which allow that a consequence will, may or must occur.
game:
  id: AS:negative_consequences_modal
  nascq:
    carneades_id: negative_consequences_modal
    name: Argument from Possible Negative Consequences
    semantic_type: action
    thesis_independent: false
    base_weight: 0.65
    variables:
      A:
        type: action
        description: Action
        example_en: license the pesticide
      G:
        type: event
        description: Bad consequence that may follow
        example_en: harm to bees
    premise_templates_en:
    - Doing {A} may bring about {G}
    - '{G} is bad'
    conclusion_template_en: '{A} may be unwise to do because of {G}'
    description_en: An action may be unwise to do because it may bring about a bad
      consequence. Its conclusion bears on the decision only through the bridge from
      a possible harm, which carries it there when the chance matters enough (D008).
    cues_en:
    - may cause
    - might cause
    - could cause
    - may harm
    - might harm
    - could harm
    - risk of
    - a chance of
    - potential harm
    evidence: recommended
    evidence_note_en: a source showing the action could bring about the consequence
    role: modal
    weighs_as: AS:negative_consequences
  core:
    meta:
      title: Argument from Possible Negative Consequences
      source: WAG (D008), after Walton (1995)
  status: drafted by Claude Code, 2026-11-27
formulas:
  variables: [A, G]
  premises:
  - may_bring_about(A,G)
  - bad(G)
  exceptions:
  - good_outweighs(A,G)
  - too_slight(A,G)
  - harm_discounted_by_bearer(A,G)
  conclusions:
  - may_be_unwise_to_perform(A,G)
book:
- entry: "33.2"
  title: Argument from Negative Consequences
  pages: "332"
  parent: "33"
  match: partial
  cqs_printed_under: "33"
  note: 'WAG''s modal variant (decision D008, 2026-11-25): the premise in the modal
    mood, as the book''s questions allow (a consequence that will, may or must occur);
    the conclusion keeps the modality and names the consequence, where the book concludes
    that A should not be brought about. It meets ¬should_be_performed(A) only through
    bridge_from_possible_harm.'
  status: generated
families:
- family: F15
  name: Consequences, alternatives, threat and fear
  relation: variant
  note: of negative_consequences in the modal mood (decision D008, 2026-11-25); to
    positive_consequences_modal a sided flip, not a D053 polarity pair
  status: generated
premise_map:
- entry: "33.2"
  label: Premise
  formulas: [{formula: 'may_bring_about(A,G)', locus: premise}, {formula: bad(G),
      locus: premise}]
  note: the bad consequence is named G; 'will occur' becomes 'may occur'
  status: generated
- entry: "33.2"
  label: Conclusion
  formulas: [{formula: 'may_be_unwise_to_perform(A,G)', locus: conclusion}]
  note: the book's 'A should not be brought about', kept modal (D008); the bridge
    concludes ¬should_be_performed(A)
  status: generated
critical_questions:
- id: 33/CQ1
  book:
    entry: "33"
    label: CQ1
  game:
    id: CQ:modal_likelihood
    text: Is there a real chance that doing {A} leads to {G}, or is it no more than
      conceivable?
    locus: premise
    pattern: may_bring_about(A,G)
  targets: [{formula: 'may_bring_about(A,G)', locus: premise}]
  note: 'whether the possibility is real, not merely conceivable: the book''s ''may'''
  paraphrase: Is there a real chance that doing A leads to G, or is it no more than
    conceivable?
  answer: 'The proponent, once asked. Against: reasons why G could not follow from
    A, or only conceivably (no mechanism, no case where it did), which undermines
    may_bring_about(A,G). For: a mechanism, a precedent or evidence that A can lead
    to G. A reply that G is real but slight answers walton/too_slight instead, and
    one that the chance is too small to matter answers the bridge''s premise (docs/kialo-batch2/guidelines.md
    §3.1, OC9, OC15).'
  status: drafted by Claude Code, 2026-11-25
- id: 33/CQ2
  book:
    entry: "33"
    label: CQ2
  game:
    id: CQ:modal_evidence
    text: What evidence shows that doing {A} could lead to {G}, and is it enough for
      a real possibility?
    locus: premise
    pattern: may_bring_about(A,G)
  targets: [{formula: 'may_bring_about(A,G)', locus: premise}]
  note: no separate evidence formula
  paraphrase: What evidence shows that doing A could lead to G, and is it enough for
    a real possibility?
  answer: 'The proponent, once asked. Against: showing that the evidence offered does
    not show the possibility (an anecdote, a case unlike this one), which undermines
    may_bring_about(A,G). For: evidence enough to make the possibility real: a study,
    a precedent, a known mechanism.'
  status: drafted by Claude Code, 2026-11-25
- id: 33/CQ3
  book:
    entry: "33"
    label: CQ3
  game:
    id: CQ:good_outweighs
    text: Would doing {A} have good consequences that matter more than {G}?
    locus: exception
    pattern: good_outweighs(A,G)
  targets: [{formula: 'good_outweighs(A,G)', locus: exception}]
  note: the sided exception good_outweighs(A,G), shared with negative_consequences
    (D055)
  paraphrase: Would doing A have good consequences that matter more than G?
  answer: 'The critic, who raises it with an argument. Against: a claim that a good
    consequence of A matters more than G, argued with good_outweighs_bad, which concludes
    good_outweighs(A,G) and undercuts the argument, this one and the categorical one
    about the same A and G alike: the comparison does not depend on how likely G is.
    If the rival consequence is itself only possible, the claim is coded with Other,
    naming candidate C024. A good consequence that ranks nothing is a rebuttal at
    the bridge''s conclusion. For: a reply that attacks the weighing''s comparison
    or the consequence it relies on (docs/kialo-batch2/guidelines.md §3.1, OC10, OC15).'
  status: drafted by Claude Code, 2026-11-25
- id: walton/too_slight
  game:
    id: CQ:too_slight
    text: 'Granted that doing {A} would or could bring about {G}, is {G} too slight
      a consequence to count in deciding on {A}? (Reaching few does not make a consequence
      slight: one weighty gain or harm can decide.)'
    locus: exception
    pattern: too_slight(A,G)
  targets: [{formula: 'too_slight(A,G)', locus: exception}]
  note: The book does not ask it. Since 2026-11-25 walton.yml has it as an exception
    (D065, candidate C005), apart from bad(G), so that a real but slight consequence
    is not a denied one. Slight means slight by what bears on the decision on A, not
    merely that G reaches few, is small in number, or seems minor to one side; so
    scoped, it is neutral as to polarity (D053, the owner's declaration of 2026-11-25).
    The game asks it since step C5.2 (CQ:too_slight).
  paraphrase: 'Granted that doing A would or could bring about G, is G too slight
    a consequence to count in deciding on A? (Reaching few does not make a consequence
    slight: one weighty gain or harm can decide.)'
  answer: 'The critic, who raises it with an argument. Against: showing that G, though
    real and bad, is too small to weigh in the decision on A (a burden as small as
    a change of diet, 13292.25), which undercuts the argument through too_slight(A,G);
    a grave harm is not slight, however few it reaches. No scheme concludes it: a
    claim that argues it is coded with Other (docs/kialo-batch2/guidelines.md §3.1,
    OC9). For: showing that G is large enough to count: its size, how long it lasts,
    or how much it matters to those it reaches.'
  status: drafted by Claude Code, 2026-11-27
- id: walton/harm_discounted_by_bearer
  game:
    id: CQ:harm_discounted
    text: On whom would {G} fall, and does that make it count for less in deciding
      on {A}?
    locus: exception
    pattern: harm_discounted_by_bearer(A,G)
  targets: [{formula: 'harm_discounted_by_bearer(A,G)', locus: exception}]
  note: 'The book does not ask it. Since 2026-11-25 walton.yml has it as an exception
    (D065, candidate C021): the side of an argument against A of the bearer pair,
    whose other side, gain_discounted_by_bearer(A,G), is the positive schemes'' (a
    sided flip, D053: that a cost falls on the polluters who cause the harm discounts
    it as a harm and is the very reason it is a gain). The game asks it since step
    C5.2 (CQ:harm_discounted).'
  paraphrase: On whom would G fall, and does that make it count for less in deciding
    on A?
  answer: 'The critic, who raises it with an argument. Against: showing that the harm
    falls on those who cause what A is meant to remedy (the cost falls on the producers
    whose farms cause the harm the tax is for), so that it counts for less, which
    undercuts the argument through harm_discounted_by_bearer(A,G); it grants the harm.
    Coded with Other (docs/kialo-batch2/guidelines.md §3.1, OC16). A right or a value
    that rules A out whatever its consequences is not this question (OC5). For: showing
    that those it falls on have no part in what A remedies, or that on whom it falls
    does not lessen it here.'
  status: drafted by Claude Code, 2026-11-25
summary:
  text: 'WAG''s modal variant of negative consequences (33.2; decision D008, 2026-11-25):
    from may_bring_about(A,G) and bad(G) it concludes may_be_unwise_to_perform(A,G),
    a conclusion that keeps the modality and names the consequence. It meets ¬should_be_performed(A)
    only through bridge_from_possible_harm. Use it for a claim that doing A may, might,
    could or can (of possibility) bring about a bad G, a possible consequence for
    the agent''s own goals included, since 33.3 has no modal variant (name 33.3 in
    notes); the claim''s primary instance is then the bridge (docs/kialo-batch2/guidelines.md
    §3; §3.1, OC15). It has the categorical scheme''s exceptions: good_outweighs(A,G),
    too_slight(A,G) and harm_discounted_by_bearer(A,G).'
  status: drafted by Claude Code, 2026-11-25
contrasts:
- scheme: positive_consequences
  text: ""
  status: todo
- scheme: negative_consequences
  text: The categorical scheme claims that A brings about G (would, will, can of capability);
    the modal variant only that it may (may, might, could, can of possibility), and
    concludes no more than that A may be unwise because of G, which reaches ¬should_be_performed(A)
    through bridge_from_possible_harm. The mood is the causal link's; when it cannot
    be told, code the modal variant, which claims less (docs/kialo-batch2/guidelines.md
    §3).
  status: drafted by Claude Code, 2026-11-25
- scheme: negative_consequences_reasoning
  text: '33.3 argues from a consequence that is bad for the agent''s own goals, and
    has no modal variant (D008 names 33.1 and 33.2): a possible consequence for the
    agent''s own goals is coded with negative_consequences_modal and its bridge, with
    33.3 named in notes (docs/kialo-batch2/guidelines.md §3.1, OC15).'
  status: drafted by Claude Code, 2026-11-25
