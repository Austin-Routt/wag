specialises:
  scheme: negative_consequences
  note: 'families.json (F15) makes it a subtype of 33.2: the action is the agent''s
    own and the outcome is bad by the agent''s goals. Since 2026-10-22 it has the
    same conclusion, ¬should_be_performed(A), and the same exception, so the two meet
    the same arguments for A.'
  status: drafted by Claude Code, 2026-10-22
dialogue_types:
  proper: [deliberation, persuasion, negotiation]
  suspect: [inquiry]
  note: 'As for negative_consequences, from ND via docs/dialogue-types.md §7: arguments
    from consequences belong to deliberation (ND pp. 157–60), including the solitary
    deliberation in which one person looks for the bad consequences of a course of
    action by playing devil''s advocate (p. 152), which is this scheme''s first-person
    setting. Used against a thesis about what is true, it is ad consequentiam (pp.
    176–7). Negotiation, where a party may reject an option because it would harm
    its own goals, persuasion about what to do, and inquiry are our extrapolation
    (ND p. 116 speaks of the other party''s goals, the threat setting).'
  status: drafted by Claude Code, 2026-10-22
