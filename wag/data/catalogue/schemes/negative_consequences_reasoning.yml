id: negative_consequences_reasoning
name: Argument From Consequences - Reasoning From Negative Consequences
tier: 1
walton:
  id: negative_consequences_reasoning
  title: Argument From Consequences - Reasoning From Negative Consequences
  source: 'Douglas Walton, A Pragmatic Theory of Fallacy. Tuscaloosa and London: University
    of Alabama Press, 1995. pp. 155-156. Douglas Walton, Scare Tactics. Dordrecht:
    Kluwer, 2000, p. 123.'
formulas:
  variables: [A, B]
  premises:
  - agent_bring_about(A,B)
  - bad_for_goals(B)
  exceptions:
  - other_consequences(A)
  conclusions:
  - ¬should_be_performed(A)
