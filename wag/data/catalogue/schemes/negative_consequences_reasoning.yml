dialogue_types:
  proper: [deliberation, persuasion, negotiation]
  suspect: [inquiry]
  note: 'As for negative_consequences, from ND via docs/dialogue-types.md §7: arguments
    from consequences belong to deliberation (ND pp. 157–60), including the solitary
    deliberation in which one person looks for the bad consequences of a course of
    action by playing devil''s advocate (p. 152), which is this scheme''s first-person
    setting. In negotiation ND treats arguments from negative consequences for the
    other party''s goals as relevant (p. 116). Used against a thesis about what is
    true, it is ad consequentiam (pp. 176–7). Persuasion (about what to do) and inquiry
    are our extrapolation, as for negative_consequences.'
  status: drafted by Claude Code, 2026-10-22
