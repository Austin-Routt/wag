critical_questions:
- id: 33/CQ1
  book:
    entry: "33"
    label: CQ1
  targets: [{formula: 'agent_bring_about(A,B)', locus: premise}]
  note: Shared with positive_consequences and negative_consequences, whose paraphrase
    says G for this scheme's B. The book's question also allows for the strength the
    arguer claims (that B will, may or must follow); the paraphrase asks for the likelihood
    whatever strength is claimed.
  paraphrase: How likely is it that doing A would actually lead to B?
  answer: 'The proponent, once asked. Against: reasons why B is unlikely to follow
    from A, or would follow only under conditions this case lacks, which undermines
    agent_bring_about(A,B). For: a record, a known mechanism or a forecast showing
    that actions like A reliably produce outcomes like B.'
  status: drafted by Claude Code, 2026-10-22
- id: 33/CQ2
  book:
    entry: "33"
    label: CQ2
  targets: [{formula: 'agent_bring_about(A,B)', locus: premise}]
  note: No separate evidence formula, so the question targets the premise the evidence
    would support. Shared with positive_consequences and negative_consequences (G
    there for B here).
  paraphrase: What evidence shows that doing A would lead to B, and is it strong enough
    for the confidence with which the claim is made?
  answer: 'The proponent, once asked. Against: showing that the evidence for the link
    is missing, anecdotal, or weaker than the claim needs (a firm "will" backed only
    by a "might"), which undermines agent_bring_about(A,B). For: studies, precedents
    or a known mechanism that support the link as strongly as it is claimed.'
  status: drafted by Claude Code, 2026-10-22
- id: 33/CQ3
  book:
    entry: "33"
    label: CQ3
  targets: [{formula: not_bring_about(A), locus: conclusion}]
  note: 'Counter-argument from the opposite consequences; no formula of this scheme
    encodes it, so it targets the conclusion, as for positive_consequences and negative_consequences.
    No walton.yml scheme concludes the negation of not_bring_about(A): a positive_consequences
    argument concludes should_be_performed(A), which does not formally meet it (see
    the discrepancy on the conclusion).'
  paraphrase: Would doing A also have consequences of the opposite kind to B that
    ought to be weighed against it?
  answer: 'The critic, who raises it with an argument. Against: a consequence of A
    that serves the agent''s goals, put forward as a counter-argument for doing A,
    which rebuts the argument when it outweighs B. For: showing that A has no such
    consequence, or that B outweighs it.'
  status: drafted by Claude Code, 2026-10-22
summary:
  text: 'Use it when an agent weighs an action of its own: bringing about A would
    lead to an outcome B that would harm the agent''s own goals, so the agent had
    better not bring A about. It is the first-person, goal-relative form of negative_consequences
    (compendium 33.3), and concludes not_bring_about(A), the predicate threat also
    concludes, rather than ¬should_be_performed(A).'
  status: drafted by Claude Code, 2026-10-22
contrasts:
- scheme: positive_consequences
  text: 'The opposite polarity, and not first-person: choose positive_consequences
    when an action is recommended for a good result. walton.yml has no first-person
    positive form, so an agent''s case for its own action from a good result is also
    coded positive_consequences.'
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_consequences
  text: Choose negative_consequences_reasoning when an agent reasons about its own
    action and the outcome is bad by that agent's goals ("if I do this, it defeats
    what I am after"); choose negative_consequences when an action, such as a policy,
    is judged by an outcome that is bad in general terms. In a policy debate prefer
    negative_consequences, whose conclusion meets the pros on should_be_performed(A).
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_consequences_prudential
  text: Choose negative_consequences_prudential when the bad outcome would follow
    from not acting, and the arguer warns someone who was considering not doing A
    that they ought to do it; choose negative_consequences_reasoning when the bad
    outcome would follow from doing A. The book's parenthetical "don't bring about"
    reading of 33.3 is close to the prudential form (see the discrepancy on Premise
    1).
  status: drafted by Claude Code, 2026-10-22
- scheme: pragmatic_alternative
  text: Choose pragmatic_alternative when the text sets up an either-or addressed
    to the hearer (do A, or B follows); choose negative_consequences_reasoning when
    an agent rejects one of its own options for a result that would harm its goals.
  status: drafted by Claude Code, 2026-10-22
- scheme: threat
  text: Both conclude not_bring_about(A). Choose threat when the speaker undertakes
    to cause the bad outcome if the hearer acts; choose negative_consequences_reasoning
    when the agent itself foresees the bad outcome of its own action and no one undertakes
    to cause it.
  status: drafted by Claude Code, 2026-10-22
- scheme: ad_baculum
  text: 'Not a close relative: the disjunctive threat demands an action of the hearer
    on pain of a harm the speaker will cause, while this scheme is an agent''s own
    reasoning about a bad result of its action.'
  status: drafted by Claude Code, 2026-10-22
- scheme: fear
  text: Choose fear when the argument works on the hearer's fear and presents one
    action as the only way to avert something very bad; choose negative_consequences_reasoning
    when the agent states, as a matter of its own goals, that an action's result would
    set them back.
  status: drafted by Claude Code, 2026-10-22
- scheme: danger
  text: Choose danger when someone argues that an action would put the hearer at risk
    of serious harm; choose negative_consequences_reasoning when the agent rejects
    its own action because the result would harm its goals, whether or not anyone
    is in danger.
  status: drafted by Claude Code, 2026-10-22
- scheme: slippery_slope_base_case
  text: Choose a slippery slope when the bad outcome is reached through a graduated
    chain of steps; choose negative_consequences_reasoning when the agent's own action
    leads to the bad result directly.
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_reasoning2
  text: In the book's account (p. 101), practical reasoning starts from a goal and
    looks for the action, while reasoning from consequences starts from the action
    and judges it by its outcome. Choose practical_reasoning2 when an action is argued
    for as the way to reach a goal; choose negative_consequences_reasoning when an
    action is argued against because its result would harm the agent's goals.
  status: drafted by Claude Code, 2026-10-22
examples:
- text: If I take the night shift I'll be asleep when my kids leave for school, and
    seeing them off is half of why I took this job. So I won't take it.
  coding: 'A = taking the night shift; B = missing the children before school. Stated:
    agent_bring_about(A,B), and bad_for_goals(B) (seeing them off is one of the speaker''s
    aims). Conclusion: not_bring_about(A). The agent is the speaker; no formula names
    it.'
  status: drafted by Claude Code, 2026-10-22
- text: 'We''d better not open a second shop this year: the loan would tie up the
    cash we need to keep the first one going.'
  coding: 'A = opening a second shop this year; B = the cash the first shop needs
    being tied up in the loan. Stated: agent_bring_about(A,B), and bad_for_goals(B)
    (the owners'' goal of keeping the first shop going). Conclusion: not_bring_about(A).'
  status: drafted by Claude Code, 2026-10-22
- text: A sin tax on meat would make food more expensive, despite many people not
    being able to afford it.
  kialo: "13292.7"
  coding: 'Near miss: the action is a public policy and the outcome is bad in general
    terms, not by the goals of the agent who would act; negative_consequences (A =
    a tax on meat, G = food becoming unaffordable for many), as the gold codes it.'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
discrepancies:
- kind: book-walton
  about: Premise 1
  detail: The book's first premise has a parenthetical reading in which it is not
    bringing A about that leads to B. agent_bring_about(A,B) covers only doing A.
    The conclusion as printed has no matching reading, so the parenthetical case would
    need the opposite conclusion (bring A about).
  decision: 'No change to the formulas. Code that case with negative_consequences_prudential
    when it is a warning to someone considering not acting; otherwise bind A to the
    omission and say so in the coding. Open: whether the parenthetical is meant to
    license the omission case at all, given the unchanged conclusion.'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: Conclusion
  detail: The book's conclusion is first-person and qualified as practical ("practically
    speaking"). walton.yml's not_bring_about(A) has no agent, and its template, shared
    with threat, reads as advice to a second person ("you had better not").
  decision: 'No change for now: read not_bring_about(A) as the agent''s own practical
    conclusion about its own action, and name the agent in the coding. See the other
    discrepancy on the conclusion for the predicate itself.'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: agent
  detail: 'The book names the reasoner ("I, an agent") and judges B by that agent''s
    goals. Neither formula has an agent variable: agent_bring_about(A,B) has none
    despite its name, and bad_for_goals(B) speaks of "the agent''s goals" without
    saying whose.'
  decision: No change. The agent is the arguer unless the text says otherwise; the
    coding names it. A variable for the agent would matter only if the catalogue had
    to tell two agents' goals apart.
  status: drafted by Claude Code, 2026-10-22
- kind: other
  about: conclusion
  detail: not_bring_about(A) is not the negation of should_be_performed(A), the conclusion
    of positive_consequences and the practical-reasoning schemes. An argument of this
    scheme and one for the same action therefore do not rebut each other, and 33/CQ3's
    counter-argument cannot formally meet it.
  decision: 'Open, for the owner: conclude ¬should_be_performed(A), as negative_consequences
    does, or keep the predicate the upstream block has. We recommend ¬should_be_performed(A),
    so that the scheme can take part in the same weighing of pros and cons. Until
    then, code cons in policy debates with negative_consequences (batch-2 guidelines
    §3).'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: CQ1-CQ2
  detail: The book's first two questions allow the consequences to be claimed with
    different strengths (will, may, must). agent_bring_about(A,B) has no modality.
  decision: 'No change for now, as for positive_consequences and negative_consequences:
    code a hedged claim with the formula, say so in the coding, and treat the weaker
    link as a reason to answer 33/CQ1 against it.'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: CQ3
  detail: 33/CQ3 asks whether consequences of the opposite kind should be weighed.
    walton.yml has no formula for it here, while it encodes the same question as the
    exception other_consequences(X) in negative_consequences_prudential.
  decision: 'The catalogue targets the conclusion, as for the other two forms. Open:
    whether walton.yml should give the consequence schemes the exception other_consequences(A),
    as it does the prudential scheme.'
  status: drafted by Claude Code, 2026-10-22
- kind: other
  about: upstream
  detail: The scheme comes from the second block with the id negative_consequences
    in the upstream category file A_reasoning/3_practical-reasoning.yml (line 511),
    which has an empty variable list and templates that repeat the book's premises.
    walton.yml gives it a new id, the variables [A,B], and templates in our own words.
  decision: 'No change: the owner''s decision of 2026-10-22, recorded in docs/scheme-registry/walton-clean/CHANGELOG.md
    ("Added by the owner''s decision").'
  status: drafted by Claude Code, 2026-10-22
