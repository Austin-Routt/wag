dialogue_types:
  proper: [deliberation, persuasion]
  suspect: [inquiry]
  note: 'Not in ND''s table (docs/dialogue-types.md §7); our extrapolation. A value
    bears on what to aim at, so the scheme belongs where goals are argued over: deliberation,
    where ND notes that judgments of relative worth are common (p. 155), and persuasion
    about what to do, which is the setting of the two Bench-Capon papers the book
    cites for it. It is suspect in inquiry, where it would be offered as a reason
    to accept a proposition as true, by analogy with ND''s account of ad consequentiam
    (pp. 176–7).'
  status: drafted by Claude Code, 2026-10-22
