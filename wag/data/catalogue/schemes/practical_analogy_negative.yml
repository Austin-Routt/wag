classification:
  source: independent
  reasoning: practical
  epistemic: ""
  group: values
  note: 'Not in the tree; placed with values (values, fairness), as practical_analogy_positive
    is, because its premise and its conclusion are verdicts on whether an action is
    wrong, not claims about goals, means or consequences. Its analogical form would
