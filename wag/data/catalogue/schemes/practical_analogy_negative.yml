critical_questions:
- id: walton/difference_for
  targets: [{formula: 'difference_for(A1,A2,X2)', locus: exception}]
  note: 'No book question asks it: the book prints no questions for 8.1 or 8.2. The
    exception is analogy''s difference question, given to its practical counterpart
    (D028), and sided: a difference that tells in favour of taking X2 here undercuts
    this argument, while one against it undercuts the positive practical analogy instead,
    so that when both argue from one past situation each side''s difference defeats
    only the other (D053).'
  paraphrase: Do the two situations differ in a way that tells in favour of taking
    this course here?
  answer: 'The critic, who raises it with an argument. Against: a feature of the present
    situation, absent from A1, that removes what made X1 wrong there (the banks failed
    through a pandemic, not reckless lending), which undercuts the argument through
    difference_for(A1,A2,X2). For: showing that the differences do not bear on X2,
    or that they count against it too.'
  status: drafted by Claude Code, 2026-10-22
summary:
  text: Use it when an action X2 is argued against in a situation A2 because the corresponding
    action X1 was the wrong course in an earlier situation A1 that resembles A2. What
    crosses from one situation to the other is a verdict that an action was wrong
    (a mistake, unethical), and the conclusion, that X2 should not be performed, rebuts
    practical reasoning and the positive consequence and practical analogy arguments
    about the same action. That sets it apart from analogy, which carries over any
    other claim, and from negative_consequences, which judges the action by its own
    consequences.
  status: drafted by Claude Code, 2026-10-22
contrasts:
- scheme: analogy
  text: 'The choice with analogy: a practical analogy cites the source for a verdict
    that an action taken there was right or wrong, whatever the word, and concludes
    that verdict on the corresponding action here; any other claim carried over is
    analogy. A deontic status that is not a verdict on doing something, such as having
    no obligation (Kialo 5637.341), is analogy; a verdict on forcing someone to act
    (5637.14071) is this scheme.'
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_inference
  text: Choose practical_inference when the argument is about whether X is a means
    to a goal; choose practical_analogy_negative when X is opposed because it was
    wrong in a similar situation, whatever goal it served there.
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_analogy_positive
  text: 'The counterpart, with the same form: they conclude contradictories about
    the same action, so they rebut each other and Carneades weighs them. Choose the
    negative form when the earlier action is cited as a mistake, to argue against
    repeating it, and the positive form when it is cited as the right course, to argue
    for repeating it.'
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_consequences
  text: Choose negative_consequences when X is opposed because of bad outcomes it
    would bring here; choose practical_analogy_negative when it is opposed because
    doing X in a similar earlier situation was judged wrong. "It went badly when they
    tried it" can be either; code practical_analogy_negative when the text leans on
    the likeness of the situations, and negative_consequences when it leans on the
    outcome.
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_reasoning2
  text: Choose practical_reasoning2 when the argument is whether X serves a goal in
    the present circumstances; choose practical_analogy_negative when X is opposed
    because doing it in a similar situation was wrong.
  status: drafted by Claude Code, 2026-10-22
examples:
- text: Bailing out the banks in 2008 was wrong, since it rewarded reckless lenders.
    This crisis is like 2008, so the banks should not be bailed out.
  coding: 'A1 = the 2008 banking crisis; A2 = this banking crisis; X1 = bailing out
    the banks in 2008; X2 = bailing out the banks now. Conclusion: ¬should_be_performed(X2).
    A critic raises difference_for(A1,A2,X2): this crisis came from a pandemic, not
    reckless lending; that defeats this argument only, not the positive one from the
    same situation. The stated reason for the base premise (it rewarded reckless lenders)
    can back wrong_to_do(A1,X1) only through Other: no scheme concludes it.'
  status: drafted by Claude Code, 2026-10-22
- text: Just as you cannot force a mother to donate an organ or blood to her child,
    you cannot force her to use her body to carry a foetus, even if that foetus is
    technically under her care.
  kialo: "5637.14071"
  coding: 'A1 = a child''s need for an organ that only its mother can give; A2 = a
    foetus''s need for its mother''s body to live; X1 = forcing the mother to give
    the organ; X2 = forcing the mother to carry the pregnancy. "Cannot force" sits
    between a permission (she may refuse: analogy) and a verdict that forcing her
    would be wrong; read as the verdict, carried over, it is this scheme. A challenge
    of corresponds(X1,X2): refusing to give an organ leaves the child as it was; ending
    a pregnancy acts against the foetus. It replies to 5637.11606, so in a game it
    is a defence of the parent''s analogy.'
  status: drafted by Claude Code, 2026-10-22
- text: In the 2021 storm, evacuating a day early was the wrong call, because the
    roads flooded before the town did. This storm is like that one, so we should not
    evacuate early.
  coding: 'A1 = the 2021 storm; A2 = this storm; X1 = evacuating the low town a day
    early in 2021; X2 = evacuating the low town a day early now. Conclusion: ¬should_be_performed(X2),
    the contradictory of a positive practical analogy from the 2019 flood; the two
    rebut each other.'
  status: drafted by Claude Code, 2026-10-22
- text: Closing Northfield's school was the wrong decision, and Southfield is in the
    same position, so merging its school with the next one would be wrong as well.
  coding: 'A1 = Northfield when its school was threatened; A2 = Southfield now that
    its school is threatened; X1 = closing Northfield''s school; X2 = merging Southfield''s
    school with the next one. A challenge of corresponds(X1,X2): merging keeps the
    building open as a branch, so it is not the counterpart of closing.'
  status: drafted by Claude Code, 2026-10-22
- text: Closing the village school would make the children travel ten miles a day,
    so it should not be done.
  coding: 'Near miss: no other situation is cited; the action is judged by its own
    consequence; negative_consequences.'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
- text: Only regimes we would never want to resemble ban books from school libraries,
    so we should not ban them.
  coding: 'Near miss: rejected because of who does it, not because it was wrong in
    a like situation; from_antimodel.'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
