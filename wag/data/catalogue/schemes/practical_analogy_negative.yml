    the owner prefers. It is closest to fairness, which also asks that like cases
    be treated alike.'
  status: drafted by Claude Code, 2026-10-22
specialises:
  scheme: ""
  note: 'Specialises nothing: the book presents it as the practical counterpart of
    argument from analogy (ch. 2, p. 74), not a subtype. It shares analogy''s vocabulary
    (similar_to, corresponds and a difference exception) but carries a verdict on
    an action and concludes that the action should not be performed.'
  status: drafted by Claude Code, 2026-10-22
dialogue_types:
  proper: [deliberation, persuasion]
  suspect: []
  note: Not in ND's table, and ND does not discuss it; our extrapolation, as for practical_analogy_positive.
    It answers "what should we not do?", so it belongs in deliberation (ND pp. 151–7)
    and in persuasion about an action. In negotiation, an appeal to what was wrong
    in a like case works as the independent standard that ND says lies outside the
    normative model of negotiation (p. 102); we list negotiation in neither list.
  status: drafted by Claude Code, 2026-10-22
