critical_questions:
- id: walton/means_good_outweighs
  targets: [{formula: 'means_good_outweighs(X,Y)', locus: exception}]
  note: 'Borrowed from the consequence schemes (D023), as for end_and_means_1, the
    other way round: 33/CQ3 asks of negative consequences whether good ones outweigh
    them.'
  paraphrase: Does X have good consequences that matter more than the bad end Y?
  answer: 'The critic, who raises it with an argument. Against: good consequences
    of the means X that matter more than the harm of its end Y, which undercuts the
    argument through means_good_outweighs(X,Y). For: showing that they are smaller
    than the end''s harm.'
  status: drafted by Claude Code, 2026-11-26
summary:
  text: 'Use it when a means is judged bad because the end it serves is bad: X is
    the means to the end Y, Y is bad, so X is bad (the negative reading of 22.6.1,
    D022). It evaluates the means; a text that concludes that an action should not
    be done for a bad consequence is negative_consequences.'
  status: drafted by Claude Code, 2026-11-26
contrasts:
- scheme: practical_inference
  text: practical_inference argues forward from a goal to the action that realizes
    it and recommends the action; end_and_means_bad judges a means by the badness
    of its end and recommends nothing.
  status: drafted by Claude Code, 2026-11-26
examples:
- text: Rigging the vote is the means to keeping a corrupt mayor in office, and that
    is bad. So rigging the vote is bad.
  coding: 'X = rigging the vote; Y = keeping a corrupt mayor in office. The negative
    reading of 22.6.1 (D022); it borrows negative consequences'' question of the opposite
    value (D023). Pressed: walton/means_good_outweighs (It is the only way to stop
    the council selling the park, which matters more than who is mayor). (proposal
    D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: Selling the field is the means to opening the casino, which would be bad for
    the town. So selling the field is bad.
  coding: 'X = selling the field; Y = a casino opening in the town. Pressed: walton/means_good_outweighs
    (The sale would pay for the new school, which matters more than the casino''s
    harm). (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: Selling the field would bring a casino to the town, which is bad. So the town
    should not sell it.
  coding: 'Near miss: A = the town selling the field; G = a casino in the town. A
    recommendation against an action for its consequence: negative consequences, not
    the evaluation of a means by its end. (proposal D022-D093)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-26
