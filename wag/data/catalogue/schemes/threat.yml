examples:
- text: 'If you build the extension, I will take you to court over the boundary. I
    can: my deeds cover that strip. And I tell you now that I will sue if you build.
    So you had better not build it.'
  coding: 'X = building the extension; C = a lawsuit over the boundary. Pressed: a
    challenge of position_to_bring_about(C) (The land registry shows the strip on
    your neighbour''s title, not yours: you have nothing to sue on). (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: If management cuts the night shift, the union will strike. We have the votes
    to call one, and we are telling you now that we will. So management had better
    not cut it.
  coding: 'X = management cutting the night shift; C = a strike. The speaker undertakes
    to bring about the consequence (D060: position_to_bring_about(C), and assert_bad(X,C)
    printed C first). Pressed: a challenge of assert_bad(X,C) (The union''s own rules
    need a ballot after the cut is announced; the leadership cannot promise a strike
    in advance). (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: If management cuts the night shift, no one will watch the boilers at night,
    and sooner or later one will explode. An explosion is a danger to everyone in
    the plant, managers included. So management should not cut it.
  coding: 'Near miss: X = management cutting the night shift; Y = an unwatched boiler
    exploding at night. A warning, not a threat: the speaker does not undertake to
    bring about the consequence. (proposal D022-D093)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-26
