dialogue_types:
  proper: [inquiry, persuasion, deliberation]
  suspect: []
  note: Not in ND's table; our extrapolation, from the guide's rule for epistemic
    schemes. In an inquiry a single case can suggest a rule at the discovery stage
    but cannot establish it (ND pp. 97–8); in persuasion and deliberation it is a
    common way of giving a general claim some support. Generalizing from an untypical
    case is a misuse in any type, and 6.1/CQ3 and CQ5 are the questions that catch
    it.
  status: drafted by Claude Code, 2026-10-22
