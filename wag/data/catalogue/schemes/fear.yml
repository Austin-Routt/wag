examples:
- text: If you don't get the brakes fixed before the trip, you could crash on the
    mountain descent. That would be terrible for you, and you ought to avoid it if
    you can; fixing the brakes is the only way. Get them fixed.
  coding: 'X = getting the brakes fixed before the trip; Y = a crash on the mountain
    descent. Pressed: a challenge of only_way_prevent(Y,X) (You could take the valley
    road and avoid the descent altogether); a challenge of not_do_appear(X,Y) (The
    garage checked them last week; they are worn but within the limits). (proposal
    D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: If you don't back up your thesis, one disk failure will wipe out two years
    of work. Losing it would be a disaster for you, and you should prevent that if
    you can; a backup is the only way. Back it up.
  coding: 'X = backing up the thesis files; Y = losing two years of thesis work. Since
    2026-11-26 the conclusion is the recommendation itself, should_be_performed(X),
    which an argument from negative consequences against backing up would meet. Pressed:
    a challenge of not_do_appear(X,Y) (The university''s server already keeps nightly
    copies of the thesis folder). (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: A meat tax would make food less affordable for the poor.
  kialo: "13292.7"
  coding: 'Near miss: A = governments putting a tax on meat; G = food becoming less
    affordable for the poor. A bad consequence of the action, with no appeal to the
    respondent''s fear and no claim that acting is the only way to avoid it: negative
    consequences, not fear. The gold''s coding. (proposal D022-D093)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-26
