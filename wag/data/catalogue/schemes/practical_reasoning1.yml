# A scheme of WAG's catalogue (wag/data/catalogue/README.md).
# Source fields are regenerated by "wag-cli --catalogue-gen"; do not edit
# them here: walton and formulas (from walton.yml), game.backs (from
# game/order.yml) and each question's game text (its paraphrase, with the
# scheme's variables in braces). The rest of the game part (game.id,
# game.nascq, game.core, each question's game id, locus and pattern) is the
# game's data, which "wag-cli --catalogue-gen" writes the game's files from:
# change it only as a decision says. Every other item has a status,
# game.status too; set it when you draft, verify or dispute.
id: practical_reasoning1
name: Argument from Value-Based Practical Reasoning
tier: 1
walton:
  id: practical_reasoning1
  title: Argument from Value-Based Practical Reasoning
  source: Atkinson, K., and Bench-Capon, T. J. M. Practical reasoning as presumptive
    argumentation using action based alternating transition systems. Artificial Intelligence
    171, 10-15 (2007), 855–874.
game:
  id: AS:practical_reasoning
  nascq:
    carneades_id: practical_reasoning1
    name: Practical Reasoning
    semantic_type: action
    thesis_independent: false
    base_weight: 0.7
    variables:
      A:
        type: action
        description: Action to be performed
        example_en: introduce a carbon tax
      S1:
        type: state
        description: Current circumstances
        example_en: emissions are rising
      S2:
        type: state
        description: Future state after action
        example_en: lower emissions
      G:
        type: goal
        description: Goal to be realized
        example_en: a stable climate
      V:
        type: value
        description: Value promoted by the goal
        example_en: public health
      P:
        type: agent
        description: Agent who would take the action
        example_en: the city council
    premise_templates_en:
    - One of the goals of {P} is {G}
    - The current situation is {S1}
    - Doing {A} in the situation {S1} would lead to {S2}
    - The goal {G} would be achieved in {S2}
    - Achieving {G} would promote the value {V}
    conclusion_template_en: '{A} should be done'
    description_en: An agent should do an action because, in the current circumstances,
      it brings about a state that realizes one of the agent's goals, which promotes
      a value.
    cues_en:
    - should
    - ought to
    - we must
    - in order to
    - so that
    - goal
    - aim
    - achieve
    - promote
    - policy
    - plan to
    evidence: ""
    evidence_note_en: ""
  core:
    meta:
      title: Argument from Value-Based Practical Reasoning
      source: Atkinson & Bench-Capon (2007)
  status: generated
formulas:
  variables: [A, S1, S2, G, V, P]
  premises:
  - goal_of_agent(P,G)
  - current_circumstances(S1)
  - would_bring_about(A,S1,S2)
  - would_be_realized(G,S2)
  - would_promote_value(G,V)
  assumptions:
  - legitimate_value(V)
  - worthy_goal(G)
  - possible_bring_about(P,A)
  exceptions:
  - bring_about_more_effectively(P,S2,A)
  - realize_more_effectively(P,G,A)
  - promote_more_effectively(P,V,A)
  - bad_outweighs(A,G)
  - incompatible_goal(P,G)
  conclusions:
  - should_be_performed(A)
book:
- entry: "22.4"
  title: Value-Based Practical Reasoning
  pages: "324"
  parent: "22"
  match: partial
  note: Same name ("Value-Based Practical Reasoning") but another source and structure
    (Atkinson & Bench-Capon 2007, action-based alternating transition systems). WAG
    AS:practical_reasoning uses this id.
  status: generated
families:
- family: F09
  name: Values and sacrifice
  relation: related
  note: uses values (also in F10)
  status: generated
- family: F10
  name: Practical reasoning
  relation: variant
  note: value-based; walton.yml version from Atkinson & Bench-Capon 2007; WAG AS:practical_reasoning
  status: generated
premise_map:
- entry: "22.4"
  label: Premise 1
  formulas: [{formula: 'goal_of_agent(P,G)', locus: premise}]
  note: the agent's goal (D005, since 2026-11-24)
  status: generated
- entry: "22.4"
  label: Premise 2
  formulas: [{formula: 'would_promote_value(G,V)', locus: premise}]
  status: generated
- entry: "22.4"
  label: Premise 3
  formulas: [{formula: 'would_bring_about(A,S1,S2)', locus: premise}, {formula: 'would_be_realized(G,S2)',
      locus: premise}]
  note: necessary/sufficient condition replaced by "A in S1 brings about S2, in which
    G is realized"
  status: generated
- entry: "22.4"
  label: Conclusion
  formulas: [{formula: should_be_performed(A), locus: conclusion}]
  status: generated
critical_questions:
- id: 22.4/CQ1
  book:
    entry: "22.4"
    label: CQ1
  game:
    id: CQ:other_goals
    text: Is there another goal of {P} that {G} itself would clash with?
    locus: exception
    pattern: incompatible_goal(P,G)
  targets: [{formula: 'incompatible_goal(P,G)', locus: exception}]
  note: Conflicting goals. Since 2026-11-24 (D004) practical_reasoning1 has the exception
    incompatible_goal(P,G), as practical_reasoning2 has, scoped to the agent and the
    goal; until then the question targeted the conclusion, as the game's CQ:other_goals
    did until step C5.2, which asks it at the exception. Ch. 9 asks which goals might
    conflict; ch. 3's list asks which should come first (p. 96), the derived question
    derived/other_goals_priority. See the discrepancies on CQ1 and on the game's questions.
  paraphrase: Is there another goal of P that G itself would clash with?
  answer: 'The critic, who raises it with an argument. Against: another goal of P
    that G itself clashes with and that matters as much or more, which undercuts the
    argument through incompatible_goal(P,G). A goal that the means sets back is a
    consequence of the means, argued as a rebuttal or a weighing (22.4/CQ7). For:
    showing that P has no such goal, or that G can be pursued without giving the others
    up.'
  status: drafted by Claude Code, 2026-11-24
- id: 22.4/CQ2
  book:
    entry: "22.4"
    label: CQ2
  targets: [{formula: 'would_promote_value(G,V)', locus: premise}]
  note: 'Values. Corrected targets: dropped legitimate_value(V), which links.json
    also gave. The book takes V as the agent''s own values and asks only how well
    G fits them; whether V is a legitimate value is walton.yml''s separate assumption,
    asked by walton/legitimate_value.'
  paraphrase: How far do the agent's values V support G, or at least fit with it?
  answer: 'The proponent, once asked. Against: showing that achieving G does not advance
    V, or works against it, which undermines would_promote_value(G,V). For: showing
    how achieving G advances V.'
  status: drafted by Claude Code, 2026-10-22
- id: 22.4/CQ3
  book:
    entry: "22.4"
    label: CQ3
  game:
    id: CQ:other_means
    text: 'Could {P} realize {G} more effectively by another action than {A}: more
      surely, sooner or at lower cost?'
    locus: exception
    pattern: realize_more_effectively(P,G,A)
  targets: [{formula: 'realize_more_effectively(P,G,A)', locus: exception}]
  note: Alternatives. The exception needs an action that realizes G more effectively;
    since 2026-11-24 it names the agent (D089), and the answer scheme better_means
    concludes it (D075). An alternative that is merely as good is no reason against
    A (D006). See the discrepancy on the game's questions.
  paraphrase: 'Could P realize G more effectively by another action than A: more surely,
    sooner or at lower cost?'
  answer: 'The critic, who raises it with an argument. Against: another action open
    to P that would realize G more surely, sooner or at lower cost than A, argued
    with better_means, which concludes realize_more_effectively(P,G,A) and so undercuts
    the argument; its goal premise is this argument''s own, and it records which comparison
    it makes. An action that is merely as good answers nothing (D006). For: a reply
    that attacks better_means'' premises: that P cannot take the other action, that
    it does not reach G, or that it does no better.'
  status: drafted by Claude Code, 2026-11-24
- id: 22.4/CQ4
  book:
    entry: "22.4"
    label: CQ4
  game:
    id: CQ:best_means
    text: Of {A} and the other actions open to {P}, which would achieve {G}, or reach
      {S2}, most surely, soonest or at least cost?
    locus: exception
    pattern: bring_about_more_effectively(P,S2,A)
  targets: [{formula: 'realize_more_effectively(P,G,A)', locus: exception}, {formula: 'bring_about_more_effectively(P,S2,A)',
      locus: exception}]
  note: Efficiency, in realizing G or in reaching S2; both exceptions name the agent
    since 2026-11-24 (D089).
  paraphrase: Of A and the other actions open to P, which would achieve G, or reach
    S2, most surely, soonest or at least cost?
  answer: 'The critic, who raises it with an argument. Against: an action open to
    P that would reach S2, or realize G, more surely, sooner or at lower cost than
    A, which undercuts the argument through bring_about_more_effectively(P,S2,A) or
    realize_more_effectively(P,G,A); the second is argued with better_means (D075),
    the first with Other until it has an answer scheme. For: a comparison showing
    that A is the most efficient of P''s options.'
  status: drafted by Claude Code, 2026-11-24
- id: 22.4/CQ5
  book:
    entry: "22.4"
    label: CQ5
  targets: [{formula: 'promote_more_effectively(P,V,A)', locus: exception}]
  note: Best by values. The book weighs the options against the agent's whole set
    of values; walton.yml compares them on the one value V, for the agent P since
    2026-11-24 (D089). See the discrepancy on V.
  paraphrase: Could P serve V more effectively by another action than A?
  answer: 'The critic, who raises it with an argument. Against: an action open to
    P that would promote V more than A does, which undercuts the argument through
    promote_more_effectively(P,V,A); no answer scheme concludes it yet, so it is argued
    with Other. For: showing that no alternative does more for V than A.'
  status: drafted by Claude Code, 2026-11-24
- id: 22.4/CQ6
  book:
    entry: "22.4"
    label: CQ6
  game:
    id: CQ:possibility
    text: Can {P} actually do {A}?
    locus: premise
    pattern: possible_bring_about(P,A)
  targets: [{formula: 'possible_bring_about(P,A)', locus: assumption}]
  note: 'Possibility: that P can do A (D088, since 2026-11-24). The game asks it at
    the premise; possible_bring_about(P,A) is an assumption of walton.yml, and both
    put the burden on the proponent.'
  paraphrase: Can P actually do A?
  answer: 'The proponent, once asked. Against: showing that A is beyond P''s means,
    powers or authority in the circumstances S1, which undermines possible_bring_about(P,A).
    For: evidence that P has the resources and the standing to do A, such as a plan
    or a precedent.'
  status: drafted by Claude Code, 2026-11-24
- id: 22.4/CQ7
  book:
    entry: "22.4"
    label: CQ7
  game:
    id: CQ:bad_outweighs
    text: Would doing {A} have bad consequences that matter more than {G}?
    locus: exception
    pattern: bad_outweighs(A,G)
  targets: [{formula: 'bad_outweighs(A,G)', locus: exception}]
  note: 'Since 2026-11-24 (D070, D091) the exception is the claim that A''s bad consequences
    outweigh G, D055''s formula. The book asks only about consequences that outweigh
    G; walton.yml''s side_effects(A,S1), whose template spoke of side effects which
    demote some value, let any of them defeat the argument (WAG''s reading of the
    source''s exception, Walton and Gordon 2015, p. 515). The question has two routes
    (docs/kialo-batch2/guidelines.md §3.1): a bad consequence that ranks nothing is
    a rebuttal, negative_consequences at the conclusion (OC2); a claim that it matters
    more than G argues the exception, with bad_outweighs_good (OC3, OC4).'
  paraphrase: Would doing A have bad consequences that matter more than G?
  answer: 'The critic, who raises it with an argument. Against: a claim that a bad
    consequence of A matters more than G, argued with bad_outweighs_good, which concludes
    bad_outweighs(A,G) and undercuts the argument; a bad consequence that ranks nothing
    is argued as negative_consequences, a rebuttal at the conclusion, weighed by the
    scheme weights. For: a reply that attacks the weighing''s comparison or the consequence
    it relies on (docs/kialo-batch2/guidelines.md §3.1, OC10).'
  status: drafted by Claude Code, 2026-11-27
- id: walton/worthy_goal
  targets: [{formula: worthy_goal(G), locus: assumption}]
  note: Neither the book nor the game asks it. The premise map linked the book's first
    premise (the agent has G) to this assumption, as an approximation, until 2026-11-24,
    when goal_of_agent(P,G) came to state it (D005); see the discrepancy on Premise
    1.
  paraphrase: Is G a goal worth pursuing?
  answer: 'The proponent, once asked. Against: showing that G is trivial, harmful
    or not the agent''s proper concern, which undermines worthy_goal(G). For: reasons
    why G deserves to be pursued, such as the value V it serves.'
  status: drafted by Claude Code, 2026-11-24
- id: walton/legitimate_value
  targets: [{formula: legitimate_value(V), locus: assumption}]
  note: Neither the book nor the game asks it; 22.4/CQ2 asks how well G fits V, not
    whether V is legitimate.
  paraphrase: Is V a value that may properly count in this decision?
  answer: 'The proponent, once asked. Against: showing that V is not a value the parties
    accept, or should carry no weight here (a private advantage presented as a value),
    which undermines legitimate_value(V). For: showing that V is widely held or recognised
    in the setting, such as public health or fairness.'
  status: drafted by Claude Code, 2026-10-22
- id: game/CQ:side_effect
  game:
    id: CQ:side_effect
    text: Would doing {A} also bring about something bad?
    locus: conclusion
  targets: [{formula: should_be_performed(A), locus: conclusion}]
  note: 'The game''s rebuttal route of 22.4/CQ7 (D095 (1)), as on positive_consequences:
    it asks, at the conclusion, for a further bad consequence of A, argued as negative_consequences
    and weighed by the scheme weights (docs/kialo-batch2/guidelines.md §3.1, OC2).
    A claim that the consequence matters more than G is 22.4/CQ7''s exception, bad_outweighs(A,G).
    No backup edge lets negative_consequences back this question (D009; the owner''s
    question 1 in docs/c5-game.md), so such an argument is played as a direct rebuttal.'
  paraphrase: Would doing A also bring about something bad?
  answer: 'The critic, who raises it with an argument. Against: a bad consequence
    of A, played as a rebuttal of the conclusion; the weights decide between it and
    the argument. In the game the answer is backed by expert_opinion, position_to_know
    or sign; an argument from negative consequences against A is played as a direct
    rebuttal instead. A claim that the bad consequence matters more than G answers
    22.4/CQ7. For: showing that A has no such consequence.'
  status: drafted by Claude Code, 2026-11-27
- id: derived/other_goals_priority
  derived:
    source: Walton, Reed and Macagno 2008
    chapter: "3"
    page: "96"
    name: Other-Goals Question
  targets: []
  note: 'D007: the compendium (ch. 9) is the catalogue''s authority, and ch. 3''s
    further questions are kept as derived questions. Ch. 3''s list asks which other
    goals should have priority, a ranking of goals that no formula of the scheme encodes;
    22.4/CQ1 asks instead whether G clashes with another goal of P. Before step C5.2
    the game''s CQ:other_goals asked in ch. 3''s terms; the game does not ask this
    question.'
  paraphrase: Has P another goal that should come before G in deciding on A, its achievement
    being worth more?
  answer: 'The critic, who raises it with an argument for the other goal. No formula
    of the scheme ranks goals: a goal that should come first is argued as practical
    reasoning from it against A, a rebuttal, or as a bad consequence of A that matters
    more than G (22.4/CQ7); a goal that G itself clashes with is 22.4/CQ1''s exception.
    For: showing that G comes first in this decision, or that A serves the other goal
    too.'
  status: drafted by Claude Code, 2026-11-27
summary:
  text: Use it when an action A is recommended because, in the present circumstances
    S1, doing A would lead to a state S2 in which a goal G is met, and achieving G
    promotes a value V. The value premise sets it apart from practical_reasoning2,
    which argues from the goal alone, and from positive_value, which supports a goal
    by a value without reaching an action.
  status: drafted by Claude Code, 2026-10-22
contrasts:
- scheme: positive_value
  text: positive_value concludes only that a value V is a reason to keep a goal G;
    it reaches no action. Choose practical_reasoning1 when the text goes on to an
    action whose result meets G; choose positive_value when it argues only that a
    value makes a goal worth holding (13292.43 can be read so; the gold codes it as
    a weighing, with good_outweighs_bad since 2026-11-24).
  status: drafted by Claude Code, 2026-11-24
- scheme: negative_value
  text: 'negative_value weighs a goal by a value judged negative, and reaches no action.
    Choose practical_reasoning1 when the text recommends an action because its result
    meets a goal that promotes V. A value that the action would harm is a consequence
    of the action: a weighing at practical_reasoning1''s exception bad_outweighs(A,G)
    when it is claimed to matter more than G, otherwise a separate negative_consequences
    argument; not negative_value.'
  status: drafted by Claude Code, 2026-11-24
- scheme: sacrifice
  text: 'Not a close relative: sacrifice infers that a thing has great value from
    the great sacrifice made for it, and concludes no action. A text that urges going
    on because of what has already been given up is waste or sunk_costs, not practical_reasoning1.'
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_inference
  text: practical_inference is the book's basic goal-means scheme (22.1), with no
    value and no circumstances. Choose practical_reasoning1 when the text names the
    value V that the goal serves as well as the means; choose practical_inference
    when it gives only the goal and the means.
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_reasoning2
  text: practical_reasoning2 has the same circumstances, transition and goal, without
    the value. Choose practical_reasoning1 only when the text, or its immediate context,
    names the value V that achieving G promotes; otherwise practical_reasoning2 (batch-2
    guidelines, §3).
  status: drafted by Claude Code, 2026-10-22
- scheme: positive_consequences
  text: Choose positive_consequences when the claim says only that A brings about
    something good; choose practical_reasoning1 when it states the present circumstances,
    a resulting state in which a goal is met, and the value that goal promotes.
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_consequences
  text: Choose negative_consequences when a bad result of A is offered against doing
    A; as a reply to a practical_reasoning1 argument for the same A it is a rebuttal
    at the conclusion, and a claim that it matters more than G argues the exception
    bad_outweighs(A,G), with bad_outweighs_good (D070, D091). Choose practical_reasoning1
    only when the text argues for an action from circumstances, a goal and the value
    it serves.
  status: drafted by Claude Code, 2026-11-24
examples:
- text: Commuters on the east side now spend an hour in traffic each way. A protected
    bike lane on Main Street would let many of them cycle instead, which would cut
    congestion, and less congestion means cleaner air for everyone. The city should
    build the lane.
  coding: 'P = the city; S1 = east-side commuters spend an hour in traffic; A = build
    a protected bike lane on Main Street; S2 = many commuters cycle; G = less congestion;
    V = clean air (public health). Stated: current_circumstances(S1), would_bring_about(A,S1,S2),
    would_be_realized(G,S2), would_promote_value(G,V). Supplied: goal_of_agent(P,G).
    Conclusion: should_be_performed(A).'
  status: drafted by Claude Code, 2026-11-24
- text: The library is shut on Saturdays, the only day many working parents can bring
    their children. Opening on Saturdays would let those children borrow books too,
    and every child should have the same chance to read.
  coding: 'P = the library; S1 = the library is closed on Saturdays; A = open the
    library on Saturdays; S2 = working parents'' children can borrow books; G = every
    child has access to the library; V = equal opportunity. Stated: current_circumstances(S1),
    would_bring_about(A,S1,S2), would_promote_value(G,V) (the last clause). Supplied:
    would_be_realized(G,S2), goal_of_agent(P,G). Conclusion: should_be_performed(A),
    left implicit.'
  status: drafted by Claude Code, 2026-11-24
- text: Tax revenue is not the primary reason to tax meat; there are other, more pressing
    issues, such as sustainability or animal welfare.
  kialo: "13292.43"
  coding: 'Near miss: it names values behind taxing meat, but no circumstances, no
    resulting state and no goal met in it. Read as a value argument it is positive_value
    (V = sustainability and animal welfare, G = taxing meat); the gold codes it as
    a weighing against 13292.9''s exception, with good_outweighs_bad since 2026-11-24
    (D064, D075; Other before). The gold sets practical_reasoning1 aside because three
    of its premises would have to be supplied.'
  near_miss: true
  status: drafted by Claude Code, 2026-11-24
discrepancies:
- kind: partial-link
  about: "22.4"
  detail: 'walton.yml formalizes compendium 22.4 only in part: Same name ("Value-Based
    Practical Reasoning") but another source and structure (Atkinson & Bench-Capon
    2007, action-based alternating transition systems). WAG AS:practical_reasoning
    uses this id.'
  decision: Keep the partial link. The book's 22.4 (a goal, values supporting it,
    a necessary or sufficient means) and Atkinson and Bench-Capon's scheme share the
    value premise and the conclusion. The catalogue reads the book's premises and
    questions onto walton.yml's formulas through the premise map and the targets,
    and records the gaps below. The game plays this scheme as AS:practical_reasoning.
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: CQ1
  detail: 22.4/CQ1 asks about the agent's other goals that conflict with G. practical_reasoning1
    had no formula for it; practical_reasoning2 had the exception incompatible_goal(G).
  decision: 'Done: decision D004 (2026-11-24; proposal D004-D075) gave practical_reasoning1
    the exception incompatible_goal(P,G), practical_reasoning2''s predicate scoped
    to the agent and the goal in both schemes; 22.4/CQ1 targets it, and the game''s
    CQ:other_goals will at step C5. A goal that the means sets back is a consequence
    of the means (22.4/CQ7).'
  status: drafted by Claude Code, 2026-11-24
- kind: book-walton
  about: Premise 1
  detail: The book's first premise says that the agent has the goal G. No formula
    said so; links.json mapped it, as an approximation, to the assumption worthy_goal(G),
    which says that G is worth pursuing, a different and evaluative claim.
  decision: 'Done: decision D005 (2026-11-24; proposal D004-D075) added the premise
    goal_of_agent(P,G), the schemes library''s predicate, to which links.json and
    the premise map link Premise 1; worthy_goal(G) and legitimate_value(V), which
    no book question asks about, keep their walton/ questions. The conclusion stays
    should_be_performed(A) (D059, D063).'
  status: drafted by Claude Code, 2026-11-24
- kind: book-walton
  about: Premise 3
  detail: 'The book''s means premise says that A is needed for G, or enough for it.
    walton.yml splits it into would_bring_about(A,S1,S2) and would_be_realized(G,S2),
    which say that A would lead to a state in which G is met: the sufficient reading
    only. The circumstances S1 have no basis in 22.4.'
  decision: No change. Code a text that says A is needed for G with this scheme when
    it names a value, and record the necessity in the coding; practical_necessary_condition
    encodes necessity but has no value premise.
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: V
  detail: In the book V is the agent's set of values, and CQ5 weighs the options against
    all of them; in walton.yml V is one value, and promote_more_effectively(P,V,A)
    compares the options on that value alone (for the agent P since 2026-11-24).
  decision: 'No change. Bind V to the value the text names; another value is raised
    as a consequence of A: a weighing at bad_outweighs(A,G) when it is claimed to
    matter more than G, or a separate argument (since 2026-11-24; until then through
    side_effects(A,S1)).'
  status: drafted by Claude Code, 2026-11-24
- kind: book-walton
  about: burden of the questions
  detail: 'In ch. 3 the book says that asking any of the questions it lists for practical
    reasoning defeats the argument, at least for a time, until the proponent answers
    (p. 96): each question shifts the burden to the proponent. walton.yml makes the
    alternatives, efficiency, values and side-effects questions exceptions, which
    the critic must prove.'
  decision: 'Decided 2026-11-22 (D003): The questions stay exceptions, the critic''s
    to support. Who must answer a question that is asked is a rule of the dialogue
    (the request, its answer, and what holds while it is pending), set by the game''s
    question protocol with D075, not by turning exceptions into assumptions. Not yet
    applied. Before: The catalogue follows walton.yml''s roles, as the game does (docs/game-rules.md
    §2), and the answers say so. open: the owner''s decision whether these questions
    should shift the burden when asked, which would make them assumptions.'
  status: drafted by Claude Code, 2026-10-22
- kind: other
