  epistemic: ""
  group: position to know
  status: drafted by Claude Code, 2026-10-22
specialises:
  scheme: position_to_know
  note: 'The tree places witness testimony under position to know, and the book sets
    the two side by side (pp. 88–91): the witness reports a fact or event W perceived,
    and the scheme adds the truth-telling premise (believes(W,S)) and the consistency
    and bias questions. Its formulas keep position_to_know''s premises (with in_domain''s
    arguments reversed); in place of the exception dishonest(W), sincerity is a premise.'
  status: drafted by Claude Code, 2026-10-22
dialogue_types:
  proper: [persuasion, inquiry]
  suspect: []
  note: The book (p. 90, not ND) says witness testimony belongs above all to the courtroom.
    ND likens the criminal trial to a persuasion dialogue governed by its own rules
    of evidence (pp. 232–4), and has public inquiries gather the testimony of witnesses
    at their first stage (p. 92). We list persuasion (the trial) and inquiry (the
    public inquiry). Questioning the witness is information-seeking inside these,
    and deliberation is not the scheme's home (the book gives deliberation to position_to_know,
    p. 90); both are our reading. No type makes it suspect as such.
  status: drafted by Claude Code, 2026-10-22
