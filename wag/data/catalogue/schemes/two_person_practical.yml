id: two_person_practical
name: Two Person Practical Reasoning
tier: 2
walton:
  id: two_person_practical
  title: Two Person Practical Reasoning
  source: 'Douglas Walton, Appeal to Expert Opinion. University Park: Pennsylvania
    State University Press. 1997 p. 163.'
formulas:
  variables: [A, B, X, "Y"]
  premises:
  - tells_intend(A,X,B)
  - situation_necessity(B,Y,X,A)
  assumptions:
  - possible_bring_about(A,Y)
  exceptions:
  - realize_more_effectively(A,X,Y)
  - incompatible_goal(A,X)
  - bad_outweighs(Y,X)
  conclusions:
  - should_do(A,Y)
book:
- entry: "23"
  title: Two-Person Practical Reasoning
  pages: 325-326
  match: exact
  note: Same title and source (Appeal to Expert Opinion 1997, p. 163). Since 2026-11-26
    four of its five questions are in practical reasoning's formulas (D093) and it
    concludes should_do(A,Y) (D063).
  status: generated
families:
- family: F10
  name: Practical reasoning
  relation: context-specific
  note: advice dialogue
  status: generated
premise_map:
- entry: "23"
  label: Premise 1
  formulas: [{formula: 'tells_intend(A,X,B)', locus: premise}]
  status: generated
- entry: "23"
  label: Premise 2
  formulas: [{formula: 'situation_necessity(B,Y,X,A)', locus: premise}]
  status: generated
- entry: "23"
  label: Conclusion
  formulas: [{formula: 'should_do(A,Y)', locus: conclusion}]
  note: '''unless he has better reasons not to'' is the exceptions'' and the questions''
    work; names the agent, so bridge_from_agent carries it to should_be_performed(Y)
    (D063)'
  status: generated
critical_questions:
- id: 23/CQ1
  book:
    entry: "23"
    label: CQ1
  targets: [{formula: 'incompatible_goal(A,X)', locus: exception}]
  note: a conflicting goal, practical reasoning's formula
  paraphrase: Does A have another goal, perhaps more important, that the goal X works
    against?
  answer: 'The critic, who raises it with an argument. Against: another goal of A,
    perhaps more important, that X works against, which undercuts the advice through
    incompatible_goal(A,X). For: showing that the goals fit together, or that X comes
    first.'
  status: drafted by Claude Code, 2026-11-26
- id: 23/CQ2
  book:
    entry: "23"
    label: CQ2
  targets: [{formula: 'realize_more_effectively(A,X,Y)', locus: exception}]
  note: alternative means read as a better means, scoped to the agent (D089); under
    the premise's necessary reading an alternative no better denies the premise that
    Y is necessary, and is an attack on that premise, not on the advice (D090, D006)
  paraphrase: Is there a way for A to realize X more surely, sooner or at lower cost
    than doing Y?
  answer: 'The critic, who raises it with an argument. Against: a way for A to realize
    X more surely, sooner or at lower cost than the advised Y, which undercuts the
    advice through realize_more_effectively(A,X,Y). For: showing that Y is the best
    way open to A.'
  status: drafted by Claude Code, 2026-11-26
- id: 23/CQ3
  book:
    entry: "23"
    label: CQ3
  targets: [{formula: 'bad_outweighs(Y,X)', locus: exception}]
  note: 'the side effect that outweighs: WAG''s reading (D070, D091)'
  paraphrase: Would doing Y have side effects that matter more than X?
  answer: 'The critic, who raises it with an argument. Against: side effects of doing
    Y that matter more than X, which undercuts the advice through bad_outweighs(Y,X).
    For: showing that they are smaller than X, or avoidable.'
  status: drafted by Claude Code, 2026-11-26
- id: 23/CQ4
  book:
    entry: "23"
    label: CQ4
  targets: [{formula: 'possible_bring_about(A,Y)', locus: assumption}]
  note: scoped to the agent (D088)
  paraphrase: Can A do Y?
  answer: 'The proponent, once asked. Against: showing that A cannot do Y, which undermines
    possible_bring_about(A,Y). For: showing that A can.'
  status: drafted by Claude Code, 2026-11-26
- id: 23/CQ5
  book:
    entry: "23"
    label: CQ5
  targets: []
  undercuts: true
  note: 'no formula, an undercutting question (D093): under the premise''s necessary
    reading another required step is no reason against the advised one'
  paraphrase: Would A have to do other things besides Y to realize X?
  answer: 'The critic, who raises it with an argument. Against: other actions A would
    have to take besides Y, where the advice claims that Y is enough to realize X,
    which undercuts the advice; where it claims that Y is needed, another required
    step is no reason against Y (D093). For: showing that Y is enough, or that the
    other actions are in hand.'
  status: drafted by Claude Code, 2026-11-26
