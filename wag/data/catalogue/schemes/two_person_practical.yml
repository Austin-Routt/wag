examples:
- text: Lena tells her coach she wants to run a marathon in the spring. As the coach
    sees it, building up to sixty kilometres a week is necessary for that, and he
    tells her so. So Lena should build up to sixty kilometres a week, unless she has
    better reasons not to.
  coding: 'A = Lena; B = her coach; X = running a marathon in the spring; Y = building
    up to sixty kilometres a week. Pressed: 23/CQ1 (She also wants to finish her degree
    in the spring, and the training would take the evenings it needs); 23/CQ2 (Fewer,
    longer runs get runners like her to a first marathon with less risk); 23/CQ3 (Her
    knee would flare up; months without running matter more than one race); 23/CQ4
    (She works double shifts; she cannot run sixty kilometres a week). (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: Sam tells his accountant he wants to open a second shop next year. As the
    accountant sees it, paying off the van loan first is necessary for that, and she
    tells him so. So Sam should pay off the van loan first.
  coding: 'A = Sam; B = his accountant; X = opening a second shop next year; Y = paying
    off the van loan first. It concludes should_do(A,Y) (D063); its exceptions are
    practical reasoning''s formulas (D093). Pressed: 23/CQ4 (The loan has a penalty
    for paying it off early that Sam cannot cover this year). (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: Saving each month contributes to opening a second shop, and that is Sam's
    goal. So Sam should save each month.
  coding: 'Near miss: P = Sam; X = saving each month; G = opening a second shop. One
    person''s reasoning, with no advisor who tells the agent what the goal needs:
    the argument from goal, not two-person practical reasoning. (proposal D022-D093)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-26
