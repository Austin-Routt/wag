id: bridge_from_agent
name: From What an Agent Should Do to the Action (bridge)
tier: 2
walton:
  id: bridge_from_agent
  title: From What an Agent Should Do to the Action (bridge)
  source: 'WAG''s bridge (decision D063, refined 2026-11-22; D093): an explicit warrant,
    with a premise its arguer supports, from a conclusion that names an agent, should_do(P,A),
    to the recommendation should_be_performed(A), when it falls to P to decide whether
    to go ahead with A. Not in the compendium.'
formulas:
  variables: [P, A]
  premises:
  - should_do(P,A)
  - deliberating_agent(P,A)
  conclusions:
  - should_be_performed(A)
book: []
families:
- family: F10
  name: Practical reasoning
  relation: related
  note: 'a bridge (decision D063, 2026-11-26): from a conclusion that names an agent,
    should_do(P,A), to should_be_performed(A), with deliberating_agent(P,A) (D093)'
  status: generated
premise_map: []
critical_questions: []
summary:
  text: 'Use it to carry a conclusion that names an agent, that P should do A (practical_goal,
    two_person_practical, sunk_costs_precommitment, from_model), to the recommendation
    that A should be performed, when the decision whether to go ahead with A is P''s
    (D063). That it is P''s is a premise its arguer supports, not an exception presumed
    (D093); the annotation check holds A to be P''s action in the case record. It
    asks no question of its own (D075''s reasoned none): it chooses no means, and
    the argument it carries has its own questions.'
  status: drafted by Claude Code, 2026-11-26
contrasts:
- scheme: practical_inference
  text: practical_inference concludes should_be_performed(A) from a goal and a means;
    bridge_from_agent concludes it from another argument's conclusion that an agent
    should do A, and the premise that the decision is the agent's.
  status: drafted by Claude Code, 2026-11-26
examples:
- text: Maya should walk to school, and it is Maya's to decide whether she walks.
    So walking to school should be done.
  coding: 'P = Maya; A = walking to school. The bridge carries the argument from goal''s
    conclusion to the recommendation only with deliberating_agent(P,A), its arguer''s
    premise (D063''s refinement). Pressed: a challenge of deliberating_agent(P,A)
    (Her parents decide how she gets to school, not Maya). (proposal D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: Lena should build up to sixty kilometres a week, and it is hers to decide.
    So building up to sixty kilometres a week should be done.
  coding: 'P = Lena; A = building up to sixty kilometres a week. Pressed: a challenge
    of should_do(P,A) (The coach''s advice is answered: her knee rules it out). (proposal
    D022-D093)'
  status: drafted by Claude Code, 2026-11-26
- text: Walking to school may be worth doing for the exercise, and the chance of that
    is large enough to matter. So walking to school should be done.
  coding: 'Near miss: A = walking to school; G = more exercise. A bridge from a possible
    consequence (D008), not from what an agent should do. (proposal D022-D093)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-26
discrepancies:
- kind: not-in-book
  about: bridge_from_agent
  detail: 'The compendium (ch. 9) lists no scheme this formalizes. walton.yml cites:
    WAG''s bridge (decision D063, refined 2026-11-22; D093): an explicit warrant,
    with a premise its arguer supports, from a conclusion that names an agent, should_do(P,A),
    to the recommendation should_be_performed(A), when it falls to P to decide whether
    to go ahead with A. Not in the compendium.'
