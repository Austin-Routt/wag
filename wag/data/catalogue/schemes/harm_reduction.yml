  decision: WAG's scheme (D072, candidate C022), in walton.yml since 2026-11-25 (proposal
    D008-D074); its premises are scoped to the action, and its exceptions are the
    owner's. The steering form ("it is coming anyway, so shape it") is not covered.
  status: drafted by Claude Code, 2026-11-25
