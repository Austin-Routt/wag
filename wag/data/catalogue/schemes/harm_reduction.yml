examples:
- text: People will take drugs at the festival whether or not it offers pill testing.
    Free pill testing would make each time less dangerous. The festival should offer
    it.
  coding: 'A = the festival offering free pill testing; E = people taking drugs at
    the festival. Pressed: walton/preventable_otherwise (Searches at the gate would
    stop most of the drugs coming in: the festival can prevent the drug taking, not
    only make it safer); walton/no_net_reduction (A clean test tells people a pill
    is safe, so more of them would take one, and the harm overall would grow); a challenge
    of less_harmful_per_occurrence(A,E) (The tests miss the most dangerous adulterants,
    so they make no occasion safer). (proposal D008-D074)'
  status: drafted by Claude Code, 2026-11-25
- text: Teenagers will drink at parties whether or not schools teach them safe limits.
    Teaching the limits would make each time less harmful, so schools should teach
    them.
  coding: 'A = schools teaching teenagers safe drinking limits; E = teenagers drinking
    at parties. Pressed: a challenge of happens_anyway(A,E) (These parties are supervised
    by parents and dry: the teenagers do not drink at them, lessons or no lessons);
    walton/no_net_reduction (Talk of ''safe limits'' tells them that drinking is expected;
    more of them would start, and the harm overall would grow). (proposal D008-D074)'
  status: drafted by Claude Code, 2026-11-25
- text: If the council paid for a hot lunch for every primary pupil, no child would
    start the afternoon hungry.
  coding: 'Near miss: A = the council paying for a hot lunch for every primary pupil;
    G = no primary pupil starting the afternoon hungry. Hunger is not an outcome that
    happens whether or not the lunch is paid for: the lunch prevents it. That is positive
    consequences of the lunch, with the hunger''s not happening as G. (proposal D008-D074)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-25
