id: harm_reduction
name: Argument from What Happens Anyway (harm reduction)
tier: 2
walton:
  id: harm_reduction
  title: Argument from What Happens Anyway (harm reduction)
  source: 'WAG''s scheme (decision D072, refined 2026-11-25; candidate C022), not
    in the compendium: an outcome that happens whether or not the action is done,
    made less harmful each time by the action.'
formulas:
  variables: [A, E]
  premises:
  - happens_anyway(A,E)
  - less_harmful_per_occurrence(A,E)
  exceptions:
  - preventable_otherwise(A,E)
  - no_net_reduction(A,E)
  conclusions:
  - should_be_performed(A)
book: []
families:
- family: F15
  name: Consequences, alternatives, threat and fear
  relation: related
  note: WAG's argument from what happens anyway (decision D072, candidate C022, 2026-11-25)
  status: generated
premise_map: []
critical_questions:
- id: walton/preventable_otherwise
  targets: [{formula: 'preventable_otherwise(A,E)', locus: exception}]
  note: 'Neither the book nor the game asks it: the scheme is WAG''s (D072, candidate
    C022), its exceptions the owner''s (2026-11-25).'
  paraphrase: Could E be prevented, rather than only made less harmful, by a course
    open to whoever would do A? Which course?
  answer: 'The critic, who raises it with an argument. Against: a course open to the
    same agent that would prevent E, not only make it less harmful, named in the answer
    (education that stops the drinking), which undercuts the argument through preventable_otherwise(A,E).
    Coded with Other (docs/kialo-batch2/guidelines.md §3.1, OC17). For: showing that
    no such course is open, or that it would not prevent E.'
  status: drafted by Claude Code, 2026-11-25
- id: walton/no_net_reduction
  targets: [{formula: 'no_net_reduction(A,E)', locus: exception}]
  note: 'Neither the book nor the game asks it: the scheme is WAG''s (D072, candidate
    C022), its exceptions the owner''s (2026-11-25).'
  paraphrase: Would the harm E does overall fall, or would something (E happening
    more often, for instance) offset the gain each time?
  answer: 'The critic, who raises it with an argument. Against: showing that the harm
    E does overall would not fall, for instance because A makes E so much more frequent
    (more festival-goers take pills once they can test them), which undercuts the
    argument through no_net_reduction(A,E). A more frequent E need not offset the
    gain: 15 occurrences at a harm of 20 are less than 10 at 100. Coded with Other
    (docs/kialo-batch2/guidelines.md §3.1, OC17). For: showing that the harm overall
    does fall: E would not grow so much, or the harm per occurrence falls by more.'
  status: drafted by Claude Code, 2026-11-25
summary:
  text: 'WAG''s argument from what happens anyway (D072, 2026-11-25; candidate C022):
    E happens whether or not A is done (happens_anyway(A,E)), and doing A makes each
    occurrence of E less harmful (less_harmful_per_occurrence(A,E)); so A should be
    performed. Its exceptions are the owner''s: a course open to whoever would do
    A could prevent E (preventable_otherwise(A,E)), and the harm E does overall would
    not fall (no_net_reduction(A,E)). It has no outweighing exception: A''s other
    harms are argued as its negative consequences, a rebuttal. The steering form ("it
    is coming anyway, so shape it") is not this scheme: Other, naming C022 (docs/kialo-batch2/guidelines.md
    §3.1, OC17).'
  status: drafted by Claude Code, 2026-11-25
contrasts:
- scheme: positive_consequences
  text: Positive consequences cites a good that A brings about, a harm of not acting
    that A prevents included (G the harm's not happening, OC13); harm_reduction cites
    an outcome that happens whether or not A is done, which A only makes less harmful
    each time (OC17). A claim that A prevents E is positive consequences.
  status: drafted by Claude Code, 2026-11-25
- scheme: negative_consequences
  text: negative_consequences argues against A from a bad consequence; against harm_reduction,
    a claim that A's other harms matter more than the reduction is that argument,
    a rebuttal at the conclusion, since harm_reduction has no outweighing exception
    (docs/kialo-batch2/guidelines.md §3.1, OC17).
  status: drafted by Claude Code, 2026-11-25
- scheme: negative_consequences_reasoning
  text: ""
  status: todo
- scheme: negative_consequences_prudential
  text: The prudential form argues from a harm to the one who acts that comes if X
    is not done, and that doing X averts (its exception fails_to_avert(X,C) denies
    that); harm_reduction from an outcome that happens anyway, which A makes less
    harmful each time.
  status: drafted by Claude Code, 2026-11-25
