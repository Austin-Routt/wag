- kind: book-walton
  about: variables (N12)
  detail: The book's scheme has two cases, a source C1 and a target C2, and uses one
    letter for the claim made relative to each. walton.yml had only the source case
    C, the target left implicit as "the current case", and one proposition A for both,
    so its premise in_case(A,C) said that the target's claim held in the source case,
    which is false whenever the two claims differ (a tobacco tax and a meat tax, 13292.61).
  decision: 'Done (D001, decided by the owner on 2026-10-22; proposal D001-D028-D029,
    version 3): a claim in each case, P1 and P2, joined by corresponds(P1,P2); similar_to(C1,C2)
    names both cases; the conclusion is P2. The "(false)" form is coded by negated
    claims.'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: Similarity Premise
  detail: The book qualifies its similarity premise with "generally". Ch. 2 also gives
    a version 2 (p. 58), with a further premise that the similarity observed is relevant
    to the similarity in question, and a list of questions for version 1 (p. 62) that
    also asks whether the cases are similar in the respects cited; walton.yml has
    no formula for either, and the compendium's list drops the second.
  decision: No change. The catalogue follows the compendium's scheme 7, which is ch.
    2's version 1, the version the book recommends, keeping version 2 for cases where
    relevance has to be decided (p. 86). Relevance is carried by the difference exception,
    which names the claim (7/CQ1), and a doubt about the respects cited by challenging
    similar_to(C1,C2). "Generally" is carried by the argument's defeasibility, not
    by the formula.
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: CQ3
  detail: The book's counter-case need only resemble the source case and have the
    claim fail there, and the book reads it as a counter-analogy (p. 63). walton.yml's
    more_on_point(A,C) asked instead for a case more on point than C, as an undercutter.
  decision: 'Done (D001, 2026-10-22): more_on_point is removed, and 7/CQ3 targets
    the conclusion; the counter-analogy, an analogy from the further case for the
    opposite claim, rebuts and is weighed.'
  status: drafted by Claude Code, 2026-10-22
- kind: other
  about: game questions
  detail: 'Until the NASCQ is generated from the catalogue, the game''s AS:analogy
    keeps the old form (A and C): CQ:difference asks of relevant_differences(C), CQ:truth
    of in_case(A,C) and CQ:other_case of more_on_point(A,C), and analogy is not thesis-independent.'
  decision: 'Open: at workstream E, AS:analogy takes P1, P2, C1, C2 and answer variable
    P2; CQ:difference and CQ:truth are repatterned and CQ:other_case answered by a
    counter-analogy at the conclusion; how far analogy reaches as an answer is D057.'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: correspondence premise
  detail: The book uses one letter for the claim in both cases; walton.yml has a claim
    in each case joined by corresponds(P1,P2), which the book does not print.
  decision: 'Keep (D001): it makes the shared letter explicit and lets the target
    claim differ in wording, tense or predicate. It is challenged like any premise,
    so it has no question of its own. Binding rule: P2 says of C2 what P1 says of
    C1.'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: difference exception
  detail: The book's CQ1 asks whether the cases differ in ways that weaken the likeness.
    walton.yml's exception difference_against(C1,C2,P2) names the claim and says that
    the difference tells against it.
  decision: 'Keep (D001): so a difference about one claim leaves another analogy between
    the same cases standing, and a difference that favours the claim (as in an a fortiori
    argument) defeats nothing. A general dissimilarity is a challenge of similar_to(C1,C2).'
  status: drafted by Claude Code, 2026-10-22
- kind: other
  about: limits of the form
  detail: Several source cases fold into one C1 (Carneades does not add arguments
    up); proportional analogies hide their relation in the correspondence premise;
    imagined sources are judged, not observed. A fortiori arguments and refutation
    by parallel argument fit neither this form nor the practical analogies.
  decision: Code what fits with strain as analogy and note it; for what does not fit,
    use the near miss or Other rather than force the form (guidelines §3). A fortiori
    and refutation by parallel argument are candidates (docs/candidates.md, D056).
  status: drafted by Claude Code, 2026-10-22
