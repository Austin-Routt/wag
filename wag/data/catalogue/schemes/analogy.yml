id: analogy
name: Argument from Analogy
tier: 1
walton:
  id: analogy
  title: Argument from Analogy
  source: Douglas Walton, Fundamentals of Critical Argumentation, Cambridge University
    Press, New York 2006, p. 96-97.
game:
  id: AS:analogy
formulas:
  variables: [P1, P2, C1, C2]
  premises:
  - similar_to(C1,C2)
  - in_case(P1,C1)
  - corresponds(P1,P2)
  exceptions:
  - difference_against(C1,C2,P2)
  conclusions:
  - P2
book:
- entry: "7"
  title: Argument From Analogy
  pages: "315"
  match: exact
  note: Same title and source (Fundamentals 2006, pp. 96-97). The book's one letter,
    a claim made relative to each case, is a claim in each case joined by a correspondence
    premise of ours (decisions D001, D028 and D029, 2026-10-22); both premises and
    all three CQs have formulas.
  status: generated
families:
- family: F04
  name: Analogy and case-based arguments
  relation: generic
  status: generated
premise_map:
- entry: "7"
  label: Similarity Premise
  formulas: [{formula: 'similar_to(C1,C2)', locus: premise}]
  status: generated
- entry: "7"
  label: Base Premise
  formulas: [{formula: 'in_case(P1,C1)', locus: premise}]
  status: generated
- entry: "7"
  label: Conclusion
  formulas: [{formula: P2, locus: conclusion}, {formula: 'corresponds(P1,P2)', locus: premise}]
  note: P2, the claim about the target case; the correspondence premise, ours, says
    that it is the counterpart of P1, the book's shared letter
  status: generated
critical_questions:
- id: 7/CQ1
  book:
    entry: "7"
    label: CQ1
  game:
    id: CQ:difference
    text: Does the case of {C} differ from this one in relevant ways?
    locus: exception
    pattern: relevant_differences(C)
  targets: [{formula: 'difference_against(C1,C2,P2)', locus: exception}]
  note: 'In ch. 2 (p. 63) the book says that the matching question of its version-1
    list (p. 62, CQ3) could be an undercutter or a defeater, depending on how much
    the differences matter. walton.yml makes it an exception, so the critic raises
    it, and since 2026-10-22 (D001) the exception names the claim carried over and
    tells against it: a difference about another claim, or one that favours this claim,
    does not defeat the argument.'
  paraphrase: Do the two cases differ in a way that tells against the claim carried
    over to the target?
  answer: 'The critic, who raises it with an argument. Against: a difference between
    C1 and C2 that tells against P2 (a feature that made P1 hold in C1 and is missing
    in C2), which undercuts the argument through difference_against(C1,C2,P2). For:
    showing that the differences do not bear on the claim, or that they favour it.'
  status: drafted by Claude Code, 2026-10-22
- id: 7/CQ2
  book:
    entry: "7"
    label: CQ2
  game:
    id: CQ:truth
    text: Is {A} really true in the case of {C}?
    locus: premise
    pattern: in_case(A,C)
  targets: [{formula: 'in_case(P1,C1)', locus: premise}]
  note: In ch. 2 (p. 63) the book calls the questions that only restate a premise
    redundant; this is one. For an imagined source case (a thought experiment), whether
    the claim holds there is the audience's considered judgment.
  paraphrase: Did the claim really hold in the source case?
  answer: 'The proponent, once asked. Against: evidence that P1 did not hold in C1,
    or held only in part, which undermines in_case(P1,C1). For: a record or source
    showing that it held; for an imagined case, the audience''s considered judgment,
    which the critic can contest by putting the case differently.'
  status: drafted by Claude Code, 2026-10-22
- id: 7/CQ3
  book:
    entry: "7"
    label: CQ3
  game:
    id: CQ:other_case
    text: Is there a case more on point than {C} in which {A} is false?
    locus: exception
    pattern: more_on_point(A,C)
  targets: [{formula: P2, locus: conclusion}]
  note: 'The book asks for another case like the source, C1, in which the claim failed,
    and reads the matching question of its version-1 list (p. 62, CQ4) as a counter-analogy,
    more like a defeater (p. 63). In the two-case form the counter-analogy needs no
    formula of its own: it is an analogy from the further case for the opposite claim,
    which rebuts the conclusion and is weighed against it. walton.yml''s more_on_point(A,C),
    an undercutter, was removed with D001.'
  paraphrase: Is there another case, much like the source, in which the counterpart
    of the claim did not hold?
  answer: 'The critic, who answers it with a counter-analogy: an analogy from the
    further case for the opposite of P2, which rebuts the conclusion; Carneades weighs
    the two. For: showing that the further case is less like the target than C1 is,
    or that the claim failed there for a reason absent in C2.'
  status: drafted by Claude Code, 2026-10-22
summary:
  text: Use it when a claim is made about one case because a corresponding claim held
    in another, similar case. It carries a claim that is not a verdict on an action
    (a finding, a prediction, a deontic status such as having no obligation, an evaluation
    of a thing) from one particular case to another. That sets it apart from from_example,
    which argues from cases up to a general rule, and from practical_analogy_positive
    and practical_analogy_negative, which carry over a verdict that an action taken
    in a like situation was right or wrong. P2 says of the target case what P1 says
    of the source; a recommendation drawn from a finding is a second argument.
  status: drafted by Claude Code, 2026-10-22
contrasts:
- scheme: practical_analogy_positive
  text: 'Choose practical_analogy_positive when the source is cited for a verdict
    that an action taken there was right (whatever the word: right, the correct call,
    what should be done) and the conclusion is that the corresponding action should
    be done here; choose analogy for any other claim, such as a finding that a measure
    worked in C1. A finding carried over by analogy (a tax cut consumption there)
    often backs a practical claim through a second argument from consequences.'
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_analogy_negative
  text: Choose practical_analogy_negative when the source is cited for a verdict that
    an action taken there was wrong (wrong, a mistake, unethical), to conclude that
    the corresponding action should not be done here; choose analogy for any other
    claim, including a deontic status that is not a verdict on doing something, such
    as having no obligation (Kialo 5637.341).
  status: drafted by Claude Code, 2026-10-22
- scheme: exception_to_rule
  text: Choose exception_to_rule (walton.yml's precedent scheme) when the similar
    case is cited for the rule it was decided by, and that rule's conclusion is applied
    here; choose analogy when a claim is carried from C1 to C2, with no rule in between.
  status: drafted by Claude Code, 2026-10-22
- scheme: from_example
  text: 'Choose from_example when a case is offered as support for a general rule;
    choose analogy when it is used to conclude something about one other case. One
    case can do both in turn: a tax that cut consumption elsewhere can back a rule
    about such taxes, or a prediction about a meat tax, and the gold codes 13292.61
    as analogy.'
  status: drafted by Claude Code, 2026-10-22
- scheme: verbal_classification
  text: Choose verbal_classification when O is put in a category because it has a
    property that marks the category; choose analogy when a finding is carried over
    from one compared case. The book warns that the two are easily mixed up (pp. 66–9).
  status: drafted by Claude Code, 2026-10-22
examples:
- text: A tax for tobacco significantly reduced its consumption.
  kialo: "13292.61"
  coding: 'C1 = a tax on tobacco; C2 = a tax on meat; P1 = taxing tobacco significantly
    reduced tobacco consumption; P2 = taxing meat would significantly reduce meat
    consumption. Stated: in_case(P1,C1). Supplied: similar_to(C1,C2), corresponds(P1,P2).
    Conclusion: P2, rebutting 13292.13 on the consumption link. Pressed: 7/CQ1 (meat
    is a staple, and demand for staples changes little with price); 7/CQ3 by a counter-analogy
    from a tax on sugary drinks.'
  status: drafted by Claude Code, 2026-10-22
- text: Judith Jarvis Thomson argues that people would be outraged if they found themselves
    plugged to an ailing violinist, obliged to keep them alive for nine months. In
    cases where biological parents do not choose to create life, the violinist in
    the thought experiment is equivalent to the foetus.
  kialo: "5637.341"
  coding: 'C1 = being plugged into an ailing violinist without consent; C2 = an unchosen
    pregnancy; P1 = one is not obliged to stay plugged in for nine months; P2 = the
    pregnant person is not obliged to carry the pregnancy to term. Analogy, not a
    practical analogy: it carries a deontic status, not a verdict on an action. The
    source is imagined, so in_case(P1,C1) is the audience''s judgment. Its replies
    press 7/CQ1 (5637.11606: a stranger, not one''s own child) and challenge corresponds(P1,P2)
    (5637.344: being unplugged is not killing).'
  status: drafted by Claude Code, 2026-10-22
- text: Like nuclear weapons, transhumanism can be limited through the principle of
    mutual assured destruction.
  kialo: "13564.1157"
  coding: C1 = nuclear technology; C2 = transhumanist technology; P1 = the threat
    of mutual destruction has kept nuclear weapons from being used; P2 = the threat
    of mutual destruction would keep transhumanist weapons from being used. Its parent,
    13564.1155, draws another analogy between the same two cases; the difference exception
    names the claim, so a difference against this one leaves the parent standing.
  status: drafted by Claude Code, 2026-10-22
- text: Rent control in the old town did not bring more homes onto the market, and
    the new district is much like it, so rent control there will not either.
  coding: 'The "(false)" form, by negated claims: C1 = rent control in the old town;
    C2 = rent control in the new district; P1 = rent control did not increase the
    supply of homes in the old town; P2 = rent control will not increase the supply
    of homes in the new district. A critic raises difference_against(C1,C2,P2): the
    old town had no land left to build on, the new district has.'
  status: drafted by Claude Code, 2026-10-22
- text: Road pricing ended Singapore's traffic jams, so London should bring it in.
  coding: 'A chain. Analogy: C1 = road pricing in Singapore; C2 = road pricing in
    London; P1 = road pricing ended the traffic jams in Singapore; P2 = road pricing
    would end the traffic jams in London. Then positive consequences from P2 to the
    recommendation. Binding P2 to the recommendation would make the correspondence
    premise pair a finding with a policy.'
  status: drafted by Claude Code, 2026-10-22
- text: Elsewhere, governments have put taxes on ecologically damaging businesses,
    e.g., carbon tax, oil tax etc.
  kialo: "13292.30"
  coding: 'Near miss: it compares situations, but the source is cited for a verdict
    on an action (taxing carbon and oil was right) and the conclusion is the thesis,
    that meat should be taxed; practical_analogy_positive, as the gold codes it (X2
    = tax_meat).'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
- text: In the Riverside tenants' case the court held that tenants may withhold rent
    while the landlord leaves the heating broken; our tenants, whose heating has been
    off for a month, may do the same.
  coding: 'Near miss: a case cited for the rule it was decided by; exception_to_rule
    (walton.yml''s precedent scheme), C = the Riverside tenants'' case, R = the rule,
    S = our tenants may withhold rent.'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
