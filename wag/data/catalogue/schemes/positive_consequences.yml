  status: drafted by Claude Code, 2026-10-22
dialogue_types:
  proper: [deliberation, persuasion, negotiation]
  suspect: [inquiry]
  note: 'From ND, via docs/dialogue-types.md §7: arguments from consequences are the
    characteristic move of deliberation (ND pp. 157–60), and are proper in a critical
    discussion of whether a policy is good (p. 203). They are fallacious (ad consequentiam)
    when used in a dispute about whether a thesis is true, as an illicit shift into
    deliberation (pp. 176–7); persuasion is listed as proper only for theses about
    what to do. Our extrapolation: inquiry, whose goal is to prove a proposition true
    or false (p. 32), is where the same misuse threatens; and in negotiation an offer
    can cite the benefits of accepting it, as ND states for the negative form (p.
    116).'
  status: drafted by Claude Code, 2026-10-22
