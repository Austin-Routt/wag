id: positive_consequences
name: Argument from Positive Consequences
tier: 1
walton:
  id: positive_consequences
  title: Argument from Positive Consequences
  source: Douglas Walton, A Pragmatic Theory of Fallacy, The University of Alabama
    Press, Tuscaloosa and London, 1995, pp. 155-156.
game:
  id: AS:consequences
  backs: ['CQ:opposite_consequences']
formulas:
  variables: [A, G]
  premises:
  - brings_about(A,G)
  - good(G)
  exceptions:
  - bad_outweighs(A,G)
  conclusions:
  - should_be_performed(A)
book:
- entry: "33.1"
  title: Argument from Positive Consequences
  pages: "332"
  parent: "33"
  match: exact
  cqs_printed_under: "33"
  note: Same title (upstream Carneades; source A Pragmatic Theory of Fallacy 1995,
    pp. 155-156). WAG AS:consequences uses this id.
  status: generated
families:
- family: F15
  name: Consequences, alternatives, threat and fear
  relation: variant
  note: WAG AS:consequences
  status: generated
premise_map:
- entry: "33.1"
  label: Premise
  formulas: [{formula: 'brings_about(A,G)', locus: premise}, {formula: good(G), locus: premise}]
  note: the good consequence is named G
  status: generated
- entry: "33.1"
  label: Conclusion
  formulas: [{formula: should_be_performed(A), locus: conclusion}]
  status: generated
critical_questions:
- id: 33/CQ1
  book:
    entry: "33"
    label: CQ1
  game:
    id: CQ:likelihood
    text: How likely is it that the claimed link actually holds?
    locus: premise
    pattern: brings_about(A,G)
  targets: [{formula: 'brings_about(A,G)', locus: premise}]
  note: The book's question also allows for the strength the arguer claims (that G
    will, may or must follow); the paraphrase asks for the likelihood whatever strength
    is claimed. The game's CQ:likelihood drops that modality and speaks of "the claimed
    link".
  paraphrase: How likely is it that doing A would actually lead to G?
  answer: 'The proponent, once asked. Against: reasons why G is unlikely to follow
    from A, or would follow only under conditions this case lacks, which undermines
    brings_about(A,G). For: a record, a known mechanism or a forecast showing that
    actions like A reliably produce outcomes like G.'
  status: drafted by Claude Code, 2026-10-22
- id: 33/CQ2
  book:
    entry: "33"
    label: CQ2
  targets: [{formula: 'brings_about(A,G)', locus: premise}]
  note: No separate evidence formula, so the question targets the premise the evidence
    would support. The game asks its version (game/CQ:evidence) of the inference instead;
    see the discrepancy on the game's questions.
  paraphrase: What evidence shows that doing A would lead to G, and is it strong enough
    for the confidence with which the claim is made?
  answer: 'The proponent, once asked. Against: showing that the evidence for the link
    is missing, anecdotal, or weaker than the claim needs (a firm "will" backed only
    by a "might"), which undermines brings_about(A,G). For: studies, precedents or
    a known mechanism that support the link as strongly as it is claimed.'
  status: drafted by Claude Code, 2026-10-22
- id: 33/CQ3
  book:
    entry: "33"
    label: CQ3
  targets: [{formula: 'bad_outweighs(A,G)', locus: exception}]
  note: 'Targets the sided exception bad_outweighs(A,G), decision D055 (2026-10-23):
    doing A has bad consequences that outweigh G. It names G, so it defeats only this
    argument, not every consequence argument about A. The question has two routes
    (docs/kialo-batch2/guidelines.md §3.1): a further bad consequence of A that ranks
    nothing rebuts the conclusion, as a negative_consequences argument weighed by
    the scheme weights (OC2); a claim that a bad consequence of A matters more than
    G argues this exception (OC3, OC4). The exceptions'' limits are recorded in the
    discrepancy on 33/CQ3.'
  paraphrase: Would doing A have bad consequences that matter more than G?
  answer: 'The critic, who raises it with an argument. Against: a claim that some
    bad consequence of A matters more than G, coded with Other or a source-based scheme
    (expert opinion, position to know), which argues bad_outweighs(A,G) and, unanswered,
    defeats the argument whatever the weights. For: a reply that attacks that claim''s
    own comparison, or the consequence it relies on (OC10); only a reply that nothing
    outweighs G answers every weighing claim at once.'
  status: drafted by Claude Code, 2026-10-23
- id: game/CQ:evidence
  game:
    id: CQ:evidence
    text: Is there enough evidence that doing {A} brings about {G}?
    locus: argument
  targets: []
  undercuts: true
  note: The game's form of 33/CQ2, asked of the inference (locus argument) rather
    than of the premise brings_about(A,G); see the discrepancy on the game's questions.
    It stays apart from 33/CQ2, whose target is the premise, because the game asks
    it of the inference.
  paraphrase: Does enough evidence back the claim that doing A brings about G?
  answer: 'The proponent, once asked: the argument is out of force until answered.
    Against: showing that no study, record or mechanism supports the link, which undercuts
    the argument. For: evidence that A brings about G.'
  status: drafted by Claude Code, 2026-10-22
- id: game/CQ:side_effect
  game:
    id: CQ:side_effect
    text: Would doing {A} have bad side effects?
    locus: conclusion
  targets: [{formula: should_be_performed(A), locus: conclusion}]
  note: 'The game''s form of the rebuttal route of 33/CQ3: it asks, at the conclusion,
    for a further bad consequence of A. Whether a bad consequence outweighs G is the
    exception bad_outweighs(A,G), which 33/CQ3 targets (D055); the game gains that
    question at workstream E.'
  paraphrase: Would doing A also bring about something bad?
  answer: 'The critic, who raises it with an argument. Against: a bad effect of A,
    played as a rebuttal of the conclusion; the weights decide between it and the
    argument. In the game the answer is backed by expert_opinion, position_to_know
    or sign: no backup edge lets negative_consequences back it, so an argument from
    negative consequences against A is played as a direct rebuttal instead. A claim
    that the bad effect outweighs G answers 33/CQ3 instead. For: showing that A has
    no such effect.'
  status: drafted by Claude Code, 2026-10-23
summary:
  text: 'Use it when an action A is recommended because doing it would bring about
    an outcome G that is good, and the claim offers nothing more: no circumstances,
    no goal the action serves, no value. It concludes that A should be done, and differs
    from practical_reasoning1 and 2 in arguing from the worth of a result rather than
    from a goal, and from cause_to_effect in that its point is the recommendation,
    not the prediction.'
  status: drafted by Claude Code, 2026-10-22
contrasts:
- scheme: negative_consequences
  text: The mirror image. Choose positive_consequences when the cited outcome is good
    and the claim is that A should be done; choose negative_consequences when the
    outcome is bad and the claim is that A should not be done. Bind A to the action
    as the issue states it, so that the two meet on one conclusion.
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_consequences_reasoning
  text: 'Not a close relative: it is the first-person negative form, an agent deciding
    against its own action because the outcome would harm its goals. A first-person
    case for doing something because of a good result is still positive_consequences;
    walton.yml has no first-person positive form.'
  status: drafted by Claude Code, 2026-10-22
- scheme: negative_consequences_prudential
  text: Choose negative_consequences_prudential when the reason is a harm that failing
    to do A would bring on the one who acts, whom it warns; choose positive_consequences
    when the reason is a good that doing A brings, and also when it is a harm of not
    doing A that falls on anyone else, with G the harm's not happening, phrased as
    a good state (docs/kialo-batch2/guidelines.md §3.1, OC13).
  status: drafted by Claude Code, 2026-10-23
- scheme: pragmatic_alternative
  text: 'Choose pragmatic_alternative when the text presents a forced choice: either
    A is done or a bad outcome B follows, so A must be done. Choose positive_consequences
    when A is recommended for a good it brings, with no either-or.'
  status: drafted by Claude Code, 2026-10-22
- scheme: threat
  text: 'Not a close relative: a threat argues against an action from a bad outcome
    that the speaker undertakes to bring about. Nothing in positive_consequences corresponds
    to it.'
  status: drafted by Claude Code, 2026-10-22
- scheme: ad_baculum
  text: 'Not a close relative: the disjunctive threat demands an action on pain of
    a harm that the speaker will cause. positive_consequences recommends an action
    for a good it brings, with no one threatening anything.'
  status: drafted by Claude Code, 2026-10-22
- scheme: fear
  text: Choose fear when the argument presents A as the only way to avert something
    very bad for the hearer and works through the hearer's fear; choose positive_consequences
    when the reason is a benefit gained, not a harm averted.
  status: drafted by Claude Code, 2026-10-22
- scheme: danger
  text: 'Not a close relative: the danger appeal argues against an action that would
    put the hearer at serious risk. Its positive counterpart is not a danger appeal
    but positive_consequences.'
  status: drafted by Claude Code, 2026-10-22
- scheme: slippery_slope_base_case
  text: 'Not a close relative: a slippery slope argues against a first step from a
    horrible outcome at the end of a chain. A chain of events towards a good end,
    argued for, is a series of causal steps (cause_to_effect_modal, for a proposed
    action) beside a positive_consequences argument; gradualism is something else,
    leading a hearer to accept a conclusion in small steps.'
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_reasoning2
  text: Choose practical_reasoning2 only when S2 is a state distinct from the action
    and, of S1, the step from A to S2 and the step from S2 to G, at most one has to
    be supplied (the claim's immediate context counts as given); choose positive_consequences
    when the claim chiefly says that the action brings about a good outcome. A proposal
    stated with its purpose is positive_consequences (batch-2 guidelines §5 item 4;
    gold rule R3).
  status: drafted by Claude Code, 2026-10-22
- scheme: practical_reasoning1
  text: Choose practical_reasoning1 when, besides circumstances and a goal, the claim
    names a value V that the goal promotes; choose positive_consequences for a bare
    good result with no goal or value stated.
  status: drafted by Claude Code, 2026-10-22
- scheme: cause_to_effect
  text: 'Choose cause_to_effect when the claim''s point is that the effect will happen;
    choose positive_consequences when the point is that A should be done because its
    effect is good. A claim that defends the causal link a consequences argument relies
    on is a causal step, not a new consequences argument: cause_to_effect if its cause
    has occurred, cause_to_effect_modal if it is the proposed action or follows from
    it.'
  status: drafted by Claude Code, 2026-10-22
- scheme: positive_value
  text: Choose positive_value when the reason given is a value that the agent holds
    and that favours keeping a goal; choose positive_consequences when the reason
    is an outcome that the action produces.
  status: drafted by Claude Code, 2026-10-22
- scheme: end_and_means_1
  text: Choose end_and_means_1 when the claim concludes only that X is good because
    it leads to a good end, without recommending that anyone do X (Kialo gold, 13292.3);
    choose positive_consequences when it argues that an action should be done for
    its good result.
  status: drafted by Claude Code, 2026-10-22
- scheme: cause_to_effect_modal
  text: Choose positive_consequences when an effect is cited to argue that an action
    should be done; choose cause_to_effect_modal when the point is only that the effect
    may follow, including a step that explains, beside a consequences argument, how
    the consequence it cites could come about (the step concludes may_occur, not brings_about).
  status: drafted by Claude Code, 2026-10-22
examples:
- text: A tax on meat would combat unhealthy meat consumption.
  kialo: "13292.115"
  coding: 'A = a tax on meat; G = less unhealthy meat consumption. Stated: brings_about(A,G).
    Supplied: good(G), plain from "unhealthy". Conclusion: should_be_performed(A),
    the thesis. "Combat" is goal language, but no circumstances or separate goal are
    stated, so it is not practical reasoning (the gold''s note). Pressed: 33/CQ1 (heavy
    meat eaters buy it whatever it costs); 33/CQ3 by 13292.127, which says that starvation
    from less access to meat is worse than any harm of high meat consumption: it argues
    bad_outweighs(A,G), re-parented to this argument from its Kialo parent 13292.7
    (docs/kialo-batch2/guidelines.md §3.1, OC4, OC7).'
  status: drafted by Claude Code, 2026-10-23
- text: A congestion charge would get traffic in the city centre moving again, so
    the council should bring one in.
  coding: 'A = the council bringing in a congestion charge; G = traffic in the city
    centre moving again. Stated: brings_about(A,G) and the conclusion. Supplied: good(G).
    Pressed: 33/CQ2, since the only figures quoted come from a city with a metro on
    every street.'
  status: drafted by Claude Code, 2026-10-23
- text: Legalising cannabis would mean more adults use it openly and safely, which
    is a good thing.
  coding: A = legalising cannabis; G = more adults using cannabis. negative_consequences'
    example from public health cites the same G, valued oppositely. Each argument's
    exception names its own side (bad_outweighs here, good_outweighs there), so they
    share none; the dispute over the value is fought over good(G) and bad(G).
  status: drafted by Claude Code, 2026-10-23
- text: People in physically abusive relationships are likely to stay tethered to
    their abusers when they cannot end a pregnancy.
  kialo: "5637.1866"
  coding: 'The thesis states a right ("the right to choose abortion"), so A is the
    action that grants or secures it: pregnant people having access to abortion services.
    G = people in abusive relationships being able to leave their abusers. The claim
    states a harm of not having access that falls on people other than the one who
    acts, so it is positive consequences of access, with G the harm''s not happening,
    phrased as a good state (docs/kialo-batch2/guidelines.md §3.1, OC13; candidate
    C015). Pressed: 33/CQ3 by 5637.12239, which says that healthy relationships also
    last longer without access and that this may outweigh the harm: bad_outweighs(A,G)
    (OC3, OC4). The Kialo text is condensed.'
  status: drafted by Claude Code, 2026-10-23
- text: A four-day week would leave staff more rested, so the firm should try it.
  coding: 'A = the firm trying a four-day week; G = staff being more rested. Pressed:
    33/CQ3 by a balance claim (all told, the costs to the firm outweigh the benefits),
    which names no single consequence: one weighing instance, bad_outweighs(A,G),
    for each positive argument about the four-day week on the board (OC14), and one
    proof leaves the others standing (candidate C004). A reply that names the bad
    consequence (the lost Friday orders matter more than rested staff) is an ordinary
    weighing claim.'
  status: drafted by Claude Code, 2026-10-23
- text: Rationing meat via personal carbon budgets/allowances (credits) where everybody
    in a country can consume a small amount of meat … would help reduce carbon emissions.
  kialo: "13292.147"
  coding: 'A = rationing meat through personal carbon budgets; G = lower carbon emissions.
    Stated: brings_about(A,G). Supplied: good(G). Conclusion: should_be_performed(A).
    A is a rival to the thesis action, so the gold also treats the claim as offering
    a better means against the thesis''s environmental argument.'
  status: drafted by Claude Code, 2026-10-22
- text: Governments should put a tax on meat and use some of those tax revenues to
    encourage research into developing synthetic meats.
  kialo: "13292.145"
  coding: 'A = a meat tax whose revenue partly funds research into synthetic meat;
    G = faster development of synthetic meat. Stated: the conclusion should_be_performed(A),
    and its purpose, which is brings_about(A,G). Supplied: good(G). A proposal stated
    with its purpose is coded this way (batch-2 gold rule R3).'
  status: drafted by Claude Code, 2026-10-22
- text: Taxing meat would raise the consumer price to reflect the real costs of meat
    consumption.
  kialo: "13292.118"
  coding: 'Near miss: it separates what the tax changes (a higher price, S2) from
    the goal that change serves (a price that reflects the real costs, G), and its
    context states the circumstances (13292.11: subsidies keep the price down); practical_reasoning2
    (A = the tax, S2 = a higher price, G = a price that reflects real costs), as the
    gold codes it.'
  near_miss: true
  status: drafted by Claude Code, 2026-10-22
- text: The city has set itself the goal of clean air by 2030, and a congestion charge
    is the way to get there, so it should bring one in.
  coding: 'Near miss: the action is argued for as the means to a goal the agent has
    set, not by a consequence judged good; practical_reasoning2 (S1 = the city''s
    air being dirty, A = bringing in a congestion charge, S2 = the city''s air being
    clean, G = clean air by 2030).'
  near_miss: true
  status: drafted by Claude Code, 2026-10-23
discrepancies:
- kind: game-differs
  about: exception bad_outweighs(A,G)
  detail: The game's core.yml lacks the exception bad_outweighs(A,G) of walton.yml.
  decision: Keep the game as it is until its data is generated from the catalogue
    (plan §6; catalogue-alignment.md, workstream E). The game asks 33/CQ3's rebuttal
    route at the conclusion (CQ:side_effect) and keeps it; core.yml then gets the
    exception bad_outweighs(A,G), with a question at it for the weighing route (D055).
    No scheme concludes the exception, so a player answers that question with Other
    or a source-based scheme (expert opinion, position to know); whether analogy may
    is D057.
  status: drafted by Claude Code, 2026-10-23
- kind: book-walton
  about: Premise
  detail: The compendium's single premise says that doing A will plausibly have good
    consequences, without naming them; walton.yml names the consequence G and splits
    the premise into brings_about(A,G) and good(G). The qualifier "plausibly" is lost;
    the ch. 3 version (p. 101) has no qualifier.
  decision: No change. Naming G lets the link and the goodness be questioned apart,
    and ND's form of the scheme does the same (p. 158). The plausibility is carried
    by the argument's weight and proof standard, not by the formula.
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: CQ1-CQ2
  detail: The book's first two questions allow the consequences to be claimed with
    different strengths (will, may, must). brings_about(A,G) has no modality, and
    Kialo claims often hedge ("could", "would help").
  decision: 'No change. Code a hedged claim with brings_about(A,G), say so in the
    coding, and treat the hedge as a reason to press 33/CQ1: the conclusion that A
    should be done needs a consequence likely enough to act on. The claim''s causal
    steps are coded beside it as secondary cause_to_effect_modal instances, which
    conclude only that the effect may occur and do not back brings_about(A,G) (cause_to_effect_modal,
    the discrepancy on the consequence schemes). Open: whether brings_about should
    get a modal form too.'
  status: drafted by Claude Code, 2026-10-22
- kind: book-walton
  about: CQ3
  detail: 33/CQ3 asks whether consequences of the opposite kind should be weighed.
    walton.yml had no formula for it here. The owner's decision of 2026-10-22 added
    other_consequences(A), but that one exception was shared by every consequence
    argument about A on both sides, so one argument that it held defeated them all
    (D055).
  decision: 'Done: decision D055 (2026-10-23) gave each consequence scheme an exception
    on its own side that names the consequence it cites: bad_outweighs(A,G) here,
    good_outweighs(A,G) in negative_consequences, good_outweighs(A,B) in negative_consequences_reasoning,
    bad_outweighs(X,C) in negative_consequences_prudential. 33/CQ3 targets it, by
    two routes (docs/kialo-batch2/guidelines.md §3.1). What the sided exceptions cannot
    do (each tested in WAG''s engine by the proposal''s reviews; docs/proposals/D055-D059.md):
    (1) a balance claim that names no single consequence needs one weighing instance
    per argument it answers, and one proof leaves the others standing (candidate C004);
    (2) contrary weighing claims (starvation outweighs the health gain; the health
    gain outweighs starvation) are different statements, so both can be accepted and
    both arguments fall, since declared contraries are not enforced (D053); (3) no
    scheme concludes the exceptions, so a weighing claim is argued with Other or a
    source-based scheme and is not tied to the rival consequence it relies on (candidate
    C003); (4) negative_consequences and negative_consequences_reasoning share the
    exception when bound alike, so one weighing claim defeats both; (5) one consideration
    framed as a gain (33.1) and as a harm averted (33.4) has two exceptions, and a
    weighing claim reaches only one (the guidelines code it once, OC12); (6) every
    weighing claim against one argument argues the same statement, so a reply that
    denied the exception would cancel them all (the guidelines have a reply attack
    the weighing claim''s own comparison, OC10); (7) an exception holds whatever the
    weights: an unanswered weighing claim of weight 0.1 removes an argument of weight
    0.9, and an equal denial restores it.'
  status: drafted by Claude Code, 2026-10-23
- kind: other
  about: game questions
  detail: 'The game''s three questions differ from the book''s: CQ:likelihood drops
    the modality and speaks of "the claimed link"; CQ:evidence asks the book''s evidence
    question of the inference (locus argument), not of the premise brings_about(A,G);
    CQ:side_effect narrows the opposite-consequences question to bad side effects.
    No backup edge lets AS:negative_consequences back CQ:side_effect, the mirror of
    AS:consequences backing CQ:opposite_consequences; and CQ:side_effect''s caes_mapping
    names the argument, while its ask edge, which the game uses, names the conclusion.'
  decision: 'Open: when the NASCQ is generated from the catalogue (plan §6), take
    the game''s texts from these paraphrases, sit the evidence question on 33/CQ2
    at the premise, add the backup edge AS:negative_consequences → CQ:side_effect,
    and add the book''s 33/CQ3 at the exception bad_outweighs(A,G), beside CQ:side_effect
    at the conclusion (D055).'
  status: drafted by Claude Code, 2026-10-23
