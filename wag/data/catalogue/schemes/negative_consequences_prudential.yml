examples:
- text: You were thinking of not backing up your thesis. But if you don't, one disk
    failure could lose a year's work, which would be very bad for you. So you should
    back it up.
  coding: 'X = backing up the thesis; C = losing a year''s work. Stated: not_doing(X),
    bad_consequence(X,C) and the conclusion should_be_performed(X), which meets a
    negative consequences argument that backing up should not be done (D059). Pressed:
    33/CQ1 at strongly_occur(X,C) (the laptop is new and the university server keeps
    a copy every night); 33/CQ3 by the claim that the only backup on offer, a public
    cloud service, would breach the ethics approval for the confidential interview
    data, which is worse than the small risk of loss: bad_outweighs(X,C). C is a consequence
    of not acting, so the exception reads: backing up has bad consequences that outweigh
    losing a year''s work.'
  status: drafted by Claude Code, 2026-10-23
- text: You were going to skip the flu jab this year. But if you don't get it, you
    may fall ill during your exams, which would be very bad for you. So get the jab.
  coding: 'X = getting the flu jab; C = falling ill during the exams. Pressed: 33/CQ2
    at bad_consequence(X,C) (last winter''s flu peaked in February, and the exams
    are in December). A second warning for the jab that cites another harm to the
    same reader (missing the family''s trip in January) has its own likelihood assumption,
    so showing that the flu will not strike during the exams leaves it standing (D055).
    A harm to someone else, such as passing the flu to a newborn in the family, is
    not this form: it is positive consequences of the jab (kialo-batch2/guidelines.md
    §3.1, OC13).'
  status: drafted by Claude Code, 2026-10-23
- text: Pay me by Friday, or I'll send those photos to your employer.
  coding: 'Near miss: the bad consequence is one the arguer undertakes to bring about,
    so it is the disjunctive threat, ad_baculum (35.1; X = your paying me by Friday,
    Y = the photos being sent to your employer); the prudential form cites a consequence
    that follows of itself. Its conclusion meets no should_be_performed claim (D063).'
  near_miss: true
  status: drafted by Claude Code, 2026-10-23
discrepancies:
- kind: partial-link
  about: "33.4"
  detail: 'walton.yml formalizes compendium 33.4 only in part: Same title and references.
    The conclusion restates the book''s call to reconsider and do X prudentially as
    should_be_performed(X), in the game''s vocabulary, so that the warning meets the
    practical schemes about X (decision D059, 2026-10-23), as 8.1 and 8.2 do under
    D029.'
  decision: 'Done: decision D059 (2026-10-23). The book''s conclusion (reconsider,
    and prudentially do X) is restated as should_be_performed(X), so that the warning
    meets the practical schemes about X. What the restatement loses (the call to reconsider,
    "prudentially", the ceteris-paribus clause) is carried by not_doing(X), bad_consequence(X,C)''s
    "very bad for you", the argument''s weight and its questions. The old prudential(X)
    met no other scheme.'
  status: drafted by Claude Code, 2026-10-23
- kind: book-walton
  about: CQ1
  detail: 'The likelihood assumption strongly_occur(X) named the action but not the
    consequence, so two warnings about one action that cite different consequences
    shared it: showing one consequence unlikely defeated the other warning too. The
    upstream template had both slots, and the cleaning recorded the lost argument
    as a semantic concern.'
  decision: 'Done: decision D055 (2026-10-23) made it strongly_occur(X,C), with a
    template of ours; 33/CQ1 targets it. Also ours: 33/CQ2''s target, bad_consequence(X,C),
    the premise that names C; the question had no target before.'
  status: drafted by Claude Code, 2026-10-23
- kind: book-walton
  about: CQ3
  detail: 33/CQ3's exception, other_consequences(X), named only the action, so it
    was shared with every consequence argument about X.
  decision: 'Done: decision D055 (2026-10-23) replaced it with the sided exception
    bad_outweighs(X,C): X has bad consequences that outweigh C, a consequence of not
    doing X. The exceptions'' limits are recorded in positive_consequences'' discrepancy
    on 33/CQ3. What is ours: the template of bad_outweighs/2, and reading the exception
    as weighing against C, a consequence of not doing X.'
  status: drafted by Claude Code, 2026-10-23
- kind: other
  about: first person
  detail: The templates address the one who acts as "you" (you were considering not
    doing X; very bad for you). The book's parenthetical reading of 33.3, the omission
    case, is the same form in the first person.
  decision: 'No change to the templates. Read a first-person instance with "I" for
    "you", and bind X without a possessive ("backing up the thesis", not "your thesis"),
    so that it meets the arguments about the same action. Who counts as the one who
    acts: docs/kialo-batch2/guidelines.md §3.1, OC13 (D027). The game does not have
    this scheme yet, so it is played with Other.'
  status: drafted by Claude Code, 2026-10-23
