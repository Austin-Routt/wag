    follow even if X were done (renewals take three months, so renewing would not
    bring the passport back before the wedding), which undercuts the argument through
    fails_to_avert(X,C); it grants that C would be bad. Coded with Other (docs/kialo-batch2/guidelines.md
    §3.1, OC13). For: showing that doing X does avert C, or makes it unlikely.'
  status: drafted by Claude Code, 2026-11-25
