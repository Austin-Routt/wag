critical_questions:
- id: walton/worth_finding_out_first
  game:
    id: CQ:worth_finding_out_first
    text: 'Should the possibility that doing {A} brings about {G} be left out of the
      decision on {A} until it is found out: can it be found out in time, reliably
      enough to settle the question, at a cost and risk worth bearing? Which way?'
    locus: exception
    pattern: worth_finding_out_first(A,G)
  targets: [{formula: 'worth_finding_out_first(A,G)', locus: exception}]
  note: 'The book does not ask it: the bridge is WAG''s (D008, refined 2026-11-25).
    The game asks it since step C5.2 (CQ:worth_finding_out_first), and refuses Other''s
    answer there (D095 (3)). The exception is the critic''s (D003): that it is worth
    finding out first, not merely that it could be found out, since a test too costly,
    too slow, too risky or too unreliable to settle the question is no reason to set
    the possibility aside (the owner, 2026-11-25: bare knowability does not justify
    deferring a decision). The bridge''s other premise, matters_to_decision(A,G),
    is its arguer''s, challenged as any premise is (CQ:premise_acceptable). The exception
    is shared with the other bridge, neutral as to polarity (D053, declared by the
    owner, with its scope): if it is worth finding out first whether A brings G about,
    the possibility counts for neither side until then. It takes the bridge away,
    not the decision, and it does not reach a categorical argument about the same
    link: a reply addressed to one challenges its brings_about(A,G) instead (33/CQ1
    or CQ2; docs/kialo-batch2/guidelines.md §3.1, OC15).'
  paraphrase: 'Should the possibility that doing A brings about G be left out of the
    decision on A until it is found out: can it be found out in time, reliably enough
    to settle the question, at a cost and risk worth bearing? Which way?'
  answer: 'The critic, who raises it with an argument. Against: an argument of finding_out_first
    (D095), which names the investigation and argues that it would settle whether
    A brings G about, in time and at a cost and risk worth bearing (a trial, a pilot,
    a study), and so undercuts the bridge through worth_finding_out_first(A,G); a
    source-based scheme that asserts the exception (expert opinion, position to know)
    answers too, with its own questions. The modal argument stands. A reply that shows
    only that G could be found out argues the exception without making it out: it
    does not meet the critic''s burden (D053, the owner''s declaration); it is coded
    with Other (docs/kialo-batch2/guidelines.md OC15), and the game refuses it at
    this question since step C5.2 (D095 (3)). For: against an answer of finding_out_first,
    a challenge of the premise it denies (the investigation would end after the decision
    must be taken, would not settle the question, or would cost or risk more than
    it is worth); against a reply coded with Other, a rebuttal of its conclusion.'
  status: drafted by Claude Code, 2026-11-26
summary:
  text: 'WAG''s bridge (D008, refined 2026-11-25) from negative_consequences_modal''s
    conclusion to ¬should_be_performed(A), on the pattern of D011 and D063: an explicit
    warrant, never counted as evidence beside the argument it bridges. Its premises
    are that conclusion, may_be_unwise_to_perform(A,G), and matters_to_decision(A,G):
    that the chance that A brings about G is large enough, given what G would be,
    to bear on the decision, which its arguer supports (a remote chance of a modest
    G does not, a small chance of a grave one may). Its exception is worth_finding_out_first(A,G),
    that it is worth finding out first. It is an entry condition, not a weight. Code
    a claim of a possible consequence with the modal variant, secondary, and this
    bridge, primary, which takes the claim''s role and target (docs/kialo-batch2/guidelines.md
    §3.1, OC15).'
  status: drafted by Claude Code, 2026-11-25
