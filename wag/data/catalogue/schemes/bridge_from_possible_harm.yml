examples:
- text: Taxing meat might force producers to use cheaper and more dangerous means
    of producing meat.
  kialo: "13292.174"
  coding: 'A = governments putting a tax on meat; G = producers using cheaper and
    more dangerous means of producing meat. The gold''s coding after the recode: the
    bridge is the claim''s primary instance, whose conclusion meets the environmental
    argument''s (the discussion''s, 13292.1#2, since D096); the modal argument is
    its secondary instance; that the possibility matters is supplied, since the claim
    offers it as a reason against the tax. Pressed: walton/worth_finding_out_first
    (A tax in one region first would show, in time and with little harm, whether producers
    there cut corners before a national tax is decided); a challenge of matters_to_decision(A,G)
    (Where meat was taxed, one producer in a hundred cut corners: a chance that small
    should not decide a national tax). (proposal D008-D074)'
  status: drafted by Claude Code, 2026-11-25
- text: A tax on meat could actually reduce tax revenues by harming the trillion-dollar
    meat industry, which pays substantial taxes.
  kialo: "13292.9"
  coding: 'A = governments putting a tax on meat; G = tax revenues falling. ''Could
    actually'': modal; the gold''s coding after the recode, as the example before.
    Pressed: walton/worth_finding_out_first (The treasury can model the revenue effect
    from the industry''s tax returns, quickly and at no real cost, before the rate
    is set). (proposal D008-D074)'
  status: drafted by Claude Code, 2026-11-25
- text: We do not know whether the old bridge can bear the lorry. If we act as if
    it can and it cannot, the lorry and its driver fall into the river; if we act
    as if it cannot and it can, we lose an hour going round. So we act on the presumption
    that it cannot.
  coding: 'Near miss: A = the old bridge can bear the lorry; B = the lorry and its
    driver falling into the river; C = losing an hour going round. It acts on a possibility
    too, but under ignorance of a fact, by comparing what follows from each presumption:
    negative practical reasoning (26.2), a kind of argument from ignorance. The bridge
    takes a possible consequence of an action to the decision whether to do it. (proposal
    D008-D074)'
  near_miss: true
  status: drafted by Claude Code, 2026-11-25
