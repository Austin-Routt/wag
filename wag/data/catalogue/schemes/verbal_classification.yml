  epistemic: application
  group: based on cases
  status: drafted by Claude Code, 2026-10-22
specialises:
  scheme: ""
  note: 'Specialises nothing: it is the generic scheme of its family (F07). definition_to_verbal_classification
    narrows it.'
  status: drafted by Claude Code, 2026-10-22
dialogue_types:
  proper: [persuasion, inquiry, deliberation]
  suspect: []
  note: Not in ND's table (docs/dialogue-types.md §7), and ND does not discuss the
    scheme; our extrapolation. Classifying a case gives evidence about what it is,
    so it serves persuasion and inquiry, and deliberation, where the category a case
    falls in often decides which policy or rule applies to it. The book (not ND) warns
    that a classification by a loaded term can beg the question when its definition
    is the point in dispute (pp. 67–8); that is a misuse in any type, not a type in
    which the scheme is suspect.
  status: drafted by Claude Code, 2026-10-22
