# The game's data in the catalogue (step C5.1, docs/c5-game.md), with the
# entries' game parts: wag-cli --catalogue-gen generates the game's files
# (wag/data/nascq/*.json, wag/data/schemes/core.yml) from them. Change it only
# as a decision says. Comments are not kept: --catalogue-gen rewrites this file.
questions:
- id: CQ:other_goals
  record:
    name: Other Goals Question
    semantic_type: value
    question_template_en: Are there goals other than {G} that should come first?
    answer_en:
      against: "yes"
      for: "no"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: rebuttal
      target: conclusion
- id: CQ:other_means
  record:
    name: Other Means Question
    semantic_type: action
    question_template_en: Could an action other than {A} also achieve {G}?
    answer_en:
      against: "yes"
      for: "no"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undercutter
      target: argument
- id: CQ:side_effect
  record:
    name: Side Effects Question
    semantic_type: causality
    question_template_en: Would doing {A} have bad side effects?
    answer_en:
      against: "yes"
      for: "no"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undercutter
      target: argument
- id: CQ:possibility
  record:
    name: Possibility Question
    semantic_type: causality
    question_template_en: Is {A} actually possible?
    answer_en:
      against: "no"
      for: "yes"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undermining
      target: premise
      target_premise_pattern: possible({A})
- id: CQ:best_means
  record:
    name: Best Means Question
    semantic_type: action
    question_template_en: Is {A} the best way to achieve {G}?
    answer_en:
      against: "no"
      for: "yes"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undercutter
      target: argument
- id: CQ:evidence
  record:
    name: Evidence Question
    semantic_type: truth
    question_template_en: Is there enough evidence that doing {A} brings about {G}?
    answer_en:
      against: "no"
      for: "yes"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undercutter
      target: argument
- id: CQ:likelihood
  record:
    name: Likelihood Question
    semantic_type: truth
    question_template_en: How likely is it that the claimed link actually holds?
    answer_en:
      against: unlikely
      for: likely
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undermining
      target: premise
- id: CQ:other_event
  record:
    name: Other Event Question
    semantic_type: causality
    question_template_en: Could something other than {B} better explain why {A} is
      observed?
    answer_en:
      against: "yes"
      for: "no"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undercutter
      target: argument
- id: CQ:expertise
  record:
    name: Expertise Question
    semantic_type: source
    question_template_en: How credible is {W} as an expert on {D}?
    answer_en:
      against: not credible
      for: credible
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undermining
      target: premise
- id: CQ:field
  record:
    name: Field Question
    semantic_type: property
    question_template_en: Is {S} really a matter of {D}?
    answer_en:
      against: "no"
      for: "yes"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undermining
      target: premise
- id: CQ:opinion
  record:
    name: Opinion Question
    semantic_type: truth
    question_template_en: Did {W} really say that {S}?
    answer_en:
      against: "no"
      for: "yes"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undermining
      target: premise
- id: CQ:trustworthiness
  record:
    name: Trustworthiness Question
    semantic_type: source
    question_template_en: Is {W} honest and unbiased?
    answer_en:
      against: "no"
      for: "yes"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undercutter
      target: argument
- id: CQ:consistency
  record:
    name: Consistency Question
    semantic_type: truth
    question_template_en: Do other credible sources agree that {S}?
    answer_en:
      against: "no"
      for: "yes"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undercutter
      target: argument
- id: CQ:backup_evidence
  record:
    name: Backup Evidence Question
    semantic_type: truth
    question_template_en: Is what {W} says based on evidence?
    answer_en:
      against: "no"
      for: "yes"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undermining
      target: premise
      target_premise_pattern: based_on_evidence(asserts({W},{S}))
- id: CQ:position
  record:
    name: Position to Know Question
    semantic_type: source
    question_template_en: Is {W} really in a position to know about {D}?
    answer_en:
      against: "no"
      for: "yes"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undermining
      target: premise
- id: CQ:difference
  record:
    name: Difference Question
    semantic_type: property
    question_template_en: Does the case of {C} differ from this one in relevant ways?
    answer_en:
      against: "yes"
      for: "no"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undercutter
      target: argument
- id: CQ:truth
  record:
    name: Truth Question
    semantic_type: truth
    question_template_en: Is {A} really true in the case of {C}?
    answer_en:
      against: "no"
      for: "yes"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undermining
      target: premise
- id: CQ:other_case
  record:
    name: Other Case Question
    semantic_type: property
    question_template_en: Is there a case more on point than {C} in which {A} is false?
    answer_en:
      against: "yes"
      for: "no"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undercutter
      target: argument
- id: CQ:legitimate_value
  record:
    name: Legitimate Value Question
    semantic_type: value
    question_template_en: Is {V} really a positive value for {A}?
    answer_en:
      against: "no"
      for: "yes"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undermining
      target: premise
- id: CQ:value_effect
  record:
    name: Value Effect Question
    semantic_type: value
    question_template_en: Does {V} really support the goal {G} for {A}?
    answer_en:
      against: "no"
      for: "yes"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undermining
      target: premise
- id: CQ:conflicting_goals
  record:
    name: Conflicting Goals Question
    semantic_type: value
    question_template_en: Does the goal {G} conflict with other goals that should
      be considered?
    answer_en:
      against: "yes"
      for: "no"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undercutter
      target: argument
- id: CQ:intervening_actions
  record:
    name: Intervening Actions Question
    semantic_type: causality
    question_template_en: Would something else have to happen, or be done, before
      {A} could achieve {G}?
    answer_en:
      against: "yes"
      for: "no"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undercutter
      target: argument
- id: CQ:goal_possible
  record:
    name: Goal Possibility Question
    semantic_type: causality
    question_template_en: Can the goal {G} be achieved at all?
    answer_en:
      against: "no"
      for: "yes"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: undermining
      target: premise
      target_premise_pattern: possible({G})
- id: CQ:opposite_consequences
  record:
    name: Opposite Consequences Question
    semantic_type: action
    question_template_en: Would doing {A} also have good consequences, to weigh against
      {G}?
    answer_en:
      against: "yes"
      for: "no"
    caes_mapping:
      positive_answer_type: support
      negative_answer_type: rebuttal
      target: conclusion
