# The game's sentences (D094 (f); rule (e) of docs/c5-game.md, C5.2): the
# templates of core.yml's language, where they differ from walton.yml's,
# each group with its reason, and the sentence of each predicate's negation,
# which walton.yml does not give. A predicate the game plays and this file
# does not record reads as walton.yml's template. wag-cli --catalogue-gen
# reads this file and does not rewrite it.
differences:
- reason: 'The board''s sentences since the game''s first data (core.yml before step C5), which D094 (f) keeps:
    shorter than walton.yml''s, and written to read with the players'' own words, which the board quotes.'
  templates:
    asserts/2: '%s says that %s.'
    based_on_evidence/1: '%s, and this is based on evidence.'
    biased/1: '%s is biased.'
    brings_about/2: Doing %s brings about %s.
    credible_source/2: '%s is a credible expert on %s.'
    current_circumstances/1: The current situation is %s.
    expert/2: '%s is an expert in %s.'
    finding_true/1: '%s is observed.'
    in_case/2: '%s is true in the case of %s.'
    in_domain/2: '%s is a matter of %s.'
    inconsistent_with_other_experts/1: Other experts disagree that %s.
    intervening_actions/2: Something else would have to happen, or be done, before %s could achieve %s.
    judged_positive_value/2: '%s is a positive value for %s.'
    more_on_point/2: '%s is false in a case more on point than %s.'
    other_credible_sources_disagree/1: Other credible sources dispute %s.
    position_to_know/2: '%s is in a position to know about %s.'
    positive_affects/3: '%s supports the goal %s for %s.'
    reason_retaining_goal/2: '%s is a reason to keep the goal %s.'
    relevant_differences/1: The case of %s differs in relevant ways.
    should_be_performed/1: '%s should be done.'
    similar_case/1: '%s is a similar case.'
    strong_correlation/2: '%s and %s are strongly correlated.'
    true_in_situation/1: '%s holds in the current situation.'
    untrustworthy/1: '%s is not a trustworthy source.'
    would_be_realized/2: The goal %s would be achieved in %s.
    would_bring_about/3: Doing %s in the situation %s would lead to %s.
    would_promote_value/2: Achieving %s would promote the value %s.
- reason: 'The board''s sentence, with the book''s "generally" (D009: sign''s premise keeps it, since step C5.2).'
  templates:
    indicated_true/2: '%s is generally indicated when %s holds.'
negations:
  asserts/2: '%s does not say that %s.'
  bad/1: '%s is not bad.'
  bad_outweighs/2: The action %s has no bad consequences that outweigh %s.
  based_on_evidence/1: '%s, but this is not based on evidence.'
  biased/1: '%s is not biased.'
  bring_about_more_effectively/3: There is no way for %s to reach the state %s more effectively than %s.
  brings_about/2: Doing %s does not bring about %s.
  credible_source/2: '%s is not a credible expert on %s.'
  current_circumstances/1: The current situation is not %s.
  dishonest/1: '%s is honest.'
  done_in_time/2: '%s cannot be done before the decision on action %s must be taken.'
  expert/2: '%s is not an expert in %s.'
  finding_true/1: '%s is not observed.'
  gain_discounted_by_bearer/2: In deciding on action %s, the gain %s does not count for less because of whom it
    would go to.
  goal_of_agent/2: None of the goals of %s is %s.
  good/1: '%s is not good.'
  good_outweighs/2: The action %s has no good consequences that outweigh %s.
  harm_discounted_by_bearer/2: In deciding on action %s, the harm %s does not count for less because of whom it
    would fall on.
  in_case/2: '%s is not true in the case of %s.'
  in_domain/2: '%s is not a matter of %s.'
  incompatible_goal/2: No other goal of %s is incompatible with %s.
  inconsistent_with_other_experts/1: Other experts agree that %s.
  indicated_true/2: '%s is not generally indicated when %s holds.'
  intervening_actions/2: Nothing else would have to happen, or be done, before %s could achieve %s.
  judged_positive_value/2: '%s is not a positive value for %s.'
  legitimate_value/1: '%s is not a legitimate value.'
  matters_more/2: '%s does not matter more than %s.'
  matters_to_decision/2: The chance that action %s brings about %s is not large enough, given what that consequence
    would be, to bear on whether the action should be performed.
  may_be_unwise_to_perform/2: It is not the case that action %s may be unwise to perform because of %s.
  may_be_worth_performing/2: It is not the case that action %s may be worth performing for the sake of %s.
  may_bring_about/2: There is no real chance that the action %s brings about %s.
  more_effective_means/4: 'For %s, %s would not realize %s more effectively than %s: not more surely, sooner or
    at lower cost.'
  more_on_point/2: '%s is not false in any case more on point than %s.'
  other_credible_sources_disagree/1: No other credible source disputes %s.
  position_to_know/2: '%s is not in a position to know about %s.'
  positive_affects/3: '%s does not support the goal %s for %s.'
  possible_bring_about/2: It is not possible for %s to bring about %s.
  possible_goal/1: '%s is not possible.'
  promote_more_effectively/3: There is no way for %s to promote the value %s more effectively than %s.
  realize_more_effectively/3: There is no way for %s to realize the goal %s more effectively than %s.
  reason_retaining_goal/2: '%s is no reason to keep the goal %s.'
  relevant_differences/1: The case of %s does not differ in relevant ways.
  settles_whether/3: '%s would not settle, reliably enough for the decision, whether action %s brings about %s.'
  should_be_performed/1: '%s should not be done.'
  similar_case/1: '%s is not a similar case.'
  strong_correlation/2: '%s and %s are not strongly correlated.'
  too_slight/2: In deciding on action %s, %s is not too slight a consequence to count.
  true_in_situation/1: '%s does not hold in the current situation.'
  untrustworthy/1: '%s is a trustworthy source.'
  worth_finding_out_first/2: 'It is not worth finding out first whether action %s would bring about %s: that possibility
    counts in deciding on the action now.'
  worth_its_costs/3: The costs and risks of %s are not worth bearing to know whether action %s brings about %s before
    that possibility counts in the decision.
  worthy_goal/1: '%s is not a worthy goal.'
  would_be_realized/2: The goal %s would not be achieved in %s.
  would_bring_about/3: Doing %s in the situation %s would not lead to %s.
  would_promote_value/2: Achieving %s would not promote the value %s.
