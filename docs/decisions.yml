- id: D029
  title: Whether the practical analogies rebut each other
  question: >-
    Should carry_out_wrong(A2,X) be read as ¬carry_out_right(A2,X), so that
    the two practical analogies rebut each other, or should they stay apart?
    A third answer is proposed with D001 and D028: the two-case form, an
    action in each situation joined by a correspondence premise, concluding
    that the target action should, or should not, be performed, so that the
    pair rebut each other and meet the practical schemes. A closer situation
    in which the course went the other way is then a practical analogy of
    the opposite sign, which rebuts directly. The owner approved this answer
    on 2026-10-22 (proposal version 3).
  category: vocabulary
  blocks: [verification, game]
  decider: owner
  priority: 2
  status: decided
  items:
    - {entry: practical_analogy_positive, kind: other, about: "Conclusion"}
    - {entry: practical_analogy_negative, kind: other, about: "Conclusion"}
  docs: ["docs/proposals/D001-D028-D029.md"]
  decided:
    date: "2026-10-22"
    by: owner
    decision: >-
      The third answer: the two-case form, an action in each situation joined
      by corresponds(X1,X2), concluding should_be_performed(X2) and its
      negation, so that the two rebut each other and meet the practical
      schemes (proposal D001-D028-D029, version 3). Approved after two
      independent reviews and a short independent check.
    recorded: "docs/scheme-registry/walton-clean/tools/edits.py (ANALOGY) and CHANGELOG.md; docs/scheme-registry/links.json; the catalogue entries; docs/kialo-batch2 (gold, guidelines); docs/proposals/D001-D028-D029.md"

