- id: D069
  title: Harms of not acting
  question: >-
    Four candidates concern a harm that follows if an action is not done
    (docs/candidates.md, the group "Harms of not acting"): C015, a harm of
    not acting to others or to society, which the consequence forms cover
    only for the one who would act (33.3's parenthetical, D027; 33.4), and
    which the guidelines code as positive consequences of the action, with
    the harm's not happening as G (§3.1, OC13; the book's p. 101 places harms to a
    third party in the pity appeals, 38 and 39, whose conclusions meet
    nothing, D063); C016, a question whether doing the action would avert
    the harm, which 33.4 lacks and fear states; C020, one consideration
    framed as a gain and as an averted harm; and C023, doing against
    allowing, whether the agent is bound to prevent a harm at all. Should
    the first become a scheme of its own, or stay a coding rule? C015 meets
    the threshold.
