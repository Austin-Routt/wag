- id: D053
  title: Declared polarity pairs
  question: >-
    Should positive/negative scheme pairs be declared as polarity pairs and
    checked, never merged (the entries, walton.yml's schemes and the game's
    schemes stay one per polarity)? As revised after the two independent
    reviews of 2026-10-22: pairs are declared in families.json's counterpart
    relation and checked by the registry. The conclusions are p and ¬p.
    Every other formula is shared, or a flip of a declared kind: p and ¬p;
    two predicates declared contraries with the same arguments (good and
    bad, right_to_do and wrong_to_do); or a sided flip, two predicates for
    the two directions with the same arguments (difference_against and
    difference_for). The questions have the same targets, or targets that
    are declared flips of each other; their wording may flip. Every shared exception or assumption is declared neutral as to
    polarity by a person, and the declaration is tested: one example per
    side, run in the engine, must show that proving it for a reason that
    favours either side should defeat both. The registry also reports exact
    pairs that nobody declared. The engine does not enforce declared
    contraries: both can be accepted at once. Pairs: the practical analogies
    (8.1, 8.2), with D029; consequences (33.1, 33.2), now that D055 is decided (2026-10-23);
    ethotic argument (41), once ethotic2's conclusion is checked (¬S, where
    the book reads the claim as less plausible). Model and antimodel (6.3,
    6.4) differ in more than a flip, so they would be a looser counterpart,
    not checked as exact. Not values (19.1, 19.2), whose conclusions are two
    reasons that can hold together; falsification only after D054.
  category: vocabulary
  blocks: [verification]
  decider: owner
  priority: 2
  status: decided
  docs: ["docs/proposals/D001-D028-D029.md"]
  decided:
    date: "2026-10-22"
    by: owner
    decision: >-
      Yes, as revised: declared and checked, never merged, with the sided
      flip and the tested neutrality declaration. The registry's check is
      to build.
      Declared 2026-11-25 by the owner, on an external assessment of proposal
      D008-D074 version 4 and the developer's analysis of it: too_slight(A,G)
      is neutral as to polarity in the pair 33.1 and 33.2 and in their modal
      variants. Its scope: G, as a consequence of A, judged by the criteria
      that bear on the decision on A, is too slight to count; not merely that
      G reaches few, is small in number, or seems minor to one side (one grave
      consequence can decide, D065). The declaration is tested in the engine,
      one example per side. The bridges' information-first exception is
      declared once proposal D008-D074 version 5 has been reviewed; the
      appeal to consequences (D074) shares no formula, so it needs none.
      Declared 2026-11-25 by the owner, after the reviews of version 5
      and its amendments, in the words of a reviewer's draft the owner
      adopted: "I declare `worth_finding_out_first(A,G)` neutral as to
      polarity between `bridge_from_possible_good` and
      `bridge_from_possible_harm`, when both concern the same action A,
      consequence G, and decision context. The exception means that it is
      worthwhile to determine whether A would bring about G before allowing
      that possibility to influence the decision. The investigation must be
      sufficiently timely and reliable to resolve the relevant question, and
      its costs and risks must justify obtaining the information first. The
      critic bears the burden of establishing the exception. Merely asserting
      that the consequence could be investigated, without establishing the
      stronger conditions, does not satisfy that burden. An unresolved tie
      goes against the critic under the declared evaluation rule. When
      established, the exception defeats both applicable modal bridges,
      regardless of which side supports it. It does not defeat the modal
      consequence arguments themselves, independent categorical arguments,
      bridges concerning different consequences, or arguments in other
      decision contexts. It does not suspend the decision on A; remaining
      arguments continue to determine the outcome under the game's rules.
      This is a deliberate WAG formalization consistent with D003, D008, D053
      and the revised C3 proposal." How WAG applies it: a reply addressed to
      a categorical argument about the same link challenges its
      brings_about(A,G) (33/CQ1 or CQ2; guidelines OC15). A bare claim of
      knowability is coded as arguing the exception without making it out
      (OC15), and the game's CQ answer contract (item F, step C5.2) is to
      refuse it as an answer, the burden of production not met (Walton and
      Gordon 2015, p. 525; "Types of Dialogue and Burdens of Proof", p. 5);
      until then the engine lets it stand, as any argument, until it is
      answered (the tactical burden), and a tie goes against the critic under
      the preponderance standard. Tested in the engine, one example per side,
      each side proving it for a reason of its own
      (wag/internal/carneades/consequences_c3_test.go). Since 2026-11-26 an
      answer that makes the conditions out is an argument of
      finding_out_first (D095 (3), proposal D095), tested in the engine one
      premise at a time (wag/internal/carneades/finding_out_first_test.go);
      from step C5.2 the game accepts it at the question and refuses Other
      there.
    recorded: "docs/decisions.yml; docs/proposals/D001-D028-D029.md; docs/proposals/D008-D074.md (the declarations of 2026-11-25); docs/proposals/D095.md (the answer scheme, 2026-11-26)"

- id: D054
  title: Falsification's conclusion
  question: >-
    evidence_hypothesis_falsification concludes ¬A, the event, which its
    premise already says is false; the book concludes that the hypothesis is
    false (¬H), and verification, its positive counterpart, concludes H. Its
    assumption also reverses the arguments of verification's
    sufficient_correlation(H,A). Correct both?
  category: scheme
  blocks: [verification]
  decider: owner
  priority: 2
  status: decided
