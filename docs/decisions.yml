    recorded: "docs/c5-game.md (version 4); (3)'s answer scheme applied 2026-11-26: docs/proposals/D095.yml (version 2, after an independent review; 2a after the check of its application), walton.yml through edits.py (FINDING_OUT_D095), families.json, positions.json, the catalogue entries, docs/kialo-batch2 (guidelines §3.1 and OC15, rule cases OC15-c, OC15-f and OC15-g, two retired wordings, validate.py's R11); (1) and (3) in the game at step C5.2's switch, 2026-11-27 (one question at one formula, CQ:bad_outweighs at the outweighing exception; CQ:worth_finding_out_first at both bridges' exception, refusing Other; finding_out_first plays as AS:finding_out_first); item F's tests of the rest at step C5.2's step 7"

- id: D096
  title: A fragment and the argument its discussion needs (the first gold, 13292.108)
  question: >-
    13292.108 states only that meat production and consumption harm the
    environment, but its record in round 1 of the first gold binds the whole
    environmental argument for the meat tax, the tax and the goal supplied,
    because the thesis has no argument for the pros to attach to; seven claims
    target the supplied part (D086 round 1, question 1). Should the fragment
    carry the argument, or stay as it is stated beside a separately identified
    reconstruction?
  category: annotation
  blocks: [annotation, verification]
  decider: owner
  priority: 1
  status: decided
  docs: ["docs/d086-first-gold.md §11", "wag-workspace verify/d086/OWNER-BATCH-2026-11-27.md (Q1)"]
  decided:
    date: "2026-11-27"
    by: owner ("Yes. Based on your analysis and recommendations, please proceed to close all remaining gaps", 2026-11-27, in reply to the decision batch, wag-workspace verify/d086/OWNER-BATCH-2026-11-27.md), on the developer's and the other reviewer's recommendation
    decision: >-
      Two layers. A fragment keeps what it states. Where claims target parts of
      an argument that the discussion needs and no claim states, the gold adds a
      separately identified reconstruction of that argument, marked as the
      discussion's, not a claim's, and those targets move to it: for 13292.108's
      environmental argument, 13292.5, .147 and .174 at its conclusion and
      13292.6, .13, .104 and .127 at its supplied premises; the claims at the
      circumstances 13292.108 states keep their targets. How a reconstruction is
      identified in the annotation records goes through a proposal.
    recorded: "Applied 2026-11-27. The format: docs/annotation-records.md §13 (an instance by the discussion, rule R20), with cases RC1-RC15 written before their tests and code (docs/d086-first-gold.md §6); validate.py and the Go check (R20), agreement (the instances field leaves it out), the replay (to_wag.py plays it first, and a move at the premise a fragment backs at the argument it backs). The gold by recode_d096.py, round 1's draft 3, part 2: the thesis's instance 13292.1#2, by the discussion; 13292.108 a fragment backing its circumstances; 13292.5, .6, .13, .104, .127, .147 and .174 at 13292.1#2 (13292.13 at its efficacy premise, which the decision calls supplied: the gold infers it, citing 13292.14, which states it, as §13 asks); 13 items recoded; the 7 claims pending Q1 released, and 13292.1, .5, .147 and .174, agreed at draft 1, back to review (d086-rounds.json). After the independent review of the application (wag-workspace verify/d096/REVIEW-application.md): the replay's move follows the reconstruction's own conclusion, R20's citation and target checks have no gap, Go checks R19, and the guidelines and §13 say whose instance it is and which claims back or are cited (2026-11-28)"

- id: D097
  title: The causal exception names its effect
  question: >-
    walton.yml's cause_to_effect and its modal variant have one exception,
    interference(E1), which names only the cause. Three such formulas are shared
    by causal steps with different effects in the gold, so an answer that blocks
    one effect (13292.182 and .198, against anemia) would also block an
    unrelated step from the same cause once causal schemes are played (D086
    round 1, G2). Should the exception name its effect?
  category: scheme
  blocks: [annotation, game]
  decider: owner
  priority: 1
  status: decided
  docs: ["docs/d086-first-gold.md §11", "wag-workspace verify/d086/OWNER-BATCH-2026-11-27.md (G2)"]
  decided:
    date: "2026-11-27"
    by: owner ("Yes. Based on your analysis and recommendations, please proceed to close all remaining gaps", 2026-11-27, in reply to the decision batch, wag-workspace verify/d086/OWNER-BATCH-2026-11-27.md), on the developer's and the other reviewer's recommendation
    decision: >-
      Yes: interference(E1,E2), that something interferes with E1 bringing about
      E2, in cause_to_effect and cause_to_effect_modal, through a proposal and
      edits.py, with links.json's 28 CQ3, the catalogue entries, the gold's
      causal instances and challenges recoded, the targets of 13292.182 and .198,
      and new pins. The format-1 walton.yml stays frozen.
    recorded: "The same decision as D071 (2026-11-22). docs/proposals/D040-D071-D097.yml (version 2, after an independent review), applied 2026-11-27: walton.yml through edits.py (CAUSAL_D097); links.json (28 CQ3); the catalogue entries; engine tests; the gold by recode_d097.py (17 causal instances, 6 challenges, 13292.182 and .198; re-pinned), the start of round 1's draft 3: the 10 claims pending G2 released, the 7 agreed among them back to review (d086-rounds.json); guidelines §5 item 11 and rule case OC6-d. Version 2b (2026-11-28), after the independent review of the application: a factor that only makes the effect smaller answers neither the exception nor the first question (§5 item 11, the catalogue entries); the CHANGELOG's row; validate.py's R21 and the proposal check tie the gold's English and the applied templates to walton.yml. The template's wording, 'Another causal factor in this case keeps, or would keep, E1 from bringing about E2', narrows the decided 'that something interferes with E1 bringing about E2' (process.md §5): it is put to the owner as a choice of its own, and stays as applied meanwhile (an exception that holds undercuts the step, so it must stop the effect, not lessen it); guidelines §5 item 11's line that a factor that only lessens the effect answers neither question, and both catalogue entries' answers to 28 CQ3, follow the choice. Version 2c (2026-11-28): the catalogue effect on the examples worded again"

