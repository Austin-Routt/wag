# The decision register (docs/process.md §5): every open decision of the
# project. Edit this file; docs/decisions.md is generated from it by
# `wag-cli --catalogue-gen`, and `wag-cli --catalogue-check` keeps it in step
# with the catalogue: every catalogue discrepancy whose decision begins
# "Open" must be listed under an open decision here.
#
# Fields: id (D and three digits, never reused); title; question; category
# (scheme, vocabulary, game, annotation, book, metadata, project); blocks
# (game, verification, annotation, play, release); decider (owner, verifier,
# data, play); priority (1 holds up the next steps, 2 later work, 3 can
# wait); status (open, decided); items (catalogue discrepancies, by entry,
# kind and about); docs (documents that raise it); decided (date, by,
# decision, recorded) once taken. When a decision is taken, also update the
# entries it lists, so that they no longer say "Open".

note: >-
  The priorities were proposed on 2026-10-22, when the register was made
  (review part 13), and confirmed by the owner the same day. "The next steps" are
  steps 3 and 4 of the alignment plan's order: the game's fields for the 9 game
  schemes with the generator, and verifying tier 1. Not yet registered: the
  semantic concerns recorded in walton-clean/CHANGELOG.md and the walton.yml
  audit (docs/walton-audit/REPORT.md), of which D054 is one; they are being
  added. D055 is a defect found by the independent review of proposal
  D001-D028-D029.

decisions:

# --- Priority 1: the game's schemes, and who verifies -----------------------

- id: D001
  title: Analogy with a source and a target case (audit N12)
  question: >-
    Should analogy get a two-case scheme, with separate propositions for the
    source and the target case and a premise that they correspond, as
    proposed in part 6 §4? The game's analogy question waits on it. The
    options were A, keep today's formula; B, add a two-case scheme beside
    analogy; C, replace analogy's formula, keeping its id, title and links.
    The owner chose C on 2026-10-22, to be made once the proposal's examples
    are approved. The owner approved the proposal on 2026-10-22 with the
    second independent review's changes (version 3: a directional difference
    exception that names the claim, difference_against(C1,C2,P2); the book's
    CQ3 as a counter-analogy against the conclusion), subject to a short
    independent check; this decision closes when the change is made.
  category: scheme
  blocks: [game, verification]
  decider: owner
  priority: 1
  status: decided
  items:
    - {entry: analogy, kind: book-walton, about: "variables (N12)"}
  docs: ["docs/review-2026-10-13-part5.md §7", "docs/review-2026-10-15-part6.md §4", "docs/catalogue-alignment.md §3 C5", "docs/proposals/D001-D028-D029.md"]
  decided:
    date: "2026-10-22"
    by: owner
    decision: >-
      Option C, in the form of proposal D001-D028-D029, version 3: a claim in
      each case (P1, P2) joined by corresponds(P1,P2); similar_to(C1,C2); the
      exception difference_against(C1,C2,P2); the book's CQ3 answered by a
      counter-analogy against the conclusion. Approved after two independent
      reviews and a short independent check. The game takes it at workstream
      E (D057).
    recorded: "docs/scheme-registry/walton-clean/tools/edits.py (ANALOGY) and CHANGELOG.md; docs/scheme-registry/links.json; the catalogue entries; docs/kialo-batch2 (gold, guidelines); docs/proposals/D001-D028-D029.md"

