    recorded: "docs/scheme-registry/walton-clean/tools/edits.py (CONSEQUENCES) and CHANGELOG.md; docs/scheme-registry/links.json; wag/data/schemes/families.json; the catalogue entry negative_consequences_prudential; docs/proposals/D055-D059.md"

- id: D057
  title: Analogy's reach in the game
  question: >-
    Once analogy concludes a bare claim again (D001), should it answer every
    critical question, as a thesis-independent scheme does today, including
    the argument-locus questions (CQ:evidence, CQ:other_event), where its
    correspondence premise would pair a claim about a case with a statement
    about an argument? Or only questions at a premise, assumption,
    exception or conclusion locus (the last for the counter-analogy that
    answers CQ:other_case, as the book's CQ3 now is): by explicit backup
    edges (thesis_independent stays false) or by a locus limit on thesis
    independence (code, lint and tests)? In play it may also conclude should-claims and be played as an
    undercutter (D056); the choice between analogy and the practical
    analogies is a rule for annotation.
  category: game
  blocks: [game]
  decider: owner
  priority: 2
  status: decided
  items:
    - {entry: analogy, kind: other, about: "game questions"}
  docs: ["docs/proposals/D001-D028-D029.md", "docs/proposals/D055-D059.md"]
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      Only questions at a premise, assumption, exception or conclusion locus,
      by explicit backup edges, and CQ:other_case by the counter-analogy; no
      blanket thesis independence. Argument-locus questions need an explicit
      target and a fitting rule (D075).
    recorded: "docs/decisions.yml; to apply: the NASCQ generator and the game's data (plan §0, stage 2)"

- id: D061
  title: Three presets weigh a game scheme's variants differently
  question: >-
    The policy, scientific and legal presets weigh AS:consequences (0.70,
    0.35, 0.40) and AS:practical_reasoning, but do not name
    AS:negative_consequences or AS:practical_reasoning_goal, which keep
    their default weight (0.65). So under policy a positive consequences
    argument beats an equal negative one, and under scientific and legal the
    negative one wins, though the presets mean to weigh consequences alike
    and say nothing of their sign. Should every preset give
    AS:negative_consequences the weight of AS:consequences, and
    AS:practical_reasoning_goal that of AS:practical_reasoning, with a test
    that a preset weighing schemes by name names every game scheme? Found
    by the independent review of proposal D055-D059 (its game test shows
    the two sides tie in every preset once the weights are added); the
    proposal applies it if the owner agrees. It also moves negative
    consequences against the other schemes in those presets, as they
    intend: under policy it ties value-based practical reasoning, which
    beats it today; under scientific it falls below sign, position to know,
    analogy and Other (from a tie with sign today); under legal below expert
    opinion, sign and analogy, level with Other (from a tie with expert
    opinion today, and below position to know there already).
  category: game
  blocks: [play]
  decider: owner
  priority: 2
  status: decided
  docs: ["wag/data/contexts.json", "docs/proposals/D055-D059.md"]
  decided:
    date: "2026-10-23"
    by: owner
    decision: >-
      Yes: the policy, scientific and legal presets give
      AS:negative_consequences the weight of AS:consequences and
      AS:practical_reasoning_goal that of AS:practical_reasoning, and a test
      checks that a preset weighing schemes by name names every game scheme.
    recorded: "wag/data/contexts.json; wag/internal/game/premise_test.go (TestContexts)"

- id: D063
  title: Practical conclusions that meet nothing
  question: >-
    D059 makes the prudential form conclude should_be_performed(X), so that
    it meets the other arguments about doing X. The family's other practical
    schemes conclude predicates that no other scheme concludes or uses:
    fear (ought_to_bring_about), danger (should_not, D062), threat
    (not_bring_about, D060), the pragmatic argument from alternatives and
    the disjunctive threat (do_other), waste (ought_to_continue), help
    (carry_out), distress (bring_relief) and two-person practical reasoning
    (should_carry_out). In WAG's engine an argument from fear for doing X
    has no contact with a consequence argument against X. Should each
    conclude should_be_performed or its negation for its action, keeping
    what is particular to it (the speaker's threat, the agent who helps) in
    its premises and questions? help, distress and two-person practical
    reasoning name an agent, which should_be_performed does not. The
    practical reasoning family has the same gap in its own schemes:
    practical inference (22.1, carry_out_action, shared only with the appeal
    to vanity), the necessary- and sufficient-condition schemes (22.2, 22.3,
    bringing_about_action), practical_goal (22.5, should_do, shared only with
    the arguments from a model and an antimodel), and regulative_rule
    (must_do). D016 asks the same of alternative_normative. Found by the
    independent reviews of proposal D055-D059 (the second added the
    practical reasoning family). Schemes whose conclusions are not practical
    claims are outside this decision.
  category: vocabulary
  blocks: [verification]
  decider: owner
  priority: 2
  status: decided
  docs: ["docs/proposals/D055-D059.md", "docs/candidates.md", "docs/review-2026-11-22-stages.md"]
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      Recommendations of an action that name no agent but the one addressed
      conclude should_be_performed(A) or its negation, as D059 and D029 did:
      fear, danger, threat, the pragmatic argument from alternatives and the
      disjunctive threat, among others. Conclusions that name an agent (help,
      distress, two-person practical reasoning, practical_goal's
      should_do(P,X), waste) keep the agent, and a bridge scheme with its own
      exception (the agent is not the one deliberating) connects them to
      should_be_performed(A). Requirements and permissions stay apart (D016).
      (The review proposed sharing only identical propositions and bridging
      the rest; this applies that rule with D059's precedent.) Refined
      2026-11-22 under the standing rule, on ChatGPT's review of stages 0 and
      1: the bridge needs the agent and the deliberation context positively
      the same, or explicitly mapped. The exception alone is not enough: an
      exception nobody raises is presumed not to hold, so an unknown agent
      would pass. Continuing an activity binds to the continuing action, not
      only to its goal.
    recorded: "docs/proposals/D004-D075.yml, applied in part 2026-11-24 (practical_inference and the two condition schemes); docs/proposals/D022-D093.yml (version 2), applied 2026-11-26 through edits.py (PRACTICAL_C4): fear, danger, threat, ad_baculum, pragmatic_alternative and appeal_to_vanity_ad_populum conclude should_be_performed or its negation, their links partial; the bridges bridge_from_agent and bridge_from_continuing, with deliberating_agent(P,A) a premise (D093(e)) and the continuing bridge with practical reasoning's questions (D093(f)); help and distress (F16) with their family; the game at step C5"

- id: D070
  title: Practical reasoning's side effects defeat whatever the weights
  question: >-
    practical_reasoning1 and practical_reasoning2 have the exception
    side_effects(A,S1), that the action would have side effects that
    demote some value. As an exception, a side effect that is shown
    defeats the argument however small it is: the reason other_consequences
    was reworded, and the reason proposal D055-D059 reads its third
    question as two routes. Should side_effects read as an outweighing
    claim, with a plain side effect argued as negative consequences, a
    rebuttal? The game asks CQ:side_effect at that exception, and the
    batch-2 gold codes such replies as answers there (13292.174, 13292.5).
    Found by the second independent review of proposal D055-D059.
  category: scheme
  blocks: [verification, game]
  decider: owner
  priority: 2
  status: decided
  docs: ["docs/proposals/D055-D059.md"]
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      Yes: a plain side effect is argued as negative consequences, a rebuttal.
      The exception is renamed for a side effect claimed to outweigh the
      reasons for the action, with the comparison as a premise of its answer
      (D075), so that old weak side-effect facts are not read as the stronger
      claim. The gold's two side-effect answers are recoded in a new version.
      Refined 2026-11-24 by the owner (D091):
      the outweighing reading is WAG's interpretation; the source's
      side-effect exception (Walton and Gordon 2015, p. 515) is any side
      effect that demotes a value. The exception is D055's bad_outweighs(A,G)
      (proposal D004-D075).
    recorded: "docs/proposals/D004-D075.yml; walton.yml through edits.py, applied 2026-11-24; links.json, families.json, the catalogue entries; docs/kialo-batch2 (gold by recode_c2.py, guidelines §3 and §3.1, rule-cases.yml, validate.py R8-R11, the replay); the game (CQ:side_effect) at step C5"

- id: D071
  title: Cause to effect's interference names only the cause
  question: >-
    cause_to_effect and cause_to_effect_modal have the exception
    interference(E1), naming only the cause. Two causal arguments from one
    cause to different effects then share it, and an interference proven
    against one effect defeats the other too (the second independent review
    of proposal D055-D059, engine test), the fault strongly_occur(X) had
    before that proposal. Should it name the effect, interference(E1,E2)?
    The batch-2 gold codes several causal steps from tax_meat beside the
    consequence arguments (D038).
  category: scheme
  blocks: [verification]
  decider: owner
  priority: 2
  status: decided
  docs: ["docs/proposals/D055-D059.md"]
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      Yes: interference(E1,E2) in cause_to_effect and cause_to_effect_modal.
    recorded: "docs/proposals/D040-D071-D097.yml (version 2, after an independent review of version 1, which found D071 left out), applied 2026-11-27: walton.yml through edits.py (CAUSAL_D097) and CHANGELOG.md; links.json (28 CQ3); the catalogue entries cause_to_effect and cause_to_effect_modal; engine tests (wag/internal/carneades/causal_d097_test.go); docs/kialo-batch2 (the gold by recode_d097.py, re-pinned; guidelines §5 item 11; rule case OC6-d); docs/proposals/D008-D074.md written again"

- id: D076
  title: Evidence as records
  question: >-
    A player's evidence is a list of strings, and the evidence rule checks
    only that one is there. What does WAG record about a source, and what does
    admitting it mean?
  category: game
  blocks: [game, annotation]
  decider: owner
  priority: 2
  status: decided
  docs: ["the external reviews of 2026-11-22 (ChatGPT's evidence design)", "wag/internal/server/protocol.go", "docs/review-2026-11-22-stages.md", "docs/evidence-contract.md", "docs/evidence-theory-review.md"]
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      A source is a record: what it is (a URL, a file, a book page), the
      passage or region used, the claim drawn from it, the premise it is
      offered for, each party's assessment, and whether it was admitted, by
      whom and under which rule. Consent and a moderator's admission are
      commitments, not verification. Built in slices from stage 2; the four
      game profiles of the review (cooperative, adversarial, moderated,
      automated) wait for Track D. A moderator's decision on a statement is a
      hard assumption today, and is labelled so. Refined 2026-11-22 under the
      standing rule, on ChatGPT's review of stages 0 and 1: the first evidence
      slice fixes its admission policy before its first episode: two players,
      each consenting to the same revision of the source, one acceptance being
      one party's commitment and silence no consent; withdrawing a consent
      removes only its own route of admission. Captured content is data, never
      instructions (this does not decide D079). Refined 2026-11-23 under the
      standing rule, on the evidence-theory review: a consent is to the exact
      binding, that is the source and its representation, the passage, the
      source's assertion, the offered interpretation and warrant, the target,
      the role, the context and the policy, so agreeing on the same document
      is not enough. Admission is for consideration only: not a stipulation, a
      moderator's ruling, the engine's acceptance or a finding of fact.
      wag-evidence/0.1 checks this offline, outside the game
      (docs/evidence-contract.md).
    recorded: "docs/decisions.yml; to apply: the game's moves and export (plan §0, stage 2)"

- id: D077
  title: Evidence captured for research
  question: >-
    Should the evidence cited in the data (the links of Kialo claims, the
    sources players cite) be captured whole, and where is it kept?
  category: project
  blocks: [annotation]
  decider: owner
  priority: 2
  status: decided
  docs: ["the owner's notes of 2026-11-22", "wag-workspace README.md"]
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      Yes, for research purposes, under the fair use doctrine (the owner,
      2026-11-22): the whole source as cited, and the part each reader used,
      with every assessment. It is kept in the private workspace, large files
      in Git LFS, never in the public repository. First the links of the
      claims a pilot annotates. Terms of use, privacy and injected
      instructions are D079.
    recorded: "wag-workspace README.md; docs/plan.md"

- id: D078
  title: Rewriting the public history
  question: >-
