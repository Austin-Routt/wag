- id: D075
  title: Answering a question with an argument
  question: >-
    How does an argument answer a critical question whose answer is an
    exception or an assumption? Today a backup edge may carry a sentence (a
    bridge) that lets an argument stand for an answer it does not conclude,
    and nothing on the board can be challenged. The external reviews of
    2026-11-22 (Fable, ChatGPT) and WAG's review of 15 October (part 6 §4, the
    schemes bad_side_effect and better_means, never registered) propose answer
    schemes: schemes whose conclusion is the answer.
  category: game
  blocks: [game]
  decider: owner
  priority: 1
  status: decided
  docs: ["docs/review-2026-10-15-part6.md §4", "docs/game-rules.md", "the external reviews of 2026-11-22 (wag-workspace reviews/2026-11-22)", "docs/review-2026-11-22-stages.md"]
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      Answer schemes. An answer scheme concludes the exception or assumption
      it answers; its premises name the witness (the harm, the other action)
      and bind every variable of what it answers; it has its questions (the
      book's, derived ones, or a reasoned none). A free-text bridge is a lint
      error. Each backup edge has a test answer that must pass, one that must
      be refused, and one bound to the wrong target. The first answer schemes
      are C003's (D064), the side effect that outweighs (D070) and another
      means that does better, with part 6's sketches repaired (their side
      effect left a variable unbound). D009, D038, D057 and D063's bridges
      follow this rule. Refined 2026-11-22 under the standing rule, on
      ChatGPT's review of stages 0 and 1: answer schemes bind agent and
      context positively (D063). The lint rule against free-text bridges
      landed in stage 1, and a saved game a bridge let through stops at that
      move with the reason. An engine scheme shared by two game schemes is a
      lint error, since the game records which one was played.
    recorded: "docs/proposals/D004-D075.yml; applied in part 2026-11-24 through edits.py: the first answer schemes (bad_outweighs_good, good_outweighs_bad, better_means) and validate.py R8 and R11; to apply: the answer contract (stage 2, item F), the other answer schemes and the game's backup edges (step C5)"

- id: D082
  title: What a full NASCQ means
  question: >-
    The goal is that every scheme and question be playable in some context.
    What does full mean, and how is it measured?
  category: project
  blocks: [game]
  decider: owner
  priority: 1
  status: decided
  docs: ["docs/plan.md", "the external reviews of 2026-11-22 (Fable's addendum, ChatGPT's NASCQ review)"]
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      Two things. Within a versioned set of schemes and questions, every
      question can be asked and every answer the set offers has a tested
      contract (target, binding, effect, refusal, replay): this is checked.
      Beyond it, completeness is measured, never proven: the plan's two
      measures, and two more: the share of the answers found in coded data and
      in play that can be played as meant, and the share of answers that
      should be refused that the game refuses. Confirmed by the owner on
      2026-11-24, the goal's wording unchanged.
    recorded: "docs/plan.md (the goal)"

- id: D086
  title: Who makes the first gold, and who verifies it
  question: >-
    Batch 2's reference annotation was made by models, and D045 requires a
    person to verify. The critical review of 2026-11-23 (its answer 2): keep
    the gold first, as a bounded first gold a person has verified rather
    than a complete corpus; a reference made by models is development
    material, not gold. Who makes the first gold, and who verifies it?
  category: annotation
  blocks: [annotation]
  decider: owner
  priority: 1
  status: decided
  docs: ["docs/plan.md §0 and §4", "docs/decisions.yml D045", "the critical review of 2026-11-23 (wag-workspace reviews/2026-11-23)"]
  decided:
    date: "2026-11-24"
    by: owner
    decision: >-
      The developer and the other independent reviewer (ChatGPT)
      make it: the developer first, then back and forth until they converge.
      The owner verifies it, which is D045's verification by a person. Until
      the owner has verified an item, it is development material, not gold.
    recorded: "docs/plan.md §0 and §4"

