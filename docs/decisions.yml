- id: D055
  title: The consequence schemes share an exception whose meaning depends on the side
  question: >-
    positive_consequences, negative_consequences,
    negative_consequences_reasoning and negative_consequences_prudential
    share the exception other_consequences(A), "doing A also has
    consequences of the opposite kind that outweigh the ones cited": its
    meaning depends on the argument it belongs to, but its formula does not.
    Carneades treats the formula as one statement, so an argument that the
    bad consequences of an action outweigh the good undercuts the negative
    argument about that action as well as the positive one (shown in WAG's
    engine by the independent review of 2026-10-22). The exception was added
    on 2026-10-22 for the book's 33/CQ3. Naming the consequence,
    other_consequences(A,G), is not enough: when both sides cite the same
    consequence and value it oppositely, they still share the exception (the
    second independent review's engine test). Should each side get its own
    predicate, bad_outweighs(A,G) (bad consequences outweigh the good one
    cited) in positive_consequences and good_outweighs(A,G) in the negative
    schemes (B in 33.3), and bad_outweighs(X,C) in 33.4, a sided flip under
    D053? The owner chose this (option C; the others were A, keep
    other_consequences(A); B, other_consequences(A,G); D, no exception, the
    third question answered only by a rebuttal) on 2026-10-22. The
    independent review of proposal D055-D059's version 1 approved it with
    changes, made in version 2: among them, 33.4's likelihood assumption
    strongly_occur(X), which has the same fault on one side, becomes
    strongly_occur(X,C). It is made once the owner approves the proposal.
  category: scheme
  blocks: [verification, game]
  decider: owner
  priority: 2
  status: open
  docs: ["docs/scheme-registry/walton-clean/CHANGELOG.md, owner decisions of 2026-10-22", "docs/proposals/D001-D028-D029.md", "docs/proposals/D055-D059.md"]

- id: D059
  title: The prudential form's conclusion meets nothing
  question: >-
    negative_consequences_prudential (33.4) concludes prudential(X), "you
    ought prudentially to do X", which no other scheme concludes or uses, so a
    prudential argument neither supports nor meets any practical claim about X.
    Should it conclude should_be_performed(X), the game's practical
    conclusion, as the slippery slope's base case and the practical analogies
    now do? Proposed with D055 in proposal D055-D059, whose independent
    review approved it; 33.4's link to the book then becomes partial. The
    same question for the family's other practical schemes is D063.
  category: vocabulary
  blocks: [verification, game]
  decider: owner
  priority: 2
  status: open
  docs: ["docs/proposals/D055-D059.md"]

- id: D057
  title: Analogy's reach in the game
  question: >-
    Once analogy concludes a bare claim again (D001), should it answer every
    critical question, as a thesis-independent scheme does today, including
    the argument-locus questions (CQ:evidence, CQ:other_event), where its
    correspondence premise would pair a claim about a case with a statement
    about an argument? Or only questions at a premise, assumption,
    exception or conclusion locus (the last for the counter-analogy that
    answers CQ:other_case, as the book's CQ3 now is): by explicit backup
    edges (thesis_independent stays false) or by a locus limit on thesis
    independence (code, lint and tests)? In play it may also conclude should-claims and be played as an
    undercutter (D056); the choice between analogy and the practical
    analogies is a rule for annotation.
  category: game
  blocks: [game]
  decider: owner
  priority: 2
  status: open
  items:
    - {entry: analogy, kind: other, about: "game questions"}
  docs: ["docs/proposals/D001-D028-D029.md", "docs/proposals/D055-D059.md"]

- id: D061
  title: Three presets weigh a game scheme's variants differently
  question: >-
    The policy, scientific and legal presets weigh AS:consequences (0.70,
    0.35, 0.40) and AS:practical_reasoning, but do not name
    AS:negative_consequences or AS:practical_reasoning_goal, which keep
    their default weight (0.65). So under policy a positive consequences
    argument beats an equal negative one, and under scientific and legal the
    negative one wins, though the presets mean to weigh consequences alike
    and say nothing of their sign. Should every preset give
    AS:negative_consequences the weight of AS:consequences, and
    AS:practical_reasoning_goal that of AS:practical_reasoning, with a test
    that a preset weighing schemes by name names every game scheme? Found
    by the independent review of proposal D055-D059 (its game test shows
    the two sides tie in every preset once the weights are added); the
    proposal applies it if the owner agrees.
  category: game
  blocks: [play]
  decider: owner
  priority: 2
  status: open
  docs: ["wag/data/contexts.json", "docs/proposals/D055-D059.md"]

- id: D063
  title: The consequence family's other practical conclusions meet nothing
  question: >-
    D059 makes the prudential form conclude should_be_performed(X), so that
    it meets the other arguments about doing X. The family's other practical
    schemes conclude predicates that no other scheme concludes or uses:
    fear (ought_to_bring_about), danger (should_not, D062), threat
    (not_bring_about, D060), the pragmatic argument from alternatives and
    the disjunctive threat (do_other), waste (ought_to_continue), help
    (carry_out), distress (bring_relief) and two-person practical reasoning
    (should_carry_out). In WAG's engine an argument from fear for doing X
    has no contact with a consequence argument against X. Should each
    conclude should_be_performed or its negation for its action, keeping
    what is particular to it (the speaker's threat, the agent who helps) in
    its premises and questions? help, distress and two-person practical
    reasoning name an agent, which should_be_performed does not. D016 asks
    the same of alternative_normative. Found by the independent review of
    proposal D055-D059. Many schemes outside these families conclude
    predicates of their own too; that is not registered.
  category: vocabulary
  blocks: [verification]
  decider: owner
  priority: 2
  status: open
  docs: ["docs/proposals/D055-D059.md", "docs/candidates.md §3"]

