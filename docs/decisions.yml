  blocks: [annotation, play]
  decider: owner
  priority: 3
  status: decided
  docs: ["docs/candidates.md", "docs/proposals/D055-D059.md", "docs/review-2026-11-22-stages.md"]
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      C015 stays a coding rule (OC13: positive consequences of the action,
      with the harm's not happening as G), which D059 and the guidelines of
      D055 already give; it does not become a scheme. C016 (would doing the
      action avert the harm) becomes a question of 33.4; C020 is covered by
      OC12; C023 (doing against allowing) stays a candidate. (The review
      proposed a new omission scheme through D027; that duplicates 33.4 and
      OC13, which the owner decided.) Refined 2026-11-22 under the standing
      rule, on ChatGPT's review of stages 0 and 1: an omission coded as a
      positive consequence (OC13) records whether the action's preventing the
