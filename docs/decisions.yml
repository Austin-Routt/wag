- id: D101
  title: The pilot's first external benchmark
  question: >-
    Which external benchmark should the pilot use first, and may the model runs
    on it spend API credits?
  category: project
  blocks: [annotation]
  decider: owner
  priority: 2
  status: decided
  docs: ["wag-workspace verify/ethix-2026-11-27 (PROTOCOL.md, CROSSWALK.md)", "wag-workspace verify/d086/OWNER-BATCH-2026-11-27.md (the external benchmark)"]
  decided:
    date: "2026-11-27"
    by: owner ("Yes. Based on your analysis and recommendations, please proceed to close all remaining gaps", 2026-11-27, in reply to the decision batch, wag-workspace verify/d086/OWNER-BATCH-2026-11-27.md); amended by the owner, 2026-11-27 ("Based on your analysis, please proceed to close all remaining gaps", in reply to the developer's recommendation after both reviews of the protocol, wag-workspace verify/chatgpt-d086-x2-2026-11-27 and verify/chatgpt-rule-2026-11-27)
    decision: >-
      EthiX first, as a private experiment track: its texts and labels stay out
      of the public repository, and its protocol, crosswalk and split are fixed
      before any run. QT-Schemes comes second, its licence to be confirmed. No
      model is run on EthiX until the owner sets a budget (D046). Amended by the
      owner on 2026-11-27: the protocol's rule is version 2's. Development
      examples are kept only if the 2.5th percentile of the paired difference,
      macro-F1 with the examples minus macro-F1 without, over 1,000 draws of the
      held-out debates resampled together for both runs, is above zero; and only
      if, on the first gold's agreed items, the run with the examples gets at
      most one item newly wrong in each of scheme, fit, role, target (claim,
      instance, part and formula together) and polarity, a gain never offsetting
      a loss. Each run is made once and not repeated to pass.
    recorded: "wag-workspace verify/ethix-2026-11-27 (PROTOCOL.md, version 2 since 2026-11-27; CROSSWALK.md, results/split.json)"

