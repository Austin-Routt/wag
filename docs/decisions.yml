- id: D008
  title: A modal form for the consequence schemes
  question: >-
    Should brings_about(A,G) get a weaker, modal counterpart for consequences
    that may follow, as cause to effect now has? Until then a hedged claim
    is a reason to press the likelihood question.
  category: vocabulary
  blocks: [game, verification]
  decider: owner
  priority: 1
  status: decided
  docs: ["docs/review-2026-11-22-stages.md"]
  items:
    - {entry: positive_consequences, kind: book-walton, about: "CQ1-CQ2"}
    - {entry: negative_consequences, kind: book-walton, about: "CQ1-CQ2"}
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      Yes, as schemes of their own: modal variants of the consequence schemes,
      as cause to effect has cause_to_effect_modal, not a modality field.
      Likelihood stays a question (33/CQ1, CQ:likelihood). (The review left
      variant or field open and added an adequacy assumption; WAG's precedent
      is a scheme of its own, and the likelihood question already exists.)
      Refined 2026-11-22 under the standing rule, on ChatGPT's review of
      stages 0 and 1: a test shows that a possible or weak causal premise
      cannot fill a categorical one; the modal variants keep their modality in
      premises and conclusion.
      Refined 2026-11-25 by the owner, on the two reviews of proposal
      D008-D074 version 1 (an internal one and an external one): the modal
      conclusions name the consequence, may_be_worth_performing(A,G) and
      may_be_unwise_to_perform(A,G). They meet the thesis through two bridges,
      one for each side, added to walton.yml now and played from step C5: each
      has a premise its arguer must support, that the possibility matters to
      the decision, and an exception of its own, both naming A and G. The
      bridge is an entry condition, not a weight: equal weights are declared
      in the tests, and no multiplier is set. That the conclusion keeps the
      modality is WAG's design: the book concludes 'A should be brought about'
      and carries the strength in its questions (Walton, Reed and Macagno
      2008, pp. 102, 332).
      Refined again 2026-11-25 by the owner, on an external assessment of
      proposal D008-D074 version 4: the bridges' exception is that it is worth
      finding out first whether A brings about G (it can be found out before
      A must be decided, reliably enough to settle the question, at a cost
      and risk worth bearing), not bare knowability, which does not justify
      deferring a decision. It is the critic's to support (D003), shared by
      the two bridges about the same G, and declared neutral by the owner once
      proposal D008-D074 version 5 has been reviewed (D053).
    recorded: "docs/proposals/D008-D074.yml (version 5); walton.yml through edits.py (CONSEQUENCES_C3), applied 2026-11-25; links.json, families.json, positions.json, the catalogue entries; docs/kialo-batch2 (gold by recode_c3.py, guidelines §3 and §3.1, rule-cases.yml, the replay): positive_consequences_modal, negative_consequences_modal and their bridges, whose exception is worth_finding_out_first(A,G), which sets the possibility aside until it is found out, not the decision; the game at step C5"

