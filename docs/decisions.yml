# The decision register (docs/process.md §5): every open decision of the
# project. Edit this file; docs/decisions.md is generated from it by
# `wag-cli --catalogue-gen`, and `wag-cli --catalogue-check` keeps it in step
# with the catalogue: every catalogue discrepancy whose decision begins
# "Open" must be listed under an open decision here.
#
# Fields: id (D and three digits, never reused); title; question; category
# (scheme, vocabulary, game, annotation, book, metadata, project); blocks
# (game, verification, annotation, play, release); decider (owner, verifier,
# data, play); priority (1 holds up the next steps, 2 later work, 3 can
# wait); status (open, decided); items (catalogue discrepancies, by entry,
# kind and about); docs (documents that raise it); decided (date, by,
# decision, recorded) once taken. When a decision is taken, also update the
# entries it lists, so that they no longer say "Open".

note: >-
  The priorities were proposed on 2026-10-22, when the register was made
  (review part 13), and confirmed by the owner the same day. "The next steps" are
  steps 3 and 4 of the alignment plan's order: the game's fields for the 9 game
  schemes with the generator, and verifying tier 1.

