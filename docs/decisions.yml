    C022 (docs/candidates.md, the group "What happens anyway"): an outcome
    will happen whether or not the action is taken, and the action makes it
    less harmful or lets it be steered, so the action should be taken
    ("abortions happen anyway, so make them safe"; "it is coming anyway, so
    shape it"). Its comparison is with a baseline in which the outcome still
    happens, which no consequence scheme states. Should it become a scheme,
    with an exception for the outcome being preventable after all? Kialo
    answers it with parallel arguments (C002), and it meets the threshold.
    Found by the third independent review of proposal D055-D059.
  category: scheme
  blocks: [play]
  decider: owner
  priority: 3
  status: decided
  docs: ["docs/candidates.md"]
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      Yes: a scheme of its own, with an exception for the outcome being
      preventable after all, through the proposal path (C022).
      Refined 2026-11-25 by the owner, on the reviews of proposal D008-D074
      version 1: the premise is scoped to the action (E happens whether or not
      A is done), and A makes each occurrence of E less harmful. Its
      exceptions are that a course open to whoever would do A could prevent E
      (an answer names that course), and that the harm overall would not fall
      (a more frequent E can offset the gain per occurrence, though it need
      not). A's other harms are argued as its negative consequences. C022's
      steering form ('it is coming anyway, so shape it') is not covered.
    recorded: "docs/proposals/D008-D074.yml (version 5); walton.yml through edits.py (CONSEQUENCES_C3), applied 2026-11-25; links.json, families.json, positions.json, the catalogue entries; docs/kialo-batch2 (gold by recode_c3.py, guidelines §3 and §3.1, rule-cases.yml, the replay): harm_reduction"

- id: D073
  title: The replay chooses the moving side from a claim's immediate target
  question: >-
    docs/kialo-batch2/to_wag.py takes the side that makes a move from the
    claim's polarity, which is its stance on its immediate target, not on
    the thesis. So replies to Con's arguments are moved by Con, and backings
    of them by Pro (13292.25 and 13292.33 by Con; 13292.180, 13292.36 and
    13292.127 by Pro). The labels are unaffected, but the owners and scores
    are not what the annotations mean. Should the script compose the
    polarities along the target chain to the thesis to choose the side?
    Found by the fourth independent review of proposal D055-D059.
  category: annotation
  blocks: [annotation]
  decider: owner
  priority: 3
  status: decided
  docs: ["docs/kialo-batch2/to_wag.py", "docs/proposals/D055-D059.md"]
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      Yes, in a tested replay command of the game: the moving side is composed
      along the target chain to the thesis; ambiguous, multi-parent and cyclic
      cases are flagged, not guessed; every argument of a claim is played; a
      replay is a reconstruction, not an observed dialogue.
    recorded: "docs/decisions.yml; to apply: the guidelines, the gold and the annotation tools (plan §0, stage 2)"

- id: D074
  title: The appeal to consequences as an objection
  question: >-
    C011 (docs/candidates.md, the group "Attacking an argument's
    inference"): the objection that a consequence argument is offered for
    the truth of a claim, that a reason to act or to believe is no reason
    to think something true. In the game S9 already keeps a consequence
    scheme from concluding a factual statement, but nothing lets a player
    raise the objection, and Kialo users raise it by name. A question or
    undercutter for the consequence schemes, or a link rule that a
    practical conclusion about believing P does not support P? It met the
    threshold when the fourth independent review of proposal D055-D059
    found it outside the debate on God's existence (27150.12).
  category: scheme
  blocks: [play]
  decider: owner
  priority: 3
  status: decided
  docs: ["docs/candidates.md", "docs/proposals/D055-D059.md"]
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      A question or undercutter for the consequence schemes, raised when a
      consequence argument is offered for the truth of a claim; it goes
      forward once C011's sketch and examples pass review.
      Refined 2026-11-25 by the owner, on an external assessment of proposal
      D008-D074 version 4 and the developer's analysis of it: the objection is
      an undercutter of the specific argument whose consequences are offered
      for the truth of a claim, not an exception of the consequence schemes.
      An exception names only the action, so proving it against a misplaced
      argument would also defeat a legitimate argument about the same action
      in the same discussion (in Carneades a statement can serve several
      arguments, in different roles). In annotation a reply targets that
      argument's inference; in the game, from step C5, the objection is a
      question about the argument itself or a direct undercutter. No formula
      is shared, so D053 needs no declaration for it.
    recorded: "docs/proposals/D008-D074.yml (version 5), applied 2026-11-25: no formula; an undercutter of the specific argument in the guidelines (docs/kialo-batch2/guidelines.md §3.1, OC18) and the catalogue's consequence entries; the game's question about the argument itself at step C5"

