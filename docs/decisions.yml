    brings about X, then Y will occur") and danger(Y), and concludes
    should_not(Y), "you should not bring about Y": about the danger, where
    the book's conclusion (37) is about the action. Should it conclude
    should_not(X), or, with D063, ¬should_be_performed(X)? Its conclusion
    template also begins "Therefore", which the views repeat after "So".
