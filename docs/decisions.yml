- id: D087
  title: A first persuasion protocol after the first gold and the pilot
  question: >-
    The critical review of 2026-11-23 (its answer 2) proposed that, once the
    first gold (D086) and the bounded pilot (stage 3) have shown real
    deficiencies, a small first persuasion protocol could come next while
    the corpus grows, recorded as how Track D's order is read. Track D's
    order is the owner's (plan §8, 2026-10-15: schemes, critical questions
    and the Kialo gold first) and stands until this is decided. Asked on
    2026-11-23; the owner's answer of 2026-11-24 settled who makes and
    verifies the first gold (D086), not this.
  category: project
  blocks: [play]
  decider: owner
