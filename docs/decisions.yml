- id: D104
  title: The exceptional case names its rule and its case
  question: >-
    walton.yml's exceptional (the book's 56, p. 344) concludes rule_waived(A) from rule_can_waived(X) and case_exception(A): X and A are unrelated and the rule is unnamed, so an exceptional case waives no rule in particular. The book's 56 and its source (Walton 1995, p. 147) bind the case to the rule it is an exception to. Should the scheme bind them?
  category: scheme
  blocks: [annotation]
  decider: owner
  priority: 2
  status: decided
  docs: ["wag-workspace verify/chatgpt-rule-2026-11-27/REVIEW.md §1, §4 item 6", "wag-workspace verify/rule-family/DESIGN.md"]
  decided:
    date: "2026-11-28"
    by: "owner (standing rule of 2026-11-22), on ChatGPT's review of argument by rule (2026-11-27, wag-workspace reviews/2026-11-27), checked and agreed by the developer (wag-workspace verify/chatgpt-rule-2026-11-27/REVIEW.md §1 and §4 item 6)"
    decision: >-
      Yes: exceptional binds the rule R and the case X in every formula: the case is an exception to that rule, which can be waived in that case.
    recorded: "to apply: proposal D019-D020-D024-D026, after an independent review and after the owner's verdicts of exchange 3 are imported (walton.yml is an input every verdict records)"

- id: D105
  title: The regulative rule's addressee and its excuse
  question: >-
    walton.yml's regulative_rule (55.3, pp. 343-344) concludes must_do(A,X), but A occurs only in the conclusion, and its exception, excuse, names neither the agent nor the act. Should the rule name its addressee and scope its excuse?
  category: scheme
  blocks: [annotation]
  decider: owner
  priority: 2
  status: decided
  docs: ["wag-workspace verify/chatgpt-rule-2026-11-27/REVIEW.md §1, §4 item 6", "wag-workspace verify/rule-family/DESIGN.md"]
  decided:
    date: "2026-11-28"
    by: "owner (standing rule of 2026-11-22), on ChatGPT's review of argument by rule (2026-11-27, wag-workspace reviews/2026-11-27), checked and agreed by the developer (wag-workspace verify/chatgpt-rule-2026-11-27/REVIEW.md §1 and §4 item 6)"
