      Refined 2026-11-25 by the owner, on the reviews of proposal D008-D074
      version 1: C016's question is an exception of the prudential form, the
      critic's to support (D003), not an assumption.
    recorded: "docs/proposals/D008-D074.yml (version 5); walton.yml through edits.py (CONSEQUENCES_C3), applied 2026-11-25; links.json, families.json, positions.json, the catalogue entries; docs/kialo-batch2 (gold by recode_c3.py, guidelines §3 and §3.1, rule-cases.yml, the replay): fails_to_avert(X,C) on 33.4, and the four values of the coding rule (guidelines §3.1, OC13)"

