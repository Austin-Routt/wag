- id: D011
  title: Popular opinion's conclusion
  question: >-
    Should popular opinion conclude the accepted proposition itself, so that
    the argument can back a claim directly as a game move needs?
  category: scheme
  blocks: [verification, game]
  decider: owner
  priority: 2
  status: decided
  docs: ["docs/review-2026-11-22-stages.md"]
  items:
    - {entry: popular_opinion, kind: other, about: "conclusion"}
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      No. popular_opinion keeps reason_in_favor(A), as the book concludes.
      Where a game needs it to meet A, a bridge scheme connects them, with its
      own exception (D075's rule for bridges). Refined 2026-11-22 under the
      standing rule, on ChatGPT's review of stages 0 and 1: the bridge is an
      explicit warrant with its own challenge, never counted as evidence
      beside the reason it bridges.
    recorded: "docs/decisions.yml; to apply: stage 2: walton.yml through edits.py, after a proposal check and an independent review (plan §0)"

