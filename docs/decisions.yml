- id: D003
  title: Who bears the burden of practical reasoning's questions
  question: >-
    Should the questions of practical reasoning shift the burden to the
    proponent when asked (making them assumptions), or stay exceptions that
    the critic must support, as now?
  category: scheme
  blocks: [game, verification]
  decider: owner
  priority: 1
  status: decided
  items:
    - {entry: practical_reasoning1, kind: book-walton, about: "burden of the questions"}
    - {entry: practical_reasoning2, kind: book-walton, about: "burden of the questions"}
    - {entry: practical_necessary_condition, kind: book-walton, about: "burden of the questions"}
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      The questions stay exceptions, the critic's to support. Who must answer
      a question that is asked is a rule of the dialogue (the request, its
      answer, and what holds while it is pending), set by the game's question
      protocol with D075, not by turning exceptions into assumptions.
    recorded: "docs/proposals/D004-D075.yml (2026-11-24): walton.yml keeps the questions exceptions, so nothing to change there; to apply: the question protocol in the game (stage 2, item F, and step C5)"

