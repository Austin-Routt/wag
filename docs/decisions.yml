- id: D006
  title: An equally good alternative against practical reasoning 2
  question: >-
    Should an alternative action that is just as good count against doing A?
    It needs a formula that walton.yml lacks.
  category: scheme
  blocks: [game, verification]
  decider: owner
  priority: 1
  status: decided
  items:
    - {entry: practical_reasoning2, kind: other, about: "game questions"}
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      No. An equally good alternative is not a reason against doing A; it
      answers only a claim that A is necessary or the best (the
      necessary-condition schema, realize_more_effectively).
      practical_reasoning2's conclusion is unchanged. Refined 2026-11-24 by
      the owner (D090): the necessary-condition schema claims that some means
      of a set is needed, so another member of the set answers nothing; what
      answers it is a route that avoids the whole set,
      goal_achievable_without_any(P,G,S).
    recorded: "docs/proposals/D004-D075.yml (2026-11-24): walton.yml's exceptions need a strictly better means (realize_more_effectively, argued with better_means), and the guidelines (§2, §3, OC6) and the gold treat an equally good alternative as no answer; the game at step C5"

