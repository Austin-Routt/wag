- id: D056
  title: A fortiori and refutation by parallel argument
  question: >-
    Two patterns of argument fit neither analogy nor the practical
    analogies: a fortiori (the target is a stronger case for the claim than
    the source, not a similar one) and refutation by parallel argument (an
    argument of the same form with plainly acceptable premises and a plainly
    unacceptable conclusion undercuts the argument attacked). Neither is a
    scheme of the book's compendium; the literature treats each as its own
    pattern. Proposal D001-D028-D029 sketches both as candidates, to test
    that the analogy family's vocabulary extends to them; the second
    independent review found enough Kialo instances of both for the
    candidates route's threshold. Should a fortiori be added to walton.yml
    (it shares analogy's difference_against)? For parallel refutation, the
    choice is between analogy played as an undercutter, which the game
    already accepts (P2 bound to the attacked argument's undercutter), and a
    scheme of its own, whose variable names an argument on the board; that
    needs code, since the move check must bind the variable to the attacked
    argument at the inference locus.
  category: scheme
  blocks: [play]
  decider: owner
  priority: 3
  status: open
  docs: ["docs/candidates.md", "docs/proposals/D001-D028-D029.md", "docs/process.md §8"]

- id: D058
  title: Argument from precedent reads a rule as a case
  question: >-
    exception_to_rule (argument from precedent) has the exception
    relevant_differences(R,C), which puts the rule R where a case belongs:
    its template reads "relevant differences between case R and case C".
    Should it compare the precedent case with the current one (as
    relevant_differences(C), or naming both cases)? Its other exception,
    inapplicable_rule(R), already covers a rule that does not apply here.
    Found by the second independent review of proposal D001-D028-D029.
  category: scheme
  blocks: [verification]
  decider: owner
  priority: 3
  status: open
  docs: ["docs/proposals/D001-D028-D029.md"]

- id: D060
  title: Argument from threat names the wrong variables
  question: >-
    walton.yml's threat concludes not_bring_about(X), with X the action the
    respondent is warned against, and cited_bad_consequences(X) uses X the
    same way; but position_to_know(X) ("I am in position to bring about X")
    and assert_bad(X,C) ("I will see to it that X occurs if you bring about
    C") put X where the threatened consequence belongs. Should they read
    position_to_know(C) and assert_bad(C,X)? The independent review of
    proposal D055-D059 found two more faults of the same scheme:
    cited_bad_consequences(X) lost the consequence (the upstream template
    has two slots, the book's first premise names it, and the cleaning
    recorded it as a semantic concern), so it should be
    cited_bad_consequences(X,C); and position_to_know/1 ("I am in position
    to bring about") shares its name with the source scheme's
    position_to_know/2, so it should be renamed (for example
    able_to_bring_about(C)). Whether its conclusion should meet the
    practical claims is D063. Found while drafting proposal D055-D059,
    whose version 1 rendered it.
  category: scheme
  blocks: [verification]
  decider: owner
  priority: 3
  status: open
  docs: ["docs/proposals/D055-D059.md"]

- id: D062
  title: Argument from danger concludes about the danger
  question: >-
