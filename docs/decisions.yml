- id: D065
  title: Magnitude and risk
  question: >-
    Four candidates concern how serious or how likely a consequence is
    (docs/candidates.md, the group "Magnitude and risk"): C005, a question
    whether the cited consequence is bad (or good) enough, for enough
    people, to bear on the action, which the book's three questions do not
    ask; C008, precaution, an argument that a catastrophic, irreversible
    harm outweighs a small chance of it; C021, on whom the consequence
    falls, which may merge into C005; and C024, a certain harm set against a
    speculative one, the converse of C008. Which go forward, and as what?
    C005, C008 and C021 meet the threshold.
  category: scheme
  blocks: [play]
  decider: owner
  priority: 3
  status: decided
  docs: ["docs/candidates.md"]
  decided:
    date: "2026-11-22"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      C005 and C021 go forward as questions on the consequence schemes (how
      serious, and on whom); the likelihood question already exists. C008
      (precaution) and C024 stay candidates.
      Refined 2026-11-25 by the owner, on the reviews of proposal D008-D074
      version 1: the two questions are formulas of the consequence schemes,
      kept apart from good(G) and bad(G), so that a real but slight
      consequence is not a denied one. They are exceptions, the critic's to
      support (D003: who must answer an asked question is a rule of the
      dialogue, not an assumption), asked as walton/ questions; the game asks
      them from step C5. There is no threshold of how many people a
      consequence affects: one grave consequence can decide.
      The scope of too_slight(A,G), declared by the owner under D053 on
      2026-11-25: G, as a consequence of A, judged by the criteria that bear
      on the decision on A, is too slight to count; not merely that G reaches
      few, is small in number, or seems minor to one side.
    recorded: "docs/proposals/D008-D074.yml (version 5); walton.yml through edits.py (CONSEQUENCES_C3), applied 2026-11-25; links.json, families.json, positions.json, the catalogue entries; docs/kialo-batch2 (gold by recode_c3.py, guidelines §3 and §3.1, rule-cases.yml, the replay): too_slight(A,G), declared neutral with its scope, and the sided pair gain_discounted_by_bearer(A,G), harm_discounted_by_bearer(A,G); the game's questions at step C5"

