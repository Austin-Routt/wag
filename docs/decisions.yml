- id: D053
  title: Declared polarity pairs
  question: >-
    Should positive/negative scheme pairs be declared as polarity pairs and
    checked, never merged (the entries, walton.yml's schemes and the game's
    schemes stay one per polarity)? As revised after the two independent
    reviews of 2026-10-22: pairs are declared in families.json's counterpart
    relation and checked by the registry. The conclusions are p and ¬p.
    Every other formula is shared, or a flip of a declared kind: p and ¬p;
    two predicates declared contraries with the same arguments (good and
    bad, right_to_do and wrong_to_do); or a sided flip, two predicates for
    the two directions with the same arguments (difference_against and
    difference_for). The questions have the same targets, or targets that
    are declared flips of each other; their wording may flip. Every shared exception or assumption is declared neutral as to
    polarity by a person, and the declaration is tested: one example per
    side, run in the engine, must show that proving it for a reason that
    favours either side should defeat both. The registry also reports exact
    pairs that nobody declared. The engine does not enforce declared
    contraries: both can be accepted at once. Pairs: the practical analogies
    (8.1, 8.2), with D029; consequences (33.1, 33.2), once D055 is fixed;
    ethotic argument (41), once ethotic2's conclusion is checked (¬S, where
    the book reads the claim as less plausible). Model and antimodel (6.3,
    6.4) differ in more than a flip, so they would be a looser counterpart,
    not checked as exact. Not values (19.1, 19.2), whose conclusions are two
    reasons that can hold together; falsification only after D054.
  category: vocabulary
  blocks: [verification]
  decider: owner
  priority: 2
  status: decided
  docs: ["docs/proposals/D001-D028-D029.md"]
  decided:
    date: "2026-10-22"
    by: owner
    decision: >-
      Yes, as revised: declared and checked, never merged, with the sided
      flip and the tested neutrality declaration. The registry's check is
      to build.
    recorded: "docs/decisions.yml; docs/proposals/D001-D028-D029.md"

- id: D054
  title: Falsification's conclusion
  question: >-
    evidence_hypothesis_falsification concludes ¬A, the event, which its
    premise already says is false; the book concludes that the hypothesis is
    false (¬H), and verification, its positive counterpart, concludes H. Its
    assumption also reverses the arguments of verification's
    sufficient_correlation(H,A). Correct both?
  category: scheme
