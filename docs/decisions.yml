- id: D088
  title: The possibility of the goal and of the agent's means
  question: >-
    practical_reasoning1 and practical_reasoning2 state the action's
    possibility as possible(A), and practical_reasoning2 the goal's as
    possible(G), whose template reads "Action %s is possible." After D030 the
    condition schemes say possible_goal for the goal and possible_bring_about
    for the agent's means. Should practical reasoning use the same formulas?
    Put to the owner with proposal D004-D075 (version 1) and the independent
    reviews of 2026-11-24.
  category: scheme
  blocks: [game, verification]
  decider: owner
  priority: 1
  status: decided
  docs: ["docs/proposals/D004-D075.md", "the independent reviews of 2026-11-24 (wag-workspace reviews/2026-11-24)"]
  decided:
    date: "2026-11-24"
    by: owner
    decision: >-
      Both. possible(G) becomes possible_goal(G), and possible(A) becomes
      possible_bring_about(P,A), with P bound by the goal premise (D005). That
      a goal can be reached and that this agent can carry out the means are
      separate claims, and neither is the means being available now or sure
      to succeed. The game's CQ:goal_possible and CQ:possibility follow at
      step C5; old records keep their formulas under their version.
    recorded: "docs/proposals/D004-D075.yml; walton.yml through edits.py, applied 2026-11-24; links.json, families.json, the catalogue entries; docs/kialo-batch2 (gold by recode_c2.py, guidelines §3 and §3.1, rule-cases.yml, validate.py R8-R11, the replay); the game (CQ:goal_possible, CQ:possibility) at step C5"

- id: D089
  title: The agent and the situation in "another action would do better"
  question: >-
    The answer scheme better_means concludes practical reasoning's exception
    realize_more_effectively(G,A), which names no agent, so an answer about
    another agent's action still defeats the argument (the independent
    review's engine test of 2026-11-24, E2c). Should the exceptions and the
    answer's comparison name the agent?
  category: scheme
  blocks: [game, verification]
  decider: owner
  priority: 1
  status: decided
  docs: ["docs/proposals/D004-D075.md", "the independent reviews of 2026-11-24 (wag-workspace reviews/2026-11-24)"]
  decided:
    date: "2026-11-24"
    by: owner
    decision: >-
      Yes. Practical reasoning's three exceptions become
      realize_more_effectively(P,G,A), bring_about_more_effectively(P,S2,A)
      and promote_more_effectively(P,V,A), and better_means compares for the
      agent, more_effective_means(P,A2,G,A), with the agent's ability to take
      the alternative, possible_bring_about(P,A2), a premise of the answer,
      not a presumption. The alternative must be a different action, checked
      by the game and the validators (a Carneades guard would not act in
      WAG's play). "More effectively" means reaching the goal more surely,
      sooner or at lower cost, and an answer records which; a preference
      across values is not this claim. The situation compared is the current
      one (Walton and Gordon 2015, p. 515: "when performed in S1"): fixed per
      game or case in its profile and checked at the record level, not added
      to every formula.
    recorded: "docs/proposals/D004-D075.yml; walton.yml through edits.py, applied 2026-11-24; links.json, families.json, the catalogue entries; docs/kialo-batch2 (gold by recode_c2.py, guidelines §3 and §3.1, rule-cases.yml, validate.py R8-R11, the replay); the game at step C5"

- id: D090
  title: Alternatives in the necessary- and sufficient-condition schemes
  question: >-
    The sufficient-condition scheme (22.3) keeps the exception that the agent
    could reach the goal by another means, which its own premise grants
    whenever its set of means has a second member, and the
    necessary-condition scheme (22.2) has the same fault: another member of
    a necessary set refutes nothing (a badge or an escort). D006 says an
    equally good alternative answers only a claim that an action is
    necessary or the best. What should their alternative-means objections
    be? Raised by the independent reviews of 2026-11-24.
  category: scheme
  blocks: [verification]
  decider: owner
  priority: 2
  status: decided
  docs: ["docs/proposals/D004-D075.md", "the independent reviews of 2026-11-24 (wag-workspace reviews/2026-11-24)"]
  decided:
    date: "2026-11-24"
    by: owner
    decision: >-
      WAG declares the best-choice reading for both schemes: a strictly better
      means the agent can take defeats the recommendation,
      realize_more_effectively(P,G,X) (D089), and an equally good one does
      not (D006). The sufficient-condition scheme has no mere-alternative
      exception. The necessary-condition scheme's objection is that the goal
      can be reached without any means of the set: a new, typed predicate,
      goal_achievable_without_any(P,G,S), whose answer must name a route the
      agent can take that reaches the goal and uses no member of the set;
      alternative_means is not reused with a set in place of an action.
      Defeating the recommendation does not disprove that X would reach the
      goal. The reading is WAG's: the book allows an acceptable or the most
      acceptable means, and its pp. 96 and 323 differ on 22.3. The condition
      schemes' goal variable is G, as in practical reasoning (A was the
      book's letter for the goal).
    recorded: "docs/proposals/D004-D075.yml; walton.yml through edits.py, applied 2026-11-24; links.json, families.json, the catalogue entries; docs/kialo-batch2 (gold by recode_c2.py, guidelines §3 and §3.1, rule-cases.yml, validate.py R8-R11, the replay); the answer contract with stage 2, item F, and the game at step C5"

- id: D091
  title: Aligning the rest of practical reasoning
  question: >-
    Practical inference keeps a first-person goal premise ("I have a goal")
    and exceptions worded differently from practical reasoning's, so a
    weighing that defeats practical reasoning leaves it standing; and the
    condition schemes' side-effect exception defeats them however small the
    side effect (D070's fault). D063 now makes their conclusions meet the
    game's practical claims. Should the decided formulas apply to them now?
  category: scheme
  blocks: [verification]
  decider: owner
  priority: 2
  status: decided
  docs: ["docs/proposals/D004-D075.md", "the independent reviews of 2026-11-24 (wag-workspace reviews/2026-11-24)"]
  decided:
    date: "2026-11-24"
    by: owner
    decision: >-
      Both, now. Practical inference takes goal_of_agent(P,G),
      possible_bring_about(P,A), incompatible_goal(P,G),
      realize_more_effectively(P,G,A) and bad_outweighs(A,G), as practical
      reasoning has them, and keeps its own objection that the action works
      against its goal, scoped to the agent, incompatible_consequences(P,A,G):
      it is not merged with the outweighing claim. The condition schemes'
      side-effect exception becomes bad_outweighs(X,G), still an exception
      (D003). One-place conclusions stay (D005, D063); who performs an action
      comes from a structured action-to-actor mapping with its aliases, not
      from the action's name. D070's outweighing reading is WAG's
      interpretation: the source's side-effect exception (Walton and Gordon
      2015, p. 515) is any side effect that demotes a value.
    recorded: "docs/proposals/D004-D075.yml; walton.yml through edits.py, applied 2026-11-24; links.json, families.json, the catalogue entries; docs/kialo-batch2 (gold by recode_c2.py, guidelines §3 and §3.1, rule-cases.yml, validate.py R8-R11, the replay)"

- id: D092
  title: The identity contract of annotation records
  question: >-
    The independent reviews of 2026-11-24 found that a target names a claim
    and a part, not the inference it challenges; that who performs an action
    is read from the action's name; that one null stands for unknown, absent
    and not applicable; and that agreement on eight coarse fields measures
    neither exact targets nor bindings nor how a claim is divided into
    inferences. The owner is to verify the first gold (D086) on objects that
    stay the same. Should annotation records take an identity contract
    before the first gold is drafted, and what should it hold?
  category: annotation
  blocks: [annotation]
  decider: owner
  priority: 1
  status: decided
  docs: ["docs/annotation-records.md", "the independent reviews of 2026-11-24 (wag-workspace reviews/2026-11-24)", "wag-workspace verify/r-review-2026-11-24/ASSESSMENT-2.md"]
  decided:
    date: "2026-11-24"
    by: owner (standing rule of 2026-11-22)
    decision: >-
      Yes, as format 2 of the annotation records (docs/annotation-records.md),
      before the first gold draft: an id for every argument instance that
      edits do not change; targets that name the claim, the instance, the
      part and the formula itself; a case record with its contexts, actors
      and actions, each action with its one actor and its aliases, so that
      who performs an action comes from the mapping (D063, D091) and an
      answer stays in its target's context; unknown, absent, not applicable
      and false kept apart, and re-parenting derived, not stored; the inputs
      a gold was checked against pinned, and an item's revision for its
      verification; agreement on the exact target, the question, the
      bindings and every instance, unresolved values counted apart.
      Format-1 files stay readable and are checked as they were made. (The
      reviewers' recommendation and the developer's assessment agreed; source
      spans are left for when argument mining is taken up.)
    recorded: "docs/annotation-records.md; docs/kialo-batch2 (case.json, the gold by migrate_format2.py, gold-format1.json kept, guidelines §2, §4 and §5, validate.py R12-R17, agreement.py, to_wag.py); wag/data/annotation (positions.json, the dataset's copy); wag/internal/annotate (the reader, the check, the agreement, the prompt)"

- id: D093
  title: Repairs and choices found in drafting the rest of the first family
  question: >-
    Drafting proposal D022-D093, and the independent review of its first
    version, found faults and choices that no decision covered.
    practical_goal's goal premise, person_goal(P,G), is not practical
    reasoning's goal_of_agent(P,G), so the questions it borrows (D023) would
    speak of another goal. two_person_practical's exceptions named the
    advisor where the action belongs (side_effect_other_act(B,A)) and left
    the means out (alternative_means(A,X)). waste's assumption, possible(X),
    printed "Action X is possible" of a goal. The templates of the changed
    schemes began a premise or a conclusion with "Therefore", and some read
    right of a singular agent only. D063's decided text gives the bridges
    "a bridge scheme with its own exception (the agent is not the one
    deliberating)"; its refinement says "the bridge needs the agent and the
    deliberation context positively the same, or explicitly mapped. The
    exception alone is not enough". The continuing bridge chooses a means
    for a goal, which practical reasoning questions, and end_and_means_bad
    lacks the question of the opposite value that D023 gives
    end_and_means_1. Should they be repaired with the proposal, and how?
  category: scheme
  blocks: [verification]
  decider: owner
  priority: 2
  status: decided
  docs: ["docs/proposals/D022-D093.md", "the independent review of version 1 (wag-workspace verify/p-C4/review-v1)"]
  decided:
    date: "2026-11-26"
    by: owner (instruction of 2026-11-25 to go with the recommended choices)
    decision: >-
      Yes, with the proposal; the owner can reverse any part before it is
      applied. (a) practical_goal's goal premise becomes goal_of_agent(P,G);
      person_goal/2 is left an orphan. (b) two_person_practical asks four of
      the book's five questions (23) in practical reasoning's formulas:
      incompatible_goal(A,X), realize_more_effectively(A,X,Y) (D089),
      bad_outweighs(Y,X) (D070, WAG's reading, D091) and
      possible_bring_about(A,Y) (D088). The fifth, whether other actions are
      required too, keeps no formula, as links.json has it: under the
      premise's necessary reading another required step is no reason against
      the advised one (D090's reasoning), and a formula without the agent
      would reach other agents' arguments (D089). Under that necessary
      reading an alternative no better than Y denies the premise that Y is
      necessary, an attack on that premise, not on the advice; the better-means
      exception takes the best-choice reading only (D090, D006). It concludes
      should_do(A,Y) (D063), and the gold's R9 reads its goal,
      tells_intend(A,X,B), as goal_of_agent(A,X). (c) waste's assumption
      becomes possible_goal(X). (d) The templates this proposal adds or
      changes are rewritten in WAG's own words and read right of a plural
      binding, tells_intend/3's and stop_realize_wasted/2's among them, whose
      agent places the proposal types (positions.json); the older templates
      the changed schemes share with other schemes stay as they are. (e) The
      bridges take the
      premise deliberating_agent(P,A), that it falls to P to decide whether
      to go ahead with A, which their arguer supports, in place of the
      exception D063's decided text names: the refinement asks for the
      positive claim, and a critic who denies it attacks the premise, so the
      exception would add nothing. R14 checks that A is P's action in the
      case record; that the decision is P's is the premise's claim. (f)
      bridge_from_continuing asks practical reasoning's questions of the
      means it chooses: realize_more_effectively(P,G,A) and bad_outweighs(A,G)
      as exceptions, possible_bring_about(P,A) as an assumption (D070, D088,
      D089), and R9 reads its goal from ought_to_continue(P,G). A goal that
      conflicts with G bears on the argument from waste, whose conclusion the
      bridge takes, not on the means. bridge_from_agent asks no question of
      its own (D075's reasoned none): it chooses no means, but carries another
      argument's conclusion, whose questions test the action, and adds only
      that the decision is P's. (g) end_and_means_bad borrows means_good_outweighs(X,Y),
      the question of the opposite value, as end_and_means_1 borrows
      means_bad_outweighs(X,Y) (D023): beyond D022's "as the schemes library
      has them", since without it a means condemned by a bad end could be
      defended only by a rebuttal. The replaced formulas' templates stay as
      orphans. (e), (f) and (g), which go beyond their decisions' texts, are
      put to the owner for confirmation in D095.
    recorded: "docs/proposals/D022-D093.yml (version 2); walton.yml through edits.py (PRACTICAL_C4), applied 2026-11-26; links.json, families.json, positions.json, the catalogue entries; docs/kialo-batch2 (validate.py's R9 reads two_person_practical's goal from tells_intend(A,X,B) and bridge_from_continuing's from ought_to_continue(P,G), with planted tests; guidelines §3.1 and OC6)"

- id: D094
  title: Step C5's implementation choices, the game's data from the catalogue
  question: >-
    Step C5 (docs/c5-game.md) generates the game's data from the catalogue and
    brings the game to the first family's formulas, applying C2's and C3's game
    paragraphs, D003, D006-D009, D053, D055, D065, D075, D089 and workstreams E
    and I. Within those decisions it has to choose how the data's identity
    changes, how the game knows its agent, the English of new predicates, how
    the new kinds of scheme are offered and weighed, what the golden games run
    on, how derived fields are checked, and what a hashless export is. The
    independent checks of the plan's versions 1 and 2 (wag-workspace
    verify/c5) found each of these.
  category: game
  blocks: [game]
  decider: owner
  priority: 2
  status: decided
  docs: ["docs/c5-game.md", "the independent checks of the plan's versions 1 and 2 (wag-workspace verify/c5)"]
  decided:
    date: "2026-11-26"
    by: the developer, under the owner's instructions to close the remaining gaps (2026-11-25, 2026-11-26), within the decisions named; no part departs from a decision's text (those are D095)
    decision: >-
      As docs/c5-game.md version 3 says; each part reversible before the work
      it governs. (a) The bytes change once when the generator takes over,
      with the meaning unchanged (a test against the frozen pre-C5 files, as
      JSON and YAML trees); C5.2 makes one more change of data identity. (b)
      Every game has a profile (the agent, the actions it deliberates with
      their actors and aliases, the situation compared; D089, D091, D092):
      from a case record when one is supplied, otherwise asked when the game
      is created, with a default the board shows; a journaled move declares an
      action with its actor; a move about an undeclared action is refused; the
      game binds P and refuses a P that does not perform A; a better_means
      answer records its comparison. (f) New predicates take walton.yml's
      templates in the game; the game's other templates stay, each difference
      recorded. (g) The answer schemes, modal variants and bridges join with a
      role: an answer scheme is offered only as an answer and weighs as the
      schemes whose exception it concludes; a modal variant weighs as its
      categorical counterpart; a bridge is offered for or against a claim
      should_be_performed(A), its first premise supported by a modal argument,
      at its modal variant's weight, with no multiplier (D008). (h) The 33
      golden games stay on the frozen pre-C5 data; a new golden set is made on
      the new data. (i) A game question's locus and pattern are derived from
      its target in the formulas the game plays, the checker re-deriving them;
      where a question has several targets, its game part names the one asked.
      (j) core.yml's header carries the hash of a canonical form of the values
      the generator reads. (k) A hashless export replays and is flagged as
      legacy, not as current. D009 applies to every generated question: each
      game question has a paraphrase, and a shared question is split where its
      schemes' paraphrases differ, as the entries list. Refined 2026-11-26 by
      the developer, under the same mandate, on the independent check of
      docs/c5-game.md version 5 (wag-workspace verify/c5/c52), with the choices
      no decision makes: (1) one id is one question, asked at one formula and
      one kind of locus by every scheme that asks it, with one text: entries'
      paraphrases of one id that ask of one formula at one locus are given one
      paraphrase, and an id over two formulas is split, the scheme whose book
      question named it keeping it; its caes_mapping is derived from its
      locus, and a game question's text is generated from its paraphrase with
      the scheme's variables braced. (2) The game's profile: the default agent
      is "decider"; a move that first argues about an action declares it in
      that move, naming its actor; P3 reads D063 as making every action argued
      the agent's, beyond (b)'s "a P that does not perform A", and is put to
      the owner; a game made before step C5.2 has no profile and plays without
      its rules. (3) Types: P agent; A and A2 action; better_means' G goal; H
      and the consequence schemes' G event; I entity. (4) The weight shown
      before a move is the weight it takes; a modal variant's or bridge's
      record carries the base weight it weighs as, an answer scheme's 0.5,
      unused. The refinement replaces two sentences above: (b)'s "Every game
      has a profile" reads "every game made since step C5.2 has a profile",
      and D009's "a shared question is split where its schemes' paraphrases
      differ" gives way to (1). Completed 2026-11-27 on the check of version
      5a and the profile's code (wag-workspace verify/c5/c52/VERIFY-5a): a
      move declares only the actions it binds; a declaration of an action the
      profile holds, by the same actor, adds only its aliases; names, actors
      and the agent are compared as atoms; the board and the terminal ask
      whose a new action is; a claim is written with its action's id; a
      discussion imported from Kialo has a profile.
    recorded: "docs/c5-game.md (version 3; version 5a for the refinement of 2026-11-26, completed 2026-11-27); applied: C5.1 (2026-11-26); C5.2 (roles, the profile, the question protocol, the generator's rules, the switch, the replay by instance, item F and the new golden set, then the gates, two independent checks and their fixes, CI and the docs: 2026-11-27)"

- id: D095
  title: Step C5's departures from decided wording
  question: >-
    Three of step C5's choices (docs/c5-game.md, version 3) depart from the
    wording of decided texts, so they are put to the owner (process.md §5),
    each with the developer's recommendation. (1) The weighing questions. C2's
    game paragraph says CQ:side_effect targets bad_outweighs(A,G) on practical
    reasoning, backed by bad_outweighs_good; the entries of the consequence
    schemes, which D009 adopts, keep CQ:side_effect at positive consequences'
    conclusion, the rebuttal route, and add a question at the exception. One
    question id cannot be both, since an edge backs a question whatever scheme
    asks it and S9 refuses bad_outweighs_good at a conclusion. Recommended:
    CQ:side_effect is the rebuttal route (a further bad consequence, at the
    conclusion) for practical reasoning and positive consequences alike, as
    CQ:opposite_consequences is for negative consequences; a new weighing
    question asks bad_outweighs(A,G) of practical reasoning and positive
    consequences (one id, since the formula is one), and another asks
    good_outweighs(A,G) of negative consequences, backed by C003's answer
    schemes. This departs from C2's wording. (2) D074's question. C3's game
    paragraph puts D074's objection as a question about the argument itself;
    in the game a consequence scheme cannot conclude a factual claim (S9), so
    the misplaced appeal meets only Other's arguments. Recommended: the
    question is Other's relevance question, unchanged, with the direct
    undercutter; the consequence schemes get none. (3) The refusal of a bare
    claim of knowability (D053). No scheme concludes
    worth_finding_out_first, and the game cannot tell a bare claim made with
    Other from a well-made one. Recommended: an answer scheme concludes it
    from the owner's declared conditions (an investigation timely and
    reliable enough to settle whether A brings about G; its costs and risks
    justify finding out first), proposed for walton.yml through the proposal
    process and quoting the declaration; at that question the game accepts it
    and the source-based schemes that assert the exception itself, and
    refuses Other, well made or not (a well-made answer is made with the
    answer scheme). Also put for confirmation: D093's parts that went beyond
    their decisions' texts, decided under the instruction of 2026-11-25,
    whose written record (wag-workspace verify/p-D008-D074/RECORD.md) is the
    owner taking C3's named choices: (e) the bridges' premise for D063's
    exception, (f) the continuing bridge's questions, (g) end_and_means_bad's
    borrowed question; each is applied and reversible.
  category: game
  blocks: [game]
  decider: owner
  priority: 1
  status: decided
  docs: ["docs/c5-game.md", "docs/proposals/D004-D075.md", "docs/proposals/D008-D074.md", "docs/proposals/D022-D093.md"]
  decided:
    date: "2026-11-26"
    by: owner ("Approved, record D095 as worded", 2026-11-26), on the developer's recommendation and the independent review of 26 November (wag-workspace verify/r-external-2026-11-26, REPORT.md §3)
    decision: >-
      (1) CQ:side_effect is the rebuttal route (a further bad consequence, at
      the conclusion) for practical reasoning and positive consequences, as
      CQ:opposite_consequences is for negative consequences. A new weighing
      question asks bad_outweighs(A,G) of practical reasoning and positive
      consequences (one id: one formula, locus and burden), and another asks
      good_outweighs(A,G) of negative consequences, both backed by C003's
      answer schemes. An id that answer schemes back is asked at the same
      formula and kind of locus wherever it is asked; the generator refuses
      anything else. This departs from C2's game paragraph. (2) D074's
      objection is Other's relevance question, unchanged, with the direct
      undercutter of the particular inference; the consequence schemes get no
      question for it, and direct counterarguments stay available. (3) An
      answer scheme concludes worth_finding_out_first(A,G) from the owner's
      declared conditions (an investigation timely and reliable enough to
      settle whether A brings about G; its costs and risks justify finding out
      first), proposed for walton.yml through the proposal process and quoting
      the declaration. At that question the game accepts it and the
      source-based schemes that assert the exception, each with its own
