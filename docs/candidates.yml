  - id: C020
    name: One consideration as a gain and as an averted harm
    kind: link
    group: harms-of-not-acting
    decision: D069
    found:
      - "the second independent review of proposal D055-D059, 2026-10-22"
    confidence: low
    what: >-
      The same reason for doing X can be coded as positive consequences (G =
      the attic staying dry) or as the prudential form (C = the attic
      flooding). The two conclude the same statement but have different
      exceptions, so a weighing claim reaches only one, and a board can hold
      both framings at once. Proposal D055-D059's rule codes a consideration
      once; a declared equivalence would let the registry check it.
    compares: a gain and the same harm averted
    concludes: a rule for annotation, or a declared equivalence
    closest:
