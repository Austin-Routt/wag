  # --- threat-or-warning -------------------------------------------------------
  - id: C012
    name: Is the warning an indirect threat?
    kind: question
    group: threat-or-warning
    found:
      - "the independent review of proposal D055-D059, version 1, 2026-10-22"
    confidence: low
    what: >-
      A prudential warning (33.4) can carry an indirect threat when the
      speaker can bring the bad consequence about and means to. The book
      separates the two by the speaker's commitment to bringing it about. No
      question of 33.4 asks it, and nothing links 33.4 to threat.
    compares: who would bring the bad consequence about
    concludes: a question for the prudential form; if answered yes, a threat
    closest:
      - item: argument from threat (35) and the disjunctive threat (35.1)
        why: They code an explicit threat; a veiled one looks like a warning.
      - item: the prudential form's questions (33)
        why: They ask about likelihood and evidence, not about who brings the consequence about.
    sources:
      - "The book p. 102: an adviser's warning is not a threat; pp. 104-105: two warnings that read as indirect threats (after Walton 2000, p. 123)."
      - "ND p. 116: threats as negative consequences, at home in negotiation."
    sketch:
      note: On D055-D059 version 2's form of the prudential argument.
      schemes:
        - id: prudential_indirect_threat
          meta:
            title: The prudential form with an indirect-threat exception (candidate)
            source: Candidate C012.
          variables: [X, C]
          premises: ["not_doing(X)", "bad_consequence(X,C)"]
          assumptions: ["strongly_occur(X,C)"]
          exceptions: ["bad_outweighs(X,C)", "speaker_brings_about(C)"]
          conclusions: ["should_be_performed(X)"]
      language:
        speaker_brings_about/1: "The one giving the warning can bring about %s, and means to if the warning is ignored."
        strongly_occur/2: "If %s is not done, %s is likely to follow."
        bad_outweighs/2: "The action %s has bad consequences that outweigh %s."
      questions:
        prudential_indirect_threat:
          - {id: C012/Q1, asks: "Can the speaker bring C about, and does the speaker mean to if X is not done?", target: "speaker_brings_about(C)"}
    examples:
      - scheme: prudential_indirect_threat
        title: Protection
        invented: true
        use: argument
        text: You were thinking of not paying for our protection. But if you don't, your shop windows may get broken, which would be very bad for you. So pay.
        bindings:
          X: paying for protection
          C: the shop's windows being broken
        attacks:
          - question: C012/Q1
            text: The windows in this street get broken only in shops that refused to pay these same men.
      - scheme: prudential_indirect_threat
        title: The doctor's warning
        invented: true
        use: argument
        text: You were thinking of not giving up smoking. But if you don't, you may well get lung disease, which would be very bad for you. So give it up.
        bindings:
          X: giving up smoking
          C: getting lung disease
        attacks:
          - question: C012/Q1
            text: Asked and answered no; the doctor can neither cause the disease nor wants to, so it is a warning, not a threat.
      - scheme: prudential_indirect_threat
        title: The new lease
        invented: true
        use: argument
        text: You were thinking of not signing the new lease. But if you don't sign by Friday, you may find yourself without a flat, which would be very bad for you. So sign.
        bindings:
          X: signing the new lease by Friday
