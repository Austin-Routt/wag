# The candidates registry (docs/process.md §8): schemes, questions,
# exceptions and links that WAG does not have yet but that the literature,
# data or play suggest it may need. docs/candidates.md is generated from it
# by `wag-cli --catalogue-gen`; `wag-cli --catalogue-check` checks it.
#
# Fields:
#   groups: id (lower-case words joined by hyphens); name; families
#     (families.json ids; none: across families); about (what the members
#     share, and how they differ).
#   candidates: id (C and three digits, never reused); name; kind (scheme,
#     question, exception, link); group; decision (the register's decision
#     that settles it, needed once it meets the threshold); outcome (date,
#     by, result: reject, merge, domain or add; into; recorded), once taken;
#     found (who found it, when); confidence (the finder's: high, medium,
#     low); what; compares and concludes (short, for the group's table);
#     closest (item, why it falls short); related (candidate, how); sources
#     (the literature, the book's and ND's pages: references and our
#     paraphrase, never their text); sightings (source: kialo, game or
#     annotation; ref; place, unless a Kialo ref gives it; fit: clean or
#     strain; archived: a Kialo claim outside the discussion's active
#     scope; also: the other candidates the same claim is listed under;
#     note, in our words; found; verified, by a second reader who
#     read the text against the note); exempt (why the threshold does not
#     apply: a gap shown by analysis, not a pattern in data); sketch (the candidate as walton.yml
#     might have it: schemes, language, questions, checked like a
#     proposal's candidates, never applied); examples (as in a proposal; an
#     example of use is coded with the sketch, a near miss with a scheme
#     WAG has, near_miss_of naming the sketch); engine; needs; open.
#
# Sketches of questions and exceptions for the consequence schemes are
# written on the forms of proposal D055-D059, version 2 (bad_outweighs,
# good_outweighs, strongly_occur(X,C)), and define those templates; once
# D055 is applied, the check reports them as already in walton.yml, and
# they are removed here.

note: |-
  This is the registry of [`process.md`](process.md) §8. Candidates come
  from three places: the literature, data (Kialo, the gold, annotation
  runs) and play ("I wanted to say X and could not"). A review, an annotation
  run or a play report records each candidate in this file's shape. A new
  sighting of an existing candidate is added to that candidate. A claim
  that shows two patterns is listed under both, each listing naming the
  other; the check notes a claim listed twice without that.

  Each candidate is placed in a family of the scheme families
  (`wag/data/schemes/families.json`) and in a pattern group. A group's table
  sets its members side by side: what each compares or asks, what it
  concludes, what it comes closest to, how often it has been seen, and how
  far it has got. Kialo claims are cited by id with our own note; their
  text stays in the private workspace, and the book is cited by page.

  Not candidates yet, and recorded in the catalogue's analogy entries:
  several source cases folded into one (Carneades does not add arguments
  up); proportional analogies; imagined sources; and a precedent cited for
  its rule, which is exception_to_rule (whose exception reads a rule as a
  case: D058).

threshold:
  sightings: 3
  places: 2
  decision: D047

groups:
  - id: case-comparison
    name: Comparing cases
    families: [F04]
    about: >-
      Arguments from one case to another. Analogy relies on the cases being
      alike; the candidate relies on one case being a stronger case than the
      other for the same kind of claim.

  - id: inference-attacks
    name: Attacking an argument's inference
    about: >-
      Replies that do not deny an argument's premises or conclusion but say
      that its premises do not support its conclusion: by citing a parallel
      argument whose conclusion is plainly unacceptable (C002), or by saying
      that a reason for doing something is no reason for believing something
      (C011). Both conclude, in WAG's engine, that the argument is undercut.

  - id: weighing
    name: Weighing consequences
    families: [F15]
    about: >-
      Arguments that set consequences against each other. They differ in
      what is set against what: one consequence against another cited by
      the other side (C003), all of an action's consequences against all
      (C004), the consequences of two courses when one must be taken (C010),
      or a harm against the good it is needed for (C013). They differ also
      in what they conclude: D055's exceptions (C003, C013), a side-level
      exception (C004), or a practical claim (C010).

  - id: magnitude-risk
    name: Magnitude and risk
    families: [F15]
    about: >-
      How bad a consequence is, beside how likely it is. The book's
      questions on consequences ask about likelihood and evidence; these ask
      whether the consequence matters enough (C005), and argue that a
      catastrophic, irreversible harm outweighs a small likelihood (C008).

  - id: the-action
    name: The action itself
    families: [F15]
    about: >-
      Replies to a consequence argument about the action rather than its
      consequences: the action done differently, so that the harm does not
      follow (C006); another action that brings the same good at less cost
      (C017); or the action not possible at all (C018). Practical reasoning
      has questions for the last two; the consequence schemes have none.

  - id: values-against-consequences
    name: Values and rights against consequences
    families: [F09, F15]
    about: >-
      A consequence set against a right, a duty or a value, not against
      another consequence: the action is ruled out, or in, whatever its
      consequences.

  - id: harms-of-not-acting
    name: Harms of not acting
    families: [F15]
    about: >-
      Arguments from what follows if an action is not done. The book's forms
      for it speak to the agent (33.3's parenthetical) or warn the addressee
      (33.4); a harm of not acting to others has no form of its own (C015).
      The prudential form never says that doing the action would avert the
      harm (C016), and one consideration can be framed as a gain or as a
      harm averted (C020).

  - id: threat-or-warning
    name: Threat or warning
    families: [F15]
    about: >-
      Whether a warning of bad consequences is a prudential argument or an
      indirect threat: the difference is whether the speaker can bring the
      consequence about and means to.

  - id: practical-conclusions
    name: Where practical conclusions meet
    families: [F10, F15]
    about: >-
      Practical schemes whose conclusions no other scheme concludes or uses,
      so that their arguments meet nothing in a debate about the same
      action.

  - id: predicting-agents
    name: Predicting what agents will do
    families: [F10, F14]
    about: >-
      Predictions of an agent's action from the agent's reasons: what the
      agent expects an action to bring and wants. They conclude a
      prediction, not a recommendation.

candidates:
  # --- case-comparison ---------------------------------------------------------
  - id: C001
    name: Argument a fortiori
    kind: scheme
    group: case-comparison
    decision: D056
    found:
      - "the first independent review of proposal D001-D028-D029, 2026-10-22"
      - "the second independent review of that proposal: more Kialo sightings"
    confidence: high
    what: >-
      A claim holds in one case, and another case is a stronger case for the
      same kind of claim, so the claim holds there all the more ("if a
      student may borrow ten books, a professor certainly may"); negatively,
      if it fails for the stronger case it fails still more for the weaker
      ("not enough for a state, let alone a country"). The cases are ordered
      on the respect that matters, not alike.
    compares: two cases, one stronger for the claim than the other
    concludes: the claim, about the second case
    closest:
      - item: analogy (7)
        why: >-
          Its premise is that the cases are similar, which is false here,
          and a difference between them is the reason, not a defeater.
      - item: argument from precedent (exception_to_rule)
        why: A precedent applies a rule to a like case; nothing is ordered.
    sources:
      - "The book: not one of the compendium's schemes; not mentioned in pp. 1-138 (the OCR searched)."
      - "The classical argument from the more and the less; a fortiori as an argument of legal interpretation (Walton, Sartor and Macagno, Statutory Interpretation, 2021)."
      - "'A Refined Concept of A Fortiori Arguments for Argumentation Theory', which proposes four critical questions (not yet read here)."
    sightings:
      - source: kialo
        ref: "5637.347"
        fit: clean
        archived: true
        note: If separating parasitic conjoined twins is allowed, then ending a pregnancy, when the foetus is less formed still, should be too.
        found: second review of D001-D028-D029
        verified: session check, 2026-10-22
      - source: kialo
        ref: "13292.186"
        fit: clean
        note: The negated form; insect farming could not feed one US state, let alone a country.
        found: second review of D001-D028-D029
        verified: session check, 2026-10-22
      - source: kialo
        ref: "2629.8449"
        fit: strain
        archived: true
        note: In a young universe we could not see most of our own galaxy, let alone others; an a fortiori step inside an argument from evidence.
        found: second review of D001-D028-D029
        verified: session check, 2026-10-22
      - source: kialo
        ref: "2629.7265"
        also: [C013]
        fit: clean
        archived: true
        note: Good parents let a child suffer a little for a greater good, so how much more would a perfect God; it also argues the greater good (C013).
        found: session check of C013's sightings, 2026-10-22
        verified: session check, 2026-10-22
    sketch:
      note: >-
        As in proposal D001-D028-D029's candidates. It shares analogy's
        directional exception: a difference that tells against the claim
        defeats both, and the stronger-case difference, which favours the
        claim, defeats neither.
      schemes:
        - id: a_fortiori
          meta:
            title: Argument a fortiori (candidate)
            source: Candidate C001, not in the compendium; see D056.
          variables: [P1, P2, C1, C2]
          premises: ["in_case(P1,C1)", "stronger_case(C2,C1,P2)", "corresponds(P1,P2)"]
          assumptions: []
          exceptions: ["difference_against(C1,C2,P2)"]
          conclusions: ["P2"]
      language:
        stronger_case/3: "%s is a stronger case than %s for %s."
      questions:
        a_fortiori:
          - {id: walton/difference_against, asks: "Does a difference between the cases, other than the one the argument relies on, tell against the claim here?", target: "difference_against(C1,C2,P2)"}
    examples:
      - scheme: a_fortiori
        title: If not for a dog, then not for a child
        invented: true
        use: argument
        text: We would never leave a dog alone in a hot car for an hour; all the more, we must not leave a child there for ten minutes.
        bindings:
          C1: a dog left in a hot car for an hour
          C2: a child left in a hot car for ten minutes
          P1: leaving the dog in the hot car for an hour is wrong
          P2: leaving the child in the hot car for ten minutes is wrong
        attacks:
          - question: CQ:premise_acceptable
            target: stronger_case(C2,C1,P2)
            text: Ten minutes is far shorter than an hour; it is not clear that the child's case is the stronger one.
      - scheme: a_fortiori
        title: A professor's loans
        invented: true
        use: argument
        text: If a first-year student may borrow ten books from the library, a professor certainly may.
        bindings:
          C1: a first-year student borrowing ten books
          C2: a professor borrowing ten books
          P1: a first-year student may borrow ten books
          P2: a professor may borrow ten books
        attacks:
          - question: walton/difference_against
            text: Professors keep books for years; ten books lent to a professor are ten books gone from the shelves for the whole term.
      - scheme: a_fortiori
        title: Bread that would have been thrown away
        invented: true
        use: argument
        form: negated
        text: The court did not jail the man who stole bread to feed his children; still less should it jail the man who took bread that was about to be thrown away.
        bindings:
          C1: stealing bread to feed one's children
          C2: taking bread that was about to be thrown away
          P1: jailing the man who stole bread to feed his children was not justified
          P2: jailing the man who took bread about to be thrown away is not justified
        note: The negated form, with the claim negated in the bindings, as in analogy's.
      - scheme: analogy
        title: Staff loans, by likeness
        invented: true
        use: near-miss
        near_miss_of: a_fortiori
        text: Students may borrow ten books, and library staff are in the same position as students when they borrow, so staff may borrow ten books too.
        bindings:
          C1: a student borrowing ten books
          C2: a member of staff borrowing ten books
          P1: a student may borrow ten books
          P2: a member of staff may borrow ten books
        note: The cases are said to be alike, not ordered; nothing makes the staff member's case the stronger one, so it is analogy. Compare example 2.
    engine:
      - "Proposal D001-D028-D029's version 3 test (TestV3AFortioriBesideAnalogy, in the private workspace) and its second review's R13: a difference that tells against the claim defeats an a fortiori and an analogy argued for the same claim from the same cases; the stronger-case difference defeats neither."
      - "With version 2's undirected exception it would have forced a change to analogy (the second review's R10)."
    needs:
      - "A walton.yml addition through walton-clean/tools/edits.py (ADDITIONS) and its template."
      - "A catalogue entry with no book entry, in family F04, with questions drafted from the literature."
      - "The game later, at workstream E; it concludes a bare claim, so D057 applies to it."
    open:
      - "'A stronger case than C1 for P2' reads circularly, since P2 is already the claim about C2: should the respect in which C2 is stronger be a variable of its own?"
      - "'Other than the one it relies on' lives only in the question's text: is that enough, or does the exception need it in its formula?"
      - "Can annotators code the negated form without confusing the two directions?"

  # --- inference-attacks -------------------------------------------------------
  - id: C002
    name: Refutation by parallel argument
    kind: scheme
    group: inference-attacks
    decision: D056
    found:
      - "the first independent review of proposal D001-D028-D029, 2026-10-22"
      - "the second independent review of that proposal: more Kialo sightings"
    confidence: high
    what: >-
      An argument is attacked by citing a parallel argument of the same
      form, with plainly acceptable premises and a plainly unacceptable
      conclusion; the attacked argument's inference is thereby undercut ("by
      that reasoning, destroying an acorn would be as bad as felling an
      oak"). Its conclusion is about an argument, not a case. Also called
      refutation by logical analogy, or by parity of reasoning.
    compares: the attacked argument with a parallel one of the same form
    concludes: the attacked argument is undercut
    closest:
      - item: analogy (7), played as an undercutter
        why: >-
          In play the game already accepts analogy bound to the attacked
          argument's undercutter; in annotation, analogy about cases can only
          rebut the conclusion, and the parallel argument it cites appears in
          no formula.
    related:
      - candidate: C011
        how: Both undercut an argument's inference rather than deny its premises or conclusion.
    sources:
      - "The book: no scheme in the compendium; pp. 54-55 discuss Govier's a priori analogy, the family it belongs to."
      - "Govier's logical analogies; Woods and Hudak's parity of reasoning; Hitchcock's counterexampling parallel arguments; Juthe's refutation by parallel argument (Argumentation)."
    sightings:
      - source: kialo
        ref: "5637.12201"
        fit: clean
        archived: true
        note: By the same logic destroying an acorn would equal felling a tree; it answers 5637.12151.
        found: first review of D001-D028-D029
        verified: session check, 2026-10-22
      - source: kialo
        ref: "2629.18591"
        fit: clean
        archived: true
        note: Explaining life by selection, physics and chance is like explaining airplanes by wind and chance; ridicule by parity.
        found: first review of D001-D028-D029
        verified: session check, 2026-10-22
      - source: kialo
        ref: "5637.2296"
        fit: clean
        archived: true
        note: The same reasoning would condemn condoms as denying a potential child; 5637.3072 replies with a feature the parallel lacks, the sketch's exception.
        found: second review of D001-D028-D029
        verified: session check, 2026-10-22
      - source: kialo
        ref: "2629.22874"
        fit: clean
        note: Evidence that one suspect is innocent does not show another guilty; in the same way, disproving materialism does not prove theism.
        found: second review of D001-D028-D029
        verified: session check, 2026-10-22
      - source: kialo
        ref: "2629.19533"
        fit: strain
        note: If murder were wrong only for harming the species, failing to have a child would be as wrong; a reductio of a principle more than a parallel argument.
        found: second review of D001-D028-D029
        verified: session check, 2026-10-22
      - source: kialo
        ref: "5637.3697"
        fit: clean
        archived: true
        note: By the same claim, emergency rooms would encourage head injuries, yet no one would close them.
        found: second review of D001-D028-D029
        verified: session check, 2026-10-22
    sketch:
      note: >-
        As in proposal D001-D028-D029's candidates. A names an argument on
        the board, which walton.yml's formulas never do.
      schemes:
        - id: parallel_argument_refutation
          meta:
            title: Refutation by parallel argument (candidate)
            source: Candidate C002, not in the compendium; see D056.
          variables: [A, B]
          premises: ["same_form(B,A)", "acceptable_premises(B)", "unacceptable_conclusion(B)"]
          assumptions: []
          exceptions: ["form_difference(A,B)"]
          conclusions: ["undercut(A)"]
      language:
        same_form/2: "%s has the same form as %s."
        acceptable_premises/1: "The premises of %s are plainly acceptable."
        unacceptable_conclusion/1: "The conclusion of %s is plainly unacceptable."
        form_difference/2: "%s relies on a feature that %s lacks."
        undercut/1: "%s does not support its conclusion."
      questions:
        parallel_argument_refutation:
          - {id: walton/form_difference, asks: "Does the attacked argument rely on a feature that the parallel argument lacks?", target: "form_difference(A,B)"}
    examples:
      - scheme: parallel_argument_refutation
        title: Acorns and oaks
        kialo: "5637.12201"
        use: argument
        text: By the same logic, destroying an acorn should be morally equivalent to destroying a tree. As these are not morally equivalent, the former case is likewise not morally equivalent.
        bindings:
          A: argument a12 on the board, that a zygote is a whole human, so destroying it is immoral
          B: the argument that an acorn is a whole oak, so destroying an acorn is as bad as felling an oak
        attacks:
          - question: walton/form_difference
            text: A zygote may become a being with interests and a life of its own; an acorn becomes a tree with neither. The attacked argument relies on that.
      - scheme: parallel_argument_refutation
        title: Airplanes made by wind and chance
        kialo: "2629.18591"
        use: argument
        text: Arguing that natural selection, the laws of physics, and chance explain the origins of life is akin to claiming that airplanes were created by wind and chance alone, and not by the work of a creator.
        bindings:
          A: argument a7 on the board, that natural selection, physical law and chance explain the origin of life
          B: the argument that wind and chance explain the origin of airplanes
        attacks:
          - question: CQ:premise_acceptable
            target: same_form(B,A)
            text: Airplanes do not reproduce; natural selection works only on things that copy themselves with variation, so the two arguments do not share a form.
      - scheme: parallel_argument_refutation
        title: Crashes near home, deaths in bed
        invented: true
        use: argument
        text: You say that most crashes happen within five miles of home, so those are the most dangerous roads. By that reasoning, since most people die in bed, beds would be the most dangerous place to be.
        bindings:
          A: argument a3 on the board, that most crashes happen within five miles of home, so those roads are the most dangerous
          B: the argument that most people die in bed, so beds are the most dangerous place to be
        note: Both arguments count events without asking how much time is spent where; the parallel argument shows the flaw by giving it an absurd conclusion.
      - scheme: analogy
        title: Acorns, as a counter-analogy
        invented: true
        use: near-miss
        near_miss_of: parallel_argument_refutation
        text: Destroying an acorn is nothing like felling an oak, and a zygote stands to a person as an acorn stands to an oak, so destroying a zygote is nothing like killing a person.
        bindings:
          C1: an acorn being destroyed
          C2: a zygote being destroyed
          P1: destroying the acorn is not as bad as felling an oak
          P2: destroying the zygote is not as bad as killing a person
        note: It argues for the opposite claim, a rebuttal, rather than showing that the attacked argument's reasoning fails; compare example 1.
    engine:
      - "The second review of D001-D028-D029 (R9, R9b, R9c, R12): it works as an answer at the argument locus; it undercuts the attacked argument, and its own exception, once proven, reinstates it."
      - "As a support move it never applies: the adapter files its main argument as an exception argument, with no owner and no presumed premises. The move check (S9) refuses it at the inference locus, since it has no answer variable."
      - "Bound to a description, A names no argument; A must be bound to the attacked argument's id."
    needs:
      - "D056 chooses: (a) analogy played as an undercutter (no new scheme; templates that read well with an argument as a case; an annotation rule); or (b) a scheme of its own, which needs code so that S9 returns undercut(<target>) at the inference locus and the move check binds A to the attacked argument."
    open:
      - "'The premises of B are plainly acceptable' strains when B is a pattern, and is false when B shares the very principle under attack (a reductio, 2629.19533): the same candidate or another?"
      - "Ridicule by parity (2629.18591) is often a weak or fallacious use; the exception is the defence, and the dialogue type should set its weight."
      - "The book's a priori analogy (pp. 54-55) is the source to read before writing its questions."

  - id: C011
    name: Appeal to consequences, as an objection
    kind: question
    group: inference-attacks
    found:
      - "the independent review of proposal D055-D059, version 1, 2026-10-22"
    confidence: low
    what: >-
      The objection that a consequence argument is offered for the truth of
      a claim: that one should believe something, or that it would be bad if
      it were false, is no reason to think it true. In the game, S9 already
      keeps a consequence scheme from concluding a factual statement, but no
      question lets a player raise the objection, which Kialo users raise by
      name.
    compares: a reason to act (or believe) with a reason to think true
    concludes: the argument is undercut, as support for a factual claim
    closest:
      - item: S9 (game-rules.md)
        why: It refuses the move in the game; it does not let a player object to it in annotation or argue about it.
      - item: the consequence entries' dialogue-type notes
        why: They mark inquiry as a type where the scheme is suspect, but name no objection.
    related:
      - candidate: C002
        how: Both undercut an argument's inference.
      - candidate: C014
        how: Both concern where a practical conclusion may meet a claim.
    sources:
      - "ND pp. 176-177: the argument ad consequentiam, and when it is fallacious."
    sightings:
      - source: kialo
        ref: "2629.18670"
        fit: clean
        note: Even if one should believe in a god, that is no reason to be convinced one exists; it answers 2629.17573, a net-benefit argument for belief.
        found: review of D055-D059 v1
        verified: session check, 2026-10-22
      - source: kialo
        ref: "2629.19027"
        fit: clean
        note: Arguing for God's existence from how bad its absence would be is named as the appeal to consequences; it answers 2629.3501.
        found: review of D055-D059 v1
        verified: session check, 2026-10-22
    open:
      - "A sketch: an exception on the consequence schemes when the action is holding a belief, or a link rule that a practical conclusion about believing P does not support P? 2629.10311 defends the opposite, pragmatist, view in the same discussion."
      - "Only one discussion so far (on God's existence); the others are practical debates, where the objection rarely arises."

  # --- weighing ----------------------------------------------------------------
  - id: C003
    name: Weighing an opposite consequence against a cited one
    kind: scheme
    group: weighing
    decision: D064
    found:
      - "the independent review of proposal D055-D059, version 1, 2026-10-22"
    confidence: high
    what: >-
      An argument that a consequence H of an action matters more than the
      consequence G that an argument of the other sign cites, so that the
      other argument does not carry. It is the claim behind D055's sided
      exceptions, argued with a scheme tied to H rather than with Other.
    compares: one consequence of the action against one cited by the other side
    concludes: the other argument's exception (bad_outweighs or good_outweighs)
    closest:
      - item: Other, concluding D055's exception
        why: >-
          It carries the claim but not its link to H, so the weighing claim
          survives the loss of the consequence it relies on.
      - item: negative practical reasoning (26.2), more_serious_consequences/2
        why: It compares consequences only for acting on a presumption, inside another scheme.
      - item: 33/CQ3 as a rebuttal (D055)
        why: A plain opposite consequence is weighed by the scheme weights, which cannot say that one consequence matters more.
    related:
      - candidate: C004
        how: The same comparison made globally, naming no consequence.
      - candidate: C013
        how: C003 with a premise that the harm is needed for the good.
      - candidate: C010
        how: C010 compares the consequences of two courses, not two consequences of one.
      - candidate: C005
        how: How much a consequence matters is what C003's comparison and C005's question both turn on.
    sources:
      - "ND p. 159: the evaluation of consequences as a comparative weighing of the good against the bad; p. 168: the course followed by the lesser evil, after Aristotle; p. 170: the bad outweighing the good."
    sightings:
      - source: kialo
        ref: "13292.127"
        fit: clean
        note: Starvation from less access to meat is a worse threat than any harm of eating much meat; weighs against a class of consequences (the gold's secondary instance).
        found: review of D055-D059 v1
        verified: session check, 2026-10-22
      - source: kialo
        ref: "13292.43"
        fit: clean
        note: Revenue is not why the tax is wanted; sustainability and animal welfare press harder than the lost revenue.
        found: review of D055-D059 v1
        verified: session check, 2026-10-22
      - source: kialo
        ref: "5637.12239"
