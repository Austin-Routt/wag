# Proposal for decisions D055 and D059 (docs/decisions.md): the
# consequence family's opposite-consequences exception, and the prudential
# form's conclusion. `wag-cli --proposal` checks it and writes its view,
# D055-D059.md. How proposals work: process.md §5.
#
# Version 1, 2026-10-22. The owner chose option C for D055 (sided
# exceptions) on 2026-10-22; this proposal works it out and is to be
# reviewed independently before walton.yml changes.

decisions: [D055, D059]
title: Sided opposite-consequences exceptions for the consequence family
summary: |-
  **The problem (D055).** The book's argument from consequences (33) has four
  forms: positive (33.1), negative (33.2), reasoning from negative consequences
  (33.3) and the prudential form (33.4). One list of three questions serves all
  four. The third asks whether consequences of the opposite kind should be taken
  into account. On 2026-10-22 the owner gave 33.1–33.3 that question as an
  exception, `other_consequences(A)` ("doing A also has consequences of the
  opposite kind that outweigh the ones cited"); 33.4 already had it. Its meaning
  depends on the argument it is attached to (bad outweighs good on a positive
  argument; good outweighs bad on a negative one), but its formula does not, and
  Carneades treats equal formulas as one statement. So an argument that the bad
  consequences of an action outweigh the good also defeats every negative
  argument about the same action. In the batch-2 gold, 16 consequence arguments
  about `tax_meat` (5 for, 11 against) share the single statement
  `other_consequences(tax_meat)`: one argument for it would knock out all 16.

  **The change (option C, chosen by the owner on 2026-10-22).** Each side gets
  its own exception, naming the consequence its argument cites:
  - positive consequences (33.1): `bad_outweighs(A,G)`, "doing A also has bad
    consequences that outweigh G";
  - negative consequences (33.2) and reasoning from negative consequences
    (33.3): `good_outweighs(A,G)` and `good_outweighs(A,B)`;
  - the prudential form (33.4), which argues for doing X to avoid a bad
    consequence C of not doing it: `bad_outweighs(X,C)`.

  A plain opposite consequence is still a rebuttal: a consequence argument of
  the opposite sign, which Carneades weighs against the first, as the game
  already plays it (`CQ:opposite_consequences`). The exception is for the
  further claim that the opposite consequences *outweigh* the one cited. That
  claim matters because WAG sets weights by scheme and context, not by content:
  two opposite consequence arguments of equal weight tie, and under the usual
  proof standard both go out, so without the exception nothing lets a player
  argue that one consequence matters more. Kialo makes the claim outright
  (13292.127, 5637.12239; examples 1 and 6).

  **Why not the alternatives.** Keeping `other_consequences(A)` keeps the
  defect. Naming the consequence alone, `other_consequences(A,G)`, fixes it only
  when the two sides cite different consequences: when they cite the same one
  and value it oppositely (legal cannabis means more people use it, which one
  side counts as good and the other as bad), they still share the exception
  (examples 3 and 7; shown in WAG's engine by the second review of proposal
  D001-D028-D029). Dropping the exception, so that the third question is
  answered only by a rebuttal, loses the weighing claim.

  **D059, the prudential form's conclusion.** 33.4 concludes `prudential(X)`,
  "you ought prudentially to do X", which no other scheme concludes or uses, so
  a prudential argument neither supports nor meets any practical claim about X.
  It is a reason for doing X, as positive consequences and practical reasoning
  are, and its conclusion becomes `should_be_performed(X)`, the game's
  practical conclusion, as the owner chose for the slippery slope's base case
  and the practical analogies (D029). The book's "prudentially" and "other
  things being equal" are carried by the scheme, its weight and its
  questions, as "the right thing to do" is in the practical analogies.

  **What else this settles, and what it leaves.**
  - D053: the positive and negative consequence schemes (33.1, 33.2) become an
    exact polarity pair: their premises flip good/bad (declared contraries),
    their conclusions are contradictories, and their exceptions are a sided flip
    (`bad_outweighs`/`good_outweighs`, same arguments). They can be declared
    once this is made.
  - A scan of walton.yml for defeaters shared by arguments of opposite sign
    finds only two: `other_consequences`, fixed here, and ethotic argument's
    assumption `character_is_relevant(S)`, which is neutral (if character is
    irrelevant to S, both the positive and the negative ethotic argument fail,
    rightly).
  - Informed, not settled: D033 (whether argument from waste takes a "future
    losses outweigh" defeater, as the critic's exception or the proponent's
    assumption) and sunk costs' exception `future_losses_outweigh(A)`, which are
    comparative claims of the same kind, on one side only; D023 (whether ends
    and means borrows these questions); D009 (the game's question texts: the
    game keeps its rebuttal question and gains the exception question at
    workstream E).
  - Not touched: D008 (a modal brings_about), D038 (causal chains backing
    brings_about), D027 (33.3's omission case).
  - Found while drafting: walton.yml's threat, the near miss of example 14,
    puts the respondent's action where the threatened consequence belongs in
    two of its premises, so it reads wrongly; registered as D060, not changed
    here.

  **What is ours, not the book's:** the two exceptions and their templates (the
  book asks whether opposite consequences should be taken into account, and
  prints no formula); the reading of "taken into account" as two routes, a
  rebuttal and, for a claim that they outweigh, the exception; 33.4's
  conclusion in the game's vocabulary; 33.4's second question targeting its
  consequence premise (the catalogue gives it no target today).

  **What to judge in the renderings:** whether every line says something true
  and sensible; the two templates, above all with 33.4, whose cited
  consequence is one of *not* acting; whether a plain opposite consequence and
  an outweighing claim are told apart in the examples; and whether 33.4's
  conclusion still says what the book's does.

schemes:
  - id: positive_consequences
    meta:
      title: Argument from Positive Consequences
      source: Douglas Walton, A Pragmatic Theory of Fallacy, The University of Alabama Press, Tuscaloosa and London, 1995, pp. 155-156.
    variables: [A, G]
    premises: ["brings_about(A,G)", "good(G)"]
    assumptions: []
    exceptions: ["bad_outweighs(A,G)"]
    conclusions: ["should_be_performed(A)"]
  - id: negative_consequences
    meta:
      title: Argument from Negative Consequences
      source: Douglas Walton, A Pragmatic Theory of Fallacy, The University of Alabama Press, Tuscaloosa and London, 1995, pp. 155-156.
    variables: [A, G]
    premises: ["brings_about(A,G)", "bad(G)"]
    assumptions: []
    exceptions: ["good_outweighs(A,G)"]
    conclusions: ["¬should_be_performed(A)"]
  - id: negative_consequences_reasoning
    meta:
      title: Reasoning from Negative Consequences
      source: Douglas Walton, A Pragmatic Theory of Fallacy, The University of Alabama Press, Tuscaloosa and London, 1995, pp. 155-156.
    variables: [A, B]
    premises: ["agent_bring_about(A,B)", "bad_for_goals(B)"]
    assumptions: []
    exceptions: ["good_outweighs(A,B)"]
    conclusions: ["¬should_be_performed(A)"]
  - id: negative_consequences_prudential
    meta:
      title: Argument from Negative Consequences (Prudential Inference)
      source: Douglas Walton, A Pragmatic Theory of Fallacy, The University of Alabama Press, Tuscaloosa and London, 1995, pp. 155-156.
    variables: [X, C]
    premises: ["not_doing(X)", "bad_consequence(X,C)"]
    assumptions: ["strongly_occur(X)"]
    exceptions: ["bad_outweighs(X,C)"]
    conclusions: ["should_be_performed(X)"]

language:
  bad_outweighs/2: "Doing %s also has bad consequences that outweigh %s."
  good_outweighs/2: "Doing %s also has good consequences that outweigh %s."

questions:
  positive_consequences:
    - {id: 33/CQ1, asks: "How likely is it that doing A would actually lead to G?", target: "brings_about(A,G)"}
    - {id: 33/CQ2, asks: "What evidence shows that doing A would lead to G, and is it strong enough for the claim?", target: "brings_about(A,G)"}
    - {id: 33/CQ3, asks: "Would doing A also have bad consequences that outweigh G?", target: "bad_outweighs(A,G)"}
  negative_consequences:
    - {id: 33/CQ1, asks: "How likely is it that doing A would actually lead to G?", target: "brings_about(A,G)"}
    - {id: 33/CQ2, asks: "What evidence shows that doing A would lead to G, and is it strong enough for the claim?", target: "brings_about(A,G)"}
    - {id: 33/CQ3, asks: "Would doing A also have good consequences that outweigh G?", target: "good_outweighs(A,G)"}
  negative_consequences_reasoning:
    - {id: 33/CQ1, asks: "How likely is it that bringing about A would lead to B?", target: "agent_bring_about(A,B)"}
    - {id: 33/CQ2, asks: "What evidence shows that bringing about A would lead to B?", target: "agent_bring_about(A,B)"}
    - {id: 33/CQ3, asks: "Would bringing about A also have good consequences, for the agent's goals, that outweigh B?", target: "good_outweighs(A,B)"}
  negative_consequences_prudential:
    - {id: 33/CQ1, asks: "How likely is it that C will follow if X is not done?", target: "strongly_occur(X)"}
    - {id: 33/CQ2, asks: "What evidence shows that not doing X would bring about C?", target: "bad_consequence(X,C)"}
    - {id: 33/CQ3, asks: "Would doing X have bad consequences of its own that outweigh avoiding C?", target: "bad_outweighs(X,C)"}

effects:
  - "walton.yml, through walton-clean/tools/edits.py as owner decisions, with CHANGELOG rows: the exception other_consequences(A) of 33.1-33.3 (added by the owner's decision of 2026-10-22) and other_consequences(X) of 33.4 become bad_outweighs(A,G), good_outweighs(A,G), good_outweighs(A,B) and bad_outweighs(X,C); 33.4's conclusion prudential(X) becomes should_be_performed(X). Templates added: bad_outweighs/2, good_outweighs/2. Unused afterwards: other_consequences/1 and prudential/1, kept and listed as orphan templates, as the cleaning does. check/run.sh regenerates the derived files; the gate and the registry differ only in the four schemes. The annotation engine's copy, wag/data/annotation/walton.yml, is copied."
  - "links.json: 33's CQ3 maps to the new exception in each of 33.1-33.4; 33.4's conclusion map becomes should_be_performed(X), and its match level is reviewed (the conclusion restated in the game's vocabulary, as 8.1 and 8.2)."
  - "Catalogue: the four entries' 33/CQ3 retargeted, with notes saying that a plain opposite consequence is a rebuttal and the exception is the claim that it outweighs; 33.4's 33/CQ2 targets bad_consequence(X,C); the CQ3 discrepancies record the change (D055 done); 33.4 records its conclusion (D059 done); the game-differs decisions updated (the game keeps CQ:opposite_consequences as a rebuttal and gains the exception question at workstream E). The examples here move into the entries. The consequence pair is declared under D053."
  - "The batch-2 gold, guidelines and lexicon, in both copies: the 16 consequence instances get their own exceptions, bad_outweighs(tax_meat,G) or good_outweighs(tax_meat,G) with each instance's G; challenges that name other_consequences follow; 13292.127's secondary weighing instance, coded Other, may conclude bad_outweighs(tax_meat, the good consequence it answers); validate.py must pass. Guidelines §3: code a plain opposite consequence as a consequence argument of the opposite sign (a rebuttal), and an explicit claim that opposite consequences outweigh the cited one as an argument for the exception, with Other unless a source-based scheme fits. to_wag.py's replay is regenerated."
  - "The game, at workstream E: AS:consequences and AS:negative_consequences get the exceptions, with an exception-locus question beside the rebuttal question they keep; no scheme concludes the exceptions, so a player argues them with Other or a scheme whose conclusion is a statement variable. Until then the catalogue records that the game's copy differs."
  - "Register: D055 and D059 decided; D053 can declare the consequence pair; D033, D023 and D009 note this proposal."

examples:
  # --- positive_consequences (33.1) ---------------------------------------
  - scheme: positive_consequences
    title: A meat tax against unhealthy eating
    kialo: "13292.115"
    use: argument
    text: A tax on meat would combat unhealthy meat consumption.
    bindings:
      A: governments putting a tax on meat
      G: less unhealthy meat consumption
    attacks:
      - question: 33/CQ1
        text: People who eat a lot of meat buy it whatever it costs; a tax that adds a little to the price changes little for them.
      - question: 33/CQ3
        text: Kialo 13292.127 claims that starvation from reduced access to meat is a worse threat than any harm of high meat consumption, that is, that the tax's bad consequences outweigh this good one.
    note: >-
      The thesis's action (tax_meat), as the gold binds it. 13292.127's
      comparison is the exception's claim; the starvation itself, argued as a
      negative consequence, would be a rebuttal.

  - scheme: positive_consequences
    title: A congestion charge
    invented: true
    use: argument
    text: A congestion charge would get traffic in the city centre moving again, so the council should bring one in.
    bindings:
      A: the council bringing in a congestion charge
      G: traffic in the city centre moving again
    attacks:
      - question: 33/CQ2
        text: The only figures quoted come from a city with a metro on every street; nothing shows the charge would free a centre with one bus line.

  - scheme: positive_consequences
    title: Legal cannabis, for
    invented: true
    use: argument
    text: Legalising cannabis would mean more adults use it openly and safely, which is a good thing.
    bindings:
      A: legalising cannabis
      G: more adults using cannabis
    note: >-
      With example 7, both sides cite the same consequence and value it
      oppositely. Each argument's exception names its own side
      (bad_outweighs here, good_outweighs there), so they share none; with
      other_consequences(A,G) they would share one. The value dispute itself
      is fought over good(G) and bad(G).

  - scheme: practical_reasoning2
    title: Clean air as the goal
    invented: true
    use: near-miss
    near_miss_of: positive_consequences
    text: The city has set itself the goal of clean air by 2030, and a congestion charge is the way to get there, so it should bring one in.
    bindings:
      A: bringing in a congestion charge
      S1: the city's air being dirty
      S2: the city's air being clean
      G: clean air by 2030
    note: The action is argued for as the means to a goal the agent has set, not by a consequence judged good; practical reasoning, not positive consequences.

  # --- negative_consequences (33.2) ---------------------------------------
  - scheme: negative_consequences
    title: A meat tax and the poor
    kialo: "13292.7"
    use: argument
    text: A sin tax on meat would make food more expensive, despite many people not being able to afford it.
    bindings:
      A: governments putting a tax on meat
      G: food becoming less affordable for the poor
    attacks:
      - question: 33/CQ1
        text: Meat is a small part of what poor households spend on food, and cheaper foods would not be taxed.
      - question: 33/CQ3
        text: The health gains of eating less meat, above all among the poor, who suffer most from diet-related disease, outweigh a higher price for one food.
    note: >-
      A plain counter (the tax cuts emissions) would be a positive consequences
      argument, a rebuttal; this attack is the further claim that the good
      outweighs this bad, the exception.

  - scheme: negative_consequences
    title: Abusive relationships and access to abortion
    kialo: "5637.1866"
    use: argument
    text: People in physically abusive relationships are likely to stay tethered to their abusers when they cannot end a pregnancy.
    bindings:
      A: making abortion services inaccessible
      G: people in abusive relationships staying tied to their abusers
    attacks:
      - question: 33/CQ3
        text: Kialo 5637.12239 replies that healthy relationships also last longer when abortion services are inaccessible, and that the benefit of that may outweigh the harm of bad relationships enduring.
    note: The Kialo text is condensed. 5637.12239 states the weighing claim outright ("may outweigh"), so it is an argument for good_outweighs, the exception, not only a rebuttal.

  - scheme: negative_consequences
    title: Legal cannabis, against
    invented: true
    use: argument
    text: Legalising cannabis would mean more adults use it, which is bad for public health.
    bindings:
      A: legalising cannabis
      G: more adults using cannabis
    attacks:
      - question: 33/CQ2
        text: The studies cited measure use among teenagers, not adults, and come from before any country legalised it.
    note: The counterpart of example 3, with the same consequence valued oppositely.

  - scheme: slippery_slope_base_case
    title: The first step to a meat ban
    invented: true
    use: near-miss
    near_miss_of: negative_consequences
    text: A meat tax is only the first step; it will lead, one rise after another, to meat being banned outright.
    bindings:
      A: governments putting a tax on meat
      E: meat being banned outright
    note: The bad outcome is reached through a chain of further steps, not as the action's own consequence; the slippery slope's base case.

  # --- negative_consequences_reasoning (33.3) ------------------------------
  - scheme: negative_consequences_reasoning
    title: A job abroad
    invented: true
    use: argument
    text: If I take the job abroad, my children will lose all their friends, and that goes against everything I want for them, so I should not take it.
    bindings:
      A: my taking the job abroad
      B: my children losing all their friends
    attacks:
      - question: 33/CQ1
        text: The children are ten and twelve, and the international school there is known for helping newcomers settle; losing all their friends is unlikely.
      - question: 33/CQ3
        text: The job doubles my salary and would pay for the children's university, which serves what I want for them far more than staying near their friends.

  - scheme: negative_consequences_reasoning
    title: A two-year lease
    invented: true
    use: argument
    text: If I sign a two-year lease, I am tied to the city just when I meant to travel, which works against my plans, so I should not sign it.
    bindings:
      A: my signing a two-year lease
      B: my being tied to the city when I meant to travel
    attacks:
      - question: 33/CQ2
        text: The lease has a clause that lets you leave after six months with a month's notice; you have not read it.

  - scheme: practical_reasoning2
    title: A job abroad, as a goal
    invented: true
    use: near-miss
    near_miss_of: negative_consequences_reasoning
    text: My goal is to keep the children settled, and turning down the job abroad is how I do that, so I should turn it down.
    bindings:
      A: my turning down the job abroad
      S1: the children being at a school they love
      S2: the children staying at that school
      G: the children being settled
    note: The agent argues from a goal to the means; 33.3 argues from a bad outcome of the action to not doing it.

  # --- negative_consequences_prudential (33.4) -----------------------------
  - scheme: negative_consequences_prudential
    title: Backing up a thesis
    invented: true
    use: argument
    text: You were thinking of not backing up your thesis. But if you don't, one disk failure could lose a year's work, which would be very bad for you. So you should back it up.
    bindings:
      X: backing up your thesis
      C: losing a year's work
    attacks:
      - question: 33/CQ1
        text: The laptop is new, and the university server already keeps a copy every night; a loss is very unlikely.
      - question: 33/CQ3
        text: The only backup on offer is a public cloud service, and the thesis holds confidential interview data; putting it there would breach the ethics approval, which is worse than the small risk of loss.
    note: >-
      It argues for doing X, so its conclusion is should_be_performed(X)
      (D059): in the game it meets a negative consequences argument that
      backing up should not be done. Its exception is on the positive side,
      bad_outweighs, and the cited consequence C is one of not acting, so the
      exception reads: doing X has bad consequences that outweigh losing a
      year's work.

  - scheme: negative_consequences_prudential
    title: A flu jab before exams
    invented: true
    use: argument
    text: You were going to skip the flu jab this year. But if you don't get it, you may fall ill during your exams, which would be very bad for you. So get the jab.
    bindings:
      X: getting the flu jab
      C: falling ill during the exams
    attacks:
      - question: 33/CQ2
        text: Last winter's flu peaked in February and the exams are in December; nothing shows an outbreak during the exams.

  - scheme: threat
    title: Pay or the photos go out
    invented: true
    use: near-miss
    near_miss_of: negative_consequences_prudential
    text: If you don't pay me by Friday, I'll send those photos to your employer.
    bindings:
      X: your not paying by Friday
      C: the photos being sent to your employer
    note: >-
      The bad consequence is one the arguer will bring about, as a threat; the
      prudential form cites a consequence that follows of itself. walton.yml's
      threat puts the respondent's action where the threatened consequence
      belongs in two premises (position_to_know(X), assert_bad(X,C)), so its
      lines read wrongly: decision D060, found while drafting this proposal.
