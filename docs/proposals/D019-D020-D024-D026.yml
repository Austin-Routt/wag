      question: 55.1/CQ3
      polarity: attack
      bindings:
        R: the exam board's zero rule for missed papers
        C: the board must record a zero for Ana's missed paper
    text: "The zero rule can be waived for Ana's paper, missed for an operation, and the zero the board must record is about that very paper; so her exceptional case defeats the zero rule's application there."
    bindings:
      R: the exam board's zero rule for missed papers
