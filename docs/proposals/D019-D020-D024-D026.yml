  # --- bridge_from_exceptional_case -------------------------------------------
  - scheme: bridge_from_exceptional_case
    title: Ana's operation answers the zero rule (as an answer)
    invented: true
    use: answer
    answers: "55.1/CQ3 of the established-rule argument above that the board must record a zero for Ana's missed paper; it concludes that argument's exception, rule_exception_or_excuse(R,C)."
    answer_to:
