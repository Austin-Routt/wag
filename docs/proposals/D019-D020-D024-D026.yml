  # --- precedent_slippery_slope --------------------------------------------------
  - scheme: precedent_slippery_slope
    title: Ana, Ben and every booked appointment
    invented: true
    use: argument
    text: "Ana says her operation makes her missed paper an exception to the zero rule. But if her booked operation counts, Ben's booked dental appointment must count too, and then any booked appointment at all, and a rule that bends for every appointment would be intolerable. So Ana's paper cannot be an exception to it."
    bindings:
      C0: Ana's paper, missed for an operation
      C1: Ben's paper, missed for a dental appointment
      Cn: any paper missed for a booked appointment
      R: the exam board's zero rule for missed papers
    attacks:
      - question: 50/CQ1
        text: "No one can sit a paper the day after an operation, while a dental check-up can be moved: waiving the rule for Ana commits the board to nothing for Ben."
      - question: 50/CQ2
        text: "From Ben's appointment to every booked appointment the chain is only asserted; nothing shows the board would have to go on."
      - question: 50/CQ3
        text: "Letting booked appointments be sat later would be a nuisance, not intolerable: every paper would still be sat."
    note: "It concludes ¬case_exception(R,C0), the negation of the exceptional case's premise for the same rule and the same paper (above), so the two meet in the engine; with the one-place formula of today the slope named no rule (point (a))."
  - scheme: precedent_slippery_slope
    title: A garden room over the building line
    invented: true
    use: argument
    text: "The Greens say their garden room is an exception to the building-line rule. If the council lets it stand, it must let their neighbours build out too, and soon every house on the street will reach the pavement, which would be intolerable. So their case cannot be an exception."
    bindings:
      C0: the Greens' garden room over the building line
      C1: a neighbour's garden room over the building line
      Cn: every house on the street built out to the pavement
      R: the council's building-line rule
    attacks:
      - question: CQ:premise_acceptable
        target: "claimed_exception(C0,R)"
        text: "The Greens never asked for an exception: they say the room is behind the line, and they have the survey to show it."
      - question: 50/CQ1
        text: "Their room is on a corner plot, the only one on the street, so letting it stand binds the council to nothing for the others."
  - scheme: negative_consequences
    title: The cost of a second sitting
    invented: true
    use: near-miss
    near_miss_of: precedent_slippery_slope
    text: "Making an exception for Ana would mean booking the exam hall a second time, at a cost the board cannot spare; so the board should not make one."
    bindings:
      A: the board making an exception for Ana's missed paper
      G: the board paying to book the exam hall a second time
    note: "A cost of granting the exception, not a chain of cases that must be treated alike: negative consequences."
