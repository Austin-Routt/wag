# Proposal for decisions D081 and D084 (docs/decisions.md): the reserved
# name is/2, and the sorites chain scoped to its property. `wag-cli
# --proposal` checks it and writes its view, D081-D084.md. How proposals
# work: process.md §5.
#
# Version 1, 2026-11-22. The changes come from ChatGPT's review of stages 0
# and 1 (patches 2 and 3 of its package; the private workspace's
# reviews/2026-11-22/5-chatgpt-stage-review-01-code-and-data.zip). Two
# independent reviewers checked them, one against the book's page images
# (the private workspace's verify/r-stage-review-2026-11-22/, reports A and
# B). D084 and D081 are decided under the owner's standing rule of
# 2026-11-22 (process.md §5), which replaces the owner's reading of this
# view; the proposal check and the independent review still come first.
#
# Checked with no errors or warnings, then applied the same day through
# edits.py; the D081 template is this proposal's wording.

decisions: [D081, D084]
title: The reserved name is/2, and the sorites chain scoped to its property
applied: 2026-11-22, through walton-clean/tools/edits.py (D081 and D084, under the owner's standing rule)
summary: |-
  **What changes.** Three schemes, in two decisions.

  - **D084, is/2 becomes is_a/2.** Since 2026-11-22 WAG runs the schemes
    library's engine, which reserves `is`, `true` and `false` as predicate
    names: in a rule body GoCHR runs is/2 as an assignment. group_2 concludes
    is(M,Q) and rule_physical_world_1 has is(W,D) as a premise, so the
    validator fails both schemes and the language key, and the engine's own
    inference never draws group_2's conclusion. Only the name changes: is_a/2
    is the schemes library's name, and the template stays "%s is %s.". WAG
    instantiates schemes with explicit parameters, which works with either
    name.
  - **D081, the sorites chain names its property.** The chain premise,
    reapplication_sequence(A2,A), says that a chain of steps leads from the
    clear case A2 to the case A, but not what the steps are about. Every other
    formula of the scheme is about one property P: the clear case has P, a
    neighbour of a case with P has P, and the conclusion is that A may have
    P. With a binary chain, a chain built for one property (wealth: a fortune
    less one coin is still a fortune) satisfies the premise of an argument
    about another (baldness). reapplication_sequence(A2,A,P) ties the chain
    to the property the argument is about. The book's chain premise names no
    property (p. 341); scoping it to P is our reading, which keeps the
    argument about one property throughout, as its other premises and its
    conclusion are.

  D081 also approves, unchanged, three repairs the cleaning made on
  2026-10-22 that awaited the owner (the CHANGELOG's "Repairs that need the
  owner's approval"): moral_justification_ad_populum_excuse concludes that the
  speaker's action is morally acceptable, as the book's conclusion says
  (p. 312); sacrifice's value is the declared variable V, shared with the
  conclusion (p. 322); rhetorical_oppositions_normative keeps WAG's role
  order, treatment first, which its templates follow (p. 318). They are
  already in walton.yml; this proposal does not change them, so they are
  listed under the effects, not as schemes.

  **What is ours, not the book's:** the property in the chain premise; the
  chain template, in our own words; the name is_a.

  **Not part of D084:** the schemes library also adds a premise to
  rule_physical_world_1, that W and D are referentially coextensive. That
  changes what the scheme asserts (class inclusion, a whale is a mammal, is
  not coextension), and would need a decision of its own.

  **What to judge in the renderings:** whether the chain premise reads as a
  chain of steps about one property; whether the examples' challenges are
  the ones a reader would press.

schemes:
  - id: group_2
    meta:
      title: Argument From A Group and Its Members - Variant 2
      source: "Ch. Perelman and L. Olbrechts-Tyteca, The New Rhetoric: A Treatise on Argumentation.  Notre Dame, Ind.: University of Notre Dame Press, 1969, pp. 321-326. \n"
    variables: [G, Q, M]
    premises: ["group_quality(G,Q)", "group_member(M,G)", "group_member_quality(G,Q,M)"]
    assumptions: []
    exceptions: []
    conclusions: ["is_a(M,Q)"]
  - id: rule_physical_world_1
    meta:
      title: Argument For Constitutive Rule Claims - Physical World Premise Version 1
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008).  Argumentation Schemes. Cambridge University Press, p. 342.             \n"
    variables: [W, D]
    premises: ["is_a(W,D)", "synonymous"]
    assumptions: []
    exceptions: ["not_necessarily_true"]
    conclusions: ["means_same(W,D)"]
  - id: sorites_slippery_slope
    meta:
      title: Sorites Slippery Slope Argument
      source: "Douglas Walton, \"The Argument of the Beard.\" Informal Logic 18 (1996), p. 151.\n"
    variables: [A, P, A1, A2]
    premises: ["beyond_contention(A2,P)", "all_has(A2,P,A1)", "reapplication_sequence(A2,A,P)"]
    assumptions: []
    exceptions: []
    conclusions: ["may_have(A,P)"]

language:
  is_a/2: "%s is %s."
  reapplication_sequence/3: "A chain of modus ponens steps leads from %s, in the clear area, through the grey area to %s, each step concerning %s."

questions:
  rule_physical_world_1:
    - {id: 54.1/Rebuttal Factor 1, asks: "Is the first premise true only as a matter of fact, not of necessity, so that the warrant does not give synonymy?", target: "not_necessarily_true"}

effects:
  - "walton.yml, through walton-clean/tools/edits.py as owner decisions (D084, D081), with CHANGELOG rows; check/run.sh regenerates changes.json, walton.diff and the check outputs. D084: is(M,Q) and is(W,D) become is_a(M,Q) and is_a(W,D), and the key is/2 becomes is_a/2 with the same template. D081: sorites_slippery_slope's chain premise becomes reapplication_sequence(A2,A,P), and reapplication_sequence/2 gives way to reapplication_sequence/3. The gate: the reserved-name problems go, leaving the cleaned file's 17 problems in ad_hominem, practical_necessary_condition, practical_sufficient_condition and regulative_rule; the proposals file passes the whole gate again. The annotation engine's copy, wag/data/annotation/walton.yml, which a test keeps equal to the cleaned file, is copied."
  - "D081's three approved repairs (moral_justification_ad_populum_excuse, sacrifice, rhetorical_oppositions_normative) are already in walton.yml; their CHANGELOG rows and changes.json record the approval, and their formulas do not change."
  - "links.json: the maps of 21.2, 51 and 54.1 name the new formulas; 51's chain premise notes that the property is our reading."
  - "Catalogue: group_2, rule_physical_world_1 and sorites_slippery_slope regenerate (formulas, premise maps); their entries record D084 and D081. The three repaired schemes' entries record D081's approval."
  - "Tests: wag/internal/carneades/library_migration_test.go runs the engine's own inference: group_2's conclusion is drawn after the rename and not before; sorites refuses a chain about another property, a wrong start, a wrong end and a missing chain. tools/check_d084_migration.py and tools/check_d081_migration.py check the committed files and run in CI's data job."
  - "Not changed: the game, whose data uses none of the three schemes; the batch-2 gold, in which annotator-A.json keeps seven is(...) formulas as the historical record of what that annotator wrote (validate.py passes); old binary chain facts, of which the committed data has none (docs/migrations/D081-sorites.md says how to migrate one: from the one argument that used it, never by guessing its property)."
  - "Docs: docs/migrations/D084-is-a.md and D081-sorites.md, the scheme registry README, and the register (D081 decided, D084 applied)."

examples:
  # --- group_2 (D084) ------------------------------------------------------
  - scheme: group_2
    title: An orchestra's discipline
    invented: true
    use: argument
    text: The city orchestra is known for its discipline, and Mara has just joined it as oboist, so Mara is disciplined.
    bindings:
      G: the city orchestra
      Q: disciplined
      M: Mara, its new oboist
    attacks:
      - question: CQ:premise_acceptable
        target: "group_member_quality(G,Q,M)"
        text: Players join on the strength of an audition, not of their habits; a new member need not yet share what the orchestra is known for.

  - scheme: group_2
    title: A refined cuisine and one of its dishes
    invented: true
    use: argument
    text: French cooking is refined, and cassoulet is a French dish, so cassoulet is refined.
    bindings:
      G: French cooking
      Q: refined
      M: cassoulet
    attacks:
      - question: CQ:premise_acceptable
        target: "group_member_quality(G,Q,M)"
        text: The refinement belongs to the restaurant tradition; cassoulet is a farmhouse stew, and a quality of the whole need not be a quality of each part.
      - question: CQ:premise_acceptable
        target: "group_member(M,G)"
        text: Cassoulet is a dish of one region, Languedoc, more than of French cooking as the argument means it.

  - scheme: group_1
    title: From a member to the group
    invented: true
    use: near-miss
    near_miss_of: group_2
    text: Mara is disciplined, and she plays in the city orchestra, so the orchestra is disciplined.
    bindings:
      M: Mara
      G: the city orchestra
      Q: discipline
    note: The argument goes from a member's quality to the group's, not from the group to the member; it is variant 1.

  # --- rule_physical_world_1 (D084) -----------------------------------------
  - scheme: rule_physical_world_1
    title: A vixen and a female fox
    invented: true
    use: argument
    text: A vixen is a female fox, so "vixen" means the same as "female fox".
    bindings:
      W: a vixen
      D: a female fox
    attacks:
      - question: 54.1/Rebuttal Factor 1
        text: Is it necessary that a vixen is a female fox, or only how things happen to be? (Here it holds by the meaning of the words, so the rebuttal fails.)

  - scheme: rule_physical_world_1
    title: A whale and a mammal
    invented: true
    use: argument
    text: A whale is a mammal, so "whale" means the same as "mammal".
    bindings:
      W: a whale
      D: a mammal
    attacks:
      - question: 54.1/Rebuttal Factor 1
        text: That whales are mammals was found by zoology; it is not a necessary truth, so the warrant does not apply.
      - question: CQ:premise_acceptable
        target: "synonymous"
        text: Expressions can pick out the same things without meaning the same; "creature with a heart" and "creature with kidneys" are the classic case.
    note: Class inclusion is not coextension, which is why the schemes library adds a coextension premise; that is not part of D084.

  - scheme: definition_to_verbal_classification
    title: A whale classified by a definition
    invented: true
    use: near-miss
    near_miss_of: rule_physical_world_1
    text: A whale breathes air and suckles its young, which is the definition of a mammal, so a whale is a mammal.
    bindings:
      O: a whale
      D: breathing air and suckling the young
      G: mammal
    note: It concludes that the thing belongs to a class, not that two words mean the same; argument from a definition to a verbal classification.

  # --- sorites_slippery_slope (D081) ----------------------------------------
  - scheme: sorites_slippery_slope
    title: The bald man
    invented: true
    use: argument
    text: A man with no hair at all is bald, and one hair more makes no man less bald, so a man with twenty thousand hairs may be bald, for all anyone can prove.
    bindings:
      A2: a man with no hair at all
      A1: a man with one hair
      A: a man with twenty thousand hairs
      P: baldness
    attacks:
      - question: CQ:premise_acceptable
        target: "reapplication_sequence(A2,A,P)"
        text: Each added hair seems harmless, but the steps add up; run twenty thousand times, the chain passes men with a full head of hair, so not every step holds.
      - question: CQ:premise_acceptable
        target: "reapplication_sequence(A2,A,P)"
        text: The steps count hairs, but whether a man looks bald depends on how the hair is spread, so the chain does not stay about baldness.
    note: >-
      The inductive premise is coded as its first step, from no hair to one,
      which is true; what a reader presses is the chain that repeats it.
      The chain is about baldness. A chain about wealth (a fortune less one
      coin is still a fortune) does not satisfy this premise, because its
      third argument is wealth; with the old binary premise it did.

  - scheme: sorites_slippery_slope
    title: The heap
    invented: true
    use: argument
    text: A million grains of sand make a heap, and taking one grain from a heap leaves a heap, so a single grain may be a heap, for all anyone can prove.
    bindings:
      A2: a million grains of sand
      A1: a million grains less one
      A: a single grain
      P: the property of being a heap
    attacks:
      - question: CQ:premise_acceptable
        target: "reapplication_sequence(A2,A,P)"
        text: Long before the last grain the pile stops being anything anyone would call a heap; the chain cannot run all the way down.
      - question: CQ:premise_acceptable
        target: "beyond_contention(A2,P)"
        text: Whether a million grains spread thin over a beach make a heap is itself in doubt; the clear case has to be stated more carefully.

  - scheme: full_slippery_slope
    title: Retaking one exam
    invented: true
    use: near-miss
    near_miss_of: sorites_slippery_slope
    text: If students may retake one exam, they will ask to retake every exam, and then the grades will mean nothing.
    bindings:
      C0: letting students retake one exam
      C1: letting students retake every exam
      C2: grades meaning nothing
    note: Each step brings on the next through precedent and pressure, not through the vagueness of a word; the full slippery slope, not the sorites.
