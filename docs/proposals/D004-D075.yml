schemes:
  - id: practical_reasoning1
    meta:
      title: Argument from Value-Based Practical Reasoning
      source: "Atkinson, K., and Bench-Capon, T. J. M. Practical reasoning as presumptive argumentation using action based alternating transition systems. Artificial Intelligence 171, 10-15 (2007), 855–874."
    variables: [A, S1, S2, G, V, P]
    premises: ["goal_of_agent(P,G)", "current_circumstances(S1)", "would_bring_about(A,S1,S2)", "would_be_realized(G,S2)", "would_promote_value(G,V)"]
    assumptions: ["legitimate_value(V)", "worthy_goal(G)", "possible_bring_about(P,A)"]
    exceptions: ["bring_about_more_effectively(P,S2,A)", "realize_more_effectively(P,G,A)", "promote_more_effectively(P,V,A)", "bad_outweighs(A,G)", "incompatible_goal(P,G)"]
    conclusions: ["should_be_performed(A)"]
  - id: practical_reasoning2
    meta:
      title: Argument from Instrumental Practical Reasoning
      source: "Walton, Douglas (2015). Goal-Based Reasoning for Argumentation. Cambridge University Press."
    variables: [A, S1, S2, G, P]
    premises: ["goal_of_agent(P,G)", "current_circumstances(S1)", "would_bring_about(A,S1,S2)", "would_be_realized(G,S2)"]
    assumptions: ["possible_bring_about(P,A)", "possible_goal(G)"]
    exceptions: ["bring_about_more_effectively(P,S2,A)", "realize_more_effectively(P,G,A)", "intervening_actions(A,G)", "bad_outweighs(A,G)", "incompatible_goal(P,G)"]
    conclusions: ["should_be_performed(A)"]
  - id: practical_inference
    meta:
      title: Practical Reasoning - Practical Inference
      source: "Trevor Bench-Capon, \"Persuasion in Practical Argument Using Value-based Argumentation Frameworks.\" Journal of Logic and Computation 13 (2003), pp. 429-448. Douglas Walton, Practical Reasoning. Savage, Md.: Rowman and Littlefield, 1990. Douglas Walton, \"Actions and Inconsistency: The Closure Problem of Practical Reasoning. \"In Contemporary Action Theory, vol.1 , ed. Ghita Holmstrom-Hintikka and Raimo Tuomela. Dordrecht: Kluwer, 1997, p. 164. Douglas Walton, Slippery Slope Arguments. Newport News, Va.: Vale Press, 1992, pp. 89-90."
    variables: [A, G, P]
    premises: ["goal_of_agent(P,G)", "action_realize_goal(A,G)"]
    assumptions: ["possible_bring_about(P,A)", "possible_goal(G)"]
    exceptions: ["incompatible_goal(P,G)", "realize_more_effectively(P,G,A)", "bad_outweighs(A,G)", "incompatible_consequences(P,A,G)"]
    conclusions: ["should_be_performed(A)"]
  - id: practical_necessary_condition
    meta:
      title: Practical Reasoning - Necessary Condition Schema
      source: "Trevor Bench-Capon, \"Persuasion in Practical Argument Using Value-based Argumentation Frameworks.\" Journal of Logic and Computation 13 (2003), pp. 429-448. Douglas Walton, Practical Reasoning. Savage, Md.: Rowman and Littlefield, 1990. Douglas Walton, \"Actions and Inconsistency: The Closure Problem of Practical Reasoning. \"In Contemporary Action Theory, vol.1 , ed. Ghita Holmstrom-Hintikka and Raimo Tuomela. Dordrecht: Kluwer, 1997, p. 164. Douglas Walton, Slippery Slope Arguments. Newport News, Va.: Vale Press, 1992, pp. 89-90."
    variables: [X, G, P, S]
    premises: ["goal_of_agent(P,G)", "alternative_action(P,S,G)", "necessary_action(P,X,S,G)", "practicality_action(P,X)", "more_acceptable_bringing(P,G,X)"]
    assumptions: ["possible_goal(G)", "acceptable_action(P,X)", "possible_bring_about(P,X)"]
    exceptions: ["realize_more_effectively(P,G,X)", "goal_achievable_without_any(P,G,S)", "bad_outweighs(X,G)", "incompatible_goal(P,G)"]
    conclusions: ["should_be_performed(X)"]
  - id: practical_sufficient_condition
    meta:
      title: Practical Reasoning - Sufficient Condition Schema
      source: "Trevor Bench-Capon, \"Persuasion in Practical Argument Using Value-based Argumentation Frameworks.\" Journal of Logic and Computation 13 (2003), pp. 429-448. Douglas Walton, Practical Reasoning. Savage, Md.: Rowman and Littlefield, 1990. Douglas Walton, \"Actions and Inconsistency: The Closure Problem of Practical Reasoning. \"In Contemporary Action Theory, vol.1 , ed. Ghita Holmstrom-Hintikka and Raimo Tuomela. Dordrecht: Kluwer, 1997, p. 164. Douglas Walton, Slippery Slope Arguments. Newport News, Va.: Vale Press, 1992, pp. 89-90."
    variables: [X, G, P, S]
    premises: ["goal_of_agent(P,G)", "alternative_action_sufficient(P,S,G)", "sufficient_action(P,X,S,G)", "practicality_action(P,X)", "more_acceptable_bringing(P,G,X)"]
    assumptions: ["possible_goal(G)", "acceptable_action(P,X)", "possible_bring_about(P,X)"]
    exceptions: ["realize_more_effectively(P,G,X)", "bad_outweighs(X,G)", "incompatible_goal(P,G)"]
    conclusions: ["should_be_performed(X)"]
  - id: bad_outweighs_good
    meta:
      title: Weighing a Bad Consequence against a Good One
      source: "WAG's answer scheme (decisions D064 and D075; candidate C003, docs/candidates.md), after Walton's comparative weighing of good and bad consequences: Douglas Walton, The New Dialectic: Conversational Contexts of Argument. University of Toronto Press, 1998, pp. 159, 170. Not in the compendium."
    variables: [A, H, G]
    premises: ["brings_about(A,H)", "bad(H)", "matters_more(H,G)"]
    assumptions: []
    exceptions: []
    conclusions: ["bad_outweighs(A,G)"]
  - id: good_outweighs_bad
    meta:
      title: Weighing a Good Consequence against a Bad One
      source: "WAG's answer scheme (decisions D064 and D075; candidate C003, docs/candidates.md), after Walton's comparative weighing of good and bad consequences: Douglas Walton, The New Dialectic: Conversational Contexts of Argument. University of Toronto Press, 1998, pp. 159, 170. Not in the compendium."
    variables: [A, H, G]
    premises: ["brings_about(A,H)", "good(H)", "matters_more(H,G)"]
    assumptions: []
    exceptions: []
    conclusions: ["good_outweighs(A,G)"]
  - id: better_means
    meta:
      title: Argument from a Better Means
      source: "WAG's answer scheme (decisions D075 and D089), the sketch better_means of WAG's review of 2026-10-15 (part 6, §4), repaired; after the book's questions on other means and efficiency (Walton, Reed and Macagno, Argumentation Schemes, 2008: 22.1 and 22.4, and ch. 3, p. 96). Not in the compendium."
    variables: [A, A2, G, P]
    premises: ["goal_of_agent(P,G)", "possible_bring_about(P,A2)", "brings_about(A2,G)", "more_effective_means(P,A2,G,A)"]
    assumptions: []
    exceptions: []
    conclusions: ["realize_more_effectively(P,G,A)"]

language:
  goal_of_agent/2: "One of the goals of %s is %s."
  incompatible_goal/2: "Another goal of %s is incompatible with %s."
  realize_more_effectively/3: "There is a way for %s to realize the goal %s more effectively than %s."
  bring_about_more_effectively/3: "There is a way for %s to reach the state %s more effectively than %s."
  promote_more_effectively/3: "There is a way for %s to promote the value %s more effectively than %s."
  incompatible_consequences/3: "For %s, %s would have consequences that work against %s."
  goal_achievable_without_any/3: "%s could reach %s without using any of the means %s."
  alternative_action/3: "%s can reasonably hold that at least one of the means %s is needed to bring about %s."
  alternative_action_sufficient/3: "%s can reasonably hold that each of the means %s would be enough to bring about %s."
  necessary_action/4: "%s chose %s, among the means %s, as an acceptable or the best means needed for %s."
  sufficient_action/4: "%s chose %s, among the means %s, as an acceptable or the best means that would be enough for %s."
  practicality_action/2: "As far as %s can tell, nothing that cannot be changed stands in the way of bringing about %s."
  more_acceptable_bringing/3: "%s would rather bring about %s than leave %s undone."
  acceptable_action/2: "For %s, %s is an acceptable thing to do."
  matters_more/2: "%s matters more than %s."
  more_effective_means/4: "For %s, %s would realize %s more effectively than %s: more surely, sooner or at lower cost."

questions:
  practical_reasoning1:
    - {id: 22.4/CQ1, asks: "Is there another goal of P that G itself would clash with?", target: "incompatible_goal(P,G)"}
    - {id: 22.4/CQ2, asks: "How far does reaching G serve the values V, or at least fit with them?", target: "would_promote_value(G,V)"}
    - {id: 22.4/CQ3, asks: "Could P realize G more effectively by another action than A: more surely, sooner or at lower cost?", target: "realize_more_effectively(P,G,A)"}
    - {id: 22.4/CQ4, asks: "Could P reach S2 more effectively than by doing A?", target: "bring_about_more_effectively(P,S2,A)"}
    - {id: 22.4/CQ5, asks: "Could P serve V more effectively by another action than A?", target: "promote_more_effectively(P,V,A)"}
    - {id: 22.4/CQ6, asks: "Can P actually do A?", target: "possible_bring_about(P,A)"}
    - {id: 22.4/CQ7, asks: "Would doing A have bad consequences that outweigh G? (A bad consequence that is not claimed to outweigh G is argued against A as negative consequences, a rebuttal.)", target: "bad_outweighs(A,G)"}
    - {id: walton/worthy_goal, asks: "Is G a goal worth pursuing?", target: "worthy_goal(G)"}
    - {id: walton/legitimate_value, asks: "Is V a value that may properly count in this decision?", target: "legitimate_value(V)"}
  practical_reasoning2:
    - {id: 22.1/CQ1, asks: "Is there another goal of P that G itself would clash with?", target: "incompatible_goal(P,G)"}
    - {id: 22.1/CQ2, asks: "Could P realize G more effectively by another action than A: more surely, sooner or at lower cost?", target: "realize_more_effectively(P,G,A)"}
    - {id: 22.1/CQ3, asks: "Could P reach S2 more effectively than by doing A?", target: "bring_about_more_effectively(P,S2,A)"}
    - {id: 22.1/CQ4, asks: "Can P actually do A?", target: "possible_bring_about(P,A)"}
    - {id: 22.1/CQ5, asks: "Would doing A have bad consequences that outweigh G? (A bad consequence that is not claimed to outweigh G is argued against A as negative consequences, a rebuttal.)", target: "bad_outweighs(A,G)"}
    - {id: game/CQ:goal_possible, asks: "Can G be reached at all, by any means?", target: "possible_goal(G)"}
    - {id: game/CQ:intervening_actions, asks: "Would further steps be needed after A before G is reached?", target: "intervening_actions(A,G)"}
  practical_inference:
    - {id: 22.1/CQ1, asks: "Is there another goal of P that G itself would clash with?", target: "incompatible_goal(P,G)"}
    - {id: 22.1/CQ2, asks: "Is there another action open to P that would realize G better than A?", target: "realize_more_effectively(P,G,A)"}
    - {id: 22.1/CQ3, asks: "Of A and the other actions open to P, which would realize G most surely, soonest or at least cost?", target: "realize_more_effectively(P,G,A)"}
    - {id: 22.1/CQ4, asks: "Can P actually do A?", target: "possible_bring_about(P,A)"}
    - {id: 22.1/CQ5, asks: "Would doing A have bad consequences that outweigh G?", target: "bad_outweighs(A,G)"}
    - {id: walton/incompatible_consequences, asks: "Would doing A work against G itself, undoing what it is meant to achieve?", target: "incompatible_consequences(P,A,G)"}
    - {id: walton/possible_goal, asks: "Can G be reached at all, by any means?", target: "possible_goal(G)"}
  practical_necessary_condition:
    - {id: 22.3/CQ1, asks: "Could P reach G without using any of the means S?", target: "goal_achievable_without_any(P,G,S)"}
    - {id: 22.3/CQ2, asks: "Is X an acceptable thing for P to do?", target: "acceptable_action(P,X)"}
    - {id: 22.3/CQ3, asks: "Can P actually bring about X?", target: "possible_bring_about(P,X)"}
    - {id: 22.3/CQ4, asks: "Would bringing about X have bad consequences that outweigh G?", target: "bad_outweighs(X,G)"}
    - {id: 22.3/CQ5, asks: "Is there another goal of P that G itself would clash with?", target: "incompatible_goal(P,G)"}
    - {id: walton/realize_more_effectively, asks: "Is there a means open to P that would realize G more effectively than X: more surely, sooner or at lower cost?", target: "realize_more_effectively(P,G,X)"}
    - {id: walton/possible_goal, asks: "Can G be reached at all, by any means?", target: "possible_goal(G)"}
  practical_sufficient_condition:
    - {id: 22.3/CQ1, asks: "Is there a means open to P that would realize G more effectively than X: more surely, sooner or at lower cost?", target: "realize_more_effectively(P,G,X)"}
    - {id: 22.3/CQ2, asks: "Is X an acceptable thing for P to do?", target: "acceptable_action(P,X)"}
    - {id: 22.3/CQ3, asks: "Can P actually bring about X?", target: "possible_bring_about(P,X)"}
    - {id: 22.3/CQ4, asks: "Would bringing about X have bad consequences that outweigh G?", target: "bad_outweighs(X,G)"}
    - {id: 22.3/CQ5, asks: "Is there another goal of P that G itself would clash with?", target: "incompatible_goal(P,G)"}
    - {id: walton/possible_goal, asks: "Can G be reached at all, by any means?", target: "possible_goal(G)"}

examples:
  # --- practical_reasoning1 (22.4) ------------------------------------------
  - scheme: practical_reasoning1
    title: A bike lane on Main Street
    invented: true
    use: argument
    text: East-side commuters now sit in traffic for an hour each way. A protected bike lane on Main Street would let many of them cycle instead, which would cut congestion, and less congestion means cleaner air for everyone. The council should build the lane.
    bindings:
      P: the city council
      A: the city council building a protected bike lane on Main Street
      S1: east-side commuters spending an hour in traffic each way
      S2: many east-side commuters cycling to work
      G: less congestion in the city
      V: public health
    attacks:
      - question: CQ:premise_acceptable
        target: "goal_of_agent(P,G)"
        text: Less congestion is not one of the council's goals; its transport plan is about road safety, and says so.
      - question: 22.4/CQ1
        text: The council's plan to draw shoppers' cars back into the centre, to revive its high street, needs more traffic in the city, not less.
      - question: 22.4/CQ3
        text: Re-timing the lights on the ring road would cut congestion as much, at a tenth of the cost.
      - question: 22.4/CQ7
        text: The lane would take the street's parking and close its shops, and losing them matters more than shorter queues (example 18 argues it).
    note: >-
      P is the agent of A; the record's action-to-actor mapping says so,
      not A's name. A shop owner's reply that the lane would hurt trade,
      with no comparison, would be negative consequences, a rebuttal at the
      conclusion; 22.4/CQ7 is the claim that the harm outweighs G. The
      other goal in 22.4/CQ1 clashes with G itself; a goal that only the
      lane would set back is a consequence of the lane.

  - scheme: practical_reasoning1
    title: Saturday opening at the library
    invented: true
    use: argument
    text: The library is shut on Saturdays, the only day many working parents can bring their children. Opening on Saturdays would let those children borrow books too, and every child should have the same chance to read. The library board should open on Saturdays.
    bindings:
      P: the library board
      A: the library board opening the library on Saturdays
      S1: the library being closed on Saturdays
      S2: working parents' children borrowing books
      G: every child having access to the library
      V: equal opportunity
    attacks:
      - question: 22.4/CQ2
        text: One more opening day does little for equal opportunity when the children who most need books cannot get to the library on any day.
      - question: 22.4/CQ4
        text: The board's mobile library, calling at the estates after school, would get books to those children sooner than Saturday opening.
      - question: 22.4/CQ5
        text: Lending boxes of books to the primary schools would promote equal opportunity as much, at half the cost.
      - question: 22.4/CQ6
        text: The board has no budget for Saturday staff, and the volunteers have said no.
      - question: walton/worthy_goal
        text: Getting children through the door is worth little in itself; what matters is that they read, and access alone does not make them.
      - question: walton/legitimate_value
        text: Equal opportunity is a value for public schools; a lending library serves whoever comes, and should not weigh it.

  - scheme: practical_reasoning2
    title: Saturday opening, without the value
    invented: true
    use: near-miss
    near_miss_of: practical_reasoning1
    text: The library is shut on Saturdays, when working parents could bring their children; opening then would let those children borrow books, so the board should open on Saturdays.
    bindings:
      P: the library board
      A: the library board opening the library on Saturdays
      S1: the library being closed on Saturdays
      S2: working parents' children borrowing books
      G: working parents' children having access to the library
    note: No value is named that the goal promotes, so it is practical_reasoning2 (catalogue contrast; batch-2 guidelines §3).

  # --- practical_reasoning2 (22.1) ------------------------------------------
  - scheme: practical_reasoning2
    title: A meat tax and the real cost of meat
    kialo: "13292.118"
    use: argument
    text: Taxing meat would raise the consumer price of meat. The raised price would reflect the real costs of meat consumption.
    bindings:
      P: governments
      A: governments putting a tax on meat
      S1: meat being priced below its real costs
      S2: a higher price of meat
      G: the price of meat reflecting its real costs
    attacks:
      - question: 22.1/CQ2
        text: Kialo 13292.123 says that abolishing the subsidies that keep meat cheap would let its price reflect its costs, without taxing and subsidising one good at once (example 25, a better means).
      - question: 22.1/CQ5
        text: A truer price for meat matters less than the poorest families keeping protein they can afford, which the tax would put out of their reach.
      - question: game/CQ:intervening_actions
        text: While the subsidies stay, the tax only offsets them; the price would reflect the costs only once they go too.
    note: >-
      The gold's coding, with P bound to governments, the thesis's agent.
      The attack on 22.1/CQ5 is a weighing (bad_outweighs_good); a plain
      harm to the poor would be negative consequences, a rebuttal.

  - scheme: practical_reasoning2
    title: Meat and the environment
    kialo: "13292.108"
    use: argument
    text: Meat production and consumption are bad for the environment.
    bindings:
      P: governments
      A: governments putting a tax on meat
      S1: meat production and consumption harming the environment
      S2: less meat being consumed
      G: less environmental harm from meat
    attacks:
      - question: 22.1/CQ1
        text: Governments also aim to grow their meat exports, a goal that more meat production serves and less harm from meat would rule out.
      - question: 22.1/CQ3
        text: Ending the subsidies to livestock farming would cut meat consumption more surely than a tax.
      - question: 22.1/CQ4
        text: A meat tax needs agreement across the trading bloc, which no government can get alone.
      - question: game/CQ:goal_possible
        text: Meat's harm to the environment cannot be brought down while demand grows with incomes, whatever governments do.
    note: >-
      The gold's coding, with P added. 13292.174 and 13292.5, coded today as
      answers at the side-effect exception, rank nothing against G, so under
      D070 they become rebuttals at this argument's conclusion (example 20);
      13292.127 weighs against it (example 16); 13292.104 answers it with a
      better means, and 13292.147 offers another course without claiming it
      better (example 26, a near miss of better_means).

  - scheme: positive_consequences
    title: Healthier eating, as a consequence
    invented: true
    use: near-miss
    near_miss_of: practical_reasoning2
    text: A meat tax would cut meat consumption, and that is good for everyone's health.
    bindings:
      A: governments putting a tax on meat
      G: less meat being eaten
    note: The consequence is judged good; no agent's goal is stated and reached through A, so it is positive consequences.

  # --- practical_inference (22.1) -------------------------------------------
  - scheme: practical_inference
    title: The theory test
    invented: true
    use: argument
    text: Sam wants to pass the driving theory test next month, and doing the practice questions every evening is how to pass it, so Sam should do them every evening.
    bindings:
      P: Sam
      A: Sam doing the practice questions every evening
      G: Sam passing the driving theory test next month
    attacks:
      - question: 22.1/CQ1
        text: Sam also means to spend next month abroad, which rules out sitting a test here next month.
      - question: 22.1/CQ4
        text: Sam has no computer at home to do the questions on.
      - question: walton/possible_goal
        text: There is no test date next month; the next one is in two months.
    note: >-
      The book prints 22.1 in the first person; P names the one deliberating
      (D091), as practical reasoning does.

  - scheme: practical_inference
    title: Closing the outfall pipe
    invented: true
    use: argument
    text: The town council wants the river clean enough to swim in again, and closing the old outfall pipe would do that, so the council should close it.
    bindings:
      P: the town council
      A: the town council closing the old outfall pipe
      G: the river being clean enough to swim in
    attacks:
      - question: 22.1/CQ2
        text: Fitting a filter to the pipe would clean the river sooner; closing it needs a new drain built first.
      - question: 22.1/CQ3
        text: Diverting the pipe to the treatment works would clean the river as surely, for half the cost.
      - question: 22.1/CQ5
        text: Closing the pipe would flood the streets above it in heavy rain, and flooded homes matter more than a river to swim in.
      - question: walton/incompatible_consequences
        text: With the pipe closed, storm water would spill over the bank and carry more sewage into the river than the pipe does.
    note: >-
      22.1/CQ5 is the weighing; walton/incompatible_consequences is the
      action undoing its own goal, practical inference's own objection
      (D091), argued without a comparison.

  - scheme: practical_reasoning2
    title: Closing the outfall, with the circumstances
    invented: true
    use: near-miss
    near_miss_of: practical_inference
    text: The old outfall is polluting the river; if the council closed it, the river would be clean, so the council should close it.
    bindings:
      P: the town council
      A: the town council closing the old outfall pipe
      S1: the old outfall polluting the river
      S2: no sewage reaching the river from the outfall
      G: a clean river
    note: The present circumstances and the state the action brings about are stated, so practical_reasoning2, not practical_inference.

  # --- practical_necessary_condition (22.2) ---------------------------------
  - scheme: practical_necessary_condition
    title: Import standards
    kialo: "13292.45"
    use: argument
    text: If so (if the tax lets cheaper imports push out domestic producers), import standards have to be maintained at a higher level. This is manageable.
    bindings:
      P: governments
      X: governments keeping import standards at a higher level
      G: domestic meat producers protected from cheaper imports
      S: the barriers to cheaper meat imports
    attacks:
      - question: 22.3/CQ1
        text: Rebating the tax to domestic farmers would protect them from cheaper imports without any barrier to imports.
      - question: 22.3/CQ4
        text: Higher standards would raise the price of all imported food, and dearer food for every household matters more than shielding meat producers.
      - question: 22.3/CQ5
        text: Governments are also committed to open trade in food, which rules out protecting domestic producers from cheaper imports at all.
    note: >-
      The gold's coding on the repaired scheme. Its conflicting goal, open
      trade in food, clashes with G itself and is what an answer names; the
      rebate in the 22.3/CQ1 attack uses no member of S, as the objection
      requires.

  - scheme: practical_necessary_condition
    title: Night nurses
    invented: true
    use: argument
    text: The hospital trust's goal is to cut waiting times in A&E. It needs more nurses on night shifts or a second triage desk, at least one of them, and it has chosen the nurses; nothing it cannot change stops it hiring them, and shorter waits are worth the cost. So the trust should hire more night nurses.
    bindings:
      P: the hospital trust
      X: the hospital trust hiring more night-shift nurses
      G: shorter waiting times in A&E
      S: more night-shift nurses and a second triage desk
    attacks:
      - question: 22.3/CQ2
        text: The only nurses to be had are agency staff at three times the cost, which the trust's own rules forbid.
      - question: 22.3/CQ3
        text: There are no nurses to hire; the region's vacancies have been open for a year.
      - question: walton/realize_more_effectively
        text: A second triage desk would cut the waits sooner, since it needs no recruiting.
      - question: walton/possible_goal
        text: Waits cannot fall while patients wait for beds upstairs, whatever A&E does.

  - scheme: practical_sufficient_condition
    title: Night nurses, as one of several ways
    invented: true
    use: near-miss
    near_miss_of: practical_necessary_condition
    text: More night nurses, a second triage desk or a walk-in clinic next door would each be enough to cut waiting times in A&E; the trust has chosen the nurses, so it should hire them.
    bindings:
      P: the hospital trust
      X: the hospital trust hiring more night-shift nurses
      G: shorter waiting times in A&E
      S: more night nurses, a second triage desk and a walk-in clinic
    note: Each means is said to be enough, none to be needed; the sufficient-condition scheme.

  # --- practical_sufficient_condition (22.3) --------------------------------
  - scheme: practical_sufficient_condition
    title: Winter tyres
    invented: true
    use: argument
    text: The company's goal is to get its delivery vans through the winter without an accident on ice. Winter tyres would be enough, and so would chains or a winter-only route; it has chosen winter tyres, nothing it cannot change stops it fitting them, and safe vans are worth the cost. So it should fit winter tyres.
    bindings:
      P: the delivery company
      X: the delivery company fitting winter tyres
      G: the vans getting through the winter without an accident on ice
      S: winter tyres, chains and a winter-only route
    attacks:
      - question: 22.3/CQ1
        text: Chains would keep the vans as safe on ice for a tenth of the price.
      - question: 22.3/CQ4
        text: Winter tyres wear out fast on the dry motorway stretches the vans drive most, and replacing them every month costs more than the accidents they would prevent.
      - question: walton/possible_goal
        text: Every winter here some van has an accident on ice, whatever it is fitted with; the goal cannot be met, only approached.
    note: >-
      Chains are a member of S. Under the best-choice reading (D090) they
      defeat the recommendation only because they are said to do better (at
      lower cost); that they would also be enough is the scheme's own
      premise, not an objection.

  - scheme: practical_sufficient_condition
    title: A second exit
    invented: true
    use: argument
    text: The theatre's goal is to meet the fire code by spring. A second exit would be enough, and so would a sprinkler system; it has chosen the exit, nothing it cannot change stops it building one, and meeting the code matters more than the lost seats. So it should build the exit.
    bindings:
      P: the theatre
      X: the theatre building a second exit
      G: the theatre meeting the fire code by spring
      S: a second exit and a sprinkler system
    attacks:
      - question: 22.3/CQ2
        text: The building is listed; a new exit through the front wall would not be allowed.
      - question: 22.3/CQ3
        text: The exit would have to cross the neighbour's yard, and the neighbour refuses; the theatre cannot build it.
      - question: 22.3/CQ5
        text: The theatre has pledged to keep the building untouched until its centenary in June, which rules out meeting the code by spring.

  - scheme: practical_necessary_condition
    title: The only way to meet the code
    invented: true
    use: near-miss
    near_miss_of: practical_sufficient_condition
    text: The only way the theatre can meet the fire code by spring is a second exit, so it should build one.
    bindings:
      P: the theatre
      X: the theatre building a second exit
      G: the theatre meeting the fire code by spring
      S: a second exit
    note: The exit is said to be needed, not merely enough; the necessary-condition scheme, its set of means the one member the text claims.

  # --- bad_outweighs_good (C003; D070's answer) -----------------------------
  - scheme: bad_outweighs_good
    title: Starvation against less harm to the environment
    kialo: "13292.127"
    use: answer
    answers: 22.1/CQ5 of 13292.108, the goal-based argument for the meat tax on environmental grounds; it concludes that argument's exception, bad_outweighs(tax_meat,environmental_harm_from_meat_reduced).
    answer_to:
      scheme: practical_reasoning2
      question: 22.1/CQ5
      polarity: attack
      bindings:
        A: governments putting a tax on meat
        G: less environmental harm from meat
    text: Starvation from decreased access to meat is a more severe threat than any consequence of high meat consumption.
    bindings:
      A: governments putting a tax on meat
      H: starvation from reduced access to meat
      G: less environmental harm from meat
    attacks:
      - question: CQ:premise_acceptable
        target: "brings_about(A,H)"
        text: The tax would raise the price of meat a little; in the countries that would adopt it, no one starves for lack of meat.
    note: >-
      The claim names a class (any consequence of high meat consumption), so
      it is coded against one argument of the class (guidelines OC7): its
      Kialo parent, 13292.7, is not in it, and with practical reasoning in
      the class the earliest on the board is 13292.108. Version 1 coded it
      against 13292.115 (positive consequences), the earliest while
      practical reasoning had no outweighing exception.

