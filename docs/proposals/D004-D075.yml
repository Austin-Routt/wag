ical_reasoning1.yml's 13292.43 near miss, alternative_normative.yml's codings of 13292.104 and 13292.123 and its D016 text, practical_goal.yml's 13292.147 near miss, and practical_reasoning2.yml's codings of 13292.104 and 13292.118. game-differs records stay: the game keeps its copies of the four schemes until step C5."
