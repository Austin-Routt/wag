  # --- better_means (D075, D089) --------------------------------------------
  - scheme: better_means
    title: Abolishing the subsidies instead
    kialo: "13292.123"
    use: answer
    answers: 22.1/CQ2 of 13292.118, the goal-based argument for the meat tax; it concludes that argument's exception, realize_more_effectively(governments,meat_price_reflects_real_costs,tax_meat).
    answer_to:
      scheme: practical_reasoning2
      question: 22.1/CQ2
      polarity: attack
      bindings:
        P: governments
        G: the price of meat reflecting its real costs
        A: governments putting a tax on meat
    text: Both taxing and subsidising a good is an incoherent policy. Instead, the price distortions caused by subsidies should be removed by abolishing those subsidies (or at least exempting meat from them).
    bindings:
      P: governments
      A: governments putting a tax on meat
      A2: governments abolishing the subsidies on meat
      G: the price of meat reflecting its real costs
    attacks:
      - question: CQ:premise_acceptable
        target: "more_effective_means(P,A2,G,A)"
        text: Abolishing farm subsidies takes years of negotiation against the farm lobby; a tax can be passed in one budget, so the tax gets there sooner.
    note: >-
      "Instead" carries the comparison: more surely, the distortion removed
      at its source. The gold keeps its argument for abolishing the subsidies
      as a course of its own (practical_reasoning2), secondary.

  - scheme: positive_consequences
    title: Rationing through carbon budgets
    kialo: "13292.147"
    use: near-miss
    near_miss_of: better_means
    text: Rationing meat through personal carbon budgets would help reduce carbon emissions. Under such rationing everybody in a country can consume a small amount of meat, larger amounts cost extra, and very large amounts are not allowed or are extremely expensive.
    bindings:
      A: governments rationing meat through personal carbon budgets
      G: lower carbon emissions
    note: >-
      Another course with a good consequence, not claimed better than the
      tax: its children compare it the other way (13292.149, harder and
      costlier to run) or by who bears the cost (13292.151, a preference
      across values, which D089 excludes). Under D006 an alternative that is
      merely as good is no reason against the tax, so it is not an answer at
      realize_more_effectively: the gold keeps it as positive consequences
      of the other course, a proposal (D066, C017).

  - scheme: better_means
    title: Park and ride
    invented: true
    use: argument
    text: The council wants fewer cars in the centre. A park-and-ride with free buses, run on its own land by the ring road, would empty the centre of cars faster than a congestion charge.
    bindings:
      P: the city council
      A: the city council bringing in a congestion charge
      A2: the city council running a park-and-ride with free buses
      G: fewer cars in the city centre
    attacks:
      - question: CQ:premise_acceptable
        target: "possible_bring_about(P,A2)"
