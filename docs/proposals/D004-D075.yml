  # --- good_outweighs_bad (C003) --------------------------------------------
  - scheme: good_outweighs_bad
    title: Sustainability against lost revenue
    kialo: "13292.43"
    use: answer
    answers: 33/CQ3 of 13292.9, the negative consequences argument that the tax would cut revenue; it concludes that argument's exception, good_outweighs(tax_meat,tax_revenue_reduced).
    answer_to:
      scheme: negative_consequences
      question: 33/CQ3
      polarity: attack
      bindings:
        A: governments putting a tax on meat
        G: tax revenues falling
    text: Tax revenue is not the primary reason to tax meat. There are other, more pressing issues, such as sustainability or animal welfare.
    bindings:
      A: governments putting a tax on meat
      H: progress on sustainability and animal welfare
      G: tax revenues falling
    attacks:
      - question: CQ:premise_acceptable
        target: "brings_about(A,H)"
        text: People who keep eating meat would pay the tax and change nothing; the progress on sustainability would be slight.
    note: The gold codes it today as an Other argument concluding the same exception; it becomes an instance of this scheme.

  - scheme: good_outweighs_bad
    title: Attention in lessons
    invented: true
