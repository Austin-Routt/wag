good, against 13292.108 by OC7's one-instance rule, since practical reasoning is now in the class and 108 is the earliest on the board (its note, rule case OC4-a and C003's sighting follow). (6) Every challenge record that names a renamed formula follows (side_effects, possible, realize_more_effectively and the rest; 13292.108, .118, .218, .11, .137, .190 and others), 13292.45's records name the repaired scheme's formulas under their labels (22.2's, the scheme's own number, as the guidelines label 33.2's questions), and 13292.194's eco-tariffs, another barrier, become a better-means record (walton/realize_more_effectively) rather than CQ1's objection; the notes that cite a plain side effect as if it answered the outweighing exception (13292.45's CQ4, 13292.108's and 13292.118's CQ5) say that it is a rebuttal unless claimed to outweigh the goal. (7) Guidelines: §2's alternative_means says better, not as well (D006); §3 states the agent binding, that a goal set back by the means is a consequence of it, and how to code a better means; §3.1's table and two routes extend to practical reasoning; OC1, OC4, OC6, OC7 and OC10 are corrected, each old wording retired; §4 gives better_means' comparison field. Rule cases OC1-c, OC4-a and OC4-b follow the gold, and the constructed weighing cases coded with Other take C003's schemes. (8) validate.py gains R8 (an answer at an exception concludes it; it fails today on 13292.174, .104, .147, .5 and .123, which this recode fixes; the Go check gets it too), R9 (a better_means instance's A2 is not its A, it records its comparison, more surely, sooner or at lower cost, and as an answer its goal premise is the answered argument's) and R10 (a challenge record names a formula of the claim's own instances or of its target's primary instance, as all 152 of the 160 records that name a formula do today, so that a stale formula fails); planted-defect tests (test_validate.py, which CI's data job runs) show that each rule catches what it is for. (9) to_wag.py's replay and the README's counts are regenerated, with what changes. (10) The annotation engine's copies (wag/data/annotation/kialo-13292-batch2: gold.json, guidelines.md, lexicon.json) are copied."
