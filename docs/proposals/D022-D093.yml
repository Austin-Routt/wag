questions:
  practical_goal:
    - {id: walton/realize_more_effectively, asks: "Is there a way for P to realize G more effectively than by doing X?", target: "realize_more_effectively(P,G,X)"}
    - {id: walton/incompatible_goal, asks: "Does P have another goal that G works against?", target: "incompatible_goal(P,G)"}
    - {id: walton/bad_outweighs, asks: "Would doing X have bad consequences that matter more than G?", target: "bad_outweighs(X,G)"}
  two_person_practical:
    - {id: 23/CQ1, asks: "Does A have another goal, perhaps more important, that the goal X works against?", target: "incompatible_goal(A,X)"}
    - {id: 23/CQ2, asks: "Is there a better way for A to realize X than doing Y?", target: "realize_more_effectively(A,X,Y)"}
    - {id: 23/CQ3, asks: "Would doing Y have side effects that matter more than X?", target: "bad_outweighs(Y,X)"}
    - {id: 23/CQ4, asks: "Can A do Y?", target: "possible_bring_about(A,Y)"}
    - {id: 23/CQ5, asks: "Would A have to do other things besides Y to realize X?", target: "intervening_actions(Y,X)"}
  waste:
    - {id: 24/CQ1, asks: "Can X be realized at all?", target: "possible_goal(X)"}
    - {id: 24/CQ2, asks: "Leaving aside what is already lost, do the costs and benefits from now on go against continuing to try to realize X?", target: "reassessment_against_continuing(A,X)"}
  end_and_means_1:
    - {id: walton/means_bad_outweighs, asks: "Does X have bad consequences that matter more than the good end Y?", target: "means_bad_outweighs(X,Y)"}
  end_and_means_bad:
    - {id: walton/means_good_outweighs, asks: "Does X have good consequences that matter more than the bad end Y?", target: "means_good_outweighs(X,Y)"}
examples:
  # --- fear ---
  - scheme: fear
    title: "Fix the brakes before the mountain trip"
    invented: true
    use: argument
    text: "If you don't get the brakes fixed before the trip, you could crash on the mountain descent. That would be terrible for you, and you ought to avoid it if you can; fixing the brakes is the only way. Get them fixed."
    bindings:
      X: "getting the brakes fixed before the trip"
      Y: "a crash on the mountain descent"
    attacks:
      - question: "CQ:premise_acceptable"
        target: "only_way_prevent(Y,X)"
        text: "You could take the valley road and avoid the descent altogether."
      - question: "CQ:premise_acceptable"
        target: "not_do_appear(X,Y)"
        text: "The garage checked them last week; they are worn but within the limits."
  - scheme: fear
    title: "Back up the thesis"
    invented: true
    use: argument
    text: "If you don't back up your thesis, one disk failure will wipe out two years of work. Losing it would be a disaster for you, and you should prevent that if you can; a backup is the only way. Back it up."
    bindings:
      X: "backing up the thesis files"
      Y: "losing two years of thesis work"
    attacks:
      - question: "CQ:premise_acceptable"
        target: "not_do_appear(X,Y)"
        text: "The university's server already keeps nightly copies of the thesis folder."
    note: "Since 2026-11-26 the conclusion is the recommendation itself, should_be_performed(X), which an argument from negative consequences against backing up would meet."
  - scheme: negative_consequences
    title: "The tax would make food less affordable for the poor"
    kialo: "13292.7"
    use: near-miss
    near_miss_of: fear
    text: "A meat tax would make food less affordable for the poor."
    bindings:
      A: "governments putting a tax on meat"
      G: "food becoming less affordable for the poor"
    note: "A bad consequence of the action, with no appeal to the respondent's fear and no claim that acting is the only way to avoid it: negative consequences, not fear. The gold's coding."
  # --- danger ---
  - scheme: danger
    title: "Do not open the quarry by the school"
    invented: true
    use: argument
    text: "If the council opens the quarry next to the primary school, blasting will throw rock over the playground. That is a danger to the children. So, on balance, the council should not open it."
    bindings:
      X: "the council opening the quarry next to the school"
      Y: "rock thrown over the school playground"
    attacks:
      - question: "CQ:premise_acceptable"
        target: "occur(X,Y)"
        text: "The plan keeps blasting 400 metres from the school and behind a berm."
  - scheme: danger
    title: "Do not swim in the flooded river"
    invented: true
    use: argument
    text: "If you swim in the river this week, the flood current will drag you under the weir. That is a danger to you. So you should not swim there."
    bindings:
      X: "swimming in the river this week"
      Y: "being dragged under the weir"
    attacks:
      - question: "CQ:premise_acceptable"
        target: "danger(Y)"
        text: "The weir gates are open this week, so there is no undertow."
    note: "Since 2026-11-26 it concludes about the action, ¬should_be_performed(X), not about the danger (D062)."
  - scheme: negative_consequences
    title: "The tax would raise the price of a burger"
    invented: true
    use: near-miss
    near_miss_of: danger
    text: "If governments tax meat, a burger will cost a dollar more. That is bad. So they should not."
    bindings:
      A: "governments taxing meat"
      G: "a burger costing a dollar more"
    note: "A bad consequence, not a danger to the one addressed: negative consequences, not danger."
  # --- threat ---
  - scheme: threat
    title: "Build the extension and I will sue"
    invented: true
    use: argument
    text: "If you build the extension, I will take you to court over the boundary. I can: my deeds cover that strip. And I tell you now that I will sue if you build. So you had better not build it."
    bindings:
      X: "building the extension"
      C: "a lawsuit over the boundary"
    attacks:
      - question: "CQ:premise_acceptable"
        target: "position_to_bring_about(C)"
        text: "The land registry shows the strip on your neighbour's title, not yours: you have nothing to sue on."
  - scheme: threat
    title: "Cut the night shift and we strike"
    invented: true
    use: argument
    text: "If management cuts the night shift, the union will strike. We have the votes to call one, and we are telling you now that we will. So management had better not cut it."
    bindings:
      X: "management cutting the night shift"
      C: "a strike"
    attacks:
      - question: "CQ:premise_acceptable"
        target: "assert_bad(X,C)"
        text: "The union's own rules need a ballot after the cut is announced; the leadership cannot promise a strike in advance."
    note: "The speaker undertakes to bring about the consequence (D060: position_to_bring_about(C), and assert_bad(X,C) printed C first)."
  - scheme: danger
    title: "Cut the night shift and the line will jam"
    invented: true
    use: near-miss
    near_miss_of: threat
    text: "If management cuts the night shift, the line will jam with unfinished orders by Friday. That is a danger to the plant. So management should not cut it."
    bindings:
      X: "management cutting the night shift"
      Y: "the line jamming with unfinished orders"
    note: "A warning, not a threat: the speaker does not undertake to bring about the consequence."
  # --- ad_baculum ---
  - scheme: ad_baculum
    title: "Pay by Friday or the car is towed"
    invented: true
    use: argument
    text: "Pay the parking fine by Friday, or I will have your car towed. You don't want that. So pay by Friday."
    bindings:
      X: "paying the parking fine by Friday"
      Y: "the car being towed"
    attacks:
      - question: "CQ:premise_acceptable"
        target: "alternative_bad(X,Y)"
        text: "The warden has no power to order a tow for an unpaid fine; only the court does."
  - scheme: ad_baculum
    title: "Hand in the report or I tell the director"
    invented: true
    use: argument
    text: "Hand in the report today, or I will tell the director you missed the deadline. You would not want that. So hand it in."
    bindings:
      X: "handing in the report today"
      Y: "the director hearing that the deadline was missed"
    attacks:
      - question: "CQ:premise_acceptable"
        target: "undesirable(Y)"
        text: "The director agreed the new deadline herself."
  - scheme: pragmatic_alternative
    title: "Pay by Friday or the fine doubles"
    invented: true
    use: near-miss
    near_miss_of: ad_baculum
    text: "Either you pay the fine by Friday or it doubles. That would be bad for you. So pay by Friday."
    bindings:
      A: "paying the fine by Friday"
      B: "the fine doubling"
    note: "The bad alternative comes by the rules, not by the speaker's undertaking: an argument from alternatives, not the disjunctive threat."
  # --- pragmatic_alternative ---
  - scheme: pragmatic_alternative
    title: "Reinforce the dyke or the polder floods"
    invented: true
    use: argument
    text: "Either we reinforce the dyke this autumn or the polder floods in the winter storms. Flooding would be a disaster for us. So we must reinforce it."
    bindings:
      A: "reinforcing the dyke this autumn"
      B: "the polder flooding in the winter storms"
    attacks:
      - question: "CQ:premise_acceptable"
        target: "alternatives(A,B)"
        text: "The pumps can keep the polder dry for one winter; reinforcing can wait for spring."
  - scheme: pragmatic_alternative
    title: "Renew the passport or miss the trip"
    invented: true
    use: argument
    text: "Either you renew your passport this month or you will miss the trip in June. Missing it would be bad for you. So renew it this month."
    bindings:
      A: "renewing the passport this month"
      B: "missing the June trip"
    attacks:
      - question: "CQ:premise_acceptable"
        target: "alternatives(A,B)"
        text: "The express service renews a passport in three days."
  - scheme: ad_baculum
    title: "Reinforce the dyke or I flood your fields"
    invented: true
    use: near-miss
    near_miss_of: pragmatic_alternative
    text: "Either you pay your share for the dyke, or I will open the sluice onto your fields. You don't want that. So pay your share."
    bindings:
      X: "paying a share for the dyke"
      Y: "the sluice being opened onto the fields"
    note: "The speaker undertakes the bad alternative: the disjunctive threat, a case of the argument from alternatives but not one of its plain warnings."
  # --- appeal_to_vanity_ad_populum ---
  - scheme: appeal_to_vanity_ad_populum
    title: "The club's best riders ride carbon"
    invented: true
    use: argument
    text: "All the best riders in the club ride carbon frames. Buy one and you will be one of them. So buy one."
    bindings:
      G: "the club's best riders"
      A: "that carbon frames are the ones to ride"
      X: "buying a carbon frame"
    attacks:
      - question: "CQ:premise_acceptable"
        target: "group_action(X,G)"
        text: "A frame does not make anyone one of the best riders; the times do."
  - scheme: appeal_to_vanity_ad_populum
    title: "Every serious cook shops at the market"
    invented: true
    use: argument
    text: "Every serious cook in town buys at the Saturday market. Shop there and you will be one of them. So shop there."
    bindings:
      G: "the serious cooks in town"
      A: "that the Saturday market is the place to buy"
      X: "shopping at the Saturday market"
    attacks:
      - question: "CQ:premise_acceptable"
        target: "admired_people(G,A)"
        text: "Half the chefs in town buy from the wholesaler."
    note: "Since 2026-11-26 it concludes should_be_performed(X) (D063); as printed, nothing links what the group accepts (A) to the action, which the challenge of group_action(X,G) presses."
  - scheme: popular_practice
    title: "Everyone shops at the market"
    invented: true
    use: near-miss
    near_miss_of: appeal_to_vanity_ad_populum
    text: "Everybody in town shops at the Saturday market, so it is an acceptable thing to do."
    bindings:
      A: "shopping at the Saturday market"
    note: "Popular practice, not vanity: no admired group to join, and no recommendation."
  # --- practical_goal ---
  - scheme: practical_goal
    title: "Maya should walk to school"
    invented: true
    use: argument
    text: "Walking to school contributes to getting more exercise. Maya's goal is to get more exercise. So Maya should walk to school."
    bindings:
      P: "Maya"
      X: "walking to school"
      G: "getting more exercise"
    attacks:
      - question: "walton/realize_more_effectively"
        text: "Joining the swimming club would give her three times the exercise."
      - question: "walton/incompatible_goal"
        text: "She also wants to sleep longer, and walking means leaving forty minutes earlier."
      - question: "walton/bad_outweighs"
        text: "The road has no pavement for a mile: the risk matters more than the exercise."
  - scheme: practical_goal
    title: "Jo should learn Spanish"
    invented: true
    use: argument
    text: "Learning Spanish contributes to working in Madrid, and Jo's goal is to work in Madrid. So Jo should learn Spanish."
    bindings:
      P: "Jo"
      X: "learning Spanish"
      G: "working in Madrid"
    attacks:
      - question: "walton/incompatible_goal"
        text: "Jo also wants to finish the engineering degree this year, and evening classes would take the time it needs."
    note: "It concludes should_do(P,X), naming the agent; bridge_from_agent carries it to the recommendation when Jo is the one deciding (D063)."
  - scheme: positive_consequences
    title: "Walking to school is good exercise"
    invented: true
    use: near-miss
    near_miss_of: practical_goal
    text: "Walking to school brings more exercise, and more exercise is good. So children should walk to school."
    bindings:
      A: "children walking to school"
      G: "more exercise"
    note: "A good consequence, with no agent's goal: positive consequences, not the argument from goal."
  # --- two_person_practical ---
  - scheme: two_person_practical
    title: "The coach's advice for the marathon"
    invented: true
    use: argument
    text: "Lena tells her coach she wants to run a marathon in the spring. As the coach sees it, building up to sixty kilometres a week is necessary for that, and he tells her so. So Lena should build up to sixty kilometres a week, unless she has better reasons not to."
    bindings:
      A: "Lena"
      B: "her coach"
      X: "running a marathon in the spring"
      Y: "building up to sixty kilometres a week"
    attacks:
      - question: "23/CQ1"
        text: "She also wants to finish her degree in the spring, and the training would take the evenings it needs."
      - question: "23/CQ2"
        text: "Fewer, longer runs get runners like her to a first marathon with less risk."
      - question: "23/CQ3"
        text: "Her knee would flare up; months without running matter more than one race."
      - question: "23/CQ4"
        text: "She works double shifts; she cannot run sixty kilometres a week."
      - question: "23/CQ5"
        text: "She would also have to change how she eats and sleeps."
  - scheme: two_person_practical
    title: "The accountant's advice on the loan"
    invented: true
    use: argument
    text: "Sam tells his accountant he wants to open a second shop next year. As the accountant sees it, paying off the van loan first is necessary for that, and she tells him so. So Sam should pay off the van loan first."
    bindings:
      A: "Sam"
      B: "his accountant"
      X: "opening a second shop next year"
      Y: "paying off the van loan first"
    attacks:
      - question: "23/CQ4"
        text: "The loan has a penalty for paying it off early that Sam cannot cover this year."
    note: "It concludes should_do(A,Y) (D063); its exceptions are practical reasoning's formulas (D093)."
  - scheme: practical_goal
    title: "Sam should save for the shop"
    invented: true
    use: near-miss
    near_miss_of: two_person_practical
    text: "Saving each month contributes to opening a second shop, and that is Sam's goal. So Sam should save each month."
    bindings:
      P: "Sam"
      X: "saving each month"
      G: "opening a second shop"
    note: "One person's reasoning, with no advisor who tells the agent what the goal needs: the argument from goal, not two-person practical reasoning."
  # --- waste ---
  - scheme: waste
    title: "Finish the tram line"
    invented: true
    use: argument
    text: "If the council stops trying to build the tram line now, the four years and millions already spent will be wasted. That would be a bad thing. So the council ought to continue trying to build it."
    bindings:
      A: "the council"
      X: "building the tram line"
    attacks:
      - question: "24/CQ1"
        text: "The line cannot be built: the bridge it needs was refused permission for good."
      - question: "24/CQ2"
        text: "Leaving aside what is spent, finishing would cost more than the line will ever return."
  - scheme: waste
    title: "Ravi's novel"
    invented: true
    use: argument
    text: "If Ravi gives up on his novel now, six years of writing will have been for nothing, which would be a shame. So Ravi ought to keep trying to finish it."
    bindings:
      A: "Ravi"
      X: "finishing his novel"
    attacks:
      - question: "24/CQ2"
        text: "Leaving the six years aside, another year of unpaid writing costs him more than the book is likely to bring."
    note: "It concludes ought_to_continue(A,X), the agent and the goal; bridge_from_continuing carries it to the action that continues the effort (D063)."
  - scheme: sunk_costs
    title: "The costs of the tram line are too high to waste"
    invented: true
    use: near-miss
    near_miss_of: waste
    text: "The council has spent millions on the tram line so far, too much to waste. So the line should be finished."
    bindings:
      A: "finishing the tram line"
      C: "millions spent on the tram line so far"
    note: "WAG's sunk costs form: the costs incurred, with no agent's efforts or goal: not the argument from waste."
  # --- sunk_costs_precommitment ---
  - scheme: sunk_costs_precommitment
    title: "Priya signed up for the race"
    invented: true
    use: argument
    text: "In March Priya signed up to run the charity race and told everyone she would. Now, in October, she can run it or not. She is committed to running it by what she did in March. So she should run it."
    bindings:
      P: "Priya"
      A: "running the charity race"
      T1: "March"
      T2: "October"
    attacks:
      - question: "CQ:premise_acceptable"
        target: "precommitted(P,A,T1,T2)"
        text: "She signed up for the five-kilometre walk, not the race."
  - scheme: sunk_costs_precommitment
    title: "The town committed to the festival"
    invented: true
    use: argument
