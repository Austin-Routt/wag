# Proposal for decisions D022, D023, D031, D033, D060, D062, D063 and D093
# (docs/decisions.md): the rest of the first family (step C4 of
# first-family.md): the practical conclusions that meet the others, their
# bridges for conclusions that name an agent, threat and danger, ends and
# means, waste and sunk costs. `wag-cli --proposal` checks it and writes its
# view, D022-D093.md. How proposals work: process.md §5.
#
# Version 1, 2026-11-26. The sources, quoted with their pages, are in the
# workspace (verify/p-C4/quotes.md); this file cites author, year and page.

decisions: [D022, D023, D031, D033, D060, D062, D063, D093]
title: "The rest of the first family: practical conclusions and their bridges, threat and danger, ends and means, waste and sunk costs"
summary: |-
  **What changes.**
  - **D063, the conclusions.** fear, ad_baculum, pragmatic_alternative and
    appeal_to_vanity_ad_populum conclude should_be_performed(X) (A for
    pragmatic_alternative); danger and threat conclude its negation. Each
    recommends an action to the one addressed, the claim WAG's thesis and
    the consequence and practical-reasoning schemes state as
    should_be_performed(A) (D059, D063). Until now each concluded a
    predicate of its own (ought_to_bring_about, should_not, not_bring_about,
    do_other, carry_out_action) that no other scheme concluded or used, so
    in the engine an appeal to fear for doing A never met an argument from
    negative consequences against A. Walton's account of these forms reads
    them so: the fear, danger and threat appeals are species of argument from
    negative consequences, and so of practical reasoning, and their
    conclusion is a practical ought about the respondent's action (Walton
    2000, pp. 138, 140-143, 173, 191); the conditional threat has the same
    conclusion as the argument from negative consequences (p. 141); the
    argument from alternatives is practical reasoning, and the disjunctive
    threat a special case of it (p. 142). What is particular to each (the
    speaker's threat, the fear, the alternative, the admired group) stays in
    its premises. The old conclusion templates are kept and listed as
    orphans.
  - **D060.** threat's premises name what the book's 35 names (Walton, Reed
    and Macagno 2008, p. 333): cited_bad_consequences(X,C), which had lost
    the consequence; position_to_bring_about(C), for position_to_know(X),
    which put the action where the threatened consequence belongs and shared
    its name with the source scheme's position_to_know/2; and assert_bad(X,C),
    whose template now prints C before X (an indexed template): the speaker
    will see to it that C happens if the respondent does X (cf. Walton 2000,
    p. 140, the conditional threat's first premise).
  - **D062.** danger concludes about the action, ¬should_be_performed(X), as
    the book's 37 does (2008, p. 334; Walton 2000, p. 173), not about the
    danger Y. occur/2's template is corrected with it.
  - **D063, the bridges.** Conclusions that name an agent keep it:
    practical_goal's should_do(P,X), two_person_practical's (now
    should_do(A,Y), D093), sunk_costs_precommitment's should_do(P,A) (D031)
    and waste's ought_to_continue(A,X). They reach the recommendation only
    through a bridge: bridge_from_agent, from should_do(P,A) to
    should_be_performed(A), and bridge_from_continuing, from
    ought_to_continue(P,G) to should_be_performed(A) for the action A that
    continues the effort to realize G. D063's refinement asks for the agent
    and the deliberation to be positively the same, or explicitly mapped: an
    exception nobody raises is presumed not to hold, so an agent nobody
    checked would pass. So each bridge has a premise its arguer supports,
    deliberating_agent(P,A), that P is the agent who deliberates in this
    discussion whether to do A; positions.json types its places, so the case
    record's mapping of actions to actors checks it (R14). That premise is
    the exception D063 first named (the agent is not the one deliberating),
    stated positively and so the arguer's burden: a critic who denies it
    challenges it as a premise, and the bridge needs no exception besides.
    D063 also says that continuing an activity binds to the continuing
    action, not only to its goal: waste concludes that the agent ought to
    continue trying to realize a goal, so bridge_from_continuing takes a
    second premise, continues_trying(A,G), that doing A is continuing to try
    to realize G, and recommends A. Neither bridge has a negative form: no
    scheme of the family concludes the negation of should_do or of
    ought_to_continue. The bridges enter walton.yml now; the game has none of
    these schemes, and takes them up with their family.
  - **D031.** sunk_costs_precommitment, the commitment form of sunk costs, a
    scheme of its own (2008, pp. 135-136 and entry 25, pp. 326-327; Walton
    2002, pp. 488-489): at a time T2 there is a choice between doing A and
    not doing it, and P is committed in advance to A by what P did or
    undertook at an earlier time T1; so P should do A. The book calls it a
    practical form of argument from commitment (2008, p. 135), a hybrid of
    commitment and practical reasoning (Walton 2002, p. 491). It prints no
    questions for it. sunk_costs, WAG's form with the costs already incurred,
    linked partly to 25, stays as it is.
  - **D033.** waste gets reassessment_against_continuing(A,X), the book's
    second question for 24 (2008, p. 326): leaving aside past losses that
    cannot be recovered, a reassessment of costs and benefits from now on
    goes against continuing (cf. Walton 2002, pp. 479, 482: past expenditures
    do not justify future ones). An exception, the critic's to make out, as
    D055's outweighing exceptions are.
  - **D022.** Two variants of end_and_means_1, whose entry (22.6.1) prints
    both readings in its parentheses (2008, p. 325), as the schemes library
    has them: end_and_means_bad, a bad end condemns its means
    (means_to_end(X,Y), bad(Y), so bad(X)), and end_and_means_less_bad, a good
    end makes a bad means less bad (means_to_end(X,Y), good(Y), bad(X), so
    less_bad_as_means(X,Y)).
  - **D023.** end_and_means_1 borrows the consequence schemes' question of
    the opposite value (33/CQ3) as the exception means_bad_outweighs(X,Y),
    that the means has bad consequences that matter more than its good end;
    end_and_means_bad, 22.6.1's negative reading, borrows it the other way
    round as means_good_outweighs(X,Y). They are not the consequence
    schemes' own formulas, bad_outweighs(A,G) and good_outweighs(A,G), whose
    first place is an action (positions.json): a means may be a state, as
    13292.3's is (less meat consumed), and typed as an action it would have
    to be an action of the case (R14). The likelihood and evidence questions
    (33/CQ1 and CQ2) press means_to_end(X,Y), a premise, which the game
    challenges. The graded
    variant borrows none: its conclusion is a comparison, which an opposite
    value does not defeat. practical_goal borrows practical reasoning's
    alternatives, conflicting goals and side effects (22.1, CQ1, CQ2, CQ5;
    22.4, CQ1, CQ3, CQ7; Walton 2000, pp. 137-138, 191), in the formulas C2
    gave practical reasoning: realize_more_effectively(P,G,X) (D089's
    reading of alternatives as better means), incompatible_goal(P,G), and
    bad_outweighs(X,G) (D070's reading of the side effect). Each is asked as
    a walton/ question, its source recorded here and in the register.
  - **D093 (new: found in drafting).** (a) practical_goal's goal premise
    becomes goal_of_agent(P,G), practical reasoning's, so that its borrowed
    questions speak of the same goal; person_goal/2 is left an orphan. (b)
    two_person_practical's questions are the book's five (2008, pp. 325-326)
    in practical reasoning's formulas: the conflicting goal
    incompatible_goal(A,X); the better means realize_more_effectively(A,X,Y)
    (D089); the side effect bad_outweighs(Y,X) (D070); the possibility
    possible_bring_about(A,Y) (D088); and, for the fifth, which walton.yml
    lacked, intervening_actions(Y,X). Its exceptions named the advisor where
    the action belongs (side_effect_other_act(B,A)) and left the means out
    (alternative_means(A,X)). It concludes should_do(A,Y), D063's agent
    conclusion, for should_carry_out(A,Y). (c) waste's assumption reads
    possible_goal(X): possible/1's template said of a goal that an action is
    possible. (d) The templates of the changed schemes, in our own words:
    occur/2 (D062), only_way_prevent/2, prevent/1, situation_necessity/4
    ("sees", for "sets"), waste_bad_thing/2 and ought_to_continue/2: a
    premise's template does not begin "Therefore", nor does a conclusion's,
    which the views put after "So".

  **What stays.** help and distress (family F16) name an agent too; D063's
  bridge applies to them when their family is taken up. end_and_means_2 and
  end_and_means_3, negative_practical, slippery_slope_base_case and the
  practical analogies (D029) do not change. sunk_costs keeps its form. None
  of these schemes is in the game's core.yml; step C5 brings the game's four
  schemes to the canonical ones, and these schemes join the game with their
  family (plan §6).

  **The sources.** Every reading above rests on the book (Walton, Reed and
  Macagno 2008), Scare Tactics (Walton 2000) and The Sunk Costs Fallacy or
  Argument from Waste (Walton 2002), at the pages cited; the quotations are
  in WAG's private workspace, which the public repository does not copy
  (D043).

  **The gold.** 13292.3 is coded with end_and_means_1: its instance lists
  the new exception means_bad_outweighs(X,Y). No other instance of the batch-2 gold
  uses a changed scheme (13292.25 names end_and_means_3, which does not
  change, among its alternatives).

  **Tests.** WAG's engine tests (wag/internal/carneades/practical_c4_test.go,
  run on walton.yml with this proposal applied before it is): each scheme's
  own conclusion, instantiated, meets an argument of the other side about
  the same action, and a tie leaves neither in (on today's walton.yml each
  of the six concludes a predicate that meets nothing, and the test fails); each bridge carries an agent's conclusion to the
  recommendation only with deliberating_agent(P,A), and the continuing
  bridge only with continues_trying(A,G) too; each new exception defeats
  the arguments it is on and no other; the schemes' shapes are pinned.
effects:
  - "walton.yml, through walton-clean/tools/edits.py as owner decisions, in a block of its own, PRACTICAL_C4, with CHANGELOG rows: sunk_costs_precommitment, end_and_means_bad, end_and_means_less_bad, bridge_from_agent and bridge_from_continuing added (category addition, owner decision); fear, danger, threat, ad_baculum, pragmatic_alternative, appeal_to_vanity_ad_populum, practical_goal, two_person_practical, waste and end_and_means_1 changed as above (repairs). Their meta (title and source) is walton.yml's, unchanged. Templates added: cited_bad_consequences/2, position_to_bring_about/1, reassessment_against_continuing/2, choice_at/2, precommitted/4, less_bad_as_means/2, means_bad_outweighs/2, means_good_outweighs/2, deliberating_agent/2, continues_trying/2; changed: assert_bad/2, occur/2, only_way_prevent/2, prevent/1, situation_necessity/4, waste_bad_thing/2, ought_to_continue/2; each agreement-free. Templates left unused are kept and listed as orphans: ought_to_bring_about/1, should_not/1, not_bring_about/1, do_other/1, carry_out_action/1, cited_bad_consequences/1, position_to_know/1, should_carry_out/2, person_goal/2, possible_action/1, goals_higher_priority/2, alternative_means/2 and side_effect_other_act/2, where no other scheme uses them. check/run.sh regenerates the derived files; the gate and the registry differ only in these schemes and keys (129 schemes), every related pair declared. The cleaning's gate reads indexed templates as WAG's renderer reads them (walton-clean/check: a template with %[n]s verbs covers each argument, each index in range), which D060 needs for assert_bad/2 and this proposal for precommitted/4; plain templates are checked as before. The annotation engine's copy, wag/data/annotation/walton.yml, is copied."
  - "links.json: 4.8, 22.5, 23, 24, 34, 35, 35.1, 36 and 37 as proposed below, for the changed formulas; 25 links sunk_costs_precommitment exactly (sunk_costs stays linked partly); 22.6.1 links end_and_means_bad and end_and_means_less_bad partly, each one reading of the entry. families.json: F10 (practical reasoning) gains sunk_costs_precommitment, end_and_means_bad, end_and_means_less_bad, bridge_from_agent and bridge_from_continuing; F11 (waste and sunk costs) gains sunk_costs_precommitment. positions.json types the agent's and the action's places of should_do/2, deliberating_agent/2, precommitted/4, situation_necessity/4 and tells_intend/3, the agent's of ought_to_continue/2, stop_realize_wasted/2, waste_bad_thing/2 and reassessment_against_continuing/2, and the action's of continues_trying/2, choice_at/2 and contributing_action/2."
  - "The catalogue regenerates the entries of the changed and added schemes (wag/data/catalogue), and the candidates registry records what these decisions closed; the register records the decisions as applied, D093 with its source (the owner's instruction of 2026-11-25 to go with the recommended choices). The batch-2 gold: 13292.3's instance lists means_bad_outweighs(X,Y) (recode_c4.py), validate.py and the Go check pass, and the replay accounts for every claim as before. The docs that count walton.yml's schemes say 129."
schemes:
  - id: fear
    meta:
      title: Argument From Fear Appeal
      source: "Douglas Walton, Scare Tactics. Dordrecht: Kluwer, 2000, p. 22.             \n"
    variables: [X, Y]
    premises: ["not_do_appear(X,Y)", "bad_for_you(Y)", "prevent(Y)", "only_way_prevent(Y,X)"]
    assumptions: []
    exceptions: []
    conclusions: ["should_be_performed(X)"]
  - id: danger
    meta:
      title: Argument From Danger Appeal
      source: "Douglas Walton, Scare Tactics. Dordrecht: Kluwer, 2000, p. 173.             \n"
    variables: [X, Y]
    premises: ["occur(X,Y)", "danger(Y)"]
    assumptions: []
    exceptions: []
    conclusions: ["¬should_be_performed(X)"]
  - id: threat
    meta:
      title: Argument From Threat
      source: "Douglas Walton, A Pragmatic Theory of Fallacy. Tuscaloosa and London: University of Alabama Press, 1995, p. 157.\n"
    variables: [X, C]
    premises: ["cited_bad_consequences(X,C)", "position_to_bring_about(C)", "assert_bad(X,C)"]
    assumptions: []
    exceptions: []
    conclusions: ["¬should_be_performed(X)"]
  - id: ad_baculum
    meta:
      title: Argument From Disjunctive Ad Baculum Threat
      source: "Douglas Walton, Scare Tactics. Dordrecht: Kluwer, 2000, p. 140.\n"
    variables: [X, Y]
    premises: ["alternative_bad(X,Y)", "undesirable(Y)"]
    assumptions: []
    exceptions: []
    conclusions: ["should_be_performed(X)"]
  - id: pragmatic_alternative
    meta:
      title: Pragmatic Argument From Alternatives
      source: "Douglas Walton, Scare Tactics. Dordrecht: Kluwer, 2000, p. 142.\n"
    variables: [A, B]
    premises: ["alternatives(A,B)", "undesirable(B)"]
    assumptions: []
    exceptions: []
    conclusions: ["should_be_performed(A)"]
  - id: appeal_to_vanity_ad_populum
    meta:
      title: Appeal to Vanity Ad Populum Argument
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008).  Argumentation Schemes. Cambridge University Press, p. 312.\n"
    variables: [G, A, X]
    premises: ["admired_people(G,A)", "group_action(X,G)"]
    assumptions: []
    exceptions: []
    conclusions: ["should_be_performed(X)"]
  - id: practical_goal
    meta:
      title: Practical Reasoning - Argument From Goal
      source: "Bart Verheij, \"Dialectical Argumentation with Argumentation Schemes: An Approach to Legal Logic.\"  Artificial Intelligence and Law 11 (2003), p. 169.\n"
    variables: [P, X, G]
    premises: ["contributing_action(X,G)", "goal_of_agent(P,G)"]
    assumptions: []
    exceptions: ["realize_more_effectively(P,G,X)", "incompatible_goal(P,G)", "bad_outweighs(X,G)"]
    conclusions: ["should_do(P,X)"]
  - id: two_person_practical
    meta:
      title: Two Person Practical Reasoning
      source: "Douglas Walton, Appeal to Expert Opinion. University Park:  Pennsylvania State University Press. 1997 p. 163.\n"
    variables: [A, B, X, Y]
    premises: ["tells_intend(A,X,B)", "situation_necessity(B,Y,X,A)"]
    assumptions: ["possible_bring_about(A,Y)"]
    exceptions: ["incompatible_goal(A,X)", "realize_more_effectively(A,X,Y)", "bad_outweighs(Y,X)", "intervening_actions(Y,X)"]
    conclusions: ["should_do(A,Y)"]
  - id: waste
    meta:
      title: Argument From Waste
      source: "Douglas Walton, A Pragmatic Theory of Fallacy, Tuscaloosa and London: University of Alabama Press, 1995, p. 157. Douglas Walton \"The Sunk Cost Fallacy or Argument from Waste\" Argumentation 16 (2002), p.488.\n"
    variables: [A, X]
    premises: ["stop_realize_wasted(A,X)", "waste_bad_thing(A,X)"]
    assumptions: ["possible_goal(X)"]
    exceptions: ["reassessment_against_continuing(A,X)"]
    conclusions: ["ought_to_continue(A,X)"]
  - id: sunk_costs_precommitment
    meta:
      title: "Argument from Sunk Costs (the commitment form)"
      source: |
        Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, pp. 135-136, and ch. 9, entry 25, pp. 326-327. Douglas Walton, 'The Sunk Costs Fallacy or Argument from Waste', Argumentation 16 (2002), pp. 488-489. As the schemes library has it (decision D031).
    variables: [P, A, T1, T2]
    premises: ["choice_at(T2,A)", "precommitted(P,A,T1,T2)"]
    assumptions: []
    exceptions: []
    conclusions: ["should_do(P,A)"]
  - id: end_and_means_1
    meta:
      title: Practical Reasoning - Argument From Ends and Means 1
      source: "Chaim Perelman and Lucie Olbrechts-Tyteca, The New Rhetoric: A Treatise on Argumentation  Notre Dame, Ind.: University of Notre Dame Press, 1969, pp. 273-278.\n"
    variables: [X, Y]
    premises: ["means_to_end(X,Y)", "good(Y)"]
    assumptions: []
    exceptions: ["means_bad_outweighs(X,Y)"]
    conclusions: ["good(X)"]
  - id: end_and_means_bad
    meta:
      title: "Ends and Means - a Bad End Condemns Its Means"
      source: |
        Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 22.6.1 (its negative reading), p. 325. Chaim Perelman and Lucie Olbrechts-Tyteca, The New Rhetoric: A Treatise on Argumentation, Notre Dame, Ind.: University of Notre Dame Press, 1969, pp. 273-278. As the schemes library has it (decision D022).
    variables: [X, Y]
    premises: ["means_to_end(X,Y)", "bad(Y)"]
    assumptions: []
    exceptions: ["means_good_outweighs(X,Y)"]
    conclusions: ["bad(X)"]
  - id: end_and_means_less_bad
    meta:
      title: "Ends and Means - a Good End Makes a Bad Means Less Bad"
      source: |
        Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 22.6.1 (its graded reading), p. 325. Chaim Perelman and Lucie Olbrechts-Tyteca, The New Rhetoric: A Treatise on Argumentation, Notre Dame, Ind.: University of Notre Dame Press, 1969, pp. 273-278. As the schemes library has it (decision D022).
    variables: [X, Y]
    premises: ["means_to_end(X,Y)", "good(Y)", "bad(X)"]
    assumptions: []
    exceptions: []
    conclusions: ["less_bad_as_means(X,Y)"]
  - id: bridge_from_agent
    meta:
      title: "From What an Agent Should Do to the Action (bridge)"
      source: |
        WAG's bridge (decision D063, refined 2026-11-22): an explicit warrant, with a premise its arguer supports, from a conclusion that names an agent, should_do(P,A), to the recommendation should_be_performed(A), when P is the agent who deliberates whether to do A. Not in the compendium.
    variables: [P, A]
    premises: ["should_do(P,A)", "deliberating_agent(P,A)"]
    assumptions: []
    exceptions: []
    conclusions: ["should_be_performed(A)"]
  - id: bridge_from_continuing
    meta:
      title: "From Continuing to Try to the Action (bridge)"
      source: |
        WAG's bridge (decision D063, refined 2026-11-22: continuing an activity binds to the continuing action, not only to its goal): from waste's conclusion, that an agent ought to continue trying to realize a goal, to the recommendation of the action that continues the effort, when the agent is the one who deliberates whether to do it. Not in the compendium.
    variables: [P, G, A]
    premises: ["ought_to_continue(P,G)", "continues_trying(A,G)", "deliberating_agent(P,A)"]
    assumptions: []
    exceptions: []
    conclusions: ["should_be_performed(A)"]
language:
  cited_bad_consequences/2: "If you go ahead with %s, the cited bad consequence %s will follow."
  position_to_bring_about/1: "I am in a position to bring about %s."
  assert_bad/2: "I will see to it that %[2]s happens if you go ahead with %[1]s."
  occur/2: "If the respondent goes ahead with %s, then %s will occur."
  only_way_prevent/2: "The only way for you to prevent %s is %s."
  prevent/1: "You ought to prevent %s if you can."
  situation_necessity/4: "As %s sees the situation, %s is a necessary or sufficient condition for realizing %s, and tells %s this."
  waste_bad_thing/2: "If all of %s's previous efforts to realize %s were wasted, that would be a bad thing."
  ought_to_continue/2: "%s ought to continue trying to realize %s."
  reassessment_against_continuing/2: "Leaving aside past losses that cannot be recovered, a reassessment of the costs and benefits from now on goes against %s continuing to try to realize %s."
  choice_at/2: "At %s, there is a choice between doing %s and not doing it."
  precommitted/4: "At %[4]s, %[1]s is committed in advance to doing %[2]s by what that agent did or undertook at %[3]s."
  less_bad_as_means/2: "%s is less bad for being a means to the good end %s."
  means_bad_outweighs/2: "%s, as a means, has bad consequences that matter more than its end %s."
  means_good_outweighs/2: "%s, as a means, has good consequences that matter more than its end %s."
  deliberating_agent/2: "%s is the agent who deliberates in this discussion whether to do %s."
  continues_trying/2: "%s is a way of continuing to try to realize %s."
