# Proposal for decisions D008, D065, D066, D069, D072 and D074
# (docs/decisions.md), with D067 recorded as changing nothing: the
# consequence family's modal forms and their bridges, how serious a
# consequence is and on whom it falls, whether acting averts the harm of not
# acting, the argument from what happens anyway, and the appeal to
# consequences offered for the truth of a claim. `wag-cli --proposal` checks
# it and writes its view, D008-D074.md. How proposals work: process.md §5.
#
# Version 5, 2026-11-25 (step C3 of first-family.md), on the owner's answer
# to version 4's open choice (an external assessment the owner sent, checked;
# the register's refinements of D053, D074, D008 and D065, e6ad187): D074's
# objection is an undercutter of the specific argument, not an exception;
# the bridges' exception is worth_finding_out_first(A,G); too_slight is
# declared neutral, with its scope. Amended before it was applied, on the
# rehearsal of its application, the independent check of both and an
# external review (v5a.py, the exact edits): the bridges' exception says what
# it does, with its scope; the engine tests pin the schemes. Amended again on
# the check of those fixes (v5b.py): a reply's one target, and what a
# reply that does not make out the exception does until it is answered.
# A third time on the owner's declaration of the bridges' exception
# (v5c.py): the burdens a bare claim of knowability fails and meets.
# Version 4
# (140e195, a32f313; its application's independent review,
# wag-workspace verify/p-D008-D074/
# application-v4/review.md), version 3 (8adb3b3) and its check, version 2
# (380ae77) and its independent review, version 1 (7ec96d8) and its review,
