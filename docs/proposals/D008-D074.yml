  - "The kept format-1 gold (gold-format1.json, D039: the version before, kept as it was) is checked against the walton.yml it was made with, which a copy beside it keeps (docs/kialo-batch2/format1/walton.yml, walton.yml before this change): validate.py reads that copy for a format-1 file, and TestFormat1IsCheckedAsMade builds its checker on it. test_validate.py's format-1 tests (test_the_format1_gold_passes_as_format1, test_format1_named, test_r4_in_format1_is_the_n8_rule), which weaken or skip once walton.yml changes, key on the copy instead, so that they run strictly, and a test checks that the copy is the walton.yml the format-1 gold was made with (its hash). Of its other inputs, links.json changes too (validate.py reads it), and the format-1 gold passes with the copy and the new links.json; an input that changes later and breaks it is kept there too. Without the copy, every change to a scheme it uses would fail it (16 instances here). Its scope: validate.py reads the copy for every format-1 file, the format-1 gold (made with it) and the annotators' files of 2026-10-13 (made with an earlier walton.yml, as before); the Go side re-checks annotation runs recorded in format 1 with the dataset's walton.yml when it shows them, since such runs pin no inputs: a limit of D092's 'checked as they were made', recorded here, not changed."
  - "Guidelines (§3, §3.1, §5 item 11; both copies) and rule cases (rule-cases.yml). The mood rule: the mood that counts is the causal link's, from the action to the consequence. May, might, could, and can of possibility (can lead to, can result in, can cause: G may or may not follow when A is done) are the modal variants; would, will, and can of capability (the measures can solve this: A, when done, brings G about) are the categorical schemes. A noun of danger (the risk of G, a threat of G) that says G may follow is modal; one that ranks how bad G is (a more severe threat than) leaves the link as the claim or its context states it. A hedge on whether the action will be taken, not on its link, leaves the link categorical. A modal cause with a firm link is cause_to_effect_modal (item 11). When the mood cannot be told, code the modal variant and say why in notes: it claims less. A weighing claim whose rival consequence is only possible has no answer scheme: it is coded with other, concluding the exception (D075), naming C024. OC2 gains a clause: a possible further consequence offered as a reason for or against A is coded with the modal variant and its bridge, the bridge primary. OC9 changes: a claim that a cited consequence is real but slight argues too_slight(A,G); one that it is rare or unlikely answers 33/CQ1 against a categorical argument, and against a modal one attacks its bridge's matters_to_decision(A,G), unless it denies that the chance is real (33/CQ1); one that it is not bad (or good) at all attacks bad(G) or good(G); its old wording is retired (rule-cases.yml's list). New rules: on whom a consequence falls (the bearer exception of the argument's side, C021) against a right or a value (OC5, C007); the bridge's premise (is the chance enough, given G?) against its exception (is it worth finding out first?), against 33/CQ1 (is the possibility real?) and against too_slight (is G itself slight?); a reply that shows only that G could be found out argues the exception without making it out: it does not meet the critic's burden of production (the owner's declaration under D053), the game's answer contract is to refuse it (item F, with step C5), and until then it stands in play until the bridge's defender answers it, a tie going against the critic; a reply addressed to a categorical argument about the same link challenges its brings_about(A,G) instead (33/CQ1 or CQ2); harm_reduction against OC13 and 33.1, and a claim that A's other harms matter more than the reduction as a rebuttal (the scheme has no outweighing exception); D074's objection as an undercutter of the specific argument's inference, against a consequence argument coded by OC1 as against OC1's other; a hedged consequence for the agent's own goals with negative_consequences_modal, naming 33.3; OC13's record of D069's four values (above); D066's three rules as OC6 has them. Rule cases: every case whose coding has a consequence scheme's instance lists the new exceptions (OC1-a, OC1-b, OC1-d, OC3-c, OC4-a, OC6-a, OC8-a, OC11-a, OC12-a, OC13-a, OC13-b), the cases of claims the recode changes follow the gold (OC1-c, OC2-a, OC9-a and any other the test names), and each new rule has a worked case, among them a positive modal variant with its bridge, and two replies that do not make out worth_finding_out_first (a test that would come too late, and one whose cost the decision cannot bear)."
  - "Validators and tests: validate.py and the Go check read the new schemes from walton.yml, and R2's table the modal links from links.json; no rule changes. Tests that use the gold follow the recode: in test_validate.py (which CI's data job runs), r10_the_targets_other_instance, r12_an_annotators_primary_comes_first_as_1, r13_a_formula_of_another_instance_of_the_claim, r13_another_kialo_parent and r16_an_annotators_file_pins_nothing, those that take the gold as an annotator's record renumbering its instances as an annotator would (the primary first, as #1: a recoded claim's bridge is #2 or #4 in the gold, whose ids keep their history); in Go, TestCheckInMatchesValidatePy likewise, TestAgreementPyMatchesGoOnTargets (its target_instance case, checked against the recoded gold), TestFormat1IsCheckedAsMade (above), TestRuleCases, TestFormat2Refusals, TestAgreementFieldsAcrossFormats, TestThePromptListsEveryInstance and the gold's checks; TestCandidatesFindFaults's sound fixture takes positive_consequences' new form, and the two cases built on it follow (a pattern two formulas from positive_consequences; a variant 9 formulas from negative_consequences). TestRuleCases also checks the arity of every walton.yml predicate in a case's formulas, an other instance's included: a case's other instance concluding one of the new exceptions is read by nothing else; a test of the check's own plants a formula with a wrong arity. The annotation engine's copies (gold.json, guidelines.md, lexicon.json) are copied; agreement.json is regenerated."
  - "The replay (to_wag.py) does not change: it plays each claim's primary instance. Until step C5 the bridges are played with other, which puts only a claim's text on the board, so the three recoded claims count as coverage gaps, and a reply to a recoded claim's modal argument (13292.12, 13292.233, 13292.43, at a secondary instance) finds no premise to attack: a cascade. 13292.25, at the exception too_slight, which the game's copy of 33.2 lacks, is not played, as the claims at exceptions the game lacks are not (13292.104, 13292.123, 13292.127). The counts fall until C5: as intended 21 to 17, cascades 1 to 4, played 40 to 37. The README states all seven categories and their total, the 49 claims besides the thesis (13292.1, the game's root): as intended 17, fragment 3, coverage gap 16, failed 1, duplicate 1, cascade 4, not played 7. When the game has the modal variants and the bridges (C5), to_wag.py plays a claim's instance that feeds its primary one (keyed by instance, not by claim), so that such replies find their target. The batch-2 README's replay table and its recode history are regenerated."
  - "Docs: the counts of walton.yml's schemes say 124 (README.md, docs/plan.md, docs/dialogue-types.md, wag/data/catalogue/README.md, docs/scheme-registry/README.md, whose rows name the five added schemes and the three changed), with the recount of schemes whose assumptions or exceptions carry questions; docs/plan.md's count of links.json's links is recounted (117: 91 exact, 26 partial; 212 question links, 160 naming a formula); first-family.md lists the new members, step C3 as done, and its C5 row names the modal variants and the bridges; annotation-records.md §7's example becomes a categorical instance's record that keeps a game question, 13292.7#1's (13292.9#1's, the example before, has none after the recode); the views of the applied proposals (D001-D028-D029, D004-D075, D055-D059) are regenerated: their examples render the new exceptions, and D055-D059's 33.1, 33.2 and 33.4 are marked as changed since (the checker's mark, 0282793). The game's count of questions (README.md, docs/plan.md, docs/prototype.md) is unchanged."
  - "The game, at step C5: the game's two consequence schemes (AS:consequences, AS:negative_consequences) take the new exceptions, with game questions for too_slight and the bearer pair, and D074's objection as a question about the argument itself; the modal variants and the bridges join the NASCQ, with a question for worth_finding_out_first (matters_to_decision is a premise, challenged as any premise is); the question protocol of D003 and D075 (who answers an asked question, and what holds while it is pending); answers at the new exceptions get answer schemes or stay other, and each backup edge has an answer that must pass, one that must be refused and one bound to the wrong target. 33.4's fails_to_avert and harm_reduction enter the game when a profile includes their schemes, not at C5."
schemes:
  - id: positive_consequences
    meta:
      title: Argument from Positive Consequences
      source: |
        Douglas Walton, A Pragmatic Theory of Fallacy, The University of Alabama Press, Tuscaloosa and London, 1995, pp. 155-156.
    variables: [A, G]
    premises: ["brings_about(A,G)", "good(G)"]
    assumptions: []
    exceptions: ["bad_outweighs(A,G)", "too_slight(A,G)", "gain_discounted_by_bearer(A,G)"]
    conclusions: ["should_be_performed(A)"]
  - id: negative_consequences
    meta:
      title: Argument from Negative Consequences
      source: |
        Douglas Walton, A Pragmatic Theory of Fallacy, The University of Alabama Press, Tuscaloosa and London, 1995, pp. 155-156.
    variables: [A, G]
    premises: ["brings_about(A,G)", "bad(G)"]
    assumptions: []
    exceptions: ["good_outweighs(A,G)", "too_slight(A,G)", "harm_discounted_by_bearer(A,G)"]
    conclusions: ["¬should_be_performed(A)"]
  - id: negative_consequences_reasoning
    meta:
      title: Argument From Consequences - Reasoning From Negative Consequences
      source: |
        Douglas Walton, A Pragmatic Theory of Fallacy. Tuscaloosa and London: University of Alabama Press, 1995. pp. 155-156. Douglas Walton, Scare Tactics. Dordrecht: Kluwer, 2000, p. 123.
    variables: [A, B]
    premises: ["agent_bring_about(A,B)", "bad_for_goals(B)"]
    assumptions: []
    exceptions: ["good_outweighs(A,B)"]
    conclusions: ["¬should_be_performed(A)"]
  - id: negative_consequences_prudential
    meta:
      title: Argument From Negative Consequences - Prudential Inference
      source: |
        Douglas Walton, A Pragmatic Theory of Fallacy. Tuscaloosa and London:  University of Alabama Press, 1995. pp. 155- 156. Douglas Walton, Scare Tactics. Dordrecht: Kluwer, 2000, p. 123.
    variables: [X, C]
    premises: ["not_doing(X)", "bad_consequence(X,C)"]
    assumptions: ["strongly_occur(X,C)"]
    exceptions: ["bad_outweighs(X,C)", "fails_to_avert(X,C)"]
    conclusions: ["should_be_performed(X)"]
  - id: positive_consequences_modal
    meta:
      title: Argument from Possible Positive Consequences
      source: |
        WAG's modal variant of the argument from positive consequences (decision D008), after Douglas Walton, A Pragmatic Theory of Fallacy, The University of Alabama Press, Tuscaloosa and London, 1995, pp. 155-156, and the questions on consequences in Walton, Reed and Macagno, Argumentation Schemes, 2008, pp. 332-333, which allow that a consequence will, may or must occur.
    variables: [A, G]
    premises: ["may_bring_about(A,G)", "good(G)"]
    assumptions: []
    exceptions: ["bad_outweighs(A,G)", "too_slight(A,G)", "gain_discounted_by_bearer(A,G)"]
    conclusions: ["may_be_worth_performing(A,G)"]
  - id: negative_consequences_modal
    meta:
      title: Argument from Possible Negative Consequences
      source: |
        WAG's modal variant of the argument from negative consequences (decision D008), after Douglas Walton, A Pragmatic Theory of Fallacy, The University of Alabama Press, Tuscaloosa and London, 1995, pp. 155-156, and the questions on consequences in Walton, Reed and Macagno, Argumentation Schemes, 2008, pp. 332-333, which allow that a consequence will, may or must occur.
    variables: [A, G]
    premises: ["may_bring_about(A,G)", "bad(G)"]
    assumptions: []
    exceptions: ["good_outweighs(A,G)", "too_slight(A,G)", "harm_discounted_by_bearer(A,G)"]
    conclusions: ["may_be_unwise_to_perform(A,G)"]
  - id: bridge_from_possible_good
    meta:
      title: From a Possible Good Consequence to the Action (bridge)
      source: |
        WAG's bridge (decision D008, refined 2026-11-25), on the pattern of decisions D011 and D063: an explicit warrant, with a premise its arguer supports and an exception of its own, from the modal conclusion of positive_consequences_modal to the recommendation. Not in the compendium.
    variables: [A, G]
    premises: ["may_be_worth_performing(A,G)", "matters_to_decision(A,G)"]
    assumptions: []
    exceptions: ["worth_finding_out_first(A,G)"]
    conclusions: ["should_be_performed(A)"]
  - id: bridge_from_possible_harm
    meta:
      title: From a Possible Bad Consequence to Not Acting (bridge)
      source: |
        WAG's bridge (decision D008, refined 2026-11-25), on the pattern of decisions D011 and D063: an explicit warrant, with a premise its arguer supports and an exception of its own, from the modal conclusion of negative_consequences_modal to the rejection. Not in the compendium.
    variables: [A, G]
    premises: ["may_be_unwise_to_perform(A,G)", "matters_to_decision(A,G)"]
    assumptions: []
    exceptions: ["worth_finding_out_first(A,G)"]
    conclusions: ["¬should_be_performed(A)"]
  - id: harm_reduction
    meta:
      title: Argument from What Happens Anyway (harm reduction)
      source: |
        WAG's scheme (decision D072, refined 2026-11-25; candidate C022), not in the compendium: an outcome that happens whether or not the action is done, made less harmful each time by the action.
    variables: [A, E]
    premises: ["happens_anyway(A,E)", "less_harmful_per_occurrence(A,E)"]
    assumptions: []
    exceptions: ["preventable_otherwise(A,E)", "no_net_reduction(A,E)"]
    conclusions: ["should_be_performed(A)"]
language:
  may_bring_about/2: "The action %s may bring about %s."
  may_be_worth_performing/2: "Action %s may be worth performing for the sake of %s."
  may_be_unwise_to_perform/2: "Action %s may be unwise to perform because of %s."
  matters_to_decision/2: "The chance that action %s brings about %s is large enough, given what that consequence would be, to bear on whether the action should be performed."
  too_slight/2: "In deciding on action %s, %s is too slight a consequence to count."
  gain_discounted_by_bearer/2: "In deciding on action %s, the gain %s counts for less because of whom it would go to."
  harm_discounted_by_bearer/2: "In deciding on action %s, the harm %s counts for less because of whom it would fall on."
  fails_to_avert/2: "Doing %s would fail to avert %s."
  worth_finding_out_first/2: "It is worth finding out first whether action %s would bring about %s, and until then that possibility should not count in deciding on the action: it can be found out in time, reliably enough to settle the question, at a cost and risk worth bearing."
  happens_anyway/2: "Whether or not %s is done, %s will happen."
  less_harmful_per_occurrence/2: "Doing %s would make each occurrence of %s less harmful."
  preventable_otherwise/2: "A course open to whoever would do %s could prevent %s."
  no_net_reduction/2: "Doing %s would not lower the harm that %s does overall."
links:
  - entry: "33.1"
    id: positive_consequences_modal
    match: partial
    reason: "WAG's modal variant (decision D008, 2026-11-25): the premise in the modal mood, as the book's questions allow (a consequence that will, may or must occur); the conclusion keeps the modality and names the consequence, where the book concludes that A should be brought about. It meets should_be_performed(A) only through bridge_from_possible_good."
    premise_map:
      - compendium_label: Premise
        note: "the good consequence is named G; 'will plausibly occur' becomes 'may occur'"
        walton: [{formula: "may_bring_about(A,G)", locus: premise}, {formula: "good(G)", locus: premise}]
    conclusion_map:
      note: "the book's 'A should be brought about', kept modal (D008); the bridge concludes should_be_performed(A)"
      walton: [{formula: "may_be_worth_performing(A,G)", locus: conclusion}]
    cq_map:
      - cq: CQ1
        note: "whether the possibility is real, not merely conceivable: the book's 'may'"
        walton: [{formula: "may_bring_about(A,G)", locus: premise}]
      - cq: CQ2
        note: "no separate evidence formula"
        walton: [{formula: "may_bring_about(A,G)", locus: premise}]
      - cq: CQ3
        note: "the sided exception bad_outweighs(A,G), shared with positive_consequences (D055)"
        walton: [{formula: "bad_outweighs(A,G)", locus: exception}]
  - entry: "33.2"
    id: negative_consequences_modal
    match: partial
    reason: "WAG's modal variant (decision D008, 2026-11-25): the premise in the modal mood, as the book's questions allow (a consequence that will, may or must occur); the conclusion keeps the modality and names the consequence, where the book concludes that A should not be brought about. It meets ¬should_be_performed(A) only through bridge_from_possible_harm."
    premise_map:
      - compendium_label: Premise
        note: "the bad consequence is named G; 'will occur' becomes 'may occur'"
        walton: [{formula: "may_bring_about(A,G)", locus: premise}, {formula: "bad(G)", locus: premise}]
    conclusion_map:
      note: "the book's 'A should not be brought about', kept modal (D008); the bridge concludes ¬should_be_performed(A)"
      walton: [{formula: "may_be_unwise_to_perform(A,G)", locus: conclusion}]
    cq_map:
      - cq: CQ1
        note: "whether the possibility is real, not merely conceivable: the book's 'may'"
        walton: [{formula: "may_bring_about(A,G)", locus: premise}]
      - cq: CQ2
        note: "no separate evidence formula"
        walton: [{formula: "may_bring_about(A,G)", locus: premise}]
      - cq: CQ3
        note: "the sided exception good_outweighs(A,G), shared with negative_consequences (D055)"
        walton: [{formula: "good_outweighs(A,G)", locus: exception}]
questions:
  positive_consequences:
    - {id: 33/CQ1, asks: "How likely is it that doing A would actually lead to G?", target: "brings_about(A,G)"}
    - {id: 33/CQ2, asks: "What evidence shows that doing A would lead to G, and is it strong enough for the confidence with which the claim is made?", target: "brings_about(A,G)"}
    - {id: 33/CQ3, asks: "Would doing A have bad consequences that matter more than G?", target: "bad_outweighs(A,G)"}
    - {id: walton/too_slight, asks: "Granted that doing A would bring about G and that G is good, is G too slight a gain to count in deciding on A? (A great gain is not slight, however few it reaches.)", target: "too_slight(A,G)"}
    - {id: walton/gain_discounted_by_bearer, asks: "Who would gain G, and does that make it count for less in deciding on A?", target: "gain_discounted_by_bearer(A,G)"}
  negative_consequences:
    - {id: 33/CQ1, asks: "How likely is it that doing A would actually lead to G?", target: "brings_about(A,G)"}
    - {id: 33/CQ2, asks: "What evidence shows that doing A would lead to G, and is it strong enough for the confidence with which the claim is made?", target: "brings_about(A,G)"}
    - {id: 33/CQ3, asks: "Would doing A have good consequences that matter more than G?", target: "good_outweighs(A,G)"}
    - {id: walton/too_slight, asks: "Granted that doing A would bring about G and that G is bad, is G too slight a harm to count in deciding on A? (A grave consequence is not slight, however few it reaches.)", target: "too_slight(A,G)"}
    - {id: walton/harm_discounted_by_bearer, asks: "On whom would G fall, and does that make it count for less in deciding on A?", target: "harm_discounted_by_bearer(A,G)"}
  negative_consequences_reasoning:
    - {id: 33/CQ1, asks: "How likely is it that bringing about A would lead to B?", target: "agent_bring_about(A,B)"}
    - {id: 33/CQ2, asks: "What evidence shows that bringing about A would lead to B, and is it strong enough for the claim?", target: "agent_bring_about(A,B)"}
    - {id: 33/CQ3, asks: "Would bringing about A have good consequences that matter more than B?", target: "good_outweighs(A,B)"}
  negative_consequences_prudential:
    - {id: 33/CQ1, asks: "How likely is it that C would follow if X is not done?", target: "strongly_occur(X,C)"}
    - {id: 33/CQ2, asks: "What evidence shows that C would follow if X is not done?", target: "bad_consequence(X,C)"}
    - {id: 33/CQ3, asks: "Would doing X have bad consequences that matter more than avoiding C?", target: "bad_outweighs(X,C)"}
    - {id: walton/fails_to_avert, asks: "Would doing X fail to avert C: would C follow even if X were done?", target: "fails_to_avert(X,C)"}
  positive_consequences_modal:
    - {id: 33/CQ1, asks: "Is there a real chance that doing A leads to G, or is it no more than conceivable?", target: "may_bring_about(A,G)"}
    - {id: 33/CQ2, asks: "What evidence shows that doing A could lead to G, and is it enough for a real possibility?", target: "may_bring_about(A,G)"}
    - {id: 33/CQ3, asks: "Would doing A have bad consequences that matter more than G?", target: "bad_outweighs(A,G)"}
    - {id: walton/too_slight, asks: "Granted that doing A could bring about G and that G is good, is G too slight a gain to count in deciding on A?", target: "too_slight(A,G)"}
    - {id: walton/gain_discounted_by_bearer, asks: "Who would gain G, and does that make it count for less in deciding on A?", target: "gain_discounted_by_bearer(A,G)"}
  negative_consequences_modal:
    - {id: 33/CQ1, asks: "Is there a real chance that doing A leads to G, or is it no more than conceivable?", target: "may_bring_about(A,G)"}
    - {id: 33/CQ2, asks: "What evidence shows that doing A could lead to G, and is it enough for a real possibility?", target: "may_bring_about(A,G)"}
    - {id: 33/CQ3, asks: "Would doing A have good consequences that matter more than G?", target: "good_outweighs(A,G)"}
    - {id: walton/too_slight, asks: "Granted that doing A could bring about G and that G is bad, is G too slight a harm to count in deciding on A?", target: "too_slight(A,G)"}
    - {id: walton/harm_discounted_by_bearer, asks: "On whom would G fall, and does that make it count for less in deciding on A?", target: "harm_discounted_by_bearer(A,G)"}
  bridge_from_possible_good:
    - {id: walton/worth_finding_out_first, asks: "Should the possibility that doing A brings about G be left out of the decision on A until it is found out: can it be found out in time, reliably enough to settle the question, at a cost and risk worth bearing? Which way?", target: "worth_finding_out_first(A,G)"}
  bridge_from_possible_harm:
    - {id: walton/worth_finding_out_first, asks: "Should the possibility that doing A brings about G be left out of the decision on A until it is found out: can it be found out in time, reliably enough to settle the question, at a cost and risk worth bearing? Which way?", target: "worth_finding_out_first(A,G)"}
  harm_reduction:
    - {id: walton/preventable_otherwise, asks: "Could E be prevented, rather than only made less harmful, by a course open to whoever would do A? Which course?", target: "preventable_otherwise(A,E)"}
    - {id: walton/no_net_reduction, asks: "Would the harm E does overall fall, or would something (E happening more often, for instance) offset the gain each time?", target: "no_net_reduction(A,E)"}
examples:
  - scheme: positive_consequences
    title: "A tax on meat would combat unhealthy meat consumption"
    kialo: "13292.115"
    use: argument
    text: "A tax on meat would combat unhealthy meat consumption."
    bindings:
      A: "governments putting a tax on meat"
      G: "less unhealthy meat consumption"
    attacks:
      - question: "33/CQ1"
        text: "Meat eaters in the countries that tried it bought cheaper cuts rather than less meat."
      - question: "walton/too_slight"
        text: "Most people already eat less meat than the guidelines' limit; the gain would be a small change in a few diets."
      - question: "walton/gain_discounted_by_bearer"
        text: "The gain would go to the heaviest eaters, who chose their diet and could change it without a tax."
    note: "Categorical: 'would combat' (the mood rule). The gold's coding."
  - scheme: positive_consequences
    title: "Free school lunches"
    invented: true
    use: argument
    text: "If the council paid for a hot lunch for every primary pupil, no child would start the afternoon hungry. The council should fund the lunches."
    bindings:
      A: "the council paying for a hot lunch for every primary pupil"
      G: "no primary pupil starting the afternoon hungry"
    attacks:
      - question: "33/CQ2"
        text: "The claim rests on one head teacher's impression; the district has no figures on afternoon hunger."
      - question: "33/CQ3"
        text: "The lunches would take the whole of next year's repairs budget, and leaking classrooms matter more (a weighing claim: bad_outweighs_good argues it)."
  - scheme: positive_consequences
    title: "Believing in free will (an appeal to consequences)"
    invented: true
    use: argument
    text: "Under the claim that free will exists: believing in free will makes people behave better, so believing in it is the thing to do."
    bindings:
      A: "people believing in free will"
      G: "people behaving better"
    note: "Coded by OC1: its conclusion is about an action (believing), so it meets nothing at the factual claim it is placed under. A reply that raises D074's objection undercuts this argument's inference (an undercutter of the specific argument, not an exception, as the owner refined D074 on 2026-11-25): 'How a belief makes people behave says nothing about whether it is true, and the discussion is whether free will exists.' (candidate C011; Kialo 2629.18670 and 2629.22816 raise it so). A legitimate argument about believing in free will, under a claim about whether to believe it, is not touched by that reply."
  - scheme: positive_consequences_modal
    title: "Sunday opening could bring in new readers (near miss)"
    invented: true
    use: near-miss
    near_miss_of: positive_consequences
    text: "Opening the library on Sundays could bring in new readers, so it may be worth doing."
    bindings:
      A: "the library opening on Sundays"
      G: "new readers coming to the library"
    note: "It looks like positive consequences, but 'could' claims the consequence only possible (the mood rule): positive_consequences_modal, whose premise and conclusion keep the modality. Coded categorically, the 'could' would fill brings_about(A,G), which it does not claim."
  - scheme: negative_consequences
    title: "A sin tax on meat would make food more expensive"
    kialo: "13292.7"
    use: argument
    text: "A sin tax on meat would make food more expensive, despite many people not being able to afford it."
    bindings:
      A: "governments putting a tax on meat"
      G: "food becoming more expensive for people who cannot afford it"
    attacks:
      - question: "walton/too_slight"
        text: "The added burden could be as small as changing what one eats (Kialo 13292.25): a real cost, but too slight to count against the tax."
      - question: "33/CQ3"
        text: "The health and climate gains of the tax matter more than a rise in food prices (good_outweighs_bad argues it)."
    note: "Categorical: 'would make'. 13292.25, coded today as a denial of bad(G), is recoded to the first attack's exception (OC9)."
  - scheme: negative_consequences
    title: "Closing the high street for the market"
    invented: true
    use: argument
    text: "Closing the high street for the Saturday market would delay deliveries to its shops, so the council should not close it."
    bindings:
      A: "the council closing the high street for the Saturday market"
      G: "deliveries to the high street's shops being delayed"
    attacks:
      - question: "33/CQ1"
        text: "The shops take their deliveries before eight, and the market opens at nine."
      - question: "33/CQ2"
        text: "No shop has said that a delivery was ever late on a market day."
      - question: "walton/harm_discounted_by_bearer"
        text: "The delays would fall on the shops that asked the council for the market, since it brings them customers."
  - scheme: negative_consequences
    title: "Believing that free will is an illusion (an appeal to consequences)"
    invented: true
    use: argument
    text: "Under the claim that free will is an illusion: believing that it is an illusion would make people give up trying, so no one should believe it."
    bindings:
      A: "people believing that free will is an illusion"
      G: "people giving up trying"
    note: "As Kialo 27150.12 replies to an argument from the risks of AGI offered on whether AGI is possible: whether we should do something has no bearing on whether it is so. A reply that raises D074's objection undercuts this argument's inference (an undercutter of the specific argument, not an exception, as the owner refined D074 on 2026-11-25): 'Whether a belief makes people give up is no evidence about whether it is true, and the discussion is whether free will is an illusion.'"
  - scheme: negative_consequences_modal
    title: "A congestion charge might drive shoppers away (near miss)"
    invented: true
    use: near-miss
    near_miss_of: negative_consequences
    text: "A congestion charge might drive shoppers to the out-of-town malls, so it may be unwise to bring one in."
    bindings:
      A: "the council bringing in a congestion charge"
      G: "shoppers going to the out-of-town malls instead"
    note: "It looks like negative consequences, but 'might' claims the consequence only possible (the mood rule): negative_consequences_modal. Coded categorically, the 'might' would fill brings_about(A,G), which it does not claim."
  - scheme: positive_consequences_modal
    title: "A four-day week might raise productivity"
    invented: true
    use: argument
    text: "Switching to a four-day week might raise our productivity, so it may be worth doing."
    bindings:
      A: "the firm switching to a four-day week"
      G: "higher productivity at the firm"
    attacks:
      - question: "33/CQ1"
        text: "The trials that reported gains were in firms whose work is done at desks; ours is shift work, where no gain has been seen."
      - question: "33/CQ2"
        text: "The claim cites one press release, not a trial's results."
      - question: "33/CQ3"
        text: "Clients would lose a weekday of service, and keeping them matters more than higher productivity."
      - question: "walton/too_slight"
        text: "Productivity is already the industry's best; whatever gain there could be would be too small to count."
      - question: "walton/gain_discounted_by_bearer"
        text: "The staff are deciding, and the gain would go to the owners' profits, not to them."
    note: "'Might': a possible consequence, and a conclusion that keeps the modality."
  - scheme: positive_consequences_modal
    title: "Believing in an afterlife might comfort the dying (an appeal to consequences)"
    invented: true
    use: argument
    text: "Under the claim that there is an afterlife: believing in one might comfort people as they die, so it may be worth believing in."
    bindings:
      A: "people believing in an afterlife"
      G: "people dying with comfort"
    note: "A reply that raises D074's objection undercuts this argument's inference (an undercutter of the specific argument, not an exception, as the owner refined D074 on 2026-11-25): 'Comfort is a reason to want an afterlife, not a reason to think there is one, and the discussion is whether there is.'"
  - scheme: positive_consequences
    title: "Eco-tariffs can solve this (near miss)"
    kialo: "13292.194"
    use: near-miss
    near_miss_of: positive_consequences_modal
    text: "Measures such as eco-tariffs and import-related policy can solve this issue. Imported meat would need to verifiably meet environmental and animal welfare standards and/or needs to pass a sufficiently high tax barrier."
    bindings:
      A: "governments taxing meat with safeguards against cheap imports"
      G: "domestic meat producers being protected from cheap imports"
    note: "'Can solve' says what the measures are able to do when they are taken, a capability, not that the result may or may not follow: categorical (the mood rule). The gold codes it as the amended action's positive consequences (action_amendment)."
  - scheme: negative_consequences_modal
    title: "Taxing meat might force producers to cut corners"
    kialo: "13292.174"
    use: argument
    text: "Taxing meat might force producers to use cheaper and more dangerous means of producing meat."
    bindings:
      A: "governments putting a tax on meat"
      G: "producers using cheaper and more dangerous means of producing meat"
    attacks:
      - question: "33/CQ1"
        text: "Food safety inspections already stop the dangerous methods, and a tax does not lift them: the possibility is not real."
      - question: "33/CQ3"
        text: "The tax's health and climate gains matter more than any change in how producers raise animals."
    note: "Its conclusion, that the tax may be unwise because of G, meets the thesis only through its bridge (the example 'Cutting corners, bridged')."
  - scheme: negative_consequences_modal
    title: "Taxing meat could cause an unhealthy underconsumption"
    kialo: "13292.121"
    use: argument
    text: "Taxing meat could also result in an unhealthy underconsumption of meat."
    bindings:
      A: "governments putting a tax on meat"
      G: "an unhealthy underconsumption of meat"
    attacks:
      - question: "33/CQ2"
        text: "Nobody in the countries with such taxes eats too little meat; the claim cites no case."
      - question: "walton/too_slight"
        text: "Eating less meat than one should harms health only mildly where iron and protein are easily had from other foods."
      - question: "walton/harm_discounted_by_bearer"
        text: "It would fall on people who choose to give up meat and can take supplements; a harm they choose counts for less."
    note: "'Could also result in': modal."
  - scheme: negative_consequences_modal
    title: "Teaching that the universe has no purpose (an appeal to consequences)"
    invented: true
    use: argument
    text: "Under the claim that the universe has no purpose: teaching it might drive students to despair, so it may be unwise to teach."
    bindings:
      A: "schools teaching that the universe has no purpose"
      G: "students falling into despair"
    note: "A reply that raises D074's objection undercuts this argument's inference (an undercutter of the specific argument, not an exception, as the owner refined D074 on 2026-11-25): 'Whether a view drives students to despair is no evidence about whether it is true, and the discussion is whether the universe has a purpose.'"
  - scheme: cause_to_effect_modal
    title: "If the tax were passed, prices would rise (near miss)"
    invented: true
    use: near-miss
    near_miss_of: negative_consequences_modal
    text: "If the tax were passed, meat prices would rise."
    bindings:
      E1: "governments passing a tax on meat"
      E2: "meat prices rising"
    note: "The cause is only proposed and the link is stated firmly ('would'): a causal step of a policy not yet enacted (guidelines §5 item 11), with no evaluation and no recommendation. Its modality is on the cause (may_occur), the modal consequence schemes' on the link (may_bring_about)."
  - scheme: bridge_from_possible_good
    title: "A four-day week, bridged"
    invented: true
    use: argument
    text: "Switching to a four-day week might raise our productivity, and even the chance of that matters for a firm our size, so we should switch."
    bindings:
      A: "the firm switching to a four-day week"
      G: "higher productivity at the firm"
    attacks:
      - question: "walton/worth_finding_out_first"
        text: "A three-month trial in one team would show cheaply, and in time, whether productivity rises before the whole firm commits."
      - question: "CQ:premise_acceptable"
        target: "matters_to_decision(A,G)"
        text: "One firm in twenty that tried it saw any gain, and a few per cent at that: a chance that small, for a gain that small, is no reason to switch."
    note: "It takes the conclusion of 'A four-day week might raise productivity' to the recommendation (D008). That the chance matters, given what the gain would be, is its arguer's to support (the challenge grants that the gain is possible); that it is worth settling the question first is the critic's."
  - scheme: bridge_from_possible_good
    title: "A night bus, bridged"
    invented: true
    use: argument
    text: "A night bus could get people home safely after the pubs close, and the chance of that matters to the town's choice, so the town should run one."
    bindings:
      A: "the town running a night bus"
      G: "people getting home safely after the pubs close"
    attacks:
      - question: "walton/worth_finding_out_first"
        text: "A summer pilot would show, at a small part of a year's cost, whether people ride it home before the town pays for a year."
    note: "A reply that only shows that a pilot could be run, at a cost the town could not bear, argues the exception without making it out: the bridge's defender answers that finding out first is not worth it."
  - scheme: practical_inference
    title: "A four-day week for a goal (near miss)"
    invented: true
    use: near-miss
    near_miss_of: bridge_from_possible_good
    text: "Higher productivity is one of the firm's goals, and switching to a four-day week is a means to it, so the firm should switch."
    bindings:
      A: "the firm switching to a four-day week"
      G: "higher productivity"
      P: "the firm"
    note: "It recommends the same action, but from a goal and a means, not from a possible consequence: practical inference (22.1), with its own questions."
  - scheme: bridge_from_possible_harm
    title: "Cutting corners, bridged"
    kialo: "13292.174"
    use: argument
    text: "Taxing meat might force producers to use cheaper and more dangerous means of producing meat."
    bindings:
      A: "governments putting a tax on meat"
      G: "producers using cheaper and more dangerous means of producing meat"
    attacks:
      - question: "walton/worth_finding_out_first"
        text: "A tax in one region first would show, in time and with little harm, whether producers there cut corners before a national tax is decided."
      - question: "CQ:premise_acceptable"
        target: "matters_to_decision(A,G)"
        text: "Where meat was taxed, one producer in a hundred cut corners: a chance that small should not decide a national tax."
    note: "The gold's coding after the recode: the bridge is the claim's primary instance, whose conclusion meets 13292.108's; the modal argument is its secondary instance; that the possibility matters is supplied, since the claim offers it as a reason against the tax."
  - scheme: bridge_from_possible_harm
    title: "Lost tax revenue, bridged"
    kialo: "13292.9"
    use: argument
    text: "A tax on meat could actually reduce tax revenues by harming the trillion-dollar meat industry, which pays substantial taxes."
    bindings:
      A: "governments putting a tax on meat"
      G: "tax revenues falling"
    attacks:
      - question: "walton/worth_finding_out_first"
        text: "The treasury can model the revenue effect from the industry's tax returns, quickly and at no real cost, before the rate is set."
    note: "'Could actually': modal; the gold's coding after the recode, as the example before."
  - scheme: negative_practical
    title: "The old bridge and the lorry (near miss)"
    invented: true
    use: near-miss
    near_miss_of: bridge_from_possible_harm
    text: "We do not know whether the old bridge can bear the lorry. If we act as if it can and it cannot, the lorry and its driver fall into the river; if we act as if it cannot and it can, we lose an hour going round. So we act on the presumption that it cannot."
    bindings:
      A: "the old bridge can bear the lorry"
      B: "the lorry and its driver falling into the river"
      C: "losing an hour going round"
    note: "It acts on a possibility too, but under ignorance of a fact, by comparing what follows from each presumption: negative practical reasoning (26.2), a kind of argument from ignorance. The bridge takes a possible consequence of an action to the decision whether to do it."
  - scheme: negative_consequences_reasoning
    title: "The night shift"
    invented: true
    use: argument
    text: "If I take the night shift, I will miss my children's evenings, which would harm what I most want for my life, so I should not take it."
    bindings:
      A: "my taking the night shift"
      B: "my missing my children's evenings"
    attacks:
      - question: "33/CQ1"
        text: "The night shift is three nights a week; you would still have four evenings with them."
      - question: "33/CQ3"
        text: "The extra pay would let you stop working years sooner, which matters more to your time with them."
  - scheme: negative_consequences_reasoning
    title: "Accepting that the universe has no purpose (an appeal to consequences)"
    invented: true
    use: argument
    text: "Under the claim that the universe has no purpose: if I accept it, my life's work will seem pointless to me, which would harm my goals, so I should not accept it."
    bindings:
      A: "my accepting that the universe has no purpose"
      B: "my life's work seeming pointless to me"
    attacks:
      - question: "33/CQ2"
        text: "Nothing shows that people who accept it find their work pointless; many find it more their own."
    note: "A reply that raises D074's objection undercuts this argument's inference (an undercutter of the specific argument, not an exception, as the owner refined D074 on 2026-11-25): 'How accepting it would make you feel is no evidence about whether the universe has a purpose.'"
  - scheme: negative_consequences
    title: "Closing the plant (near miss)"
    invented: true
    use: near-miss
    near_miss_of: negative_consequences_reasoning
    text: "Closing the plant would put four hundred people out of work, so the company should not close it."
    bindings:
      A: "the company closing the plant"
      G: "four hundred people losing their jobs"
    note: "The harm falls on others, not on the goals of the one who acts: negative consequences (33.2), not reasoning from negative consequences (33.3)."
  - scheme: negative_consequences_prudential
    title: "The hospital trust's levy"
    invented: true
    use: argument
    text: "If you do not raise the levy this year, the hospital trust will run out of cash by spring, which would be very bad for you. You should raise it."
    bindings:
      X: "the board raising the levy this year"
      C: "the hospital trust running out of cash by spring"
    attacks:
      - question: "walton/fails_to_avert"
        text: "The levy would bring in too little, too late: the trust runs out of cash in March, and the first payments arrive in June."
      - question: "33/CQ1"
        text: "The trust's reserves and its overdraft would carry it to the summer even without the levy."
      - question: "33/CQ2"
        text: "The forecast of running out of cash is the finance director's guess, not the auditors' figure."
      - question: "33/CQ3"
        text: "Raising the levy would drive the trust's best surgeons to the next county, which matters more than a cash crisis the bank would cover."
  - scheme: negative_consequences_prudential
    title: "Insuring the harvest"
    invented: true
    use: argument
    text: "If you do not insure this year's harvest, a hailstorm like last year's, which the forecasters expect, will ruin you. Insure it."
    bindings:
      X: "the farmer insuring this year's harvest"
      C: "the farmer being ruined by a hailstorm"
    attacks:
      - question: "walton/fails_to_avert"
        text: "The policy pays out only after the season ends, by which time the bank will have called in your loan."
      - question: "CQ:premise_acceptable"
        target: "not_doing(X)"
        text: "You have already applied for the policy; nobody is considering going without it."
  - scheme: negative_consequences_prudential
    title: "Keeping a belief in an afterlife (an appeal to consequences)"
    invented: true
    use: argument
    text: "Under the claim that there is an afterlife: you were thinking of giving up your belief in one. If you do, you will face death without hope, and that would be terrible for you. So keep believing."
    bindings:
      X: "keeping your belief in an afterlife"
      C: "your facing death without hope"
    note: "A reply that raises D074's objection undercuts this argument's inference (an undercutter of the specific argument, not an exception, as the owner refined D074 on 2026-11-25): 'Hope is a reason to want an afterlife, not evidence that there is one, and the discussion is whether there is.'"
  - scheme: positive_consequences
    title: "A harm of not acting that falls on others (near miss)"
    invented: true
    use: near-miss
    near_miss_of: negative_consequences_prudential
    text: "If the council does not fund the shelter, people in abusive relationships will have nowhere to go."
    bindings:
      A: "the council funding the shelter"
      G: "people in abusive relationships having somewhere to go"
    note: "The harm falls on others, not on the one who acts: positive consequences of the action, with the harm's not happening as G (OC13). Whether funding the shelter would give them somewhere to go is its causal premise, whose status and note record whether that is explicit, implicit or unknown, and a reply against it whether it is disputed (D069)."
  - scheme: harm_reduction
    title: "Pill testing at festivals"
    invented: true
    use: argument
    text: "People will take drugs at the festival whether or not it offers pill testing. Free pill testing would make each time less dangerous. The festival should offer it."
    bindings:
      A: "the festival offering free pill testing"
      E: "people taking drugs at the festival"
    attacks:
      - question: "walton/preventable_otherwise"
        text: "Searches at the gate would stop most of the drugs coming in: the festival can prevent the drug taking, not only make it safer."
      - question: "walton/no_net_reduction"
        text: "A clean test tells people a pill is safe, so more of them would take one, and the harm overall would grow."
      - question: "CQ:premise_acceptable"
        target: "less_harmful_per_occurrence(A,E)"
        text: "The tests miss the most dangerous adulterants, so they make no occasion safer."
  - scheme: harm_reduction
    title: "Teaching safe drinking limits"
    invented: true
    use: argument
    text: "Teenagers will drink at parties whether or not schools teach them safe limits. Teaching the limits would make each time less harmful, so schools should teach them."
    bindings:
      A: "schools teaching teenagers safe drinking limits"
      E: "teenagers drinking at parties"
    attacks:
      - question: "CQ:premise_acceptable"
        target: "happens_anyway(A,E)"
        text: "These parties are supervised by parents and dry: the teenagers do not drink at them, lessons or no lessons."
      - question: "walton/no_net_reduction"
        text: "Talk of 'safe limits' tells them that drinking is expected; more of them would start, and the harm overall would grow."
  - scheme: positive_consequences
    title: "A free school lunch (near miss)"
    invented: true
    use: near-miss
    near_miss_of: harm_reduction
    text: "If the council paid for a hot lunch for every primary pupil, no child would start the afternoon hungry."
    bindings:
      A: "the council paying for a hot lunch for every primary pupil"
      G: "no primary pupil starting the afternoon hungry"
    note: "Hunger is not an outcome that happens whether or not the lunch is paid for: the lunch prevents it. That is positive consequences of the lunch, with the hunger's not happening as G."
