        conclusion: {formula: 'should_be_performed(tax_meat_with_food_support)'}
      role: {kind: action_amendment, cq: null, polarity: against}
      target: {actual: {claim: '13292.36', part: conclusion}}
    why: >-
      A safeguard the agent would add to the policy argues for the amended
      policy, at the conclusion of the argument that cites the harm (D066), as
      in OC6-b. It does not say that anything in the case as proposed keeps the
      higher food costs from lessening food security, so it is no answer at that
      causal step's exception,
      interference(food_production_costs_increased,food_security_decreased)
      (guidelines §5 item 11; D071, D097). A factor that would come with the
      cause itself, such as iron supplements against anemia from eating less
      meat (13292.182 at 13292.180#2), is such an answer.

  - id: OC8-a
