        - {role: exception, formula: 'harm_discounted_by_bearer(tax_meat,jobs_lost)'}
        conclusion: {formula: '¬should_be_performed(tax_meat)'}
      role: {kind: cq_answer, cq: 'CQ:bad_outweighs', polarity: against}
