      role: {kind: cq_answer, cq: 'CQ:likelihood', polarity: against}
    why: >-
      An action that cannot be done brings nothing about, so the claim answers
      the likelihood question at brings_about(A,G) (33/CQ1; the game's
      CQ:likelihood), not an exception (C018, D066). A claim that the tax would
      be hard or costly to collect would be a further bad consequence (OC2), as
      in OC6-a.

  - id: OC6-d
    rules: [OC6]
    kialo: "13292.24"
    outside_batch: true
    claim: Governments could give tax credits or food stamps to those who could no longer afford food because of the tax.
    target: 13292.36, a negative consequence of the tax (less food security), whose causal step runs from higher food costs to less food security
    coding:
      instances:
      - primary: true
        scheme: {walton_id: positive_consequences, fit: reconstructed}
        bindings: {A: tax_meat_with_food_support, G: food_security_kept}
