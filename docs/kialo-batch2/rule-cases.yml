# Worked cases for guidelines.md §3.1 (opposite consequences and weighing,
# decisions D055 and D059, 2026-10-23), with their codings.
#
# Each case names the rules it shows (OC1-OC14), the Kialo claim (or none,
# for a constructed case), a short paraphrase in our own words, its target,
# its coding in the gold's format (instances, role, and the target as
# target.actual), and why.
# A test (wag/internal/annotate, TestRuleCases) checks that:
#   - every rule of §3.1 has a case, and every case names rules of §3.1;
#   - every coding follows walton.yml (the gold's own checker);
#   - a case that is a claim of batch 2 is coded as gold.json codes it;
#   - no retired wording (below) appears in the guidelines, these cases,
#     the catalogue's entries or the candidates registry.
#
# Not given to annotators: some cases are claims of batch 2.

retired:
  # Wording that stated an earlier version of a rule. When a rule changes,
  # its old wording goes here, so that no copy of it survives.
  - phrase: the action it allows
    now: the action that grants or secures the right (OC13)
    why: final check of D055-D059 v5, warning 3 (example 6's note)
  - phrase: to the agent or the addressee
    now: the one who acts (OC13)
    why: fourth review of D055-D059, error (example 16's note)
  - phrase: otherwise bind A to the omission
    now: never bind A to the omission (OC13)
    why: final check of D055-D059 v5, warning 5 (33.3's catalogue entry)
  - phrase: harm of not doing A is the prudential form
    now: a harm of not doing A that falls on the one who acts (OC13)
    why: second review of D055-D059, error (every harm of not acting sent to 33.4)
  - phrase: set by a claim's conclusion
    now: what the claim does at its actual target decides (OC1)
    why: final check of D055-D059 v5, warning 1
  - phrase: is a weighing, with the harm of not acting phrased as a good state
    now: the harm of not acting counts as a good consequence of A, and the weighing takes the A and G of the argument it answers (OC6)
    why: final check of D055-D059 v5, warning 2 (it put the wrong consequence in the exception)

cases:
  - id: OC1-a
    rules: [OC1]
    kialo: "27150.9"
    claim: Pursuing AGI is folly, a waste of resources given risks no one can see beyond.
    target: 27150.1, the thesis that AGI is possible
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'agi_risks_unforeseeable'}
        - {role: premise, formula: 'pursuing_agi_wastes_resources'}
        conclusion: {formula: '¬agi_possible'}
      role: {kind: independent_con, cq: null, polarity: against}
      target: {actual: {claim: '27150.1', part: conclusion}}
    why: >-
      It is offered as a reason that its target, a claim about what is the
      case, is false, so it is not coded with a consequence scheme, though it
      argues from what pursuing AGI would cost.
      Coded with negative consequences, its conclusion (that AGI should not be
      pursued) would meet nothing at its target. Its reply 27150.12 (whether we
      should is irrelevant to whether we can) is the objection candidate C011
      names.

  - id: OC1-b
    rules: [OC1]
    kialo: "2629.22855"
    claim: Religion brings psychological and social benefits, so believing in God makes pragmatic sense.
    target: 2629.9032, that psychological and sociological explanations put the authenticity of religious experience in question
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'religion_has_psychosocial_benefits'}
        conclusion: {formula: '¬explanations_question_religious_experience'}
      role: {kind: rebuttal, cq: null, polarity: against}
      target: {actual: {claim: '2629.9032', part: conclusion}}
    why: >-
      The claim's own conclusion is practical (believing makes sense), but it
      is offered against a claim about what is the case, as a reason that the
      claim is false: other, naming C011.

  - id: OC1-d
    rules: [OC1]
    kialo: "13292.145"
    claim: Tax meat and use some of the revenue to fund research into synthetic meat.
    target: 13292.13, that a meat tax would not resolve the problems of meat production and consumption
    coding:
      instances:
      - primary: true
        scheme: {walton_id: positive_consequences, fit: reconstructed}
        bindings: {A: tax_meat_and_fund_synthetic_meat_research, G: synthetic_meat_development_advanced}
        premises:
        - {role: premise, formula: 'brings_about(tax_meat_and_fund_synthetic_meat_research,synthetic_meat_development_advanced)'}
        - {role: premise, formula: 'good(synthetic_meat_development_advanced)'}
        - {role: exception, formula: 'bad_outweighs(tax_meat_and_fund_synthetic_meat_research,synthetic_meat_development_advanced)'}
        conclusion: {formula: 'should_be_performed(tax_meat_and_fund_synthetic_meat_research)'}
      role: {kind: action_amendment, cq: null, polarity: against}
      target: {actual: {claim: '13292.13', part: conclusion}}
    why: >-
      Its target says what is the case (the tax's efficacy), but the claim
      does not argue that it is false: it proposes a changed action, so it is
      coded with positive consequences, as an amendment. Contrast OC1-a,
      which is offered as a reason that its target is false.

  - id: OC1-c
    rules: [OC1]
    kialo: "13292.174"
    claim: Taxing meat might push producers to cheaper and more dangerous ways of producing it.
    target: 13292.108, value-based practical reasoning for the tax
    coding:
      instances:
      - primary: true
        scheme: {walton_id: negative_consequences, fit: reconstructed}
        bindings: {A: tax_meat, G: more_dangerous_meat_production}
        premises:
        - {role: premise, formula: 'brings_about(tax_meat,more_dangerous_meat_production)'}
        - {role: premise, formula: 'bad(more_dangerous_meat_production)'}
        - {role: exception, formula: 'good_outweighs(tax_meat,more_dangerous_meat_production)'}
        conclusion: {formula: '¬should_be_performed(tax_meat)'}
      role: {kind: cq_answer, cq: 'CQ:side_effect', polarity: against}
      target: {actual: {claim: '13292.108', part: exception, formula: 'side_effects(tax_meat,meat_production_and_consumption_harm_environment)'}}
    why: >-
      A further bad consequence offered against practical reasoning answers its
      side-effects question, at side_effects(A,S1), not a consequence
      scheme's exception (D070).

  - id: OC2-a
    rules: [OC2]
    kialo: "13292.121"
    claim: Taxing meat could also lead people to eat too little meat, which is unhealthy.
    target: 13292.115, positive consequences of the tax (less unhealthy meat consumption)
    coding:
      instances:
      - primary: true
        scheme: {walton_id: negative_consequences, fit: reconstructed}
        bindings: {A: tax_meat, G: unhealthy_meat_underconsumption}
        premises:
        - {role: premise, formula: 'brings_about(tax_meat,unhealthy_meat_underconsumption)'}
        - {role: premise, formula: 'bad(unhealthy_meat_underconsumption)'}
        - {role: exception, formula: 'good_outweighs(tax_meat,unhealthy_meat_underconsumption)'}
        conclusion: {formula: '¬should_be_performed(tax_meat)'}
      role: {kind: side_effect, cq: null, polarity: against}
      target: {actual: {claim: '13292.115', part: conclusion}}
    why: >-
      A further bad consequence with no ranking against the health gain that
      13292.115 cites: negative consequences, at that argument's conclusion,
      not its exception.

  - id: OC3-a
    rules: [OC3, OC6]
    kialo: "5637.188"
    claim: Men may suffer emotional harm when a partner chooses abortion, but women forced to carry to term suffer emotional and physical harm.
    target: 5637.104, negative consequences of access to abortion (men's emotional harm)
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'brings_about(access_to_abortion,women_spared_harms_of_forced_pregnancy)'}
        - {role: premise, formula: 'graver_harm(harms_of_forced_pregnancy,men_emotional_harm_from_abortion)'}
        conclusion: {formula: 'good_outweighs(access_to_abortion,men_emotional_harm_from_abortion)'}
      role: {kind: cq_answer, cq: '33.2 CQ3', polarity: against}
      target: {actual: {claim: '5637.104', part: exception, formula: 'good_outweighs(access_to_abortion,men_emotional_harm_from_abortion)'}}
    why: >-
      It ranks without any cue word: both kinds of harm against one kind. The
      women's harms are a harm of not acting, so they count as a good
      consequence of access (OC6), and the weighing takes 5637.104's own A and
      G, the men's harm, as the exception names it (OC4).

  - id: OC3-b
    rules: [OC3, OC5]
    kialo: "5637.2792"
    claim: Pain is subjective, so it is wrong to decide for someone else that their life is not worth living.
    target: 5637.3246, that letting parents choose for a child with a fatal or severely limiting defect is not wrong
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'pain_is_subjective'}
        - {role: premise, formula: 'judging_anothers_life_unworthy_is_wrong'}
        conclusion: {formula: '¬choosing_for_the_child_permissible'}
      role: {kind: rebuttal, cq: null, polarity: against}
      target: {actual: {claim: '5637.3246', part: conclusion}}
    why: >-
      "Not worth living" is a cue word that ranks nothing: no consequence is
      set against another. The claim states a principle against the target
      (C007), not a weighing.

  - id: OC4-a
    rules: [OC4, OC7, OC8]
    kialo: "13292.127"
    claim: Starvation from less access to meat is a worse threat than any harm of eating much meat.
    target: 13292.115, positive consequences of the tax; its Kialo parent is 13292.7
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'brings_about(tax_meat,starvation_from_reduced_meat_access)'}
        - {role: premise, formula: 'brings_about(tax_meat,reduced_unhealthy_meat_consumption)'}
        - {role: premise, formula: 'more_serious_consequences(starvation_from_reduced_meat_access,harms_of_high_meat_consumption)'}
        conclusion: {formula: 'bad_outweighs(tax_meat,reduced_unhealthy_meat_consumption)'}
      - primary: false
        scheme: {walton_id: negative_consequences, fit: reconstructed}
        bindings: {A: tax_meat, G: starvation_from_reduced_meat_access}
        premises:
        - {role: premise, formula: 'brings_about(tax_meat,starvation_from_reduced_meat_access)'}
        - {role: premise, formula: 'bad(starvation_from_reduced_meat_access)'}
        - {role: exception, formula: 'good_outweighs(tax_meat,starvation_from_reduced_meat_access)'}
        conclusion: {formula: '¬should_be_performed(tax_meat)'}
      role: {kind: cq_answer, cq: '33.1 CQ3', polarity: against}
      target: {actual: {claim: '13292.115', part: exception, formula: 'bad_outweighs(tax_meat,reduced_unhealthy_meat_consumption)'}}
    why: >-
      A ranking against a class (any harm of eating much meat): its Kialo
      parent, 13292.7, is not in the class, so it weighs against the earliest
      argument of the class on the board, 13292.115, re-parented (OC4, OC7).
      The words state the comparison, so the weighing is primary and the
      starvation consequence secondary (OC8).

  - id: OC4-b
    rules: [OC4, OC5]
    kialo: "13292.43"
    claim: Revenue is not why the tax is wanted; sustainability and animal welfare press harder.
    target: 13292.9, negative consequences of the tax (lost tax revenue)
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'brings_about(tax_meat,sustainability_and_animal_welfare)'}
        - {role: premise, formula: 'more_pressing(sustainability_and_animal_welfare,tax_revenue_reduced)'}
        conclusion: {formula: 'good_outweighs(tax_meat,tax_revenue_reduced)'}
      role: {kind: cq_answer, cq: '33.2 CQ3', polarity: against}
      target: {actual: {claim: '13292.9', part: exception, formula: 'good_outweighs(tax_meat,tax_revenue_reduced)'}}
    why: >-
      It ranks ("more pressing"), and the values it names are things the tax
      would promote, so they count as consequences (OC5). Its Kialo parent
      cites the outweighed consequence, so it is not re-parented.

  - id: OC5-a
    rules: [OC5]
    kialo: "5637.11001"
    claim: One person's emotional harm does not justify controlling another person's actions, least of all by invading their privacy.
    target: 5637.104, negative consequences of access to abortion (men's emotional harm)
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'emotional_harm_cannot_justify_control_of_another'}
        conclusion: {formula: 'undercut(men_emotional_harm_argument)'}
      role: {kind: undercutter, cq: null, polarity: against}
      target: {actual: {claim: '5637.104', part: inference}}
    why: >-
      A right set against the consequence whatever its size: not the
      exception, which weighs one consequence against another. Other, naming
      C007.

  - id: OC5-b
    rules: [OC5]
    kialo: "5637.13330"
    claim: Wars fought for freedom show that people commonly hold liberty to be worth more than life.
    target: 5637.11390, that the right to life should trump the right to bodily autonomy
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'liberty_commonly_held_worth_more_than_life'}
        conclusion: {formula: '¬right_to_life_trumps_bodily_autonomy'}
      role: {kind: rebuttal, cq: null, polarity: against}
      target: {actual: {claim: '5637.11390', part: conclusion}}
    why: >-
      Two values ranked, with no consequence of an action named: not a
      weighing of consequences (C007).

  - id: OC6-a
    rules: [OC6, OC2]
    kialo: "13292.149"
    claim: Carbon-budget rationing would be harder to run than a plain meat tax and would likely cost more than it brings in.
    target: 13292.147, positive consequences of rationing meat through personal carbon budgets
    coding:
      instances:
      - primary: true
        scheme: {walton_id: negative_consequences, fit: reconstructed}
        bindings: {A: ration_meat_via_carbon_budgets, G: rationing_costs_more_than_it_raises}
        premises:
        - {role: premise, formula: 'brings_about(ration_meat_via_carbon_budgets,rationing_costs_more_than_it_raises)'}
        - {role: premise, formula: 'bad(rationing_costs_more_than_it_raises)'}
        - {role: exception, formula: 'good_outweighs(ration_meat_via_carbon_budgets,rationing_costs_more_than_it_raises)'}
        conclusion: {formula: '¬should_be_performed(ration_meat_via_carbon_budgets)'}
      - primary: false
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'harder_to_implement(ration_meat_via_carbon_budgets,tax_meat)'}
        conclusion: {formula: 'better_course(tax_meat,ration_meat_via_carbon_budgets)'}
      role: {kind: rebuttal, cq: null, polarity: against}
      target: {actual: {claim: '13292.147', part: conclusion}}
    why: >-
      Comparing rationing with a plain tax compares two courses: other, naming
      C017 and C018, not the exception. Its cost clause sets the scheme's
      costs against its revenue, not against the emission cuts 13292.147
      cites, so it is a further bad consequence of rationing, a rebuttal (OC2),
      not a balance claim (OC14). The rebuttal reaches the target's
      conclusion, so it is primary (§5 item 5).

  - id: OC9-a
    rules: [OC9]
    kialo: "13292.25"
    claim: The extra burden could be no more than a change of diet.
    target: 13292.7, negative consequences of the tax (food less affordable for the poor)
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'brings_about(tax_meat,food_less_affordable_for_poor)'}
        - {role: premise, formula: 'means_to_end(change_food_consumption_pattern,avoid_meat_tax_burden)'}
        - {role: premise, formula: 'easy_to_achieve(change_food_consumption_pattern)'}
        conclusion: {formula: '¬bad(food_less_affordable_for_poor)'}
      role: {kind: premise_attack, cq: null, polarity: against}
      target: {actual: {claim: '13292.7', part: premise, formula: 'bad(food_less_affordable_for_poor)'}}
    why: >-
      It makes the cited harm small and names no rival consequence, so it
      attacks bad(G), not the exception (C005). No question targets bad(G), so
      it is a premise attack (R2).

  - id: OC10-a
    rules: [OC10]
    kialo: "13292.204"
    claim: Where people would starve from dearer food, they rarely eat meat; their diets are maize, flour or rice.
    target: 13292.127, the weighing claim; its starvation premise
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'at_risk_people_eat_little_meat'}
        - {role: premise, formula: 'at_risk_diets_are_staples'}
        - {role: premise, formula: 'meat_tax_leaves_staple_prices'}
        conclusion: {formula: '¬brings_about(tax_meat,starvation_from_reduced_meat_access)'}
      role: {kind: premise_attack, cq: null, polarity: against}
      target: {actual: {claim: '13292.127', part: premise, formula: 'brings_about(tax_meat,starvation_from_reduced_meat_access)'}}
    why: >-
      A reply to a weighing claim attacks the consequence the weighing relies
      on, a premise of its other instance, which no question covers: a premise
      attack, not an argument that nothing outweighs the health gain.

  - id: OC11-a
    rules: [OC11]
    claim: (constructed) A congestion charge would give the city cleaner air and fewer accidents. A reply says the shops it would close matter more than fewer accidents.
    target: the thesis that the city should bring in a congestion charge
    coding:
      instances:
      - primary: true
        scheme: {walton_id: positive_consequences, fit: explicit}
        bindings: {A: congestion_charge, G: cleaner_air}
        premises:
        - {role: premise, formula: 'brings_about(congestion_charge,cleaner_air)'}
        - {role: premise, formula: 'good(cleaner_air)'}
        - {role: exception, formula: 'bad_outweighs(congestion_charge,cleaner_air)'}
        conclusion: {formula: 'should_be_performed(congestion_charge)'}
      - primary: false
        scheme: {walton_id: positive_consequences, fit: explicit}
        bindings: {A: congestion_charge, G: fewer_accidents}
        premises:
        - {role: premise, formula: 'brings_about(congestion_charge,fewer_accidents)'}
        - {role: premise, formula: 'good(fewer_accidents)'}
        - {role: exception, formula: 'bad_outweighs(congestion_charge,fewer_accidents)'}
        conclusion: {formula: 'should_be_performed(congestion_charge)'}
      role: {kind: independent_pro, cq: null, polarity: for}
    why: >-
      The reply weighs only one of the two consequences, so each has its own
      argument, and the reply argues bad_outweighs(congestion_charge,
      fewer_accidents), leaving the clean-air argument standing.

  - id: OC12-a
    rules: [OC12]
    claim: (constructed) Fixing the roof now keeps the attic dry; if it is not fixed, the attic floods.
    target: the thesis that the roof should be fixed now
    coding:
      instances:
      - primary: true
        scheme: {walton_id: positive_consequences, fit: explicit}
        bindings: {A: fix_roof_now, G: attic_staying_dry}
        premises:
        - {role: premise, formula: 'brings_about(fix_roof_now,attic_staying_dry)'}
        - {role: premise, formula: 'good(attic_staying_dry)'}
        - {role: exception, formula: 'bad_outweighs(fix_roof_now,attic_staying_dry)'}
        conclusion: {formula: 'should_be_performed(fix_roof_now)'}
      role: {kind: independent_pro, cq: null, polarity: for}
    why: >-
      One consideration, a gain and the same harm averted: coded once. Coded
      also with the prudential form, it would have another exception, and a
      weighing claim would reach only one of the two.

  - id: OC13-a
    rules: [OC13]
    kialo: "5637.1866"
    claim: People in abusive relationships are likely to stay tied to their abusers when they cannot end a pregnancy.
    target: 5637.1, that pregnant people should have the right to choose abortion
    coding:
      instances:
      - primary: true
        scheme: {walton_id: positive_consequences, fit: reconstructed}
        bindings: {A: access_to_abortion, G: abuse_victims_able_to_leave}
        premises:
        - {role: premise, formula: 'brings_about(access_to_abortion,abuse_victims_able_to_leave)'}
        - {role: premise, formula: 'good(abuse_victims_able_to_leave)'}
        - {role: exception, formula: 'bad_outweighs(access_to_abortion,abuse_victims_able_to_leave)'}
        conclusion: {formula: 'should_be_performed(access_to_abortion)'}
      role: {kind: independent_pro, cq: null, polarity: for}
      target: {actual: {claim: '5637.1', part: conclusion}}
    why: >-
      The thesis states a right, so A is the action that grants or secures it,
      access to abortion services. The harm of not having access falls on
      people other than the one who acts, so it is positive consequences of
      access, with G the harm's not happening, phrased as a good state. Its
      reply 5637.12239 says outright that a bad consequence of access may
      outweigh this one: bad_outweighs, by OC4.

  - id: OC13-b
    rules: [OC13]
    claim: (constructed) You were going to let your passport lapse; if you do not renew it, you cannot fly to your sister's wedding in May, which would be very bad for you; so renew it.
    target: the advice to renew the passport
    coding:
      instances:
      - primary: true
        scheme: {walton_id: negative_consequences_prudential, fit: explicit}
        bindings: {X: renew_passport, C: miss_sisters_wedding}
        premises:
        - {role: premise, formula: 'not_doing(renew_passport)'}
        - {role: premise, formula: 'bad_consequence(renew_passport,miss_sisters_wedding)'}
        - {role: assumption, formula: 'strongly_occur(renew_passport,miss_sisters_wedding)'}
        - {role: exception, formula: 'bad_outweighs(renew_passport,miss_sisters_wedding)'}
        conclusion: {formula: 'should_be_performed(renew_passport)'}
      role: {kind: independent_pro, cq: null, polarity: for}
    why: >-
      The harm of not acting falls on the one who acts, the reader addressed as
      "you": the prudential form for renewing, not reasoning from negative
      consequences with A bound to letting the passport lapse, whose
      conclusion would meet nothing about renewing it (D027).

  - id: OC14-a
    rules: [OC14, OC7]
    claim: (constructed) Against "a four-day week would leave staff more rested, so the firm should try it" - all told, the costs of a four-day week to the firm outweigh its benefits.
    target: the positive consequences argument for trying a four-day week
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'four_day_week_costs_exceed_benefits'}
        conclusion: {formula: 'bad_outweighs(try_four_day_week,staff_more_rested)'}
      role: {kind: cq_answer, cq: '33.1 CQ3', polarity: against}
    why: >-
      A balance claim names no single consequence, so it weighs against every
      positive argument about the four-day week on the board, one instance
      each; one proof leaves the others standing (C004). Under the gold's one
      target, one instance, against the argument it replies to.
