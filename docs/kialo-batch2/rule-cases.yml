        - {role: premise, formula: 'easy_to_achieve(change_food_consumption_pattern)'}
        conclusion: {formula: 'too_slight(tax_meat,food_less_affordable_for_poor)'}
      role: {kind: cq_answer, cq: 'CQ:too_slight', polarity: against}
