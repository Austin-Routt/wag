        conclusion: {formula: '¬matters_to_decision(tax_meat,butchers_close)'}
      role: {kind: premise_attack, cq: null, polarity: against}
    why: >-
      It grants the possibility and denies that its chance, given what the loss
      would be, bears on the decision: the bridge's premise
      matters_to_decision(A,G), a premise attack (no question targets it). A
      denial that the possibility is real would answer 33.2 CQ1 at the modal
      instance (OC15-a), and one that the loss is slight, whatever its chance,
      would argue too_slight(A,G) (OC9).

  - id: OC15-c
    rules: [OC15]
    claim: (constructed) Against "the tax might send shoppers across the border for meat, so it should not be introduced" - a year's trial in two regions would show, in time and at little cost, whether it does, before the tax must be decided.
    target: the bridge of that possible bad consequence; its exception
    coding:
      instances:
      - primary: true
        scheme: {walton_id: finding_out_first, fit: explicit}
        bindings: {A: tax_meat, G: meat_bought_across_border, I: regional_trial}
        premises:
        - {role: premise, formula: 'settles_whether(regional_trial,tax_meat,meat_bought_across_border)'}
        - {role: premise, formula: 'done_in_time(regional_trial,tax_meat)'}
        - {role: premise, formula: 'worth_its_costs(regional_trial,tax_meat,meat_bought_across_border)'}
        conclusion: {formula: 'worth_finding_out_first(tax_meat,meat_bought_across_border)'}
      role: {kind: cq_answer, cq: 'CQ:worth_finding_out_first', polarity: against}
    why: >-
      It names the investigation, a year's trial in two regions, and makes out
      the three conditions: the trial would show whether the tax sends shoppers
      across the border, in time, before the tax must be decided, and at little
      cost. So it is an argument of finding_out_first (D095), concluding the
      bridge's exception worth_finding_out_first(A,G): the answer to the game's
      CQ:worth_finding_out_first (R2). It grants
      the possibility and what it would weigh: the bridge falls, the modal
      argument stands. A reply that showed only that a study could be done, at
      a cost or a delay the decision cannot bear, would argue the exception
      without making it out, coded with other (OC15-g); this one is answered at
      the premise its critic denies (OC15-f).

  - id: OC15-d
    rules: [OC15]
    claim: (constructed) If you take the night shift you might lose touch with your friends, which would set back your own wish for a fuller social life; so do not take it.
    target: the advice to take the night shift
    coding:
      instances:
      - primary: false
        scheme: {walton_id: negative_consequences_modal, fit: reconstructed}
        bindings: {A: take_night_shift, G: lose_touch_with_friends}
        premises:
        - {role: premise, formula: 'may_bring_about(take_night_shift,lose_touch_with_friends)'}
        - {role: premise, formula: 'bad(lose_touch_with_friends)'}
        - {role: exception, formula: 'good_outweighs(take_night_shift,lose_touch_with_friends)'}
        - {role: exception, formula: 'too_slight(take_night_shift,lose_touch_with_friends)'}
        - {role: exception, formula: 'harm_discounted_by_bearer(take_night_shift,lose_touch_with_friends)'}
        conclusion: {formula: 'may_be_unwise_to_perform(take_night_shift,lose_touch_with_friends)'}
      - primary: true
        scheme: {walton_id: bridge_from_possible_harm, fit: reconstructed}
        bindings: {A: take_night_shift, G: lose_touch_with_friends}
        premises:
        - {role: premise, formula: 'may_be_unwise_to_perform(take_night_shift,lose_touch_with_friends)'}
        - {role: premise, formula: 'matters_to_decision(take_night_shift,lose_touch_with_friends)'}
        - {role: exception, formula: 'worth_finding_out_first(take_night_shift,lose_touch_with_friends)'}
        conclusion: {formula: '¬should_be_performed(take_night_shift)'}
      role: {kind: independent_con, cq: null, polarity: against}
    why: >-
      A possible consequence for the agent's own goals is 33.3's kind, and 33.3
      has no modal variant (D008 names 33.1 and 33.2): it is coded with
      negative_consequences_modal and its bridge, the bridge primary, and 33.3
      is named in notes.

  - id: OC15-e
    rules: [OC15, OC4]
    claim: (constructed) Against "a meat tax would cut emissions, so it should be introduced" - the tax might only move meat production abroad, and that would matter more than the emissions it cuts at home.
    target: that positive consequences argument; its exception
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'may_bring_about(tax_meat,production_moved_abroad)'}
        - {role: premise, formula: 'matters_more(production_moved_abroad,emissions_cut)'}
        conclusion: {formula: 'bad_outweighs(tax_meat,emissions_cut)'}
      role: {kind: cq_answer, cq: 'CQ:bad_outweighs', polarity: against}
    why: >-
      A weighing, but its rival consequence is only possible ("might only
      move"), and C003's answer schemes take a categorical brings_about(A,H):
      other, concluding the exception of the argument it answers (D075), with
      candidate C024 (a certain against a speculative harm) named in notes.

  - id: OC15-f
    rules: [OC15]
    claim: (constructed) Against the reply in OC15-c - the trial would end only after the budget that sets the tax has been passed.
    target: that reply, an argument of finding_out_first; its premise done_in_time
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'regional_trial_ends_after_budget_vote'}
        conclusion: {formula: '¬done_in_time(regional_trial,tax_meat)'}
      role: {kind: premise_attack, cq: null, polarity: against}
    why: >-
      It grants that the trial would settle the question and denies that it
      would do so in time: the reply's premise done_in_time(I,A), a premise
      attack (no question targets it). At equal weight the premise no longer
      holds, so the exception is not proved, since a tie goes against the
      critic (D003), and the bridge stands: a test that comes too late does
      not make out the exception. Against a bare reply coded with other, the
      same objection rebuts its conclusion (OC15-g).

  - id: OC15-g
    rules: [OC15]
    claim: (constructed) Against "a night bus could get people home safely after the pubs close, so the town should run one" - the town could run the bus for a year as a pilot first and see whether people ride it.
    target: the bridge of that possible good consequence; its exception
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'night_bus_year_pilot_possible'}
        conclusion: {formula: 'worth_finding_out_first(run_night_bus,people_home_safely)'}
      role: {kind: cq_answer, cq: 'CQ:worth_finding_out_first', polarity: against}
    why: >-
      It names a way to find out, but not one worth taking: a year's pilot costs
      what a year of the service would, so finding out first costs what the
      decision does. It still argues the bridge's exception, without making it
      out: code it as the exception, the answer to CQ:worth_finding_out_first,
      and say in notes what it leaves unshown. That G could be found out is not
      enough (D008): it does not meet the critic's burden of production (the
      owner's declaration under D053), and the game refuses Other at the
      question (D095 (3), since step C5.2). In a game on the data before, it
      stood until the bridge's defender answered that finding out first is not
      worth it, a rebuttal of its conclusion (a reply coded with
      finding_out_first is answered at the premise it denies, OC15-f), and a
      tie went against the critic (D003).

  - id: OC15-h
    rules: [OC15]
    claim: (constructed) Switching to a four-day week might raise our productivity, and even the chance of that matters for a firm our size, so we should switch.
    target: the firm's choice whether to switch
    coding:
      instances:
      - primary: false
        scheme: {walton_id: positive_consequences_modal, fit: reconstructed}
        bindings: {A: switch_to_four_day_week, G: higher_productivity}
        premises:
        - {role: premise, formula: 'may_bring_about(switch_to_four_day_week,higher_productivity)'}
        - {role: premise, formula: 'good(higher_productivity)'}
        - {role: exception, formula: 'bad_outweighs(switch_to_four_day_week,higher_productivity)'}
        - {role: exception, formula: 'too_slight(switch_to_four_day_week,higher_productivity)'}
        - {role: exception, formula: 'gain_discounted_by_bearer(switch_to_four_day_week,higher_productivity)'}
        conclusion: {formula: 'may_be_worth_performing(switch_to_four_day_week,higher_productivity)'}
      - primary: true
        scheme: {walton_id: bridge_from_possible_good, fit: reconstructed}
        bindings: {A: switch_to_four_day_week, G: higher_productivity}
        premises:
        - {role: premise, formula: 'may_be_worth_performing(switch_to_four_day_week,higher_productivity)'}
        - {role: premise, formula: 'matters_to_decision(switch_to_four_day_week,higher_productivity)'}
        - {role: exception, formula: 'worth_finding_out_first(switch_to_four_day_week,higher_productivity)'}
        conclusion: {formula: 'should_be_performed(switch_to_four_day_week)'}
      role: {kind: independent_pro, cq: null, polarity: for}
    why: >-
      A possible good consequence ("might raise"): the modal variant, secondary,
      carries it, and its bridge, primary, takes it to the recommendation with
      the premise the claim states ("even the chance of that matters for a firm
      our size"). The positive side's forms, as OC15-d shows the negative
      side's.

  - id: OC15-i
    rules: [OC15]
    claim: (constructed) Against "the tax would send shoppers across the border for their meat, so it should not be introduced" - it is worth finding out first whether it would; a year's trial in two regions would show it in time, at little cost.
    target: that negative consequences argument; its premise brings_about(A,G)
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'regional_trial_would_settle_cross_border_buying'}
        conclusion: {formula: null}
      role: {kind: cq_answer, cq: 'CQ:evidence', polarity: against}
    why: >-
      The argument it answers asserts the link ("would"), so it is categorical,
      and the bridges' exception does not reach it. The reply doubts that the
      link is shown and names how to settle it: a challenge of
      brings_about(A,G), the book's 33.2 CQ2 (what evidence shows it?), the
      game's CQ:evidence, which
      the argument's proponent must answer. Against a modal argument the same
      words argue the bridges' exception (OC15-c); coded that way here, they
      would leave the categorical argument standing and favour the side that
      claims the link more firmly.

  - id: OC16-a
    rules: [OC16]
    claim: (constructed) Against "a meat tax would raise costs for the large meat producers, so it should not be introduced" - those costs fall on the producers whose farms cause the harm the tax is for, so they count for little.
    target: that negative consequences argument; its bearer exception
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'costs_fall_on_polluting_producers'}
        conclusion: {formula: 'harm_discounted_by_bearer(tax_meat,costs_raised_for_large_producers)'}
      role: {kind: cq_answer, cq: 'CQ:harm_discounted', polarity: against}
    why: >-
      It grants the cost and discounts it because of whom it falls on: the
      bearer exception of the argument's side, harm_discounted_by_bearer(A,G)
      (D065, C021). The same fact is a reason for the tax, which is why the
      exception is sided: an argument for the tax has no harm to discount
      (D053). The game asks it as CQ:harm_discounted (step C5.2; R2).

  - id: OC16-b
    rules: [OC16]
    claim: (constructed) Against "a grant for heat pumps would cut households' energy bills, so it should be introduced" - the savings would go mostly to well-off homeowners, so they count for little.
    target: that positive consequences argument; its bearer exception
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'savings_go_to_well_off_homeowners'}
        conclusion: {formula: 'gain_discounted_by_bearer(heat_pump_grant,energy_bills_cut)'}
      role: {kind: cq_answer, cq: 'CQ:gain_discounted', polarity: against}
    why: >-
      It grants the gain and discounts it because of whom it goes to: the
      exception of an argument for A, gain_discounted_by_bearer(A,G), which the
      game asks as CQ:gain_discounted (step C5.2; R2). A claim that the poor
      have a right to such help whatever its effects would be OC5's, naming
      C007.

  - id: OC17-a
    rules: [OC17]
    kialo: "5637.26"
    claim: If abortions happen anyway, it is better to make them safe, so that at least the women survive.
    target: 5637.1, that pregnant people should have the right to choose abortion (its conclusion is the thesis's)
    coding:
      instances:
      - primary: true
        scheme: {walton_id: harm_reduction, fit: reconstructed}
        bindings: {A: access_to_abortion, E: abortions_performed}
        premises:
        - {role: premise, formula: 'happens_anyway(access_to_abortion,abortions_performed)'}
        - {role: premise, formula: 'less_harmful_per_occurrence(access_to_abortion,abortions_performed)'}
        - {role: exception, formula: 'preventable_otherwise(access_to_abortion,abortions_performed)'}
        - {role: exception, formula: 'no_net_reduction(access_to_abortion,abortions_performed)'}
        conclusion: {formula: 'should_be_performed(access_to_abortion)'}
      role: {kind: independent_pro, cq: null, polarity: for}
      target: {actual: {claim: '5637.1', part: conclusion}}
    why: >-
      Abortions happen with or without access; access makes each one safer. The
      claim does not say that access prevents a harm (OC13), and it ranks no
      consequence: harm_reduction (D072, C022). A reply that more abortions
      would follow, so that the harm overall would not fall, argues
      no_net_reduction(A,E); one that support for mothers could prevent them
      argues preventable_otherwise(A,E).

  - id: OC18-a
    rules: [OC18, OC1]
    kialo: "27150.12"
    claim: Whether we should do something has no bearing on whether we can, so the risks of AGI say nothing about whether it is possible.
    target: 27150.9, negative consequences of pursuing AGI (OC1-a); its inference
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'should_irrelevant_to_can'}
        conclusion: {formula: null}
      role: {kind: undercutter, cq: null, polarity: against}
      target: {actual: {claim: '27150.9', part: inference}}
    why: >-
      The objection C011 names, against a consequence argument coded by OC1 (its
      practical conclusion meets nothing at the factual thesis): an undercutter
      of that argument's inference, not an exception (D074, as the owner refined
      it on 2026-11-25), so a legitimate argument about pursuing AGI, under a
      claim about whether to pursue it, is not touched (OC18-c shows such a
      case). No label changes at 27150.9, since that argument already meets
      nothing; the coding records the objection.

  - id: OC18-b
    rules: [OC18]
    claim: (constructed) Against "believing in free will makes people behave better, so free will exists" (OC1-e) - that a belief does good is no sign that it is true.
    target: that argument's inference
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'usefulness_no_sign_of_truth'}
        conclusion: {formula: null}
      role: {kind: undercutter, cq: null, polarity: against}
    why: >-
      The argument it answers concludes what is the case from consequences, so
      it is coded with other (OC1): the objection undercuts its inference (part
      inference, formula null), as it does a consequence argument's (OC18-a).

  - id: OC18-c
    rules: [OC18]
    claim: (constructed) In a debate on whether God exists, under the claim that one should believe anyway - believing in God gives comfort in hard times, so one should believe.
    target: that claim about whether to believe
    coding:
      instances:
      - primary: true
        scheme: {walton_id: positive_consequences, fit: reconstructed}
        bindings: {A: believing_in_god, G: comfort_in_hard_times}
        premises:
        - {role: premise, formula: 'brings_about(believing_in_god,comfort_in_hard_times)'}
        - {role: premise, formula: 'good(comfort_in_hard_times)'}
        - {role: exception, formula: 'bad_outweighs(believing_in_god,comfort_in_hard_times)'}
        - {role: exception, formula: 'too_slight(believing_in_god,comfort_in_hard_times)'}
        - {role: exception, formula: 'gain_discounted_by_bearer(believing_in_god,comfort_in_hard_times)'}
        conclusion: {formula: 'should_be_performed(believing_in_god)'}
      role: {kind: independent_pro, cq: null, polarity: for}
    why: >-
      A legitimate consequence argument about believing, offered for a claim
      about whether to believe. The objection that consequences are no reason to
      think God exists, raised against a misplaced argument about believing in
      the same debate (OC1-b), undercuts that argument alone and does not reach
      this one, as an exception about believing would have (D074, as the owner
      refined it on 2026-11-25).
