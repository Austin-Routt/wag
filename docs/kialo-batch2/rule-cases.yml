        - {role: premise, formula: 'good(unhealthy_underconsumption_prevented)'}
        - {role: exception, formula: 'bad_outweighs(tax_meat_with_accompanying_measures,unhealthy_underconsumption_prevented)'}
        - {role: exception, formula: 'too_slight(tax_meat_with_accompanying_measures,unhealthy_underconsumption_prevented)'}
        - {role: exception, formula: 'gain_discounted_by_bearer(tax_meat_with_accompanying_measures,unhealthy_underconsumption_prevented)'}
        conclusion: {formula: 'should_be_performed(tax_meat_with_accompanying_measures)'}
      role: {kind: action_amendment, cq: null, polarity: against}
      target: {actual: {claim: '13292.121', part: conclusion}}
    why: >-
      Mitigation, a measure added so that the cited harm does not follow (C006).
      It argues for the amended action, the tax with accompanying measures, with
      its own scheme, and its role is action_amendment, at the conclusion of the
      argument it answers (D066): 13292.121's bridge, its primary instance
      (OC15). "Can and likely would be" hedges whether the measures will be
      taken, not their link, so the scheme is categorical (guidelines §3).

  - id: OC6-c
    rules: [OC6]
    claim: (constructed) Against "a meat tax would cut emissions, so it should be introduced" - no tax office could collect a levy on every sale of meat, so the tax could not be carried out at all.
    target: that positive consequences argument; its causal premise
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
