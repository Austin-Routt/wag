# Worked cases for guidelines.md §3.1 (opposite consequences and weighing,
# decisions D055 and D059, 2026-10-23; practical reasoning's side effects,
# D070 and D091, 2026-11-24; possible consequences, how serious, on whom,
# what happens anyway and consequences offered for truth, D008, D065,
# D066, D069, D072 and D074, 2026-11-25), with their codings.
#
# Each case names the rules it shows (OC1-OC18), the Kialo claim (or none,
# for a constructed case), a short paraphrase in our own words, its target,
# its coding in the gold's format (instances, role, and the target as
# target.actual), and why. The codings leave out what format 2 of the
# annotation records adds for identity (instance ids, the target's instance,
# a conclusion target's formula: docs/annotation-records.md); the test
# compares what both carry.
# A test (wag/internal/annotate, TestRuleCases) checks that:
#   - every rule of §3.1 has a case, and every case names rules of §3.1;
#   - every coding follows walton.yml (the gold's own checker);
#   - a case that is a claim of batch 2 is coded as gold.json codes it, and
#     a claim of the batch's discussion that is not in the gold is marked
#     outside_batch, so that a mistyped id fails;
#   - no retired wording (below) appears in the guidelines, these cases,
#     the catalogue's entries or the candidates registry.
#
# Not given to annotators: some cases are claims of batch 2.

retired:
  # Wording that stated an earlier version of a rule. When a rule changes,
  # its old wording goes here, so that no copy of it survives.
  - phrase: which interferes with event
    now: the two-place exception's template, another causal factor keeps, or would keep, E1 from bringing about E2
    why: proposal D040-D071-D097 (D071, D097), 2026-11-27
  - phrase: or blunt its effect
    now: 28/CQ3 asks what keeps E1 from bringing about E2; a weaker effect is 28/CQ1's
    why: proposal D040-D071-D097, version 2 (its independent review, W5)
  - phrase: There are nine NASCQ schemes
    now: seventeen since step C5.2, listed in the guidelines' first table
    why: the independent check of step C5.2's switch (E-1)
  - phrase: is a `cq_answer` too
    now: a claim at the conclusion is a rebuttal (OC2); the game's questions there are that route
    why: the independent check of step C5.2's switch (N-13); OC2 and the gold code it so
  - phrase: no question of the book or the game targets too_slight
    now: the game's CQ:too_slight (OC9; step C5.2)
    why: step C5.2's switch (2026-11-27), the game asks too_slight
  - phrase: the game does not ask the modal variants yet
    now: CQ:modal_likelihood and CQ:modal_evidence (OC9, OC15)
    why: step C5.2's switch (2026-11-27), the game plays the modal variants
  - phrase: since no question of the book or the game targets them
    now: a cq_answer that names the game's question (guidelines §3.1)
    why: step C5.2's switch (2026-11-27), the game asks D065's exceptions and the bridges'
  - phrase: until then it stands in play
    now: the game refuses Other at the question (D095 (3), since step C5.2)
    why: step C5.2's switch (2026-11-27)
  - phrase: concluding the exception, as an undercutter
    now: concluding the exception, a cq_answer to the game's question (OC9, OC16)
    why: step C5.2's switch (2026-11-27), the game asks too_slight and the bearer exceptions
  - phrase: the action it allows
    now: the action that grants or secures the right (OC13)
    why: final check of D055-D059 v5, warning 3 (example 6's note)
  - phrase: to the agent or the addressee
    now: the one who acts (OC13)
    why: fourth review of D055-D059, error (example 16's note)
  - phrase: otherwise bind A to the omission
    now: never bind A to the omission (OC13)
    why: final check of D055-D059 v5, warning 5 (33.3's catalogue entry)
  - phrase: harm of not doing A is the prudential form
    now: a harm of not doing A that falls on the one who acts (OC13)
    why: second review of D055-D059, error (every harm of not acting sent to 33.4)
  - phrase: does at its actual target
    now: what the claim concludes decides (OC1)
    why: independent review of the application, error 1 (a scope by the target reversed the approved one)
  - phrase: whatever the claim itself concludes
    now: what the claim concludes decides (OC1)
    why: independent review of the application, error 1
  - phrase: code such a claim with Other
    now: a consequence claim with a practical conclusion is coded with the consequence schemes, naming C011 (OC1)
    why: independent review of the application, error 1
  - phrase: is a weighing, with the harm of not acting phrased as a good state
    now: the harm of not acting counts as a good consequence of A, and the weighing takes the A and G of the argument it answers (OC6)
    why: final check of D055-D059 v5, warning 2 (it put the wrong consequence in the exception)
  - phrase: answers its side-effects question
    now: a further bad consequence against practical reasoning is a rebuttal at its conclusion, a weighing is at bad_outweighs(A,G) (OC1)
    why: proposal D004-D075 (D070, D091), 2026-11-24
  - phrase: No scheme concludes the exception
    now: C003's answer schemes conclude the consequence schemes' exceptions (OC4; D064, D075)
    why: proposal D004-D075, 2026-11-24
  - phrase: Practical reasoning has no outweighing exception
    now: practical reasoning has bad_outweighs(A,G) and is in the class (OC7; D070, D091)
    why: proposal D004-D075, 2026-11-24
  - phrase: a premise of its `other` instance
    now: matters_more(H,G), a premise of its bad_outweighs_good or good_outweighs_bad instance (OC10)
    why: proposal D004-D075 (D064, D075), 2026-11-24
  - phrase: a premise of its other instance
    now: a premise of its bad_outweighs_good or good_outweighs_bad instance (OC10)
    why: proposal D004-D075 (D064, D075), 2026-11-24
  - phrase: Another course is not the exception
    now: against practical reasoning, a better course answers realize_more_effectively(P,G,A) (OC6; D075, D089)
    why: proposal D004-D075, 2026-11-24
  - phrase: achieve the goal as well or better
    now: only another action said to reach the goal better answers practical reasoning; one as good is no reason against the action (guidelines §2, §3; D006)
    why: proposal D004-D075, 2026-11-24
  - phrase: which the gold cannot target
    now: the reply targets the weighing instance by its id (OC10; guidelines §4)
    why: "the identity contract (D092, 2026-11-24): a target names its instance, a secondary one included"
  - phrase: "attacks `good(G)` or `bad(G)`, or the consequence's likelihood"
    now: a slight consequence argues too_slight(A,G); a rare or unlikely one answers 33/CQ1 (against a modal argument, the bridge's matters_to_decision unless it denies that the chance is real); one not bad at all attacks bad(G) or good(G) (OC9; D065)
    why: proposal D008-D074 (D065), 2026-11-25
  - phrase: offered_for_truth
    now: the objection that consequences are offered for the truth of a claim undercuts the specific argument's inference (OC18)
    why: the owner's refinement of D074, 2026-11-25 (proposal D008-D074, version 5)
  - phrase: knowable_before_deciding
    now: worth_finding_out_first(A,G), the bridges' exception (OC15)
    why: the owner's refinement of D008, 2026-11-25 (proposal D008-D074, version 5)
  - phrase: No scheme concludes any of them
    now: finding_out_first concludes the bridges' exception; no scheme concludes the others (§3.1, OC15; D095)
    why: proposal D095, 2026-11-26
  - phrase: Coded with Other (docs/kialo-batch2/guidelines.md §3.1, OC15)
    now: a reply that makes the conditions out is coded with finding_out_first, a bare one with Other (OC15; D095)
    why: proposal D095, 2026-11-26

cases:
  - id: OC1-a
    rules: [OC1]
    kialo: "27150.9"
    claim: Pursuing AGI is folly, a waste of resources given risks no one can see beyond.
    target: 27150.1, the thesis that AGI is possible
    coding:
      instances:
      - primary: true
        scheme: {walton_id: negative_consequences, fit: reconstructed}
        bindings: {A: pursuing_agi, G: resources_wasted_on_unforeseeable_risks}
        premises:
        - {role: premise, formula: 'brings_about(pursuing_agi,resources_wasted_on_unforeseeable_risks)'}
        - {role: premise, formula: 'bad(resources_wasted_on_unforeseeable_risks)'}
        - {role: exception, formula: 'good_outweighs(pursuing_agi,resources_wasted_on_unforeseeable_risks)'}
        - {role: exception, formula: 'too_slight(pursuing_agi,resources_wasted_on_unforeseeable_risks)'}
        - {role: exception, formula: 'harm_discounted_by_bearer(pursuing_agi,resources_wasted_on_unforeseeable_risks)'}
        conclusion: {formula: '¬should_be_performed(pursuing_agi)'}
      role: {kind: independent_con, cq: null, polarity: against}
      target: {actual: {claim: '27150.1', part: conclusion}}
    why: >-
      Its conclusion is about an action (AGI should not be pursued), so it is
      coded with negative consequences, though its target, the thesis that
      AGI is possible, says what is the case. Its conclusion meets nothing
      there, and it proposes no other action, so it is the appeal C011
      names: its reply 27150.12 (whether we should is irrelevant to whether
      we can) is that objection, which undercuts its inference (OC18-a).

  - id: OC1-b
    rules: [OC1]
    kialo: "2629.22855"
    claim: Religion brings psychological and social benefits, so believing in God makes pragmatic sense.
    target: 2629.9032, that psychological and sociological explanations put the authenticity of religious experience in question
    coding:
      instances:
      - primary: true
        scheme: {walton_id: positive_consequences, fit: reconstructed}
        bindings: {A: believing_in_god, G: psychosocial_benefits_of_religion}
        premises:
        - {role: premise, formula: 'brings_about(believing_in_god,psychosocial_benefits_of_religion)'}
        - {role: premise, formula: 'good(psychosocial_benefits_of_religion)'}
        - {role: exception, formula: 'bad_outweighs(believing_in_god,psychosocial_benefits_of_religion)'}
        - {role: exception, formula: 'too_slight(believing_in_god,psychosocial_benefits_of_religion)'}
        - {role: exception, formula: 'gain_discounted_by_bearer(believing_in_god,psychosocial_benefits_of_religion)'}
        conclusion: {formula: 'should_be_performed(believing_in_god)'}
      role: {kind: independent_con, cq: null, polarity: against}
      target: {actual: {claim: '2629.9032', part: conclusion}}
    why: >-
      Its conclusion is about an action, believing, so it is coded with
      positive consequences. It is offered against a claim about what is the
      case and proposes no other action, so its conclusion meets nothing
      there and it names C011.

  - id: OC1-d
    rules: [OC1]
    kialo: "13292.145"
    claim: Tax meat and use some of the revenue to fund research into synthetic meat.
    target: 13292.13, that a meat tax would not resolve the problems of meat production and consumption
    coding:
      instances:
      - primary: true
        scheme: {walton_id: positive_consequences, fit: reconstructed}
        bindings: {A: tax_meat_and_fund_synthetic_meat_research, G: synthetic_meat_development_advanced}
        premises:
        - {role: premise, formula: 'brings_about(tax_meat_and_fund_synthetic_meat_research,synthetic_meat_development_advanced)'}
        - {role: premise, formula: 'good(synthetic_meat_development_advanced)'}
        - {role: exception, formula: 'bad_outweighs(tax_meat_and_fund_synthetic_meat_research,synthetic_meat_development_advanced)'}
        - {role: exception, formula: 'too_slight(tax_meat_and_fund_synthetic_meat_research,synthetic_meat_development_advanced)'}
        - {role: exception, formula: 'gain_discounted_by_bearer(tax_meat_and_fund_synthetic_meat_research,synthetic_meat_development_advanced)'}
        conclusion: {formula: 'should_be_performed(tax_meat_and_fund_synthetic_meat_research)'}
      role: {kind: action_amendment, cq: null, polarity: against}
      target: {actual: {claim: '13292.13', part: conclusion}}
    why: >-
      Its target says what is the case (the tax's efficacy), and its
      conclusion is about an action, a changed one, so it is coded with
      positive consequences, as an amendment, as the gold codes it. It
      proposes a changed action, so it is not the appeal C011 names.
      Contrast OC1-a.

  - id: OC1-c
    rules: [OC1, OC15]
    kialo: "13292.174"
    claim: Taxing meat might push producers to cheaper and more dangerous ways of producing it.
    target: 13292.1#2, the discussion's goal-based practical reasoning for the tax (D096)
    coding:
      instances:
      - primary: false
        scheme: {walton_id: negative_consequences_modal, fit: reconstructed}
        bindings: {A: tax_meat, G: more_dangerous_meat_production}
        premises:
        - {role: premise, formula: 'may_bring_about(tax_meat,more_dangerous_meat_production)'}
        - {role: premise, formula: 'bad(more_dangerous_meat_production)'}
        - {role: exception, formula: 'good_outweighs(tax_meat,more_dangerous_meat_production)'}
        - {role: exception, formula: 'too_slight(tax_meat,more_dangerous_meat_production)'}
        - {role: exception, formula: 'harm_discounted_by_bearer(tax_meat,more_dangerous_meat_production)'}
        conclusion: {formula: 'may_be_unwise_to_perform(tax_meat,more_dangerous_meat_production)'}
      - primary: true
        scheme: {walton_id: bridge_from_possible_harm, fit: reconstructed}
        bindings: {A: tax_meat, G: more_dangerous_meat_production}
        premises:
        - {role: premise, formula: 'may_be_unwise_to_perform(tax_meat,more_dangerous_meat_production)'}
        - {role: premise, formula: 'matters_to_decision(tax_meat,more_dangerous_meat_production)'}
        - {role: exception, formula: 'worth_finding_out_first(tax_meat,more_dangerous_meat_production)'}
        conclusion: {formula: '¬should_be_performed(tax_meat)'}
      role: {kind: rebuttal, cq: null, polarity: against}
      target: {actual: {claim: '13292.1', part: conclusion}}
    why: >-
      A further bad consequence offered against practical reasoning ranks
      nothing against its goal, so it is a rebuttal at the conclusion (OC2), as
      against a consequence argument (OC1). The side-effect exception is the
      claim that the bad consequences outweigh the goal, bad_outweighs(A,G)
      (D070, D091). "Might push" makes the consequence only possible (guidelines
      §3, the mood of the link): the modal variant, secondary, and its bridge,
      primary, whose conclusion is the rebuttal's (OC15, D008).

  - id: OC1-e
    rules: [OC1]
    claim: (constructed) Believing in free will makes people behave better, so free will exists.
    target: the thesis that free will exists
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'belief_in_free_will_improves_conduct'}
        conclusion: {formula: 'free_will_exists'}
      role: {kind: independent_pro, cq: null, polarity: for}
    why: >-
      It concludes what is the case from the consequences of believing it, so
      it is not coded with a consequence scheme: other, naming C011.

  - id: OC2-a
    rules: [OC2, OC15]
    kialo: "13292.121"
    claim: Taxing meat could also lead people to eat too little meat, which is unhealthy.
    target: 13292.115, positive consequences of the tax (less unhealthy meat consumption)
    coding:
      instances:
      - primary: false
        scheme: {walton_id: negative_consequences_modal, fit: reconstructed}
        bindings: {A: tax_meat, G: unhealthy_meat_underconsumption}
        premises:
        - {role: premise, formula: 'may_bring_about(tax_meat,unhealthy_meat_underconsumption)'}
        - {role: premise, formula: 'bad(unhealthy_meat_underconsumption)'}
        - {role: exception, formula: 'good_outweighs(tax_meat,unhealthy_meat_underconsumption)'}
        - {role: exception, formula: 'too_slight(tax_meat,unhealthy_meat_underconsumption)'}
        - {role: exception, formula: 'harm_discounted_by_bearer(tax_meat,unhealthy_meat_underconsumption)'}
        conclusion: {formula: 'may_be_unwise_to_perform(tax_meat,unhealthy_meat_underconsumption)'}
      - primary: true
        scheme: {walton_id: bridge_from_possible_harm, fit: reconstructed}
        bindings: {A: tax_meat, G: unhealthy_meat_underconsumption}
        premises:
        - {role: premise, formula: 'may_be_unwise_to_perform(tax_meat,unhealthy_meat_underconsumption)'}
        - {role: premise, formula: 'matters_to_decision(tax_meat,unhealthy_meat_underconsumption)'}
        - {role: exception, formula: 'worth_finding_out_first(tax_meat,unhealthy_meat_underconsumption)'}
        conclusion: {formula: '¬should_be_performed(tax_meat)'}
      role: {kind: side_effect, cq: null, polarity: against}
      target: {actual: {claim: '13292.115', part: conclusion}}
    why: >-
      A further bad consequence with no ranking against the health gain that
      13292.115 cites: a consequence argument at that argument's conclusion, not
      its exception. "Could also lead" makes it only possible, so it is the
      modal variant and its bridge, the bridge primary: the bridge concludes
      ¬should_be_performed(tax_meat), at 13292.115's conclusion (OC15, D008).

  - id: OC3-a
    rules: [OC3, OC6]
    kialo: "5637.188"
    claim: Men may suffer emotional harm when a partner chooses abortion, but women forced to carry to term suffer emotional and physical harm.
    target: 5637.104, negative consequences of access to abortion (men's emotional harm)
    coding:
      instances:
      - primary: true
        scheme: {walton_id: good_outweighs_bad, fit: reconstructed}
        bindings: {A: access_to_abortion, H: women_spared_harms_of_forced_pregnancy, G: men_emotional_harm_from_abortion}
        premises:
        - {role: premise, formula: 'brings_about(access_to_abortion,women_spared_harms_of_forced_pregnancy)'}
        - {role: premise, formula: 'good(women_spared_harms_of_forced_pregnancy)'}
        - {role: premise, formula: 'matters_more(women_spared_harms_of_forced_pregnancy,men_emotional_harm_from_abortion)'}
        conclusion: {formula: 'good_outweighs(access_to_abortion,men_emotional_harm_from_abortion)'}
      role: {kind: cq_answer, cq: 'CQ:good_outweighs', polarity: against}
      target: {actual: {claim: '5637.104', part: exception, formula: 'good_outweighs(access_to_abortion,men_emotional_harm_from_abortion)'}}
    why: >-
      It ranks without any cue word: both kinds of harm against one kind. The
      women's harms are a harm of not acting, so they count as a good
      consequence of access (OC6), and the weighing takes 5637.104's own A and
      G, the men's harm, as the exception names it, with C003's
      good_outweighs_bad (OC4).

  - id: OC3-b
    rules: [OC3, OC5]
    kialo: "5637.2792"
    claim: Pain is subjective, so it is wrong to decide for someone else that their life is not worth living.
    target: 5637.3246, that letting parents choose for a child with a fatal or severely limiting defect is not wrong
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'pain_is_subjective'}
        - {role: premise, formula: 'judging_anothers_life_unworthy_is_wrong'}
        conclusion: {formula: '¬choosing_for_the_child_permissible'}
      role: {kind: rebuttal, cq: null, polarity: against}
      target: {actual: {claim: '5637.3246', part: conclusion}}
    why: >-
      "Not worth living" is a cue word that ranks nothing: no consequence is
      set against another. The claim states a principle against the target
      (C007), not a weighing.

  - id: OC3-c
    rules: [OC3, OC13]
    kialo: "5637.14596"
    claim: Being denied an abortion leads to worse financial, health and family outcomes, worse still after rape.
    target: 5637.1, that pregnant people should have the right to choose abortion
    coding:
      instances:
      - primary: true
        scheme: {walton_id: positive_consequences, fit: reconstructed}
        bindings: {A: access_to_abortion, G: seekers_avoid_worse_outcomes}
        premises:
        - {role: premise, formula: 'brings_about(access_to_abortion,seekers_avoid_worse_outcomes)'}
        - {role: premise, formula: 'good(seekers_avoid_worse_outcomes)'}
        - {role: exception, formula: 'bad_outweighs(access_to_abortion,seekers_avoid_worse_outcomes)'}
        - {role: exception, formula: 'too_slight(access_to_abortion,seekers_avoid_worse_outcomes)'}
        - {role: exception, formula: 'gain_discounted_by_bearer(access_to_abortion,seekers_avoid_worse_outcomes)'}
        conclusion: {formula: 'should_be_performed(access_to_abortion)'}
      role: {kind: independent_pro, cq: null, polarity: for}
      target: {actual: {claim: '5637.1', part: conclusion}}
    why: >-
      "Worse" compares the outcomes with and without access; it ranks no
      consequence against one the other side cites, so it is not a weighing
      (OC3). The harm of not having access falls on those seeking an abortion,
      not on whoever would grant access, so it is positive consequences of
      access, with G the harm's not happening (OC13). Its conclusion is the
      thesis's, so it is coded against the thesis, re-parented from 5637.3728.

  - id: OC4-a
    rules: [OC4, OC7, OC8]
    kialo: "13292.127"
    claim: Starvation from less access to meat is a worse threat than any harm of eating much meat.
    target: 13292.1#2, the discussion's goal-based practical reasoning for the tax (D096); its Kialo parent is 13292.7
    coding:
      instances:
      - primary: true
        scheme: {walton_id: bad_outweighs_good, fit: reconstructed}
        bindings: {A: tax_meat, H: starvation_from_reduced_meat_access, G: environmental_harm_from_meat_reduced}
        premises:
        - {role: premise, formula: 'brings_about(tax_meat,starvation_from_reduced_meat_access)'}
        - {role: premise, formula: 'bad(starvation_from_reduced_meat_access)'}
        - {role: premise, formula: 'matters_more(starvation_from_reduced_meat_access,environmental_harm_from_meat_reduced)'}
        conclusion: {formula: 'bad_outweighs(tax_meat,environmental_harm_from_meat_reduced)'}
      - primary: false
        scheme: {walton_id: negative_consequences, fit: reconstructed}
        bindings: {A: tax_meat, G: starvation_from_reduced_meat_access}
        premises:
        - {role: premise, formula: 'brings_about(tax_meat,starvation_from_reduced_meat_access)'}
        - {role: premise, formula: 'bad(starvation_from_reduced_meat_access)'}
        - {role: exception, formula: 'good_outweighs(tax_meat,starvation_from_reduced_meat_access)'}
        - {role: exception, formula: 'too_slight(tax_meat,starvation_from_reduced_meat_access)'}
        - {role: exception, formula: 'harm_discounted_by_bearer(tax_meat,starvation_from_reduced_meat_access)'}
        conclusion: {formula: '¬should_be_performed(tax_meat)'}
      role: {kind: cq_answer, cq: 'CQ:bad_outweighs', polarity: against}
      target: {actual: {claim: '13292.1', part: exception, formula: 'bad_outweighs(tax_meat,environmental_harm_from_meat_reduced)'}}
    why: >-
      A ranking against a class (any harm of eating much meat), with C003's
      bad_outweighs_good (OC4). Its Kialo parent, 13292.7, is not in the
      class, so it weighs against the earliest argument of the class on the
      board, re-parented (OC7): since practical reasoning has the
      outweighing exception (D070, D091), that is the environmental argument,
      the discussion's at the thesis (13292.1#2; D096), not 13292.115.
      The words state the comparison, so the weighing is primary and the
      starvation consequence secondary (OC8). The game asks the exception as
      CQ:bad_outweighs (step C5.2), the question the role names (R2).

  - id: OC4-b
    rules: [OC4, OC5]
    kialo: "13292.43"
    claim: Revenue is not why the tax is wanted; sustainability and animal welfare press harder.
    target: 13292.9, negative consequences of the tax (lost tax revenue)
    coding:
      instances:
      - primary: true
        scheme: {walton_id: good_outweighs_bad, fit: reconstructed}
        bindings: {A: tax_meat, H: sustainability_and_animal_welfare, G: tax_revenue_reduced}
        premises:
        - {role: premise, formula: 'brings_about(tax_meat,sustainability_and_animal_welfare)'}
        - {role: premise, formula: 'good(sustainability_and_animal_welfare)'}
        - {role: premise, formula: 'matters_more(sustainability_and_animal_welfare,tax_revenue_reduced)'}
        conclusion: {formula: 'good_outweighs(tax_meat,tax_revenue_reduced)'}
      role: {kind: cq_answer, cq: 'CQ:good_outweighs', polarity: against}
      target: {actual: {claim: '13292.9', part: exception, formula: 'good_outweighs(tax_meat,tax_revenue_reduced)'}}
    why: >-
      It ranks ("more pressing"), and the values it names are things the tax
      would promote, so they count as consequences (OC5): C003's
      good_outweighs_bad (OC4). Its Kialo parent cites the outweighed
      consequence, so it is not re-parented.

  - id: OC5-a
