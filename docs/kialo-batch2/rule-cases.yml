        - {role: exception, formula: 'too_slight(congestion_charge,fewer_accidents)'}
        - {role: exception, formula: 'gain_discounted_by_bearer(congestion_charge,fewer_accidents)'}
        conclusion: {formula: 'should_be_performed(congestion_charge)'}
      role: {kind: independent_pro, cq: null, polarity: for}
