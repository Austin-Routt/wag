  - id: OC15-a
    rules: [OC15]
    kialo: "13292.233"
    claim: Reviews of studies show again and again that eating less meat leads to better health, not worse.
    target: 13292.121, a possible bad consequence of the tax; the premise of its modal instance
    coding:
      instances:
      - primary: true
        scheme: {walton_id: expert_opinion, fit: reconstructed}
        bindings: {W: meat_reduction_studies, D: nutritional_epidemiology, S: meat_reduction_improves_health}
        premises:
        - {role: premise, formula: 'expert(meat_reduction_studies,nutritional_epidemiology)'}
        - {role: premise, formula: 'in_domain(meat_reduction_improves_health,nutritional_epidemiology)'}
        - {role: premise, formula: 'asserts(meat_reduction_studies,meat_reduction_improves_health)'}
        - {role: assumption, formula: 'based_on_evidence(asserts(meat_reduction_studies,meat_reduction_improves_health))'}
        - {role: exception, formula: 'untrustworthy(meat_reduction_studies)'}
        - {role: exception, formula: 'inconsistent_with_other_experts(meat_reduction_improves_health)'}
        conclusion: {formula: 'meat_reduction_improves_health'}
      role: {kind: cq_answer, cq: 'CQ:modal_likelihood', polarity: against}
      target: {actual: {claim: '13292.121', part: premise, formula: 'may_bring_about(tax_meat,unhealthy_meat_underconsumption)'}}
    why: >-
      It denies that the possibility is real (less meat brings better health,
      not worse), so it answers 33.2 CQ1 at the modal instance's
      may_bring_about(A,G): a cq_answer naming the book's question, since the
      game asks nothing of the modal variants yet. It argues from expert
      opinion, so its own instance is that source scheme's.

  - id: OC15-b
    rules: [OC15]
    claim: (constructed) Against "the tax might make a few butchers close, so it should not be introduced" - granted that it might, so remote a chance of so modest a loss is no reason to decide against the tax.
    target: the bridge of that possible bad consequence; its premise matters_to_decision
    coding:
      instances:
      - primary: true
        scheme: {walton_id: other, fit: reconstructed}
        bindings: {}
        premises:
        - {role: premise, formula: 'butcher_closures_remote'}
